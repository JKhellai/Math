 与无穷级数的门。","refs":"Amann–Escher, Analysis I §II.2"},{"id":"an_valore_assoluto","label":"绝对值","parent":"an_analisi","summary":"绝对值 |x| 在任意有序域上度量「到 0 的距离」;它满足非负、可乘、以及三角不等式 |x+y|≤|x|+|y|——后者是整个分析里出现最频繁的估计工具,也是「距离」概念的原型。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#979AFF","ring":0,"bearing":21,"popupLinks":[{"id":"num_q_ordine","text":"有序域"},{"id":"num_z_ordine","text":"环的符号定理"},{"id":"an_spazio_metrico","text":"度量空间"}],"body":"\n## 从数系转入分析\n\n到上一节为止,我们造完了实数轴:一个完备的有序域。数系构造这条线就此收尾。从这一节起,工作的性质变了——不再问「这些数**是**什么」,而是问「这些数**如何逼近**」。这是**分析**(analysis)的主题,而它的第一个、也是最基础的工具,是一把度量「远近」的尺子:**绝对值**。\n\n为什么从绝对值开始?因为「逼近」的本质是「距离越来越小」,而在数轴上,两点 x、y 的距离正是 |x − y|。整个极限理论——数列收敛、函数连续、导数、积分——都建立在「|某某| < ε」这种句子上。所以在谈第一个极限之前,必须先把这把尺子的性质彻底弄清。\n\n绝对值的定义只用到有序域的公理,所以本节在任意**有序域** K 中展开(ℚ、ℝ 都是具体样本);将来对 ℝ 原样适用。\n\n## 定义\n\n**定义.** 设 K 是有序域,x ∈ K。**绝对值**(absolute value)|x| 与**符号函数**(sign)sign(x) 定义为\n\n|x| := x(若 x > 0)/ 0(若 x = 0)/ −x(若 x < 0);\n\nsign(x) := 1(若 x > 0)/ 0(若 x = 0)/ −1(若 x < 0)。\n\n直觉:|x| 把负数「翻正」,量的是 x 到 0 的距离,不计方向;sign(x) 单独记录方向。两者合起来恰好还原 x——这是下面第一条性质。\n\n(三歧性保证定义无歧义:每个 x 恰好落入「正/零/负」之一,所以三条子句恰好适用一条。这正是<a class=\"wl\" data-id=\"num_q_ordine\">有序域<\/a>的全序性在起作用。)\n\n## 基本性质\n\n**命题.** 设 K 是有序域,x, y, a ∈ K,ε > 0。则\n\n- (i) x = |x|·sign(x);\n- (ii) |−x| = |x|,且 x ≤ |x|;\n- (iii) **|xy| = |x|·|y|**(绝对值可乘);\n- (iv) **|x| ≥ 0**,且 |x| = 0 ⟺ x = 0;\n- (v) **|x − a| < ε ⟺ a − ε < x < a + ε**(ε-带刻画);\n- (vi) **|x + y| ≤ |x| + |y|**(三角不等式)。\n\n**证明.** (i)(ii)(iv) 直接按定义分「正/零/负」三种情形逐一核对即得(例如 (iv):正数与负数取绝对值都得正数,只有 0 得 0)。\n\n(iii) 也是分情形:若 x、y 同号,xy > 0,|xy| = xy,而 |x||y| 在两正或两负时都等于 xy(负负得正);若异号,xy < 0,|xy| = −xy,而 |x||y| 此时一正一负相乘…逐格验证即可,根子是 <a class=\"wl\" data-id=\"num_z_ordine\">环的符号定理<\/a>。\n\n(v) 是后面用得最多的一条,值得写清。分两个方向,核心是把绝对值的定义拆开:\n\n|x − a| < ε  ⟺  −ε < x − a < ε  （∗）\n\n这一步本身要分情形:若 x − a ≥ 0,|x−a| = x−a < ε 给出右半 x − a < ε,而左半 −ε < x − a 因 x−a ≥ 0 > −ε 自动成立;若 x − a < 0,|x−a| = −(x−a) < ε 给出 x − a > −ε,即左半,右半 x − a < 0 < ε 自动成立。两种情形合起来就是 (∗)。再两边同加 a(序与加法相容,O1),得 a − ε < x < a + ε。∎ 这条说的是:**「x 到 a 的距离小于 ε」等价于「x 落在以 a 为心、ε 为半径的开区间里」**——「距离」与「邻域」的互译,极限定义就靠它。\n\n<svg viewBox=\"0 0 360 96\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 高亮带 -->\n  <rect x=\"110\" y=\"50\" width=\"140\" height=\"12\" fill=\"#E0612F\" opacity=\"0.13\"/>\n  <!-- 轴 -->\n  <line x1=\"30\" y1=\"56\" x2=\"330\" y2=\"56\" stroke=\"#888\" stroke-width=\"1.3\"/>\n  <path d=\"M 330 56 L 322 52 L 322 60 z\" fill=\"#888\"/>\n  <!-- a 中心 -->\n  <line x1=\"180\" y1=\"48\" x2=\"180\" y2=\"64\" stroke=\"#555\" stroke-width=\"1.4\"/>\n  <circle cx=\"180\" cy=\"56\" r=\"3.5\" fill=\"#555\"/>\n  <text x=\"180\" y=\"80\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">a<\/text>\n  <!-- 端点 a±ε (空心,开区间) -->\n  <circle cx=\"110\" cy=\"56\" r=\"4\" fill=\"white\" stroke=\"#E0612F\" stroke-width=\"1.5\"/>\n  <circle cx=\"250\" cy=\"56\" r=\"4\" fill=\"white\" stroke=\"#E0612F\" stroke-width=\"1.5\"/>\n  <text x=\"110\" y=\"80\" font-size=\"11\" text-anchor=\"middle\" fill=\"#E0612F\">a−ε<\/text>\n  <text x=\"250\" y=\"80\" font-size=\"11\" text-anchor=\"middle\" fill=\"#E0612F\">a+ε<\/text>\n  <!-- 半径标注 -->\n  <line x1=\"180\" y1=\"40\" x2=\"250\" y2=\"40\" stroke=\"#E0612F\" stroke-width=\"0.9\" stroke-dasharray=\"3,2\"/>\n  <text x=\"215\" y=\"36\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0612F\">ε<\/text>\n  <!-- x 点(带内) -->\n  <circle cx=\"215\" cy=\"56\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <text x=\"215\" y=\"80\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5A5FE0\">x<\/text>\n<\/svg>\n\n空心端点表示开区间(不含 a±ε 本身);x 落在带内,正对应 |x−a| < ε。整个极限理论里「x 充分接近 a」这句话,画出来就是这条带。\n\n(vi) **三角不等式**,本节的主角。证明用一个漂亮的分情形(依据 (ii) 的 x ≤ |x|):\n\n先设 x + y ≥ 0。则 |x + y| = x + y;而 x ≤ |x|、y ≤ |y|,相加得 x + y ≤ |x| + |y|。故 |x+y| ≤ |x| + |y|。\n\n再设 x + y < 0。则 −(x + y) > 0,于是\n\n|x + y| = |−(x+y)| = |(−x) + (−y)| ≤ |−x| + |−y| = |x| + |y|,\n\n中间的 ≤ 是把刚证的「非负情形」用在 (−x)+(−y) 上(它非负),末步用 (ii) 的 |−x| = |x|。两种情形俱得。∎\n\n为什么叫「三角」不等式:把它写成距离形式 |x − z| ≤ |x − y| + |y − z|(令上式中的两项为 x−y 与 y−z),读作「从 x 直接到 z 的距离,不超过绕道 y 的距离」——三角形两边之和不小于第三边。这条几何直觉,将在下一节被抽象成距离的公理。\n\n## 反向三角不等式\n\n三角不等式给「和」的绝对值一个**上界**;它的推论给「差」一个**下界**,同样常用。\n\n**推论(反向三角不等式).** 对一切 x, y ∈ K:\n\n|x − y| ≥ | |x| − |y| |。\n\n**证明.** 把三角不等式用在恒等式 x = (x − y) + y 上:\n\n|x| = |(x−y) + y| ≤ |x − y| + |y|,\n\n移项得 |x| − |y| ≤ |x − y|。把 x、y 互换,得 |y| − |x| ≤ |y − x| = |x − y|（由 (ii)）。两个不等式合起来:|x−y| 同时 ≥ (|x|−|y|) 和 ≥ −(|x|−|y|),即 ≥ 其绝对值。∎\n\n用处:它说「两个数的距离,至少是它们大小之差」。将来证「若 xₙ → x 则 |xₙ| → |x|」时,一行就靠它。\n\n## 一个典型估计\n\n把这两条不等式连用,演示分析里最常见的一种「拆项放缩」。这类操作以后会成为家常便饭,这里先看一遍它的样子。\n\n**例.** 设 |x − a| < δ 且 |y − b| < δ。则 |(x + y) − (a + b)| < 2δ。\n\n**证明.** 关键是先「拆」再「放」:\n\n|(x+y) − (a+b)| = |(x − a) + (y − b)| ≤ |x − a| + |y − b| < δ + δ = 2δ。\n\n第一步把目标重组成「两个已知小量之和」,第二步三角不等式拆成两段,第三步代入各自的界。∎\n\n这个套路——**把要估计的量,拼凑成若干已知小量的组合,再用三角不等式逐段控制**——是极限证明的基本动作。下一节定义数列收敛后,第一批定理(和的极限、积的极限)用的全是它。\n\n## 一道激活练习\n\n设 K 是有序域,x, y ∈ K。\n\n(a) 证明:|x| − |y| ≤ |x + y|。(注意是 x + y,不是 x − y。)\n\n(b) 设 |x − a| < δ₁ 且 |y − b| < δ₂。给出 |xy − ab| 的一个上界,用 |a|、|b|、δ₁、δ₂ 表示。(提示:这是积的情形,比和难一点。先做一次「加减同一项」的拆分:xy − ab = xy − ay + ay − ab = (x−a)y + a(y−b),再用三角不等式与可乘性 (iii);你还需要把 |y| 控制住——由 |y − b| < δ₂ 和反向三角不等式,|y| < |b| + δ₂。)\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 把反向三角不等式用在 x 与 −y 上:|x − (−y)| ≥ | |x| − |−y| |,即 |x + y| ≥ | |x| − |y| | ≥ |x| − |y|(任何数 ≤ 其绝对值,用了 (ii))。∎\n\n**(b)** 先做加减同一项的拆分:\n\nxy − ab = xy − ay + ay − ab = (x − a)·y + a·(y − b)。\n\n三角不等式 + 可乘性:\n\n|xy − ab| ≤ |x − a|·|y| + |a|·|y − b| < δ₁·|y| + |a|·δ₂。\n\n再把 |y| 控制住:由 |y − b| < δ₂ 与反向三角不等式,|y| − |b| ≤ |y − b| < δ₂,故 |y| < |b| + δ₂。代入:\n\n|xy − ab| < δ₁·(|b| + δ₂) + |a|·δ₂ = |b|·δ₁ + |a|·δ₂ + δ₁·δ₂。∎\n\n回顾:积的估计比和复杂,核心技巧是「加减同一项 ay」——把一个差拆成两个各含一个小因子 (x−a)、(y−b) 的项。这个「加减同项」的手法,是分析证明里仅次于三角不等式的常用动作,证「积的极限」时会原样登场。\n\n## 往前看一步\n\n我们有了一把尺子 |x − y|,量的是数轴上两点的距离,而且摸清了它的全部脾性:非负、可乘、满足三角不等式。下一步是一次关键的抽象。回头看这把尺子真正用到的性质,其实只有三条:距离非负且仅在两点重合时为零、距离对称(|x−y| = |y−x|)、以及三角不等式。任何一个集合,只要配上一个满足这三条的「距离函数」,「逼近」就能在其中谈论——无论它的元素是实数、复数、向量,还是函数。把这三条提炼成公理,就得到**度量空间**(metric space),它是整个分析(以及拓扑、泛函分析)的统一舞台。这就是 <a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a> 的内容;而我们的第一把尺子 |x−y|,将成为它的头号例子。","refs":"Amann–Escher, Analysis I §I.8 (Prop. 8.10–8.11)"},{"id":"fond_cardinalita","label":"等势与可数性","parent":"fond_fondamenta","summary":"「一样多」= 存在双射；与 ℕ 等势的无穷集叫可数。无穷处部分可与整体一样多，而 Cantor 对角线证明无穷竟分大小——幂集永远更大。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#A9A9A9","ring":7,"bearing":2,"popupLinks":[{"id":"fond_iniettive_suriettive","text":"双射"},{"id":"fond_equivalenza","text":"等价关系"},{"id":"fond_composizione","text":"可逆 ⟺ 双射"},{"id":"fond_relazioni","text":"笛卡尔积"},{"id":"fond_insiemi","text":"外延原则"},{"id":"num_n","text":"Peano 公理与自然数"}],"body":"\n## 不数数,怎么比多少\n\n一个上古的难题:牧人不识数,怎么知道羊有没有丢?办法是**配对**——出栏时每只羊扔一颗石子进罐,归栏时每只羊取一颗出来;罐子空了,羊就齐了。他自始至终不知道羊「有几只」,却完全有把握羊和石子「一样多」。\n\n这给了我们一个深刻的启示:**「一样多」比「有几个」更原始**——比较不需要先数数,配对就够了。而「完美配对」恰恰是我们刚刚锻造完的工具:<a class=\"wl\" data-id=\"fond_iniettive_suriettive\">双射<\/a>。于是一个古老的直觉,今天升格为定义。\n\n## 等势\n\n两个集合 A、B 称为**等势**(equipotent),记 A ≈ B,若存在一个双射 f : A → B。\n\n它的行为像极了<a class=\"wl\" data-id=\"fond_equivalenza\">等价关系<\/a>,三条全占——而且每一条都恰好由上一节的一条定理担保:\n\n- **自反** A ≈ A:恒等函数 id_A 是双射。\n- **对称** A ≈ B ⟹ B ≈ A:双射 f 可逆,而 f⁻¹ 自己也是双射——因为 f⁻¹ 有逆(就是 f),由<a class=\"wl\" data-id=\"fond_composizione\">可逆 ⟺ 双射<\/a>即得。\n- **传递** A ≈ B ∧ B ≈ C ⟹ A ≈ C:双射的复合是双射(上节引理 1+2)。\n\n> 一句诚实话:严格说,等价关系是「某个集合**上**的关系」,可「所有集合的集合」不是合法对象——还记得集合那节按下的罗素悖论么,这正是它的回响。所以我们说等势「像」等价关系:三条性质逐字成立、放心使用,只是别问「它是哪个集合上的关系」。\n\n## 有限、无穷、可数\n\n有了「一样多」,就能给「有 n 个」正身:A 是**有限的**(finite),若 A = ∅ 或 A ≈ {1, 2, …, n} 对某个自然数 n 成立;否则称**无穷的**(infinite)。数数,原来就是和样板集 {1,…,n} 配对。(自然数照例先按熟悉的方式借用——它的严格出生证明在不远处等着我们。)\n\n无穷集合里地位最特殊的标尺是 ℕ 自己。与 ℕ 等势的集合称**可数无穷**(countably infinite);有限或可数无穷统称**可数**(countable)。「与 ℕ 等势」说白了就是**能排成一列不重不漏的清单** a₀, a₁, a₂, …——双射 ℕ → A 就是这张清单,n ↦ 第 n 号展品。\n\n## 部分可以和整体一样多\n\n现在来看无穷集合的第一个反直觉现象。取偶数集 E = {0, 2, 4, …}。它是 ℕ 的**真子集**——奇数全被剔除,「少了一半」。可是:\n\n**断言.** ℕ ≈ E,由 f : ℕ → E, n ↦ 2n 实现。\n\n**证明.** 单射:设 2n = 2m,除以 2 得 n = m。满射:任给 e ∈ E,按 E 的定义 e = 2k 对某个 k ∈ ℕ,于是 f(k) = e。两条都过,f 是双射。∎\n\n证明短得让人不安,结论却推翻了一条两千年的「公理」——欧几里得说「整体大于部分」。在有限世界这没错;在无穷世界,**整体可以和真部分一样多**。伽利略在十七世纪就撞见了这件事(平方数与全体自然数配对),被吓得退了回去;Cantor 的过人之处在于不退:既然定义推出如此,那就接受它——这不是悖论,是无穷的**本性**。(事实上这条性质刻画了无穷:一个集合是无穷的,当且仅当它与某个真子集等势——Dedekind 干脆拿它当无穷的定义。)\n\n更夸张的:ℤ 看着是 ℕ 的「两倍再多一」,也照样可数——清单这么排:0, 1, −1, 2, −2, 3, −3, …,左右开弓地数,谁也不漏。(ℤ 同样先借用;严格构造它正是等价类机器的第一单生意。)\n\n## ℕ×ℕ 也可数:蛇形清单\n\n再升一级。格点阵 ℕ×ℕ——<a class=\"wl\" data-id=\"fond_relazioni\">笛卡尔积<\/a>那张图的无穷版——直觉上是「无穷个无穷」,总该更大了吧?仍然不:按**反对角线**把格点排成蛇形清单,(0,0) 排第 0 号,然后 (1,0), (0,1),然后 (2,0), (1,1), (0,2),……每条反对角线 a+b = 常数 上只有有限个点,一条数完数下一条,任何 (a,b) 都会在第 a+b 条对角线上被数到——不重,不漏:\n\n<svg viewBox=\"0 0 280 240\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"arr4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#E0612F\"/>\n    <\/marker>\n  <\/defs>\n  <line x1=\"40\" y1=\"200\" x2=\"260\" y2=\"200\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <line x1=\"40\" y1=\"200\" x2=\"40\" y2=\"20\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <circle cx=\"70\" cy=\"170\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"120\" cy=\"170\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"170\" cy=\"170\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"220\" cy=\"170\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"70\" cy=\"120\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"120\" cy=\"120\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"170\" cy=\"120\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"70\" cy=\"70\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"120\" cy=\"70\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"70\" cy=\"34\" r=\"4\" fill=\"#333\"/>\n  <line x1=\"76\" y1=\"166\" x2=\"113\" y2=\"172\" stroke=\"#E0612F\" stroke-width=\"1.3\" marker-end=\"url(#arr4)\"/>\n  <line x1=\"114\" y1=\"164\" x2=\"77\" y2=\"126\" stroke=\"#E0612F\" stroke-width=\"1.3\" marker-end=\"url(#arr4)\"/>\n  <line x1=\"76\" y1=\"114\" x2=\"113\" y2=\"76\" stroke=\"#E0612F\" stroke-width=\"1.3\" marker-end=\"url(#arr4)\"/>\n  <line x1=\"126\" y1=\"76\" x2=\"163\" y2=\"114\" stroke=\"#E0612F\" stroke-width=\"1.3\" marker-end=\"url(#arr4)\"/>\n  <line x1=\"176\" y1=\"116\" x2=\"213\" y2=\"164\" stroke=\"#E0612F\" stroke-width=\"1.3\" marker-end=\"url(#arr4)\"/>\n  <text x=\"62\" y=\"190\" font-size=\"11\" fill=\"#555\">0<\/text>\n  <text x=\"124\" y=\"190\" font-size=\"11\" fill=\"#555\">1<\/text>\n  <text x=\"174\" y=\"190\" font-size=\"11\" fill=\"#555\">2<\/text>\n  <text x=\"224\" y=\"190\" font-size=\"11\" fill=\"#555\">3<\/text>\n  <text x=\"26\" y=\"174\" font-size=\"11\" fill=\"#555\">0<\/text>\n  <text x=\"26\" y=\"124\" font-size=\"11\" fill=\"#555\">1<\/text>\n  <text x=\"26\" y=\"74\" font-size=\"11\" fill=\"#555\">2<\/text>\n<\/svg>\n\n由此立刻多米诺:ℚ(有理数)也可数——每个有理数无非「一对整数」打了个商,塞进 ℤ×ℤ 的清单里挑着数即可。(细节将来 ℚ 建成后补严;眼下记住结论与方法:**清单化 = 可数**。)\n\n到这里,你可能开始怀疑:难道所有无穷都一样多,「无穷」就是一个大箩筐?\n\n## Cantor 定理:无穷分大小\n\n不。Cantor 在 1891 年给出的论证,是整个数学里最漂亮的几页之一。先备一件小工具:集合 A 的**幂集**(power set) P(A),即 A 的全体子集组成的集合:P(A) := {X : X ⊆ A}。例如 P({1,2}) = {∅, {1}, {2}, {1,2}},四个元素。(「子集全体确实凑成一个合法的集合」——这我们约定接受,它是搭建集合宇宙的一条基本许可。)\n\n**定理 (Cantor).** 对**任何**集合 A,不存在满射 f : A → P(A)。\n\n**证明.** 任给一个函数 f : A → P(A)——它把每个元素 a 指派到一个子集 f(a) ⊆ A。要证 f 必不满,只需**亲手造出一个没人打中的靶点**(上上节「非满射」的标准任务:见证 + 一个全称论证)。\n\n构造的关键一步如下。对每个 a ∈ A 问一个问题:「**a 在不在自己被指派的那个子集里?**」把答案为「不在」的收拢起来:\n\nD := { a ∈ A : a ∉ f(a) }。\n\n(这是描述法的合法用法——从已有的 A 里切,不越雷池。)D 是 A 的子集,即 D ∈ P(A),是个正经靶点。往证:∀a ∈ A, f(a) ≠ D。\n\n任取 a ∈ A,只问一件事:a ∈ D 吗?两种情形——\n\n- 若 a ∈ D:按 D 的定义,a ∉ f(a)。于是 a 这个元素,在 D 里、不在 f(a) 里——两个集合的成员资格在 a 处不同,由<a class=\"wl\" data-id=\"fond_insiemi\">外延原则<\/a>,f(a) ≠ D。\n- 若 a ∉ D:按 D 的定义(取否定),a ∈ f(a)。于是 a 在 f(a) 里、不在 D 里——同理 f(a) ≠ D。\n\n横竖 f(a) ≠ D,对一切 a 成立。D 无人打中,f 不满。∎\n\n慢放一遍这支箭。D 是按 f 本人**量身定做**的反对者:它在每个坐标 a 上,都故意跟 f(a) 唱反调——你收 a,我就不收;你不收,我偏收。于是它跟清单上**每一项**至少有一处不同,自然不在清单上。这手法叫**对角线论证**(diagonal argument):沿着「a 对 f(a)」这条对角线逐点取反。你该觉得眼熟——罗素悖论里那个「不含自身的集合的集合」,用的是同一个手法;只是罗素用它揭出了朴素集合论的矛盾,Cantor 用它量出了无穷的层级。同一手法,两种用途;它在数学与逻辑里还会反复出现。\n\n## 无穷的阶梯\n\nCantor 定理说:A 永远配不满 P(A)——而 A 塞**进** P(A) 倒容易(a ↦ {a} 是单射)。所以 P(A) 总是「严格更多」。把它迭代起来:\n\nℕ, P(ℕ), P(P(ℕ)), P(P(P(ℕ))), …\n\n每一级都比上一级严格更大——**无穷不是一个箩筐,是一架没有顶的阶梯**。「可数」只是这架梯子的第一蹬;从 P(ℕ) 起,清单化就永远做不到了,这样的集合称**不可数**(uncountable)。预告一句:将来实数 ℝ 建成后,我们会证明 ℝ ≈ P(ℕ)——所以**实数不可数**,实数轴在「多少」的意义上就比自然数高一整级;届时还会用小数展开把对角线再扎一次,那是这一招的经典舞台。至于「两个集合互相单射进对方,是否就等势」(答案为是,Cantor–Schröder–Bernstein 定理),以及「梯级之间还有没有中间层」,都是这条线上的好戏,留待将来。\n\n## 一道激活练习\n\n把对角线握在手心。取 A = {1, 2, 3},定义 f : A → P(A) 为\n\nf(1) = {2, 3},  f(2) = {2},  f(3) = ∅。\n\n(a) 按定理证明里的配方,算出 D = {a ∈ A : a ∉ f(a)}。\n(b) 逐一核对 D ≠ f(1)、D ≠ f(2)、D ≠ f(3),并对每个 a 指明「分歧发生在哪个元素上」。\n(c) 这个 A 有 3 个元素,P(A) 有 8 个;f 当然不可能满。那 Cantor 定理对有限集说了什么**新**东西吗?想一想定理的分量到底压在哪类集合上。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 逐个过堂:1 ∈ f(1) = {2,3}?否——1 入选 D。2 ∈ f(2) = {2}?是——2 落选。3 ∈ f(3) = ∅?否——3 入选。故 **D = {1, 3}**。\n\n**(b)** D 与 f(1) = {2,3}:分歧在 1(1 ∈ D 而 1 ∉ f(1))——正是 1 自己的坐标。D 与 f(2) = {2}:分歧在 2(2 ∉ D 而 2 ∈ f(2))——正是 2 自己的坐标。D 与 f(3) = ∅:分歧在 3(3 ∈ D 而 3 ∉ f(3))——正是 3 自己的坐标。看见对角线了么:**D 与第 a 张牌的分歧,恰好都发生在 a 本人身上**——这正是「量身定做的反对者」的字面意思。\n\n**(c)** 对有限集,「3 个元素打不满 8 个靶点」用数数就知道,定理确实不新。它的全部分量压在**无穷**集合上:那里「数数」失效,「部分≈整体」的怪事横行,谁也不敢担保 ℕ 打不满 P(ℕ)——而对角线给出了一个**对一切集合一视同仁**、根本不需要数数的论证。这也是个值得记住的品味:好定理的证明,常常在最危险的地方(无穷)和最平凡的地方(有限)用的是同一句话。\n\n## 往前看一步\n\n回望这九节:我们从「一句能判真假的话」起步,一路造出了集合、关系、等价、函数、双射,直到今天量出无穷的层级。地基的**语言**部分至此完工。但这一路上有多处「暂且借用」:ℕ、ℤ、ℚ、ℝ 尚未严格建立,连「平方非负」「√2 存在」也仍悬而未证。现在轮到它们了——从此我们转入**造对象**:只用这套语言,从五条朴素得近乎天真的公理出发,把自然数从虚空中造出来,再反复使用等价类构造,造出 ℤ 与 ℚ,直到那条没有缝隙的实数轴。第一站:<a class=\"wl\" data-id=\"num_n\">Peano 公理与自然数<\/a>。","refs":"Amann–Escher, Analysis I §I.6"},{"id":"fond_composizione","label":"复合与逆函数","parent":"fond_fondamenta","summary":"复合 g∘f 把函数接力成新函数，满足结合律、以恒等为单位；可逆 ⟺ 双射，逆函数唯一且 (g∘f)⁻¹ = f⁻¹∘g⁻¹。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#A9A9A9","ring":6,"bearing":43,"popupLinks":[{"id":"fond_funzioni","text":"函数相等"},{"id":"alg_gruppi","text":"群"},{"id":"fond_cardinalita","text":"等势与可数性"}],"body":"\n## 接力\n\n函数最自然的玩法是**串起来用**：一个函数的输出，喂给下一个函数当输入。「先求平方、再加一」「先取等价类、再做别的」——数学里的复杂操作几乎都是简单操作的接力。这一节先把「接力」本身定成一个运算，弄清它的基本性质；然后回应上一节末尾的悬念——**什么样的函数，箭头能走回去**。两件事到头来是一件：「走回去」必须用「接力」才说得清楚。\n\n## 复合\n\n设 f : A → B，g : B → C（注意衔接条件：**f 的到达域 = g 的定义域**，接力棒得递得上）。定义它们的**复合**(composition)\n\ng ∘ f : A → C，  a ↦ g(f(a))。\n\n先尽本分，验证 g∘f 真是个函数：任给 a ∈ A，f 是函数，f(a) 是 B 中唯一确定的元素；g 是函数，g(f(a)) 又是 C 中唯一确定的元素。每个输入恰好一个输出，资格合法。∎\n\n<svg viewBox=\"0 0 380 150\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"arr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#555\"/>\n    <\/marker>\n  <\/defs>\n  <ellipse cx=\"60\" cy=\"70\" rx=\"34\" ry=\"42\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <ellipse cx=\"190\" cy=\"70\" rx=\"34\" ry=\"42\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <ellipse cx=\"320\" cy=\"70\" rx=\"34\" ry=\"42\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <text x=\"60\" y=\"74\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">A<\/text>\n  <text x=\"190\" y=\"74\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">B<\/text>\n  <text x=\"320\" y=\"74\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\">C<\/text>\n  <line x1=\"98\" y1=\"64\" x2=\"152\" y2=\"64\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr3)\"/>\n  <text x=\"125\" y=\"54\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">f<\/text>\n  <line x1=\"228\" y1=\"64\" x2=\"282\" y2=\"64\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr3)\"/>\n  <text x=\"255\" y=\"54\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">g<\/text>\n  <path d=\"M 70 116 C 140 152, 240 152, 310 116\" fill=\"none\" stroke=\"#E0612F\" stroke-width=\"1.4\" marker-end=\"url(#arr3)\"/>\n  <text x=\"190\" y=\"146\" font-size=\"13\" text-anchor=\"middle\" fill=\"#E0612F\">g∘f<\/text>\n<\/svg>\n\n**记号的方向是个著名的坑**：g∘f 读「g 复合 f」，可执行顺序是**先 f 后 g**——符号从右往左吃。根源在记号 g(f(a))：a 先被里层的 f 吞掉。读 ∘ 时心里默念「**∘ = 作用在……的结果上**」就不会反。\n\n## 复合的三条基本性质\n\n**(一) 不可交换。** 一般 g∘f ≠ f∘g——连两边是否都有定义都未必。就算都有定义也常不等：取 f, g : ℝ → ℝ，f(x) = x+1，g(x) = 2x，则 (g∘f)(x) = 2(x+1) = 2x+2，而 (f∘g)(x) = 2x+1。在 x = 0 处一个给 2、一个给 1，按函数相等的三件套（上一节的定义），两者不等。「先加一再翻倍」与「先翻倍再加一」当然不同——顺序就是信息。\n\n**(二) 结合律。** 设 f : A → B，g : B → C，h : C → D。则\n\nh ∘ (g∘f) = (h∘g) ∘ f。\n\n**证明.** 两边都是 A → D 的函数（定义域、到达域已同），按 <a class=\"wl\" data-id=\"fond_funzioni\">函数相等<\/a> 只剩验逐点的值。任给 a ∈ A：左边给 h((g∘f)(a)) = h(g(f(a)))；右边给 (h∘g)(f(a)) = h(g(f(a)))。逐点相同。∎\n\n证明平淡，后果不平淡：括号既然怎么放都一样，干脆不写——h∘g∘f 从此是合法记号，任意长的接力链都不必操心结合顺序。\n\n**(三) 恒等是单位。** 对任意 f : A → B：f ∘ id_A = f 且 id_B ∘ f = f（逐点一验即得）。恒等函数之于 ∘，恰如 1 之于乘法、0 之于加法——什么也不做的那个，地位最特殊。\n\n> 留意这个组合：一种运算（∘），满足结合律，有单位元（id），而且马上要看到「逆」。这三样性质凑在一起，是数学里出现频率最高的结构配方之一——它有专门的名字：**群**。正式定义留待 <a class=\"wl\" data-id=\"alg_gruppi\">群<\/a>。\n\n## 复合保品质\n\n接力不糟蹋好品质。两条小引理（设 f : A → B，g : B → C）：\n\n**引理 1.** f、g 都是单射 ⟹ g∘f 是单射。\n\n**证明.** 标准开场白：设 (g∘f)(x) = (g∘f)(x′)，即 g(f(x)) = g(f(x′))。g 单射，剥掉一层得 f(x) = f(x′)；f 单射，再剥一层得 x = x′。∎（像剥洋葱：单射的本事就是「从外往里剥」。）\n\n**引理 2.** f、g 都是满射 ⟹ g∘f 是满射。\n\n**证明.** 任给 c ∈ C，倒着追射手：g 满，存在 b ∈ B 使 g(b) = c；f 满，存在 a ∈ A 使 f(a) = b。于是 (g∘f)(a) = g(f(a)) = g(b) = c。∎（满射的本事是「从外往里追」。）\n\n两条合起来：**双射的复合是双射**。\n\n## 逆函数\n\n现在回应那个悬念。f : A → B 称为**可逆**(invertible)，若存在 g : B → A，使得\n\ng ∘ f = id_A  且  f ∘ g = id_B。\n\n第一条说「先去再回，回到原地」（g 撤销 f），第二条说「先回再去，也回到原地」（f 撤销 g）。**两条都要**，一条不够——文末陷阱里有反例。\n\n**逆若存在则唯一。** 设 g、g′ 都满足上面两条。看这串推演：\n\ng = g ∘ id_B = g ∘ (f ∘ g′) = (g ∘ f) ∘ g′ = id_A ∘ g′ = g′。\n\n五步分别用了：单位、g′ 的第二条、**结合律**、g 的第一条、单位。∎ 唯一既证，专属记号有了着落：记作 **f⁻¹**。留意这个证明一个元素都没碰——全程只摆弄运算律。这种「不看内部、只用规律」的推理，正是将来代数的日常呼吸。\n\n**主定理.** f : A → B 可逆 ⟺ f 是双射。\n\n**证明.** 「⟹」设 f 可逆，逆为 g。*单射*：设 f(x) = f(x′)，两边用 g 作用：g(f(x)) = g(f(x′))，即 id_A(x) = id_A(x′)，即 x = x′。*满射*：任给 b ∈ B，取 a := g(b)，则 f(a) = f(g(b)) = id_B(b) = b——见证到手。\n\n「⟸」设 f 是双射，要亲手造出逆。任给 b ∈ B：f 满射，存在 a 使 f(a) = b；f 单射，这样的 a 至多一个。两条合并：**恰好存在一个** a 使 f(a) = b——又是 ∃!，正因唯一，「把 b 送到这个 a」才是合法的指派，得函数 g : B → A。验两条：对任意 a ∈ A，g(f(a)) 按定义是「被 f 打到 f(a) 的那个唯一元素」，而 a 自己就打中了，由唯一性 g(f(a)) = a，故 g∘f = id_A；对任意 b ∈ B，g(b) 是打中 b 的那个元素，所以 f(g(b)) = b，故 f∘g = id_B。∎\n\n回头看「⟸」的构造，会发现它就是上一节那句直觉的严格版：双射之下 B 的每个元素恰被一支箭打中，「沿箭头走回去」处处可行、绝无歧义——单射保证「无歧义」，满射保证「处处可行」，一人一岗。\n\n例子接着上一节的活：f : ℝ → ℝ, x ↦ 2x+1 已证双射，按构造其逆为 f⁻¹(b) = (b−1)/2（就是当时满射证明里解出的那个见证！）。验算：f⁻¹(f(x)) = ((2x+1)−1)/2 = x，f(f⁻¹(b)) = 2·(b−1)/2 + 1 = b。两条都过。——满射证明里「解方程找见证」的活，和「求逆函数」原来是同一件事。\n\n## 几个最容易栽跟头的地方\n\n- **f⁻¹ 不是 1/f。** 上例里 f⁻¹(x) = (x−1)/2，而 1/f(x) = 1/(2x+1)——风马牛。记号 ⁻¹ 在这里指「关于 ∘ 的逆」，不是「关于乘法的倒数」；撞车纯属历史包袱。\n- **单边撤销不够。** 取 A = {1}，B = {a, b}，f : A → B, f(1) = a，g : B → A 只能是常函数 g(a) = g(b) = 1。验 g∘f：g(f(1)) = g(a) = 1，确实 = id_A——左边撤销成立！可 f 不是双射（b 空置），也确实 (f∘g)(b) = f(1) = a ≠ b。**一条等式只担保一半品质**（细嚼主定理「⟹」的证明会发现：单射只用了第一条，满射只用了第二条），定义里两条缺一不可。\n- **复合的衔接**：写 g∘f 前先核对 f 的到达域等于 g 的定义域，对不上就是未定义——这也是「到达域是函数身份的一部分」的又一次应用。\n\n## 一道激活练习\n\n设 f : A → B 与 g : B → C 都是双射。证明 g∘f（由引理 1、2 已知是双射，故可逆）的逆是\n\n(g∘f)⁻¹ = f⁻¹ ∘ g⁻¹。\n\n注意右边的**顺序反了过来**。先想一想为什么必须反——「先穿袜子后穿鞋」，脱的时候谁先脱？——再动手证。（提示：逆是唯一的，所以只需验证 f⁻¹∘g⁻¹ 满足逆的两条定义等式；通篇只用结合律和单位元，一个元素都不必碰。）\n\n## 参考解答\n\n（建议先自己写完再看。）思路：要证「某物是 (g∘f) 的逆」，由逆的唯一性，只需验证它满足两条定义等式。记 h := f⁻¹∘g⁻¹ : C → A（衔接合法：g⁻¹ : C → B，f⁻¹ : B → A）。\n\n**第一条** h ∘ (g∘f) = id_A：\n\n```\n(f⁻¹∘g⁻¹) ∘ (g∘f)\n= f⁻¹ ∘ (g⁻¹∘g) ∘ f     （结合律——括号随便挪）\n= f⁻¹ ∘ id_B ∘ f         （g⁻¹∘g = id_B）\n= f⁻¹ ∘ f                 （id 是单位）\n= id_A。\n```\n\n**第二条** (g∘f) ∘ h = id_C：\n\n```\n(g∘f) ∘ (f⁻¹∘g⁻¹)\n= g ∘ (f∘f⁻¹) ∘ g⁻¹     （结合律）\n= g ∘ id_B ∘ g⁻¹          （f∘f⁻¹ = id_B）\n= g ∘ g⁻¹                  （id 是单位）\n= id_C。\n```\n\n两条都成立，由逆的唯一性，(g∘f)⁻¹ = f⁻¹∘g⁻¹。∎\n\n顺序为何必须反，现在看得真切：消去要**从中间烧起**——(g∘f) 的左边只有先贴上 f⁻¹…g⁻¹ 中靠右的 g⁻¹，才能让 g⁻¹∘g 在链条中央相遇湮灭，露出里面的 f 再被 f⁻¹ 接走。穿衣是 f 先 g 后（袜子先鞋后），脱衣只能 g 先 f 后（鞋先袜后）。也再次留意：全程没碰过任何元素——和唯一性的证明一样，纯靠运算律行走。\n\n## 往前看一步\n\n地基的工具箱就此配齐：双射是「完美配对」，而且我们现在知道它可逆、可复合、复合还保双射。于是一个古老的问题第一次有了严格的问法：两个集合什么时候算「**一样多**」？答曰——它们之间存在一个双射。这个回答对有限集合不过是常识；可一旦放到无穷集合上，它将掀翻你的直觉：你会看到「部分可以和整体一样多」，也会看到「无穷与无穷竟分大小」。这就是 <a class=\"wl\" data-id=\"fond_cardinalita\">等势与可数性<\/a> 的内容。","refs":"Amann–Escher, Analysis I §I.3"},{"id":"fond_equivalenza","label":"等价关系与商集","parent":"fond_fondamenta","summary":"自反、对称、传递三条全占的关系叫等价关系；它把集合切成互不相交的等价类，类的全体构成商集——数学里制造新对象的头号机器。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#A9A9A9","ring":4,"bearing":36,"popupLinks":[{"id":"fond_relazioni","text":"关系"},{"id":"num_n","text":"自然数"},{"id":"fond_funzioni","text":"函数"}],"body":"\n## 「视为相同」\n\n数学里有个挥之不去的需求：把**不完全相同**的东西**当作相同**来处理。分数 1/2 和 2/4 写法不同，却该算同一个数；两个三角形位置不同，只要能叠合，就该算「同一个形状」；统计奇偶时，3 和 17 没有分别。每次我们都在说同一句话——「在我此刻关心的层面上，它们一样」。\n\n可「视为相同」要是随手乱用，立刻出乱子：要是「视为相同」连自己跟自己都不算相同，或者 a 同 b、b 同 c 却 a 不同 c，那「按相同归堆」这件事根本做不成。要让归堆站得住，「视为相同」必须守纪律——而需要的纪律，恰恰就是上一节备好的那三条。这绝非巧合：三条品性本来就是从「相等」身上提炼出来的，等价关系就是「**像相等一样行事**的关系」。\n\n## 定义与例子\n\n设 ~ 是集合 A 上的一个 <a class=\"wl\" data-id=\"fond_relazioni\">关系<\/a>。若 ~ 同时满足\n\n- 自反：∀x ∈ A, x ~ x；\n- 对称：∀x,y ∈ A ( x ~ y ⟹ y ~ x )；\n- 传递：∀x,y,z ∈ A ( (x ~ y ∧ y ~ z) ⟹ x ~ z )，\n\n就称 ~ 是 A 上的一个**等价关系**(equivalence relation)。习惯用波浪号 ~ 作记号，读「等价于」。\n\n例子（最后两个反例照例是命脉）：\n\n- **相等** = 本身：三条全占，是「最细」的等价关系——谁也不跟别人等价，每个元素只跟自己一堆。\n- **全关系** A×A：人人等价于人人，三条也全占，是「最粗」的——全体挤成一堆。等价关系全体就活在这两个极端之间。\n- **同奇偶**：自然数上 x ~ y ⟺ x、y 同为偶数或同为奇数。三条都成立（同自己同奇偶；同奇偶不分先后；接力两次奇偶不变）。自然数与奇偶我们暂且按你熟悉的方式用，它们的严格重建留待 <a class=\"wl\" data-id=\"num_n\">自然数<\/a>。\n- **「同一年出生」**（某群人上）：三条全占——日常语言里一切「同……」式的说法，几乎都是等价关系，这正是「视为相同」的语感来源。\n- **反例 ≤**（ℝ 上）：自反、传递，但**不对称**（2≤3 而 3≰2）。它不是等价关系——它是另一个重要物种（序关系）的代表，那条线以后再走。\n- **反例「是朋友」**：对称，未必传递（朋友的朋友不一定是朋友）。守不住接力，归堆就会归出含混的边界——这正是传递性不可或缺的原因。\n\n## 等价类\n\n有了守纪律的「视为相同」，归堆就可以动手了。对 a ∈ A，把所有与 a 等价的元素收进一个集合：\n\n[a] := { x ∈ A : x ~ a }，\n\n称为 a 的**等价类**(equivalence class)，a 叫这个类的一个**代表元**(representative)。\n\n同奇偶的例子里只有两个类：[0] = {0, 2, 4, …}（全体偶数）和 [1] = {1, 3, 5, …}（全体奇数）；并且 [0] = [2] = [4] = ⋯——**同一个类可以由它的任何成员代表**。这句话不该轻信，得证：\n\n**引理.** 设 ~ 是 A 上的等价关系，a, b ∈ A。则\n(i) a ∈ [a]；\n(ii) a ~ b ⟺ [a] = [b]。\n\n**证明.** (i) 即 a ~ a，自反性原话。（别小看这条：它保证**每个类都不空**，且每个元素都至少落在一个类里——落在自己的类里。）\n\n(ii) 「⟸」：设 [a] = [b]。由 (i)，a ∈ [a] = [b]，按定义即 a ~ b。\n\n「⟹」：设 a ~ b，证两个集合相等。按上一节的双向夹，分证两个包含。先证 [a] ⊆ [b]：任取 x ∈ [a]，即 x ~ a；又 a ~ b，由**传递**得 x ~ b，即 x ∈ [b]。再证 [b] ⊆ [a]：任取 x ∈ [b]，即 x ~ b；由 a ~ b 与**对称**得 b ~ a，再由**传递**得 x ~ a，即 x ∈ [a]。两个方向都成立，由外延原则 [a] = [b]。∎\n\n注意证明里三条性质各司其职、一条不多一条不少——这是「为什么定义恰好要这三条」的最好答案。\n\n## 类把集合切成划分\n\n把一个集合「切干净」这件事，先给个正式名字。A 的一个**划分**(partition)是一族非空子集，满足两条：**两两不相交**（任两块要么相等要么交为空），且**并起来盖满 A**（每个元素都落在某块里）。直观就是切蛋糕：不留缝、不重叠。\n\n<svg viewBox=\"0 0 340 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"20\" y=\"20\" width=\"300\" height=\"140\" rx=\"18\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.6\"/>\n  <path d=\"M 130 20 C 118 60, 142 120, 124 160\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/>\n  <path d=\"M 228 20 C 240 65, 214 115, 232 160\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/>\n  <circle cx=\"72\" cy=\"62\" r=\"3.5\" fill=\"#E0612F\"/>\n  <circle cx=\"95\" cy=\"108\" r=\"3.5\" fill=\"#E0612F\"/>\n  <circle cx=\"60\" cy=\"128\" r=\"3.5\" fill=\"#E0612F\"/>\n  <circle cx=\"172\" cy=\"58\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <circle cx=\"185\" cy=\"116\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <circle cx=\"278\" cy=\"70\" r=\"3.5\" fill=\"#1F9D6E\"/>\n  <circle cx=\"262\" cy=\"120\" r=\"3.5\" fill=\"#1F9D6E\"/>\n  <circle cx=\"292\" cy=\"132\" r=\"3.5\" fill=\"#1F9D6E\"/>\n  <text x=\"78\" y=\"46\" font-size=\"12\" fill=\"#555\">[a]<\/text>\n  <text x=\"174\" y=\"42\" font-size=\"12\" fill=\"#555\">[b]<\/text>\n  <text x=\"272\" y=\"50\" font-size=\"12\" fill=\"#555\">[c]<\/text>\n  <text x=\"30\" y=\"38\" font-size=\"13\" fill=\"#333\">A<\/text>\n<\/svg>\n\n**定理.** A 上任一等价关系 ~ 的全体等价类，构成 A 的一个划分。\n\n**证明.** 三件事。**非空**：引理 (i)，每个类含自己的代表元。**盖满**：任给 a ∈ A，引理 (i) 说 a ∈ [a]——每个元素都被某个类接住。**两两不相交**：要证任两类要么相等、要么交为空——等价地说，**只要有一个公共成员，两类就整个重合**。这一条留作下面的激活练习（引理 (ii) 已把刀磨好）。∎\n\n反过来也对：给 A 任意一个划分，规定「x ~ y ⟺ x 与 y 落在同一块里」，立刻得到一个等价关系，其等价类恰是原来的那些块。所以**等价关系与划分是同一件事的两种说法**：一个用「关系」的语言，一个用「切块」的语言，信息完全相同。\n\n## 商集：把「视为相同」升格为「真的相同」\n\n最后一步是全节的灵魂。把所有等价类**本身**收成一个新集合：\n\nA / ~ := { [a] : a ∈ A }，\n\n读「A 模 ~」，叫**商集**(quotient set)。\n\n体会一下发生了什么：在 A 里，3 和 17 是两个不同的元素，只是「被视为」相同（同奇偶）；可在商集 ℕ/~ 里，[3] 和 [17] **就是同一个元素**——引理 (ii) 白纸黑字担保了 [3] = [17]。差异没有被假装看不见，而是被**整个打包进类里、再把类当成新的个体**。「视为相同」就此升格为「真的相同」。商集 ℕ/~ 恰有两个元素：{[0], [1]}——它就是「奇偶性」这个概念本身的集合论肉身。\n\n这台机器的威力在于**无中生有地制造新对象**。预告一处你很快会亲眼看到的工地：整数。我们手里将只有自然数，而 3 − 5 在自然数里无家可归；出路是拿有序对 (a, b) 代表「a − b 这个尚不存在的差」，宣布 (3, 5) 与 (4, 6) 这些「差相同」的有序对互相等价，然后——商掉。等价类 [(3,5)] 这个**集合本身**，就是将来那个叫「−2」的对象。ℚ 的造法如出一辙（(1,2) 与 (2,4) 等价……）。每次的套路都一样：先在旧材料上铺一张等价关系，再取商集，新数就诞生了。上一节说的「造出来→验证性质→封装遗忘」，配上这台机器，就是数系构造的全部秘密。\n\n## 一道激活练习\n\n补上定理缺的那块拼图。设 ~ 是 A 上的等价关系，a, b ∈ A。证明：\n\n若 [a] ∩ [b] ≠ ∅，则 [a] = [b]。\n\n（提示：交不空意味着能**取到**一个公共成员 c——这是 ∃ 的用法；然后把 c ∈ [a]、c ∈ [b] 按定义翻译成 ~ 的语句，用对称、传递把 a ~ b 凑出来，最后让引理 (ii) 收口。）\n\n## 参考解答\n\n（建议先自己写完再看。）思路：交不空 → 取见证 c → 翻译成关系语句 → 对称＋传递凑出 a ~ b → 引理 (ii) 一锤定音。\n\n设 [a] ∩ [b] ≠ ∅。按非空的含义，存在 c ∈ [a] ∩ [b]，即 c ∈ [a] 且 c ∈ [b]。按等价类的定义翻译：\n\n```\nc ∈ [a]  即  c ~ a\nc ∈ [b]  即  c ~ b\n```\n\n由 c ~ a 与**对称性**得 a ~ c；又 c ~ b，由**传递性**得 a ~ b。最后由引理 (ii)（a ~ b ⟺ [a] = [b]），得 [a] = [b]。∎\n\n一句话回味：两个类只要碰了一下，就被对称＋传递「焊」成一整块——这正是「不留缝、不重叠」里「不重叠」的来源；而「不留缝」来自自反性（人人都被自己的类接住）。三条纪律，各管划分的一半江山。\n\n## 往前看一步\n\n关系这条线上，我们已经收编了「守纪律的视为相同」。但还有另一种关系，纪律的方向完全不同：不求对称，反倒要求**每个 a 恰好指向一个 b**——不许多指、不许不指。这种「精确制导」的对应，就是整个数学里出镜率最高的角色：<a class=\"wl\" data-id=\"fond_funzioni\">函数<\/a>。","refs":"Amann–Escher, Analysis I §I.4"},{"id":"fond_fondamenta","label":"地基","parent":null,"summary":"整座数学大厦立足之处——逻辑、集合、关系、函数；代数、几何、分析三大主干皆从这里生长。","depth":0,"isContainer":true,"isTop":true,"role":"foundation","color":"#A9A9A9","ring":0,"bearing":3,"popupLinks":[{"id":"fond_insiemi","text":"集合"},{"id":"fond_relazioni","text":"关系"},{"id":"fond_funzioni","text":"函数"}],"body":"\n这里是数学的**地基**(foundation)，整座大厦最底下的一层。它不讲某一个具体的定理，而是把后面一切都要用到的最基本的东西先备齐：一套不含歧义的**语言**（逻辑）、一种描述「一堆对象」的方式（集合）、以及对象之间的**对应与关联**（关系与函数）。\n\n地基自身的根是 逻辑——因为在严格地说清「集合是什么、数是什么、极限是什么」之前，我们必须先有一套精确的语言来陈述命题、组合命题、并判断一段推理成不成立。其余的 <a class=\"wl\" data-id=\"fond_insiemi\">集合<\/a>、<a class=\"wl\" data-id=\"fond_relazioni\">关系<\/a> 与 <a class=\"wl\" data-id=\"fond_funzioni\">函数<\/a>，都站在逻辑之上。\n\n再往上，是代数、几何、分析三大主干：它们各自处理结构、空间与连续，但无论哪一支，写下的每一个定义和定理，归根到底都用这里备好的语言和工具。"},{"id":"fond_funzioni","label":"函数","parent":"fond_fondamenta","summary":"函数是守纪律的关系：定义域里每个元素恰好被指派一个值。f: A→B 连同定义域、到达域、像的区分，是全数学出镜率最高的语言。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#A9A9A9","ring":4,"bearing":49,"popupLinks":[{"id":"fond_relazioni","text":"关系"},{"id":"fond_quantificatori","text":"量词"},{"id":"fond_iniettive_suriettive","text":"单射与满射"}],"body":"\n## 从自由到纪律\n\n<a class=\"wl\" data-id=\"fond_relazioni\">关系<\/a>给了我们「对应」，但那是一种完全放任的对应：一个 a 可以指向好几个 b，也可以谁都不指。可数学里最当家的对应是另一种气质——「**给我一个输入，我交还你一个明确的输出**」：给一个数，交还它的平方；给一个三角形，交还它的面积。这里的要害是**确定性**：同一个输入，不许时而这样、时而那样，也不许耸耸肩说「没有输出」。把这条纪律施加到关系上，得到的就是函数。\n\n## 先补一件量词的零件：「恰好一个」\n\n纪律说的是「每个输入**恰好**对应一个输出」——不多（唯一性）、不少（存在性）。「恰好一个」值得有自己的记号。在 <a class=\"wl\" data-id=\"fond_quantificatori\">量词<\/a>的语言里定义：\n\n∃!x P(x)  :⟺  ∃x ( P(x) ∧ ∀y ( P(y) ⟹ y = x ) )，\n\n读「**恰好存在一个** x 使 P(x)」(there exists a unique)。拆开看正是两件事打包：前半个 ∃x P(x) 给**存在**；后半句「凡满足 P 的都等于这个 x」给**唯一**。以后任何「存在且唯一」式的断言（数学里许多重要定理都是这种形状），证明照例分两段：先造一个、再证只此一个。\n\n## 定义\n\n设 A、B 是集合。A 到 B 的一个**函数**(function)（同义词：**映射**(map)），是一个关系 f ⊆ A × B，满足：\n\n∀a ∈ A, ∃!b ∈ B : (a, b) ∈ f。\n\n一句话：A 的每个元素，**恰好**被指派 B 里的一个元素。由于这个 b 被 a 唯一确定，给它专属记号 **f(a)**，叫 f 在 a 处的**值**(value)。整套数据写作\n\nf : A → B，  a ↦ f(a)，\n\n其中 A 叫**定义域**(domain)，B 叫**到达域**(codomain)；箭头 → 连接两个集合，↦ 描述单个元素的去向，两个箭头别混用。\n\n留意我们没有引入任何新本体：函数「就是」一种特殊的关系，而关系「就是」笛卡尔积的子集——一路还原到底，函数是个集合。你熟悉的「函数图像」在这里翻转了身份：**f 不是『有』一个图像，f 本身就是它的图像**——那堆有序对 {(a, f(a)) : a ∈ A} 不是别的，正是 f 自己。\n\n两个函数何时**相等**？数据有三件：定义域、到达域、逐点的值。三件都同才算同：f = g 当且仅当定义域相同、到达域相同，且 ∀a, f(a) = g(a)。前两件不是迂腐——同一条「求平方」规则，配上到达域 ℝ 和配上到达域 [0, ∞)，是**两个不同的函数**；这个区分眼下显得吹毛求疵，到下一节谈「满射」时将变得关键。（ℝ 照例先按熟悉的方式借用，严格构造在后头。）\n\n## 像：到达域里真正被打中的部分\n\n到达域 B 是**宣称**的弹着范围，实际被打中的未必是全部。把真正取到的值收起来：\n\nim f := { f(a) : a ∈ A } ⊆ B，\n\n叫 f 的**像**(image)。例如「求平方」ℝ → ℝ 的像是 [0, ∞)：负数在到达域里坐着，却永远没人打中它。**像 ⊆ 到达域，且一般是真包含**——这两个集合的张力，正是下一节的主角之一。\n\n## 例子与反例\n\n**是函数的：**\n\n- **恒等函数**(identity) id_A : A → A, a ↦ a。最朴素也最重要——以后谈「逆」时它是基准。\n- **常函数**(constant)：取定 c ∈ B，f : A → B, a ↦ c。所有输入打同一个点。「多对一」完全合法——纪律只管「一个输入不许多个输出」，不管「多个输入共用一个输出」。\n- f : ℝ → ℝ, x ↦ x²。每个实数恰有一个平方。\n\n**不是函数的（病各不相同）：**\n\n- R = {(x, y) ∈ ℝ×ℝ : x = y²}，当作 ℝ 到 ℝ 的对应（输入 x、输出 y）。**两种病都犯**：x = −1 时没有任何 y（存在性失败）；x = 4 时 y = 2 和 y = −2 都行（唯一性失败）。\n- 「把每个人对应到他的孩子」：无子女者处存在性失败，多子女者处唯一性失败。日常语言里大量「对应」经不起这两条盘问——这正是函数定义的筛选力。\n\n两幅小图把「合格 / 不合格」一眼定格（左：合格，多对一无妨；右：①一箭双雕、②无箭可发，各犯一病）：\n\n<svg viewBox=\"0 0 460 190\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#555\"/>\n    <\/marker>\n  <\/defs>\n  <ellipse cx=\"60\" cy=\"95\" rx=\"38\" ry=\"62\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <ellipse cx=\"180\" cy=\"95\" rx=\"34\" ry=\"52\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <text x=\"60\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A<\/text>\n  <text x=\"180\" y=\"32\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B<\/text>\n  <circle cx=\"60\" cy=\"60\" r=\"3.5\" fill=\"#E0612F\"/><text x=\"46\" y=\"64\" font-size=\"12\" fill=\"#333\">1<\/text>\n  <circle cx=\"60\" cy=\"95\" r=\"3.5\" fill=\"#E0612F\"/><text x=\"46\" y=\"99\" font-size=\"12\" fill=\"#333\">2<\/text>\n  <circle cx=\"60\" cy=\"130\" r=\"3.5\" fill=\"#E0612F\"/><text x=\"46\" y=\"134\" font-size=\"12\" fill=\"#333\">3<\/text>\n  <circle cx=\"180\" cy=\"75\" r=\"3.5\" fill=\"#5A5FE0\"/><text x=\"192\" y=\"79\" font-size=\"12\" fill=\"#333\">a<\/text>\n  <circle cx=\"180\" cy=\"115\" r=\"3.5\" fill=\"#5A5FE0\"/><text x=\"192\" y=\"119\" font-size=\"12\" fill=\"#333\">b<\/text>\n  <line x1=\"66\" y1=\"60\" x2=\"172\" y2=\"74\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr)\"/>\n  <line x1=\"66\" y1=\"95\" x2=\"172\" y2=\"77\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr)\"/>\n  <line x1=\"66\" y1=\"130\" x2=\"172\" y2=\"114\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr)\"/>\n  <text x=\"120\" y=\"178\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1F9D6E\">✓ 函数（多对一无妨）<\/text>\n  <ellipse cx=\"300\" cy=\"95\" rx=\"38\" ry=\"62\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <ellipse cx=\"418\" cy=\"95\" rx=\"34\" ry=\"52\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <circle cx=\"300\" cy=\"60\" r=\"3.5\" fill=\"#E0612F\"/><text x=\"286\" y=\"64\" font-size=\"12\" fill=\"#333\">1<\/text>\n  <circle cx=\"300\" cy=\"95\" r=\"3.5\" fill=\"#E0612F\"/><text x=\"286\" y=\"99\" font-size=\"12\" fill=\"#333\">2<\/text>\n  <circle cx=\"300\" cy=\"130\" r=\"3.5\" fill=\"#E0612F\"/><text x=\"286\" y=\"134\" font-size=\"12\" fill=\"#333\">3<\/text>\n  <circle cx=\"418\" cy=\"75\" r=\"3.5\" fill=\"#5A5FE0\"/><text x=\"430\" y=\"79\" font-size=\"12\" fill=\"#333\">a<\/text>\n  <circle cx=\"418\" cy=\"115\" r=\"3.5\" fill=\"#5A5FE0\"/><text x=\"430\" y=\"119\" font-size=\"12\" fill=\"#333\">b<\/text>\n  <line x1=\"306\" y1=\"60\" x2=\"410\" y2=\"73\" stroke=\"#B33\" stroke-width=\"1.3\" marker-end=\"url(#arr)\"/>\n  <line x1=\"306\" y1=\"62\" x2=\"410\" y2=\"112\" stroke=\"#B33\" stroke-width=\"1.3\" marker-end=\"url(#arr)\"/>\n  <line x1=\"306\" y1=\"130\" x2=\"410\" y2=\"116\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr)\"/>\n  <text x=\"358\" y=\"178\" font-size=\"12\" text-anchor=\"middle\" fill=\"#B33\">✗ ①两箭 ②无箭<\/text>\n<\/svg>\n\n## 一句要紧的眺望：数学的对象，将批量地「是」函数\n\n定义虽朴素，辐射面大得惊人，先指给你三处：\n\n- **数列**就是函数：一个实数列无非是某个 f : ℕ → ℝ（第 n 项 = f(n)）。将来分析整层楼——极限、级数——的地基语言就是它。\n- **运算**就是函数：加法无非是 + : ℕ×ℕ → ℕ，(a,b) ↦ a+b。代数那一支研究的「带运算的集合」，运算二字的严格身份就是这种函数。\n- 上一节的商集构造里还有一个值得点名的函数：把每个元素送到它的等价类，a ↦ [a]，这是一个函数 A → A/~（叫**典范投影**）。以后构造 ℤ 时会直接用到它。\n\n## 一道激活练习\n\nA = {1, 2, 3}，B = {a, b}。下列 A×B 的子集，哪些是 A 到 B 的函数？是的写出 f(1), f(2), f(3) 与像 im f；不是的指明哪一条纪律在哪个元素处失败。\n\n(1) R₁ = {(1,a), (2,a), (3,b)}\n(2) R₂ = {(1,a), (1,b), (2,a), (3,b)}\n(3) R₃ = {(1,a), (3,b)}\n(4) R₄ = {(1,b), (2,b), (3,b)}\n\n（提示：对**每个** a ∈ A 逐一盘问两件事——有没有箭？只有一支吗？）\n\n## 参考解答\n\n（建议先自己写完再看。）思路：定义就是检查清单——∀a ∈ A，先验存在（至少一对 (a, ·)），再验唯一（至多一对）。逐个过堂：\n\n**(1) 是函数。** 1、2、3 各恰好出现一次作第一分量。f(1)=a, f(2)=a, f(3)=b；im R₁ = {a, b}。1 和 2 共用输出 a 完全合法——多对一不犯规。\n\n**(2) 不是。** 元素 1 处**唯一性失败**：(1,a) 与 (1,b) 同时在场，f(1) 无从谈起。（2、3 处都干净也救不了它——纪律是 ∀，一处失守即全盘否决。）\n\n**(3) 不是。** 元素 2 处**存在性失败**：没有任何形如 (2, ·) 的对。它倒是个正经的关系——只是不配叫函数。\n\n**(4) 是函数。** 三个输入各恰好一箭，全打向 b——这是常函数。f(1)=f(2)=f(3)=b；im R₄ = {b}。注意 **im R₄ = {b} ⊊ B**：到达域里 a 没人打中。「像真包含于到达域」在这里第一次具体现身。\n\n回味一句：(2) 和 (3) 病灶相反——一个箭太多、一个箭太少——恰好对应 ∃! 里打包的两半（∃ 与唯一性）。检查任何「对应」是不是函数，永远是这两问。\n\n## 往前看一步\n\n至此地基的四件套——逻辑、集合、关系、函数——全部到位。而函数自己的故事才刚开头：(4) 里那种「到达域没被打满」的函数，与「多对一」的函数，分别欠缺两种宝贵的品质；两种品质凑齐的函数，能把两个集合「完美配对」，进而让我们第一次能严格地谈论「这两个集合一样多」——哪怕它们都是无穷的。这就是接下来 <a class=\"wl\" data-id=\"fond_iniettive_suriettive\">单射与满射<\/a> 的戏。","refs":"Amann–Escher, Analysis I §I.3"},{"id":"fond_iniettive_suriettive","label":"单射、满射与双射","parent":"fond_fondamenta","summary":"单射不许两个输入共用输出，满射要求到达域全被打中；二者兼备即双射——能把两个集合完美配对，是「一样多」的严格化前奏。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#A9A9A9","ring":5,"bearing":47,"popupLinks":[{"id":"fond_proposizioni","text":"逆否"},{"id":"fond_quantificatori","text":"存在命题"},{"id":"fond_composizione","text":"复合与逆函数"}],"body":"\n## 两种缺憾，两种品质\n\n上一节末尾验明：函数的纪律只管「一个输入恰好一支箭」，并不禁止两件事——**几个输入共用一个靶点**（常函数是极端），以及**到达域里有靶点无人问津**（im f ⊊ B）。这两件事不犯规，却各是一种缺憾：前者意味着从输出**回推不出**输入是谁；后者意味着到达域**虚报**了弹着范围。把这两个缺憾分别堵上，就得到函数的两种品质；两种全占的函数，将做到一件了不起的事——在两个集合之间**完美配对**。\n\n## 单射：输出认得出输入\n\nf : A → B 是**单射**(injective)，若不同输入必得不同输出。直接写就是 ∀x, x′ ∈ A ( x ≠ x′ ⟹ f(x) ≠ f(x′) )。但实际干活时，几乎总用它的<a class=\"wl\" data-id=\"fond_proposizioni\">逆否<\/a>形式：\n\n∀x, x′ ∈ A ( f(x) = f(x′) ⟹ x = x′ )。\n\n两种说法逻辑等价（逆否命题与原命题同真假——第一节已证的事实），但**好用程度天差地别**：原始形式叫你从「x ≠ x′」这种否定信息出发去推另一个否定——不等式没法代入、没法消去，无从下手；逆否形式给你一个**等式** f(x) = f(x′) 当起点——等式可以两边同加同乘、层层剥洋葱。于是**证单射的标准开场白**永远是：「设 f(x) = f(x′)，往证 x = x′」。\n\n单射也叫「一对一」(one-to-one)——每个被打中的靶点恰被一支箭打中，从输出能**唯一回溯**输入。\n\n## 满射：到达域不掺水\n\nf : A → B 是**满射**(surjective)，若到达域里每个元素都真的被打中：\n\n∀b ∈ B, ∃a ∈ A : f(a) = b。\n\n等价说法：im f = B——「像」与「到达域」这对上一节区分的概念在此合龙。满射也叫「映上」(onto)。\n\n证明的形状由定义里的 ∀∃ 决定：**任给** b ∈ B，要**找出**（造出）一个 a 使 f(a) = b——这是<a class=\"wl\" data-id=\"fond_quantificatori\">存在命题<\/a>，给出见证即可，通常就是「解方程 f(a) = b，把 a 用 b 表示出来，再代回验证」。\n\n立刻看清一件事：**满射与否，根本不是 f 的「规则」单方面能决定的——它由规则与到达域共同决定**。同一条规则，到达域写大一号就不满，裁齐了就满。这正是上一节坚持「到达域是函数身份的一部分」的落实。\n\n## 一条规则，四种身份\n\n把这层意思推到极致。看「求平方」这一条规则，配四种(定义域, 到达域)：\n\n| | 函数 | 单射? | 满射? | 病灶 / 解法 |\n|---|---|---|---|---|\n| ① | ℝ → ℝ, x ↦ x² | 否 | 否 | f(−1)=f(1)=1 杀单射；−1 无人打中杀满射 |\n| ② | [0,∞) → ℝ, x ↦ x² | 是 | 否 | 砍掉负半轴，「±x 同平方」的问题消失了；但 −1 仍空置 |\n| ③ | ℝ → [0,∞), x ↦ x² | 否 | 是 | 到达域裁齐成像；可 ±1 仍共用靶点 |\n| ④ | [0,∞) → [0,∞), x ↦ x² | 是 | 是 | 两病齐除：双射 |\n\n**同一条规则，四个不同的函数，四种身份。** 若你还记得上一节「函数 = 定义域 + 到达域 + 逐点的值，三件套」，这张表就是那句话最响亮的回声：定义域与到达域不是函数的包装纸，是它的骨肉。\n\n> 表里有句话先按下没问：④ 凭什么是满射？任给 b ≥ 0，得找 a ≥ 0 使 a² = b——也就是说**每个非负实数都得有平方根**。这件事看着天经地义，实则深不见底：它依赖 ℝ「没有缝隙」的完备性，是分析那一支的核心地基。此处暂且承认，严格证明留待实数完备性。你看，连 √2 的存在，也要等一条定理来确立——这正是我们整套从头重建的意义所在。\n\n两幅小图把 ②、③ 的气质画出来（左：箭箭分明、却有靶点空置；右：靶点全中、却有共用）：\n\n<svg viewBox=\"0 0 460 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"arr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#555\"/>\n    <\/marker>\n  <\/defs>\n  <ellipse cx=\"60\" cy=\"100\" rx=\"36\" ry=\"56\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <ellipse cx=\"178\" cy=\"100\" rx=\"36\" ry=\"66\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <circle cx=\"60\" cy=\"68\" r=\"3.5\" fill=\"#E0612F\"/>\n  <circle cx=\"60\" cy=\"100\" r=\"3.5\" fill=\"#E0612F\"/>\n  <circle cx=\"60\" cy=\"132\" r=\"3.5\" fill=\"#E0612F\"/>\n  <circle cx=\"178\" cy=\"58\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <circle cx=\"178\" cy=\"86\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <circle cx=\"178\" cy=\"114\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <circle cx=\"178\" cy=\"142\" r=\"3.5\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"1.4\" stroke-dasharray=\"3,2\"/>\n  <line x1=\"66\" y1=\"68\" x2=\"170\" y2=\"59\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr2)\"/>\n  <line x1=\"66\" y1=\"100\" x2=\"170\" y2=\"87\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr2)\"/>\n  <line x1=\"66\" y1=\"132\" x2=\"170\" y2=\"115\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr2)\"/>\n  <text x=\"118\" y=\"188\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">单射、非满射（虚圈空置）<\/text>\n  <ellipse cx=\"300\" cy=\"100\" rx=\"36\" ry=\"62\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <ellipse cx=\"416\" cy=\"100\" rx=\"34\" ry=\"48\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <circle cx=\"300\" cy=\"62\" r=\"3.5\" fill=\"#E0612F\"/>\n  <circle cx=\"300\" cy=\"100\" r=\"3.5\" fill=\"#E0612F\"/>\n  <circle cx=\"300\" cy=\"138\" r=\"3.5\" fill=\"#E0612F\"/>\n  <circle cx=\"416\" cy=\"80\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <circle cx=\"416\" cy=\"122\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <line x1=\"306\" y1=\"62\" x2=\"408\" y2=\"79\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr2)\"/>\n  <line x1=\"306\" y1=\"100\" x2=\"408\" y2=\"82\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr2)\"/>\n  <line x1=\"306\" y1=\"138\" x2=\"408\" y2=\"121\" stroke=\"#555\" stroke-width=\"1.3\" marker-end=\"url(#arr2)\"/>\n  <text x=\"358\" y=\"188\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">满射、非单射（两箭共靶）<\/text>\n<\/svg>\n\n## 双射\n\nf : A → B 既单又满，就叫**双射**(bijective)（同义：**一一对应**(one-to-one correspondence)）。把两个定义并排读出它的画像：B 里每个元素**至少**被打中一次（满射）、**至多**被打中一次（单射）——所以**恰好一次**。A 的元素与 B 的元素经由 f 两两牵手、无一落单、无一脚踏两船：完美配对。又见「至少 + 至多 = 恰好」——和定义函数时的 ∃! 是同一个句式，只是这回盘问的方向反了过来：那时问「每个输入恰好几支箭**射出**」，现在问「每个靶点恰好几支箭**射入**」。\n\n## 标准证明套路，跑一遍全程\n\n拿 f : ℝ → ℝ, x ↦ 2x + 1 当靶子（ℝ 及其四则照例先借用），把两种证明的标准姿势各演一遍。\n\n**单射**：设 f(x) = f(x′)，即 2x + 1 = 2x′ + 1。两边减 1 得 2x = 2x′，两边除以 2 得 x = x′。∎ （从等式出发、代数消去——逆否形式的好处全在这几步里。）\n\n**满射**：任给 b ∈ ℝ，要找 a 使 2a + 1 = b。解出候选 a = (b−1)/2——它是个实数，资格合法；代回验证：f(a) = 2·(b−1)/2 + 1 = (b−1) + 1 = b。∎ （先解出见证、再代回验证，两步缺一不可：解出来的东西必须确认真在定义域里、真打中 b。）\n\n故 f 是双射。\n\n## 否定形式\n\n实战里「证明 f **不是**单射/满射」与证明「是」一样常见，所以把两个定义的否定推到底（正好用上<a class=\"wl\" data-id=\"fond_quantificatori\">量词<\/a>那一节的否定规则——∀∃ 对调、谓词取反）：\n\n**非单射**：¬∀x,x′ ( f(x)=f(x′) ⟹ x=x′ ) ≡ ∃x,x′ ( f(x)=f(x′) ∧ x≠x′ )。（蕴含的否定 = 前件真而后件假——回想 p⟹q ≡ ¬p∨q，取反得 p∧¬q。）一句话：**找一对撞车的见证**。\n\n**非满射**：¬∀b∃a f(a)=b ≡ ∃b ∀a f(a)≠b。一句话：**找一个无人能打中的靶点**——注意这后半截是个 ∀，光说「我没找到谁打中它」不够，得**论证所有** a 都打不中。\n\n两条否定都把「证伪」变成了找见证的活——但难度不对称：非单射只需亮出两个具体的 x；非满射的见证 b 后面还拖着一条要论证的 ∀。下面练习里你会亲身体会这条不对称。\n\n## 一道激活练习\n\n用上面的否定形式，证明 ① 号函数 f : ℝ → ℝ, x ↦ x² **既非单射、也非满射**。要求：每条都先写出要证的量词语句，再给出见证并完成论证。\n\n（提示：非满射那条，选定靶点 b 后，剩下的「∀a, a² ≠ b」是个全称命题——它需要一个对**所有**实数成立的理由，想想平方有什么对所有实数都成立的性质。）\n\n## 参考解答\n\n（建议先自己写完再看。）\n\n**非单射**：要证 ∃x,x′ ( x² = x′² ∧ x ≠ x′ )。取见证 x = 1, x′ = −1：1² = 1 = (−1)²，而 1 ≠ −1。两个条件都验毕。∎\n\n**非满射**：要证 ∃b ∀a ( a² ≠ b )。取见证 b = −1，往证 ∀a ∈ ℝ, a² ≠ −1。这一步不能靠「试了几个都不行」，要一个普适的理由：任何实数的平方非负（a ≥ 0 与 a < 0 两种情形下 a·a 都 ≥ 0——此处暂且承认这条关于 ℝ 序与乘法的事实，它的严格出处是有序域的公理，留待数系构造），故 a² ≥ 0 > −1，从而 a² ≠ −1，对一切 a 成立。∎\n\n回味两口：其一，两个证明的「劳动量」印证了正文里说的不对称——非单射亮出两个数就收工，非满射在给出见证之后，还需要完成一个全称命题的论证。其二，留意「平方非负」也未被当作显然——它将由有序域的公理严格给出。这套体系里没有「显然」，只有「已证」和「待证」。\n\n## 往前看一步\n\n双射给了我们完美配对。配对天然让人想做一件事：**沿着箭头走回去**——既然 B 的每个元素恰好被一支箭打中，那「从 b 回到打中它的那个 a」本身岂不也是一个函数？这个直觉是对的，但要把它说严格，先得有「把两个函数接力起来」的操作。函数的复合、以及「双射恰好就是可逆的函数」这条定理，是接下来 <a class=\"wl\" data-id=\"fond_composizione\">复合与逆函数<\/a> 的正题。","refs":"Amann–Escher, Analysis I §I.3"},{"id":"fond_insiemi","label":"集合","parent":"fond_fondamenta","summary":"集合是把一些对象当作整体来看待；∈ 是原始的属于关系，外延原则用「成员相同」定义相等，而 ∪∩∖ 不过是 ∨∧¬ 抬到 ∈ 上。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#A9A9A9","ring":2,"bearing":52,"popupLinks":[{"id":"fond_quantificatori","text":"谓词"},{"id":"fond_proposizioni","text":"联结词"},{"id":"fond_relazioni","text":"关系"}],"body":"\n## 为什么需要集合\n\n上一节的量词总要「取遍某个范围」——∀x、∃x 里那个 x 究竟在哪儿取？我们一直含糊地说「论域」「一堆对象」。现在把这个范围本身钉死：它就是**集合**。集合是数学里**最通用的容器**——往后每一个对象（数、函数、空间里的点）都将被装进某个集合里来谈。\n\n## 集合与属于\n\n**集合**(set) 就是把若干对象看作一个整体；这些对象叫它的**元素**(element)。最根本的关系是**属于**(membership)，记 x ∈ A，读作「x 是 A 的元素」；不属于记 x ∉ A。\n\n属于关系 ∈ 我们**不再往下定义**——它和逻辑一样，是这一层的原始概念，我们约定直接使用。（这是个选择：整个集合论就架在 ∈ 这一个原始关系之上。）\n\n怎么写出一个具体的集合？两种办法：\n\n- **列举**：把元素列出来，如 A = {0, 1, 2}。花括号里不计次序、不计重复——{0,1,2}、{2,1,0}、{0,0,1,2} 是同一个集合（凭什么算「同一个」，下面外延原则会讲死）。\n- **描述**：从一个**已有的**集合 A 里，挑出满足某谓词 P(x) 的元素，记 {x ∈ A : P(x)}。这里直接用上了上一节的 <a class=\"wl\" data-id=\"fond_quantificatori\">谓词<\/a>——例如 {x ∈ ℝ : x > 3}。\n\n> 留意「从已有集合里挑」这个限制：不能无中生有地写 {x : P(x)}（对「一切满足 P 的 x」一网打尽）。这种不加约束的写法会闹出矛盾（罗素悖论），严格的回避之道留待后面专门处理；眼下我们一律**从一个已经到手的集合里切**，就安全了。\n\n## 外延原则：集合由成员决定\n\n两个集合什么时候**相等**？回答只有一条——**外延原则**(extensionality)：两个集合相等，当且仅当它们含有完全相同的元素。用我们已有的逻辑语言写出来，干净利落：\n\nA = B  ⟺  ∀x ( x ∈ A ⟺ x ∈ B )。\n\n这条把「相等」彻底交给了「成员」：集合**不在乎**元素怎么排、写了几遍、用什么方式描述出来——只认「谁在里面」。这就是为什么 {0,1,2} 和 {2,1,0} 是同一个集合。\n\n## 子集\n\n若 A 的每个元素都还在 B 里，就说 A 是 B 的**子集**(subset)，记 A ⊆ B。又是用 ∀ 和蕴含直接拼出来：\n\nA ⊆ B  ⟺  ∀x ( x ∈ A ⟹ x ∈ B )。\n\n把它和外延原则并到一处，得到一条天天要用的「双向夹」：\n\nA = B  ⟺  ( A ⊆ B  ∧  B ⊆ A )。\n\n（因为前面讲联结词时说过 p ⟺ q 恰是 (p⟹q)∧(q⟹p)，把它套到 x∈A ⟺ x∈B 上即得。）所以证集合相等的标准套路就是：**证 A⊆B、再证 B⊆A**，两个方向各跑一遍——你以后会无数次这么做。\n\n## 基本运算就是联结词\n\n这是本节的关键观察：集合的交、并、差，**根本不是新东西**——它们就是讲联结词那节的 <a class=\"wl\" data-id=\"fond_proposizioni\">联结词<\/a> ∧、∨、¬，被「抬」到属于关系 ∈ 上：\n\n- **并**(union)：x ∈ A ∪ B  ⟺  x ∈ A  ∨  x ∈ B。\n- **交**(intersection)：x ∈ A ∩ B  ⟺  x ∈ A  ∧  x ∈ B。\n- **差**(difference)：x ∈ A ∖ B  ⟺  x ∈ A  ∧  ¬(x ∈ B)。\n\n先用一张图把直觉立起来——两个圆，交叠处即 A∩B，两圆覆盖的全部即 A∪B：\n\n<svg viewBox=\"0 0 360 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <circle cx=\"140\" cy=\"100\" r=\"78\" fill=\"#FF7F50\" fill-opacity=\"0.20\" stroke=\"#E0612F\" stroke-width=\"1.6\"/>\n  <circle cx=\"220\" cy=\"100\" r=\"78\" fill=\"#979AFF\" fill-opacity=\"0.20\" stroke=\"#5A5FE0\" stroke-width=\"1.6\"/>\n  <text x=\"92\" y=\"106\" font-size=\"20\" text-anchor=\"middle\" fill=\"#333\">A<\/text>\n  <text x=\"268\" y=\"106\" font-size=\"20\" text-anchor=\"middle\" fill=\"#333\">B<\/text>\n  <text x=\"180\" y=\"105\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A∩B<\/text>\n<\/svg>\n\n一旦「成员资格」被翻译成逻辑命题，集合的恒等式就**全部塌缩成上面那些逻辑等价**。举个例子，集合版的德摩根律 A∖(B∪C) = (A∖B)∩(A∖C)，证起来无非是把 ∈ 翻成逻辑、套一次逻辑的德摩根、再用外延原则收口。这就是套路：**集合代数 = 逻辑代数，根都在 ∈ 和那张真值表里**。\n\n## 空集\n\n有一个集合一个元素都没有，叫**空集**(empty set)，记 ∅。它有个初看古怪的性质：**∅ 是任何集合的子集**，即 ∅ ⊆ A 对一切 A 成立。\n\n为什么？按定义，∅ ⊆ A 就是 ∀x ( x ∈ ∅ ⟹ x ∈ A )。可 x ∈ ∅ 永远为假，于是这个蕴含的前件恒假——它**空洞地为真**（正是讲蕴含时「前件为假，蕴含自动成立」那一条）。前件从不成立，承诺就从不被推翻，所以 ∅ ⊆ A 自动成立。逻辑那一层埋下的种子，在这里结了第一个果。\n\n## 一道激活练习\n\n用**外延原则**证明交运算可交换：\n\nA ∩ B = B ∩ A。\n\n（思路提示：要证两集合相等，按外延原则只需证 ∀x ( x∈A∩B ⟺ x∈B∩A )；把两边的 ∈ 都翻成逻辑，你会发现它归结为前面某条关于 ∧ 的等价。）\n\n## 参考解答\n\n（建议先自己写完再看。）思路：集合相等 → 外延原则 → 把成员资格翻成逻辑 → 套一条逻辑等价 → 收口。\n\n由外延原则，要证 A∩B = B∩A，只需对任意 x 证 x∈A∩B ⟺ x∈B∩A。逐步：\n\n```\n  x ∈ A∩B\n⟺ x∈A ∧ x∈B       （交的定义）\n⟺ x∈B ∧ x∈A       （∧ 的交换律——用真值表一眼可验：p∧q 与 q∧p 两列相同）\n⟺ x ∈ B∩A         （交的定义，反着用）\n```\n\n对一切 x 成立，故由外延原则 A∩B = B∩A。∎\n\n一句话思路：**集合的「交换律」其实是「且」的交换律换了身衣服**——这正是「集合代数 = 逻辑代数」的一个实例。同样地，集合的德摩根律、分配律，根也都在前面那些逻辑等价里。\n\n## 往前看一步\n\n现在我们有了容器（集合），也能判断相等、包含，做交并差了。但眼下集合里的元素还各自孤立；数学真正关心的，是元素之间的**对应**——把 A 里的东西按某种规则关联到 B 里的东西。要精确地谈「对应」，得先有一个能装下「一对有次序的对象」的工具，再从中提炼出**关系**与函数。这就引向接下来的 <a class=\"wl\" data-id=\"fond_relazioni\">关系<\/a>。","refs":"Amann–Escher, Analysis I §I.2"},{"id":"fond_proposizioni","label":"命题与联结词","parent":"fond_fondamenta","summary":"命题是非真即假的陈述；五个联结词 ¬ ∧ ∨ ⟹ ⟺ 全部由真值表定义，是一切数学推理的最小零件。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#A9A9A9","ring":0,"bearing":54,"popupLinks":[{"id":"fond_quantificatori","text":"谓词与量词"}],"body":"\n## 为什么从这里起步\n\n我们要从零开始，一砖一瓦把整座数学大厦盖起来。立的规矩是：**任何一句断言，都必须能往下追溯到它所依赖的、更基本的断言**。可这样一路下追总得有尽头——总有一层东西，是我们**约定直接接受、不再往下追问**的。逻辑，就是这最底下的一层。所以这一节脚下空无一物，它本身就是基岩：我们在这里一次性说清「什么才算一句数学的话」「这些话怎么拼接」，之后所有的定义、定理与证明，用的都是这套语言。\n\n## 命题\n\n**命题(proposition)** 是一个**非真即假**的陈述句。「非真即假」四个字要拆开看，含两层意思：它要么真、要么假（**至少**居其一），且不能又真又假（**至多**居其一）。我们把「真」记作 **T**(true)、「假」记作 **F**(false)，统称命题的**真值(truth value)**。\n\n> 这里其实悄悄做了一个**选择**：我们约定采用**经典二值逻辑**——每个命题的真值恰好是 T、F 之一，「排中律」（要么 p、要么非 p，没有第三种可能）默认成立。这是一个立场，而非天经地义；逻辑学里还有不认排中律的体系（如直觉主义逻辑）。但经典逻辑是分析学通行的地基，我们就站在这块地基上。\n\n判断几个句子是不是命题，能帮你抓住要点：\n\n- 「2 是素数(prime)」—— 是命题，真值为 T。\n- 「13 能被 5 整除」—— 是命题，真值为 F。\n- 「请关上门」—— 不是命题（祈使句，无所谓真假）。\n- 「x > 3」—— **暂时**不是命题：真假取决于 x 是谁。这种「含未定元、给定取值后才有真假」的句子叫**谓词**，它要等到 <a class=\"wl\" data-id=\"fond_quantificatori\">谓词与量词<\/a> 才登场——这正是下一节的事。\n- 「这句话是假的」—— 不是命题（说谎者悖论：假设它真，则推出它假；假设它假，又推出它真。它落不进 T/F 任何一格）。\n\n记住这条线：**命题必须能干净地落进 T 或 F 一格**。落不进的，现在都不算。\n\n## 五个联结词\n\n光有一句句孤立的命题还不够用；数学里的话总是「且」「或」「如果……那么」地缠在一起。我们用**联结词(connective)** 把已有命题拼成新命题。要紧的有五个，而它们的全部含义，**就是各自的真值表**——不多不少。换句话说，联结词不靠「语感」定义，靠真值表定义；语感只是帮你记忆的拐杖。\n\n设 p、q 是命题。\n\n**否定(negation) ¬p**：「并非 p」。\n\n| p | ¬p |\n|---|----|\n| T | F |\n| F | T |\n\n**合取(conjunction) p ∧ q**：「p 且 q」。唯有两者皆真才真。\n\n| p | q | p ∧ q |\n|---|---|-------|\n| T | T | T |\n| T | F | F |\n| F | T | F |\n| F | F | F |\n\n**析取(disjunction) p ∨ q**：「p 或 q」。这里的「或」是**相容或(inclusive or)**——只要至少一个真就真，包括两个都真的情形。日常说「喝茶或喝咖啡」常暗指二选一，但数学的 ∨ **不**排斥「两个都要」。\n\n| p | q | p ∨ q |\n|---|---|-------|\n| T | T | T |\n| T | F | T |\n| F | T | T |\n| F | F | F |\n\n**蕴含(implication) p ⟹ q**：「如果 p，那么 q」。p 叫**前件**、q 叫**后件**。它的真值表是五个里最反直觉的一处，务必盯住：\n\n| p | q | p ⟹ q |\n|---|---|-------|\n| T | T | T |\n| T | F | F |\n| F | T | T |\n| F | F | T |\n\n要点：**p ⟹ q 唯一为假的情形，是「前件真、后件假」**。前件一旦为假，整个蕴含**自动为真**——这叫**空洞为真(vacuously true)**。初学最别扭的就是后两行：「F ⟹ 任何」都判真。打个比方：你许诺「**如果**明天下雨，我**就**带伞」。只有「下了雨、你却没带伞」才算你食言（对应第二行）。若明天压根没下雨，那无论你带没带伞，你的承诺都没被推翻——承诺自动算数。数学约定取的正是这个判法：它让「前提不成立时陈述不算错」，从而使蕴含能顺畅地参与推理。\n\n**等价(equivalence) p ⟺ q**：「p 当且仅当(if and only if) q」，两者真值一致才真。\n\n| p | q | p ⟺ q |\n|---|---|-------|\n| T | T | T |\n| T | F | F |\n| F | T | F |\n| F | F | T |\n\n不难看出 p ⟺ q 恰好是 (p ⟹ q) ∧ (q ⟹ p)——这也是为何证明「等价」常拆成「⟹」与「⟸」两个方向各证一遍，你以后会无数次这么做。\n\n## 复合命题与真值表的用法\n\n有了五个零件，就能拼任意复杂的式子，如 ¬(p ∧ q) 或 (p ⟹ q) ∧ (¬q)。**任何**这样的复合命题，它的真值都被组成它的那些命题的真值**唯一决定**——一行行算真值表即可。约定优先级（像算术里乘除先于加减）：¬ 最紧，其次 ∧、∨，再次 ⟹、⟺；拿不准就加括号，括号永远优先。\n\n举一例，算 ¬p ∨ q 的真值表，并和 p ⟹ q 并排放：\n\n| p | q | ¬p | ¬p ∨ q | p ⟹ q |\n|---|---|----|--------|-------|\n| T | T | F | T | T |\n| T | F | F | F | F |\n| F | T | T | T | T |\n| F | F | T | T | T |\n\n最后两列一模一样。这告诉我们：**蕴含并不是第六个独立的零件**，p ⟹ q 不过是 ¬p ∨ q 的简写。这是我们第一次用真值表「证明」了两个外形不同的式子其实是同一个东西。\n\n当一个复合命题在**所有**真值组合下都为 T，称它为**重言式(tautology)**，即「永真式」；恒为 F 的称**矛盾式(contradiction)**。重言式是逻辑里「无条件成立」的真理，是日后一切推理规则的来源。\n\n## 几条要紧的等价\n\n若 A、B 两个式子真值表完全相同，就记 A ≡ B，说它们**逻辑等价**（等价的说法：A ⟺ B 是重言式）。下面几条最常用，每条都能用真值表验证：\n\n- **双重否定**：¬¬p ≡ p。\n- **德摩根律(De Morgan's laws)**：¬(p ∧ q) ≡ ¬p ∨ ¬q，且 ¬(p ∨ q) ≡ ¬p ∧ ¬q。「否定一个『且』，得到『或』；否定一个『或』，得到『且』」——否定往里钻时，∧ 与 ∨ 互换。这条以后求「极限不存在」「函数不连续」之类否定命题时天天要用。\n- **蕴含的改写**：p ⟹ q ≡ ¬p ∨ q（刚验过）。\n- **逆否命题(contrapositive)**：p ⟹ q ≡ ¬q ⟹ ¬p。一个蕴含和它的逆否式永远同真假——这是「反证法」成立的逻辑根。注意它跟**逆命题(converse)** q ⟹ p 是两码事，后者一般**不**与原命题等价（见下条陷阱）。\n\n## 几个最容易栽跟头的地方\n\n- **相容或 vs 排斥或**：∨ 是相容或，「两个都真」也算真。真要表达「恰好二选一」，得另写 (p ∨ q) ∧ ¬(p ∧ q)。\n- **空洞为真**：F ⟹ q 恒真。「所有独角兽都会飞」这种话，因前提（存在独角兽）为假而**自动**为真——别被它荒谬的外表骗了。这一点到了带量词的命题里会再次绊人，先留个心。\n- **逆命题不是原命题**：由「下雨 ⟹ 地湿」推不出「地湿 ⟹ 下雨」（洒水车也能让地湿）。能与原命题对调的，只有逆否命题 ¬q ⟹ ¬p，不是逆命题。这是初学证明最高频的逻辑漏洞。\n- **联结词 ⟹ 与「推理」不是一回事**：⟹ 是个**造句**用的真值函数，吃两个命题、吐一个命题；而我们写证明时说的「由 A 推出 B」是一种**元层面**的判断（在所有使 A 真的情形下 B 也真）。二者高度相关却不同层。本课程按通行做法，在这套「严谨但不完全形式化」的数学元语言里工作，不另起炉灶搭一套形式证明系统；真正的形式证明论是逻辑学独立的一支，我们用不到时就不去碰它。\n\n## 一道激活练习\n\n用真值表证明**德摩根律的第一条**：\n\n¬(p ∧ q) ≡ ¬p ∨ ¬q。\n\n也就是列出 p、q 的四种组合，分别算出左边 ¬(p ∧ q) 与右边 ¬p ∨ ¬q 两列，核对它们逐行相等。（提示：先算辅助列 p ∧ q 和 ¬p、¬q，再拼出两边。）做完后请用一句自己的话，说清「否定一个合取，为什么会翻成析取」。\n\n## 参考解答\n\n（建议先自己写完再看。）思路：联结词全由真值表定义，所以「证明两式等价」＝「列出全部真值组合，逐行核对两边真值相同」。\n\n| p | q | p∧q | ¬(p∧q) | ¬p | ¬q | ¬p∨¬q |\n|---|---|-----|--------|----|----|-------|\n| T | T | T | F | F | F | F |\n| T | F | F | T | F | T | T |\n| F | T | F | T | T | F | T |\n| F | F | F | T | T | T | T |\n\n第 4 列 ¬(p∧q) 与第 7 列 ¬p∨¬q 逐行相同 → 两式逻辑等价。\n\n为什么「且」的否定会翻成「或」：要让「p 且 q」不成立，**不必两个都假**，只要**至少一个**假，整个合取就塌了——而「至少一个为假」正是「¬p 或 ¬q」。否定一个合取，约束被放松成了析取。\n\n## 往前看一步\n\n到这里，我们能精确地谈论一句句**确定的**断言，并把它们拼装、化简、互相推出。可数学里铺天盖地的句子其实长这样：「**对每一个**实数 x，x² ≥ 0」「**存在**某个 n，使得……」——它们带着未定的元、扫过一整个范围。这种句子还不是我们今天定义的命题（回想那个被搁置的「x > 3」）。要把它们也纳入这套严密的语言，就得给逻辑添上两件新工具：**全称**与**存在**。这正是 <a class=\"wl\" data-id=\"fond_quantificatori\">谓词与量词<\/a> 要做的事。","refs":"Amann–Escher, Analysis I §I.1"},{"id":"fond_quantificatori","label":"谓词与量词","parent":"fond_fondamenta","summary":"谓词是带未定元的「开句」，给定取值才有真假；全称 ∀ 与存在 ∃ 把它封成命题，其否定是德摩根律的放大版，是数学陈述的标准句式。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#A9A9A9","ring":1,"bearing":53,"popupLinks":[{"id":"fond_proposizioni","text":"德摩根律"},{"id":"fond_insiemi","text":"集合"}],"body":"\n## 为什么需要量词\n\n上一节我们把「命题」定得很严：一句话必须能干净地落进真或假。也正因如此，我们当时把「x > 3」这类句子**挡在了门外**——它的真假悬而未决，要看 x 是谁。可偏偏，数学里最常说的话恰恰长这样：「**对每一个**实数 x，都有 x² ≥ 0」「**存在**一个 n，使得 2ⁿ > 1000」。这些句子扫过一整个范围，是定理与定义的标准句式。这一节就把它们正式收进我们严密的语言里——办法分两步：先承认带未定元的「开句」，再用两个**量词**把它们封成真正的命题。\n\n## 谓词\n\n**谓词**(predicate)，也叫**开语句**(open sentence)，是一句含有**自由变元**(free variable)的话，记作 P(x)；它本身**没有**真值，但一旦把 x 代成某个具体对象，就变回一个命题。\n\n- 取 P(x)：「x > 3」，变元 x 取遍实数。那么 P(5) 为真、P(2) 为假；而 P(x) 孤零零地写着，无所谓真假。\n- 谓词可以带多个变元：Q(x, y)：「x < y」，代入 Q(1, 2) 真、Q(2, 1) 假。\n\n有一点必须讲清：写谓词，**一定要交代变元的取值范围**——这个范围叫**论域**(domain of discourse)。「x > 3」在论域为 ℝ 时，和在论域为「正整数」时，谈的是不同的事。（这个「范围」严格来说是一个集合；集合的严格定义我们下节再给，这里先借用「一堆对象凑成一个整体」的朴素理解。）\n\n## 两个量词\n\n要把开句 P(x) 封成一个有真假的命题，就给变元**加上量词**、把它「绑定」住。要紧的只有两个。\n\n**全称量词**(universal quantifier) ∀。写 ∀x ∈ A, P(x)，读作「对论域 A 里的**每一个** x，P(x) 成立」。它为真，当且仅当 P(x) 对 A 中**所有** x 都为真。\n\n- ∀x ∈ ℝ, x² ≥ 0：真。\n- ∀x ∈ ℝ, x > 3：假——因为有 x = 0 不满足。\n\n记住要害：**要推翻一个全称命题，只需举出一个反例**(counterexample)。哪怕千万个 x 都对，只要逮着一个不对的，∀ 就塌了。\n\n**存在量词**(existential quantifier) ∃。写 ∃x ∈ A, P(x)，读作「在 A 里**存在**某个 x，使 P(x) 成立」。它为真，当且仅当 P(x) 对 A 中**至少一个** x 为真。\n\n- ∃x ∈ ℝ, x > 3：真——拿出 x = 5 作见证即可。\n- ∃x ∈ ℝ, x² < 0：假——没有任何实数的平方是负的。\n\n它的要害正相反：**要证一个存在命题，给出一个见证**(witness)就够了；**要推翻它，则得说明无一可行**。\n\n## 量词的否定——德摩根律的「放大版」\n\n这是全节最要紧、日后用得最多的一处。先建立直觉：把 ∀x P(x) 想成「对论域里每个对象都成立」——论域有限时，它无非是一长串合取 P(a) ∧ P(b) ∧ ⋯；把 ∃x P(x) 想成「至少一个成立」，有限时就是一长串析取 P(a) ∨ P(b) ∨ ⋯。\n\n于是上一节的 <a class=\"wl\" data-id=\"fond_proposizioni\">德摩根律<\/a> 立刻「放大」成量词的否定规则：\n\n- ¬(∀x P(x)) ≡ ∃x ¬P(x)。「并非人人都 P」=「存在一个不 P 的」。（对应 ¬(p ∧ q) ≡ ¬p ∨ ¬q。）\n- ¬(∃x P(x)) ≡ ∀x ¬P(x)。「并不存在 P 的」=「人人都不 P」。（对应 ¬(p ∨ q) ≡ ¬p ∧ ¬q。）\n\n口诀就一句：**否定往里钻，∀ 与 ∃ 对调，谓词随之取反**。注意上面那个「一串 ∧ / 一串 ∨」只是帮你看清来路的类比——论域无限时 ∀、∃ 并不真是有限的合取析取；但这两条否定规则对**任意**论域（含无限）都照样成立，它们直接来自 ∀、∃ 的定义。\n\n举一例。「∀x ∈ ℝ, x² ≥ 0」的否定是「∃x ∈ ℝ, x² < 0」（把 ∀ 换成 ∃、把 x² ≥ 0 取反成 x² < 0）。原命题真，故其否定假——自洽。\n\n## 嵌套：顺序不可随意交换\n\n把量词叠起来用时，**∀ 和 ∃ 的先后不能随便换**。看一个论域取 ℝ、谓词 Q(x, y) 为「y > x」的例子：\n\n- ∀x ∃y (y > x)：「对每个 x，都**找得到**一个更大的 y」。**真**——给定 x，取 y = x + 1 即可（y 可以随 x 变）。\n- ∃y ∀x (y > x)：「**存在某个** y，它比**每个** x 都大」。**假**——那等于说实数里有个最大的数，没有。\n\n同样的两个量词、同样的谓词，仅仅调了次序，真假就翻了。症结在于：∀x ∃y 里，y 的选取**允许依赖** x；而 ∃y ∀x 里，必须**一个 y 通吃所有** x。（顺带：同类量词之间可以随意交换——∀x∀y ≡ ∀y∀x，∃x∃y ≡ ∃y∃x；只有 ∀ 与 ∃ 混着叠时才挑顺序。）这个「顺序决定一切」的现象，等你将来学极限、连续的 ε-δ 定义时会反复撞见——那些定义正是几个 ∀、∃ 叠出来的，叠错顺序，意思就全变了。\n\n## 几个最容易栽跟头的地方\n\n- **否定时只做一半**。把 ∀ 的否定写成「∀x ¬P(x)」（只取反谓词、忘了换量词），或写成「∃x P(x)」（只换量词、忘了取反谓词），都是错的。两件事要一起做。\n- **混合量词的顺序**。如上例，调了次序就可能变味，务必照原句的先后来读。\n- **空论域的边界情形**。若论域为空，∀x P(x) **恒真**（举不出反例——这正是上一节「空洞为真」的体现），而 ∃x P(x) **恒假**（找不到对象作见证）。「所有住在这间空屋里的人都两米高」是一句真话。\n- **「=」暂且朴素地用**。下面练习里会出现「相等」，我们先按「指同一个对象」的朴素意思用它；它的严格身份留待讲关系时再交代。\n\n## 一道激活练习\n\n把下面这句的否定，**一步步把 ¬ 推到紧贴谓词为止**（最终式子里 ¬ 前面不许再有量词），写出最终形式，再用一句中文说清它断言什么、是真是假：\n\n¬( ∀x ∈ ℝ, ∃y ∈ ℝ, y > x )。\n\n（提示：从最外层的 ∀ 开始，一层层套用否定规则；每钻进一层，量词对调一次，最后对谓词「y > x」取反。）\n\n## 参考解答\n\n（建议先自己写完再看。）思路：从最外层量词起，每剥一层就套一次否定规则（∀↔∃ 对调、谓词取反），一路推到 ¬ 紧贴谓词。\n\n```\n¬( ∀x∈ℝ, ∃y∈ℝ, y>x )\n≡ ∃x∈ℝ, ¬( ∃y∈ℝ, y>x )     （¬∀ → ∃¬）\n≡ ∃x∈ℝ, ∀y∈ℝ, ¬(y>x)        （¬∃ → ∀¬）\n≡ ∃x∈ℝ, ∀y∈ℝ, y ≤ x          （「y>x」取反为「y≤x」）\n```\n\n它断言什么：**存在一个实数 x，比每个实数 y 都不小**——也就是「实数里有个最大的数」。**是假的**：对任何 x，x+1 就比它大，没有最大实数。（这与原句「对每个 x 都找得到更大的 y」为真恰好相反，自洽。）\n\n## 往前看一步\n\n现在，配上上一节的联结词，我们已经能把几乎任何一句数学断言写得滴水不漏。但有一样东西，这一节自始至终是**借来用**的：量词扫过的那个「论域」——我们一直说「x 取遍 ℝ」「取遍某个范围」，可这个**范围**本身，严格来说究竟是什么？它就是**集合**：把一些对象当成一个整体来看待，好让量词有个确切的地方去「取遍」。这正是 <a class=\"wl\" data-id=\"fond_insiemi\">集合<\/a> 要替我们钉死的第一件事。","refs":"Amann–Escher, Analysis I §I.1"},{"id":"fond_relazioni","label":"有序对与关系","parent":"fond_fondamenta","summary":"有序对 (a,b) 用纯集合造出「次序」，笛卡尔积 A×B 收集全部有序对；关系就是 A×B 的一个子集——「对应」从此是集合论里的一等公民。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#A9A9A9","ring":3,"bearing":51,"popupLinks":[{"id":"fond_insiemi","text":"外延原则"},{"id":"fond_funzioni","text":"函数"}],"body":"\n## 为什么需要「次序」\n\n上一节刚立下的外延原则说：集合**不在乎次序**，{a, b} 和 {b, a} 是同一个东西。可数学里偏偏到处需要次序：平面上的点 (2, 3) 和 (3, 2) 是两个不同的点；「x 对应到 y」和「y 对应到 x」是两回事。我们的处境有点尴尬——手里唯一的原料是集合，而集合天生不认次序。这一节要干的第一件事，就是**用不认次序的材料，造出认次序的东西**；造出来之后，「元素之间的对应」立刻就能严格定义了。\n\n## 有序对\n\n我们想要一个对象 (a, b)，叫**有序对**(ordered pair)，它只需满足一条**特征性质**(characteristic property)：\n\n(a, b) = (c, d)  ⟺  a = c  ∧  b = d。\n\n也就是：两个有序对相等，当且仅当**对应位置**的成员各自相等。怎么用纯集合实现它？Kuratowski 给出的定义漂亮至极：\n\n(a, b) := { {a}, {a, b} }。\n\n直觉是：{a, b} 记录「成员是谁」，{a} 单独把**第一个**成员挑出来——次序信息就这样被「不对称地」编码进了一个普通集合。\n\n定义是否合格，全看特征性质是否真的成立。这是我们课程里第一个正经的**定理**(theorem)，把证明完整跑一遍——它恰好把前几节的工具全部用上。\n\n**定理（特征性质）.** 对任意对象 a, b, c, d：{{a},{a,b}} = {{c},{c,d}} ⟺ a=c ∧ b=d。\n\n**证明.** 「⟸」方向是顺的：若 a=c 且 b=d，把字母一替换，两边是同一个集合，自然相等。\n\n「⟹」方向才见真章。设 {{a},{a,b}} = {{c},{c,d}}，要推出 a=c 且 b=d。按 <a class=\"wl\" data-id=\"fond_insiemi\">外延原则<\/a>，左右两个集合成员完全相同。分两种情形。\n\n*情形一：a = b。* 这时 {a,b} = {a,a} = {a}（外延：成员相同），于是左边 = {{a},{a}} = {{a}}——只剩一个成员 {a}。右边与它相等，成员也只能全是 {a}，故 {c} = {a} 且 {c,d} = {a}。由 {c} = {a} 得 c = a（两个单元素集相等，成员必相同——还是外延）；由 {c,d} = {a} 得 d = a。于是 a = c，且 b = a = d。两条都到手。\n\n*情形二：a ≠ b。* 左边的成员 {a}（一个元素）和 {a,b}（两个不同元素）个数不同，是两个不同的集合。看右边的成员 {c} 必属于左边：{c} = {a} 或 {c} = {a,b}。后者不可能——单元素集装不下两个不同元素。故 {c} = {a}，得 **c = a**。再看左边的 {a,b} 必属于右边：{a,b} = {c} 或 {a,b} = {c,d}。前者同理不可能，故 {a,b} = {c,d}。其中 b 是右边的成员：b = c 或 b = d。若 b = c，则 b = a，违背本情形假设；故 **b = d**。∎\n\n> 这个证明值得回味一遍：通篇只用了外延原则与分情形讨论，没有任何新公理。还有一点要提前说破——你不必把 {{a},{a,b}} 的具体长相记在心上。**从今往后我们只使用特征性质**，把 Kuratowski 构造忘掉都行：它的使命只是证明「有序对这种东西用集合造得出来」。这种「造出来→验证性质→封装遗忘」的手法，以后构造 ℤ、ℚ、ℝ 时会一再上演。\n\n有了 (a,b)，**有序三元组**顺手就有：(a,b,c) := ((a,b),c)，以此类推。\n\n## 笛卡尔积\n\n把两个集合**所有可能的有序对**收集起来：A 与 B 的**笛卡尔积**(Cartesian product)是\n\nA × B := { (a, b) : a ∈ A, b ∈ B }。\n\n例：A = {1, 2, 3}，B = {1, 2}，则 A×B 共 3·2 = 6 个元素，可摆成一张格点阵——横向取 A、纵向取 B：\n\n<svg viewBox=\"0 0 300 190\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"50\" y1=\"150\" x2=\"270\" y2=\"150\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <line x1=\"50\" y1=\"150\" x2=\"50\" y2=\"30\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <text x=\"262\" y=\"168\" font-size=\"12\" fill=\"#555\">A<\/text>\n  <text x=\"34\" y=\"38\" font-size=\"12\" fill=\"#555\">B<\/text>\n  <text x=\"100\" y=\"168\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">1<\/text>\n  <text x=\"160\" y=\"168\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">2<\/text>\n  <text x=\"220\" y=\"168\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">3<\/text>\n  <text x=\"38\" y=\"124\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">1<\/text>\n  <text x=\"38\" y=\"74\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">2<\/text>\n  <circle cx=\"100\" cy=\"120\" r=\"4\" fill=\"#E0612F\"/>\n  <circle cx=\"160\" cy=\"120\" r=\"4\" fill=\"#E0612F\"/>\n  <circle cx=\"220\" cy=\"120\" r=\"4\" fill=\"#E0612F\"/>\n  <circle cx=\"100\" cy=\"70\" r=\"4\" fill=\"#E0612F\"/>\n  <circle cx=\"160\" cy=\"70\" r=\"4\" fill=\"#E0612F\"/>\n  <circle cx=\"220\" cy=\"70\" r=\"4\" fill=\"#E0612F\"/>\n  <text x=\"236\" y=\"64\" font-size=\"11\" fill=\"#555\">(3,2)<\/text>\n<\/svg>\n\n这张格点图不是装饰——它就是日后**平面**的雏形：你熟悉的坐标平面，严格身份正是 ℝ × ℝ。「平面上的点 = 一个有序实数对」这句话，在这里第一次有了集合论的着落。\n\n注意 **A×B 与 B×A 一般不相等**：上例中 (3,2) ∈ A×B，但 (3,2) ∉ B×A（因为 3 ∉ B）。次序——我们辛苦造出来的东西——当然不白造。\n\n## 关系\n\n现在回到「对应」。直觉里，「A 的元素与 B 的元素之间的一种对应」无非是回答一个问题：**哪些 (a,b) 算对应上了？** 把\"算上了\"的那些有序对收进一个集合，对应本身就被这个集合完全刻画了。于是定义出乎意料地简短：\n\nA 到 B 的一个**关系**(relation)，就是笛卡尔积的一个子集 R ⊆ A × B。\n\n(a,b) ∈ R 时记 **a R b**，读「a 与 b 有关系 R」。A = B 时称 R 为 **A 上的**关系。\n\n这一手和上一节「∪∩∖ 就是 ∨∧¬」如出一辙：不发明新本体，把新概念**还原**成已有的集合操作。看几个老朋友的新身份：\n\n- **小于** < 是 ℝ 上的关系：它\"就是\"集合 {(x,y) ∈ ℝ×ℝ : x < y}。（ℝ 的严格构造还在后头，这里先拿它当例子用。）\n- **整除**是正整数上的关系：m R n ⟺ m 整除 n。如 3 R 12，但并非 3 R 7。\n- **包含** ⊆ 是「集合的集合」上的关系。\n- 极端例子也合法：R = ∅（谁也不对应谁）和 R = A×A（人人互相对应）都是 A 上的关系——子集嘛，空集和全集当然都算。\n\n## A 上关系的三种品性\n\n设 R 是 A 上的关系。三条最常被盘问的性质：\n\n- **自反**(reflexive)：∀x ∈ A, x R x。人人和自己有关系。\n- **对称**(symmetric)：∀x,y ∈ A ( x R y ⟹ y R x )。关系不分先后。\n- **传递**(transitive)：∀x,y,z ∈ A ( (x R y ∧ y R z) ⟹ x R z )。能接力。\n\n用例子和反例把三条钉牢（反例照例是命脉——它们说明三条性质互相独立、谁也不蕴含谁）：\n\n- ℝ 上的 ≤：自反（x≤x）、传递，但不对称（2≤3 而 3≰2）。\n- ℝ 上的 <：传递，但不自反（x<x 假）、不对称。\n- 「x 与 y 是同胞兄弟姐妹」：对称，但不自反，传递性也悬（x 与 x 不算）。\n- ℝ 上的相等 =：三条全占。\n\n三条全占的关系是个要紧的物种，叫**等价关系**——它能把一个集合干净地切成若干「互不往来的类」，是数学里**造新对象的头号机器**。它值得专门一节，这里先按下。\n\n## 一道激活练习\n\n取 A = {1, 2, 3}，R = {(1,2), (2,1)}（A 上的关系）。逐条判断 R 是否自反、对称、传递，每条给出依据（成立则验证定义，不成立则举出具体反例）。\n\n（提示：传递性那条最容易判错——把定义的 ∀x,y,z 老老实实展开，x、y、z **允许重复取值**。）\n\n## 参考解答\n\n（建议先自己写完再看。）\n\n**自反？否。** 需要 ∀x∈A, xRx，即 (1,1)、(2,2)、(3,3) 全在 R 里。可 (1,1) ∉ R——一个反例足矣。\n\n**对称？是。** 逐对核查：R 里只有 (1,2) 与 (2,1)。(1,2)∈R 要求 (2,1)∈R——在；(2,1)∈R 要求 (1,2)∈R——也在。定义对 R 的每个成员都验证通过。（注意 (3,·) 这类前提为假的情形：蕴含空洞为真，自动通过。）\n\n**传递？否。** 取 x=1, y=2, z=1：有 1R2 且 2R1，传递性要求 1R1，可 (1,1) ∉ R。反例成立。这里的陷阱正是提示里那句——z 取回 1 完全合法，∀ 里的变元没规定互不相同。很多人凭「链条接力」的直觉以为两元素的关系谈不上传递，一展开定义就现形了。\n\n顺带一个回味：若把 R 换成 ∅（空关系），它**对称且传递**——所有前提全假、全部空洞为真——但在非空的 A 上不自反。「空屋里人人两米高」再次适用。\n\n## 往前看一步\n\n关系把「对应」收编成了集合，但它太自由了：一个 a 可以对应好几个 b，也可以谁都不对应。数学里最当家的那种对应要苛刻得多——**每个** a 恰好对应**一个** b，不多不少。给关系加上这一条纪律，得到的就是整个数学里出镜率最高的角色：<a class=\"wl\" data-id=\"fond_funzioni\">函数<\/a>。","refs":"Amann–Escher, Analysis I §I.2–I.3"},{"id":"geo_geometria","label":"几何","parent":null,"summary":"研究「形、空间与不变量」的分支：点、线、面与图形，以及在某类变换下保持不变的性质（长度、角度、相交关系、连续形变下的特征）。","depth":0,"isContainer":false,"isTop":true,"role":"discipline","color":"#00C884","ring":1,"bearing":0,"popupLinks":[{"id":"fond_fondamenta","text":"地基"}],"body":"\n几何(geometry)关心的是**形与空间**：点、线、面怎样摆放，图形具有哪些性质，以及——这是现代几何的灵魂——在某一类**变换**下，哪些性质岿然不动（保长度的、保角度的、乃至只保「连在一起」这种最粗的特征）。它同样以 <a class=\"wl\" data-id=\"fond_fondamenta\">地基<\/a> 的语言写成，但带来了纯逻辑与运算里没有的新原料：空间直观，以及「位置、邻近」的观念。"},{"id":"num_archimede","label":"阿基米德性质与 ℚ 的稠密性","parent":"num_costruzioni","summary":"ℕ 在 ℝ 中无上界（阿基米德性质），由完备性直接得出;推论 1/n 可任意小,且任意两个实数之间必有有理数——这些是一切「逼近」论证的起点。","depth":2,"isContainer":false,"isTop":false,"role":null,"color":"#C0894A","ring":10,"bearing":21,"popupLinks":[{"id":"num_dedekind","text":"完备性公理"},{"id":"num_estremo_superiore","text":"上确界的 ε-刻画"},{"id":"num_q_ordine","text":"有序域性质"},{"id":"num_radice2","text":"良序"},{"id":"an_valore_assoluto","text":"绝对值"},{"id":"num_radici_n","text":"n 次根的存在性"}],"body":"\n## 完备性的两个直接推论\n\nℝ 造好了,完备性公理也证了。但在进入极限之前,还有两条「显然得几乎不像定理」的事实需要正式确立——因为整个逼近理论都从它们起步,而它们其实都是完备性的推论,并非自明。\n\n第一条:**自然数能要多大有多大**(没有哪个实数能盖过所有自然数)。第二条:**有理数在实数里到处都是**(任何实数旁边都挤着有理数)。前者让「1/n 趋于 0」这种最基本的逼近成为可能;后者让「用有理数逼近实数」有了着落。两条都短,但都不能跳过。\n\n## 阿基米德性质\n\n直觉上「ℕ 没有上界」再明显不过——可在一个抽象的有序域里,这件事**可能不成立**(确实存在「非阿基米德有序域」,里面有比所有自然数都大的元素)。所以对 ℝ,它必须被证明,而证明的关键正是完备性。\n\n**定理(阿基米德性质 Archimedean property).** ℕ 在 ℝ 中没有上界:对每个 x ∈ ℝ,存在 n ∈ ℕ 使 n > x。\n\n**证明.** 反证。x < 0 时取 n = 0 即可,故设 x ≥ 0。假设 ℕ 有上界(即结论不成立),那么 ℕ 是一个非空、有上界的实数子集,由<a class=\"wl\" data-id=\"num_dedekind\">完备性公理<\/a>,s := sup ℕ 存在于 ℝ。\n\ns 是最小上界,所以 s − 1 不是上界(<a class=\"wl\" data-id=\"num_estremo_superiore\">上确界的 ε-刻画<\/a>,取 ε = 1):存在 n ∈ ℕ 使 n > s − 1。但则 n + 1 > s,而 n + 1 也是自然数——这与 s 是 ℕ 的上界矛盾。所以 ℕ 无上界。∎\n\n证明的要害值得点出:用完备性「凭空」造出一个 sup,再用它的「最小性」逼出矛盾。**完备性是这条定理唯一的、也是不可替代的依据**——非阿基米德有序域之所以存在,正因为它们不完备。\n\n## 推论:1/n 可以任意小\n\n这条推论,是「数列 1/n 趋于 0」的全部内容,也是分析里被引用最多的事实之一。\n\n**推论.** (i) 设 a ∈ ℝ,若 0 ≤ a ≤ 1/n 对**一切** n ∈ ℕˣ 成立,则 a = 0。\n(ii) 对每个 a > 0,存在 n ∈ ℕˣ 使 1/n < a。\n\n**证明.** 先证 (ii),(i) 是它的等价改写。给定 a > 0,由阿基米德性质,存在 n ∈ ℕ 使 n > 1/a(> 0,故 n ≥ 1)。两边取倒数(正数取倒翻序,<a class=\"wl\" data-id=\"num_q_ordine\">有序域性质<\/a>):1/n < a。\n\n(i):反设 a > 0,则由 (ii) 存在 n 使 1/n < a,与「a ≤ 1/n 对一切 n」矛盾。故 a = 0。∎\n\n(ii) 说「再小的正数,也有某个 1/n 比它更小」;(i) 说「一个非负数若被所有 1/n 压在下面,它只能是 0」。后面证收敛、证极限唯一,反复就靠这两句。\n\n## 一条整数夹逼引理\n\n证有理数稠密之前,需要一个小工具:任何实数都被两个相邻整数夹住。它本身又是良序原理的一个应用——又一次回到<a class=\"wl\" data-id=\"num_radice2\">良序<\/a>。\n\n**引理.** 对任意 x ∈ ℝ,存在唯一的 m ∈ ℤ 使 m − 1 ≤ x < m。\n\n**证明(存在性).** 由阿基米德性质,存在自然数 m₁ > x 和 m₂ > −x,即 −m₂ < x < m₁。于是集合 { k ∈ ℤ : k > x } 非空(含 m₁)且在 ℤ 中有下界(被 −m₂ 界住)。这样的整数集合有最小元(良序原理对 ℤ 的下有界版本——把它平移进 ℕ 即可应用)。取这个最小元为 m:m > x,而 m − 1 不再 > x(否则 m 不是最小),即 m − 1 ≤ x。\n\n**唯一性**:若 m、m′ 都满足,则 m − 1 ≤ x < m 且 m′ − 1 ≤ x < m′ 给 |m − m′| < 1,而整数之差小于 1 只能为 0,故 m = m′。∎\n\n(这个 m − 1,就是 x 的**下取整** ⌊x⌋;本引理即「下取整存在」。)\n\n## ℚ 在 ℝ 中稠密\n\n**定理(ℚ 在 ℝ 中稠密).** 对任意 a, b ∈ ℝ,若 a < b,则存在 r ∈ ℚ 使 a < r < b。\n\n**证明.** 思路:先把 a、b 之间的「缝」用一个足够大的 n 放大到「宽度超过 1」,这样缝里必然套得进一个整数;再除回去,那个整数除以 n 就是要找的有理数。\n\n(a) b − a > 0,由阿基米德性质取 n ∈ ℕ 使 n > 1/(b−a)(> 0)。两边乘 (b−a) > 0:n(b − a) > 1,即 **nb > na + 1**。缝被放大到宽度大于 1。\n\n(b) 对实数 na 用整数夹逼引理:存在 m ∈ ℤ 使 m − 1 ≤ na < m。于是\n\nna < m ≤ na + 1 < nb,\n\n中间 m ≤ na + 1 来自 m − 1 ≤ na,末端 na + 1 < nb 来自 (a)。两端同除以 n > 0:\n\na < m/n < b。\n\n取 r := m/n ∈ ℚ 即可。∎\n\n「先放大缝、套进整数、再除回去」——这个三步是稠密性证明的标准结构。注意它把两件刚证的事(阿基米德放大缝、整数夹逼套整数)拼在了一起。\n\n> **顺带:无理数也稠密。** 任意 a < b 之间也必有无理数。简证:由稠密性,在 a 与 b 之间取有理数 r₁ < r₂(连用两次),则 ξ := r₁ + (r₂ − r₁)/√2 落在 (r₁, r₂) ⊆ (a, b) 内,且 ξ 无理(若 ξ 有理,反解出 √2 = (r₂−r₁)/(ξ−r₁) 有理,与<a class=\"wl\" data-id=\"num_radice2\">√2 无理<\/a>矛盾)。所以**有理数与无理数,在实数轴上彼此交错、都处处稠密**——这是 ℝ 的精细结构的第一瞥。（这里暂用了 √2 在 ℝ 中的存在性,它由 ℝ 的完备性保证,下一节正式给出 n 次根的存在定理。）\n\n## 一道激活练习\n\n(a) 证明:对任意 x ∈ ℝ 与任意 ε > 0,存在 r ∈ ℚ 使 |x − r| < ε。（即:每个实数都能被有理数任意逼近——这是「稠密」最常用的形式。）\n\n(b) 证明:对任意 x ∈ ℝ,存在唯一整数 m 使 m ≤ x < m + 1（下取整 ⌊x⌋ 的标准形式;与正文引理只差一个记号平移,请独立写一遍以熟悉手法）。\n\n（提示:(a) 把稠密性定理用在区间 (x − ε, x + ε) 上。(b) 仿正文引理,或直接对 { k ∈ ℤ : k ≤ x } 取最大元。）\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 因 ε > 0,有 x − ε < x + ε。由 ℚ 在 ℝ 中稠密(取 a = x−ε, b = x+ε),存在 r ∈ ℚ 使 x − ε < r < x + ε。由<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>的 ε-带刻画,这正是 |x − r| < ε。∎\n\n**(b)** 存在性:集合 S := { k ∈ ℤ : k ≤ x } 非空(由阿基米德性质,存在自然数 > −x,其相反数 ≤ x,故在 S 中)且有上界 x。ℤ 的上有界非空子集有最大元(平移进 ℕ 用良序);取最大元 m,则 m ≤ x,而 m + 1 ∉ S 即 m + 1 > x,合起来 m ≤ x < m + 1。唯一性:若 m、m′ 都满足,则 |m − m′| < 1,整数之差小于 1 只能为 0。∎\n\n回顾:(a) 把「稠密」从「两数之间有有理数」改写成了「每个数可被有理数 ε-逼近」——这两种说法等价,但后者是分析里直接要用的形式(下一章定义「有理数列逼近实数」时就是它)。(b) 的下取整,以后取整数部分、做估计时会反复用到。\n\n## 往前看一步\n\n完备性的这两条推论就位了:自然数无界、ℚ 处处稠密。其中阿基米德性质还藏着一个尚未兑现的承诺——本章开头说「造 ℝ 是为了能开平方」。我们已经有了 √2 这个具体的分割,但「任意正实数都有 n 次方根」这条一般定理还没证。它同样是完备性的产物(用 sup 把根「逼出来」),正是 <a class=\"wl\" data-id=\"num_radici_n\">n 次根的存在性<\/a> 的内容。","refs":"Amann–Escher, Analysis I §I.10 (Prop. 10.6–10.8)"},{"id":"num_aritmetica","label":"自然数的算术","parent":"num_costruzioni","summary":"加法与乘法由递归出生:m+0=m、m+S(n)=S(m+n);1+1=2 从此是定理,交换律、结合律、分配律逐条由归纳法证得,皆为定理而非默认。","depth":2,"isContainer":false,"isTop":false,"role":null,"color":"#C0894A","ring":1,"bearing":43,"popupLinks":[{"id":"num_n","text":"归纳原理"},{"id":"fond_funzioni","text":"∃!"},{"id":"num_ricorsione","text":"递归定理"},{"id":"fond_equivalenza","text":"等价类"},{"id":"alg_gruppi","text":"群"}],"body":"\n## 骨架要学会算术\n\n上一节的 ℕ 只会一件事:从 0 出发,一步步走。它不会加、不会乘——「+」这个符号根本尚未定义,1 + 1 = 2 暂时还是一句没有意义的话。可加法的**直觉**早就藏在骨架里:n + m,不就是「从 n 出发再走 m 步」么?这一节把这句话铸成严格的定义,然后做一件更要紧的事:交换律、结合律这些自幼熟习、却从未被证明过的定律,将在这里逐条获得证明。\n\n## 递归:归纳的孪生兄弟\n\n「从 n 出发再走 m 步」是个**分层指示**:第 0 步在哪儿说清楚,每下一步怎么走说清楚。把这种定义方式提炼成一般原理:\n\n**递归定理(recursion theorem).** 设 X 是集合,a ∈ X,g : X → X。则**存在唯一**的函数 f : ℕ → X,使得\n\nf(0) = a,  且  ∀n ∈ ℕ, f(S(n)) = g(f(n))。\n\n读法:f(0) 钦定为 a(起步),f 在「下一个数」处的值由它在「这个数」处的值经 g 加工而来(传递)。这与<a class=\"wl\" data-id=\"num_n\">归纳原理<\/a>是一对孪生:归纳说「性质沿链条传遍全体」,递归说「**取值**沿链条铺满全体」——一个用于证明,一个用于定义。\n\n又是「存在且唯一」,照<a class=\"wl\" data-id=\"fond_funzioni\">∃!<\/a>的老规矩拆两半。**唯一性**我们当场证掉:设 f、f′ 都满足两条,对 P(n) :≡「f(n) = f′(n)」跑归纳——奠基:f(0) = a = f′(0);归纳步:设 f(n) = f′(n),则 f(S(n)) = g(f(n)) = g(f′(n)) = f′(S(n))。由归纳原理,f 与 f′ 逐点相同,而二者定义域、到达域已同,故 f = f′。∎\n\n**存在性**却深得多,值得说破为什么:函数不是一句咒语,是一个**实实在在的集合**(那堆有序对)——归纳法只会证明「已有之物」的性质,**变不出集合来**。要把无穷多步指示真正拼装成一堆合法的有序对,得在集合论里动一番手脚。此处暂且承认存在性,严格搭建留待 <a class=\"wl\" data-id=\"num_ricorsione\">递归定理<\/a> 专节,先继续前行。\n\n## 加法\n\n固定 m ∈ ℕ。对「X = ℕ,起步 a = m,传递 g = S」用一次递归定理,得到唯一的函数 σₘ : ℕ → ℕ,满足 σₘ(0) = m、σₘ(S(n)) = S(σₘ(n))。把 σₘ(n) 写作 **m + n**,上面两条就成了**加法(addition)的定义**:\n\n- (A1) m + 0 := m;\n- (A2) m + S(n) := S(m + n)。\n\n读出声来:「加 0 = 原地不动」「加『n 的下一个』= 先加 n、再走一步」——正是「重复地走」的严格版。顺带重提一句旧话:这样一来 + 是个堂堂正正的函数 ℕ×ℕ → ℕ,(m,n) ↦ m+n——「运算就是函数」,当初在函数那节埋下的伏笔,在此第一次落到实处。\n\n**1 + 1 = 2,这就证。** 按定义 1 := S(0),2 := S(1)。于是\n\n1 + 1 = 1 + S(0) ⟨A2⟩= S(1 + 0) ⟨A1⟩= S(1) = 2。∎\n\n两步,每步都有出处。从今天起,这个等式不再是口诀,是定理。\n\n顺手再得一个小定理:**S(n) = n + 1**——因为 n + 1 = n + S(0) ⟨A2⟩= S(n + 0) ⟨A1⟩= S(n)。「后继」从此可以退居幕后,我们终于有资格写熟悉的 n + 1 了。\n\n## 定律是定理,不是定义\n\n现在试试 0 + n。别急着喊「当然等于 n」——定义直接给出的只有 m + **0** = m(A1,0 在**右边**),而 **0** + n 里 0 在左边,定义对它**只字未提**。定义是不对称的,对称性必须证明。这就是本节的主要工作:每一条「天经地义」,都要由一次归纳确立为定理。\n\n**引理 A.** ∀n ∈ ℕ, 0 + n = n。\n\n**证明.** 对 n 归纳。奠基:0 + 0 ⟨A1⟩= 0。归纳步:设 0 + n = n,则 0 + S(n) ⟨A2⟩= S(0 + n) ⟨归纳假设⟩= S(n)。∎\n\n**引理 B.** ∀m, n ∈ ℕ, S(m) + n = S(m + n)。(「左边的进位也能搬出来」——A2 只管右边,左边这条得证。)\n\n**证明.** 固定 m,对 n 归纳。奠基:S(m) + 0 ⟨A1⟩= S(m) ⟨A1 反用⟩= S(m + 0)。归纳步:设 S(m) + n = S(m + n),则 S(m) + S(n) ⟨A2⟩= S(S(m) + n) ⟨归纳假设⟩= S(S(m + n)) ⟨A2 反用⟩= S(m + S(n))。∎\n\n**定理(加法交换律 commutativity).** ∀m, n ∈ ℕ, m + n = n + m。\n\n**证明.** 固定 m,对 n 归纳。奠基:m + 0 ⟨A1⟩= m ⟨引理 A⟩= 0 + m。归纳步:设 m + n = n + m,则\n\nm + S(n) ⟨A2⟩= S(m + n) ⟨归纳假设⟩= S(n + m) ⟨引理 B 反用⟩= S(n) + m。∎\n\n留意这个证明的**结构**:交换律不是一步证完的,它踩着两块垫脚石(引理 A 管「0 在左边」,引理 B 管「后继在左边」)才够得着。把大目标拆成小引理、逐块归纳——这是往后许多证明的标准做法。**结合律** (k + m) + n = k + (m + n) 则不需要任何引理,留作文末练习;它一经确立,括号就可以省去,放心写 k + m + n。\n\n## 乘法\n\n同一台递归机器,再次启用。固定 m,定义**乘法(multiplication)**:\n\n- (M1) m · 0 := 0;\n- (M2) m · S(n) := m · n + m。\n\n「乘 0 归零」「乘『n 的下一个』= 先乘 n、再加一个 m」——乘法就是**重复地加**,正如加法是重复地走。验收一下,算 2 · 2(其中 3 := S(2),4 := S(3)):\n\n2 · 2 = 2 · S(1) ⟨M2⟩= 2·1 + 2 = (2 · S(0)) + 2 ⟨M2⟩= (2·0 + 2) + 2 ⟨M1⟩= (0 + 2) + 2 ⟨引理 A⟩= 2 + 2,\n\n而 2 + 2 = 2 + S(1) ⟨A2⟩= S(2 + 1) = S(2 + S(0)) ⟨A2⟩= S(S(2 + 0)) ⟨A1⟩= S(S(2)) = S(3) = 4。∎\n\n每一步都有定义或引理可援,字字有据。\n\n乘法的定律同样逐条可证,且**踩在加法定律的肩上**。示范一条,看这种「层层叠加」:\n\n**定理(分配律 distributivity).** ∀k, m, n ∈ ℕ, k · (m + n) = k·m + k·n。\n\n**证明.** 固定 k、m,对 n 归纳。奠基:k·(m + 0) ⟨A1⟩= k·m ⟨A1 反用⟩= k·m + 0 ⟨M1 反用⟩= k·m + k·0。归纳步:设 k·(m+n) = k·m + k·n,则\n\nk·(m + S(n)) ⟨A2⟩= k·S(m + n) ⟨M2⟩= k·(m+n) + k ⟨归纳假设⟩= (k·m + k·n) + k ⟨加法结合律⟩= k·m + (k·n + k) ⟨M2 反用⟩= k·m + k·S(n)。∎\n\n看见没——倒数第二步用的正是你即将在练习里证明的**加法结合律**:定律之间有先后的依托——加法诸律先行确立,乘法诸律方能在其上立足。乘法的交换律、结合律手法如出一辙(各需一两块「0 在左、S 在左」式的垫脚石),清单先记在这儿,手痒尽可自证,我们不再逐条占篇幅。\n\n## 一道激活练习\n\n证明**加法结合律(associativity)**:\n\n∀k, m, n ∈ ℕ, (k + m) + n = k + (m + n)。\n\n(提示:固定 k、m,对 n 归纳——想想为什么挑 n:定义 A1/A2 都是在**右边**的变元上动作的,对 n 归纳,每一步都有现成的依据可援。全程只需 A1、A2 与归纳假设,连引理都不用。)\n\n## 参考解答\n\n(建议先自己写完再看。)固定 k, m,对 P(n) :≡「(k+m)+n = k+(m+n)」跑归纳。\n\n**奠基** P(0):\n\n(k + m) + 0 ⟨A1⟩= k + m ⟨A1 反用,作用在 m 上⟩= k + (m + 0)。\n\n**归纳步**:设 (k+m)+n = k+(m+n),往证 P(S(n)):\n\n```\n(k + m) + S(n)\n= S((k + m) + n)      ⟨A2⟩\n= S(k + (m + n))      ⟨归纳假设⟩\n= k + S(m + n)        ⟨A2 反用⟩\n= k + (m + S(n))      ⟨A2 反用,作用在内层⟩\n```\n\n两步齐备,由归纳原理结论对一切 n 成立;k、m 任意,定理得证。∎\n\n回味:整场证明就是把括号外的 S「往里搬运」——A2 正着用是「拆」,反着用是「装」,归纳假设负责中途换轨。做完这道,你已亲手确立三大定律之一;随之而来的还有记号上的自由:从此 k + m + n 不必加括号,怎么结合都是同一个数。\n\n## 往前看一步\n\n总结一下:ℕ 会走(S)、会加、会乘,定律齐备、张张有出生证明。可它是个**残缺**的世界:方程 x + 3 = 1 在 ℕ 里无解——「减法」无处安身,当初<a class=\"wl\" data-id=\"fond_equivalenza\">等价类<\/a>那节预告的整数构造也尚未动工。修复的路有两条走法,而我们要先走一条看似绕远的:停下来,把「一种运算 + 它的定律」**本身**当作研究对象。复合那节末尾提到的组合——结合律、单位元、逆元——ℕ 恰好是「有结合律、有单位元、**没有逆元**」。给这套配置一个名字并系统地研究它,代数主干由此开始:<a class=\"wl\" data-id=\"alg_gruppi\">群<\/a>。","refs":"Amann–Escher, Analysis I §I.5"},{"id":"num_cantor","label":"ℝ 的 Cantor 构造","parent":"num_costruzioni","summary":"把 ℚ 的全体 Cauchy 列构成的环,模掉「零列」这个理想,得到商环 ℝ := 𝓡/c₀;它是完备有序域,由完备有序域的唯一性,它与 Dedekind 造的 ℝ 是同一个——两条路殊途同归。","depth":2,"isContainer":false,"isTop":false,"role":null,"color":"#C0894A","ring":10,"bearing":0,"popupLinks":[{"id":"num_dedekind","text":"Dedekind 分割"},{"id":"an_cauchy","text":"Cauchy 列"},{"id":"fond_equivalenza","text":"等价类"},{"id":"alg_anelli","text":"理想与商环"},{"id":"num_z","text":"ℤ"},{"id":"num_q","text":"ℚ"},{"id":"an_algebra_limiti","text":"零×有界=零"},{"id":"num_q_ordine","text":"全序"},{"id":"alg_campi","text":"域"},{"id":"num_estremo_superiore","text":"上确界公理"},{"id":"an_bolzano_weierstrass","text":"Bolzano–Weierstrass"},{"id":"fond_iniettive_suriettive","text":"同构"},{"id":"num_radice2","text":"√2 不是有理数"},{"id":"an_serie","text":"级数"},{"id":"an_limsup","text":"上下极限"}],"body":"\n## 通往 ℝ 的第二条路\n\n<a class=\"wl\" data-id=\"num_dedekind\">Dedekind 分割<\/a>那节提过,造 ℝ 有两条经典路线:分割,以及「Cauchy 列的完备化」。我们走了分割那条;<a class=\"wl\" data-id=\"an_cauchy\">Cauchy 列<\/a>那节又把第二条的思路说了个大概——把 ℚ 的所有 Cauchy 列收集起来,按「差为零列」归类,商出的就是 ℝ。这一节把第二条路**完整走一遍**。\n\n它不引入任何新的实数(ℝ 已经由 Dedekind 造好了),价值在别处:**它把前面学过的好几样工具——<a class=\"wl\" data-id=\"fond_equivalenza\">等价类<\/a>、<a class=\"wl\" data-id=\"alg_anelli\">理想与商环<\/a>、<a class=\"wl\" data-id=\"an_cauchy\">Cauchy 列<\/a>、<a class=\"wl\" data-id=\"num_dedekind\">完备性<\/a>——在一个构造里汇到一起**,是对整条数系-分析主线的一次漂亮回顾。而且它揭示一件深刻的事:Dedekind 的「分割」与 Cantor 的「Cauchy 列」造出的,是**同一个** ℝ。\n\n(本节属于可选的完整性补充;原书也标注「首次阅读可略」。它不影响后续推进。)\n\n## 核心想法：用「逼近它的有理数列」代表一个实数\n\n回到 <a class=\"wl\" data-id=\"an_cauchy\">Cauchy 列<\/a> 那节的关键反例:逼近 √2 的有理数列(如牛顿迭代 x₀=2, x_{n+1}=½(xₙ+2/xₙ))在 ℚ 中是 Cauchy 列,却在 ℚ 中**不收敛**——它要靠近的 √2 是 ℚ 的一个洞。\n\nCantor 的想法是把这件事**反过来当定义**:既然这个 Cauchy 列「指向」√2,那就**用这个 Cauchy 列本身去代表 √2**。每个实数(包括有理数和无理数),就是「一列逼近它的有理数」。\n\n但同一个实数有许多列逼近它——牛顿迭代和「1.4, 1.41, 1.414, …」都指向 √2:\n\n<svg viewBox=\"0 0 440 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- √2 竖线 -->\n  <line x1=\"160\" y1=\"30\" x2=\"160\" y2=\"160\" stroke=\"#B33\" stroke-width=\"1.3\" stroke-dasharray=\"6,3\"/>\n  <text x=\"160\" y=\"22\" font-size=\"11\" text-anchor=\"middle\" fill=\"#B33\">√2 (ℚ 的洞)<\/text>\n  <!-- 数轴 -->\n  <line x1=\"55\" y1=\"92\" x2=\"410\" y2=\"92\" stroke=\"#ccc\" stroke-width=\"1\"/>\n  <!-- 列A 牛顿(上, 从右收) -->\n  <text x=\"20\" y=\"59\" font-size=\"11\" fill=\"#E0612F\">列A<\/text>\n  <g fill=\"#E0612F\">\n    <circle cx=\"307\" cy=\"55\" r=\"3\"/><circle cx=\"181\" cy=\"55\" r=\"3\"/><circle cx=\"160\" cy=\"55\" r=\"3\"/>\n  <\/g>\n  <polyline points=\"307,55 181,55 160,55\" fill=\"none\" stroke=\"#E0612F\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n  <text x=\"315\" y=\"59\" font-size=\"9\" fill=\"#E0612F\">2, 1.5, 1.4167, …<\/text>\n  <!-- 列B 截断(下, 从左收) -->\n  <text x=\"20\" y=\"134\" font-size=\"11\" fill=\"#00A070\">列B<\/text>\n  <g fill=\"#00A070\">\n    <circle cx=\"55\" cy=\"130\" r=\"3\"/><circle cx=\"156\" cy=\"130\" r=\"3\"/><circle cx=\"159\" cy=\"130\" r=\"3\"/><circle cx=\"160\" cy=\"130\" r=\"3\"/>\n  <\/g>\n  <polyline points=\"55,130 156,130 159,130 160,130\" fill=\"none\" stroke=\"#00A070\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n  <text x=\"55\" y=\"148\" font-size=\"9\" fill=\"#00A070\">1, 1.4, 1.41, 1.414, …<\/text>\n  <text x=\"240\" y=\"170\" font-size=\"10\" fill=\"#777\">两列不同的有理数，都收向 √2 —— 它们的差 → 0，应当代表同一个实数<\/text>\n<\/svg>\n\n所以要像造 <a class=\"wl\" data-id=\"num_z\">ℤ<\/a>、<a class=\"wl\" data-id=\"num_q\">ℚ<\/a> 那样,**把「指向同一个数」的 Cauchy 列粘成一类**——而「指向同一个数」的判据是:**两列之差是零列**(差 → 0)。等价类机器又一次登场,只是这次的「材料」是 Cauchy 列。\n\n## 构造：Cauchy 列的环,模掉零列的理想\n\n把上面的想法落成代数。设 𝓡 是 ℚ 中**全体 Cauchy 列**构成的集合,c₀ 是 ℚ 中**全体零列**(收敛到 0 的列)构成的集合。\n\n**第一步:𝓡 是环,c₀ 是它的理想。** Cauchy 列逐项相加、相乘仍是 Cauchy 列(用<a class=\"wl\" data-id=\"an_cauchy\">Cauchy⟹有界<\/a>控制乘积:|rₙsₙ − rₘsₘ| ≤ |rₙ||sₙ−sₘ| + |rₙ−rₘ||sₘ|,两个因子都被界住),所以 𝓡 在逐项运算下是一个<a class=\"wl\" data-id=\"alg_anelli\">交换环<\/a>(含幺元——常数列 1)。而零列对加法封闭、且「零列 × Cauchy 列 = 零列」(<a class=\"wl\" data-id=\"an_algebra_limiti\">零×有界=零<\/a>),所以 c₀ 是 𝓡 的一个<a class=\"wl\" data-id=\"alg_anelli\">理想<\/a>。\n\n**第二步:商掉理想。** 既然 c₀ 是理想,就能作<a class=\"wl\" data-id=\"alg_anelli\">商环<\/a>\n\nℝ := 𝓡 / c₀。\n\n它的元素是等价类 [r] = r + c₀,其中两个 Cauchy 列 r、s 同类 ⟺ r − s ∈ c₀ ⟺ **r − s 是零列** ⟺ 两列之差 → 0。这正是「指向同一个数的 Cauchy 列归为一类」的严格版。商环的加法、乘法自动从 𝓡 继承(理想的存在保证了运算<a class=\"wl\" data-id=\"alg_anelli\">良定义<\/a>)——这是当初学<a class=\"wl\" data-id=\"alg_anelli\">理想与商环<\/a>时埋下、如今兑现的用途。\n\n**第三步:ℚ 嵌入。** 每个有理数 a 对应**常数列** (a, a, a, …),它是 Cauchy 列;映射 a ↦ [(a,a,…)] 把 ℚ 单射地、保运算地放进 ℝ(<a class=\"wl\" data-id=\"num_z\">嵌入<\/a>的又一次)。于是 ℚ 成为 ℝ 的子环。无理数则对应那些**不**与任何常数列同类的 Cauchy 列——比如逼近 √2 的那一类,它在 ℚ 里没有「目标」,在 ℝ 里却是一个堂堂正正的元素 [√2]。\n\n## 序、域、完备\n\n要让 ℝ 成为完备**有序域**,还需配上序并验证性质。这里给出框架,细节是标准的(原书逐条做过):\n\n**序:** 称 Cauchy 列 r「严格正」,若从某项起 rₙ ≥ 1/N 对某固定 N > 0 成立(即它最终离 0 有正的距离、且在正侧)。用「严格正类」定义 [r] ≤ [s] :⟺ s − r 严格正或为零类。可验证这是与运算相容的<a class=\"wl\" data-id=\"num_q_ordine\">全序<\/a>,且在 ℚ 上还原成 ℚ 本来的序。\n\n**域:** 关键是非零类可逆。若 [r] ≠ 0,即 r 不是零列,则 r 最终离 0 有正距离,可以「逐项取倒数」(把开头有限项补成任意值),得到的 (1/rₙ) 仍是 Cauchy 列,其类就是 [r]⁻¹。于是 ℝ 是<a class=\"wl\" data-id=\"alg_campi\">域<\/a>。\n\n**完备:** 可证 ℝ 满足<a class=\"wl\" data-id=\"num_estremo_superiore\">上确界公理<\/a>——每个非空有上界的子集有上确界。证明用「逐次二分逼近」构造一个 Cauchy 列,其类即为上确界(思路与 <a class=\"wl\" data-id=\"an_bolzano_weierstrass\">Bolzano–Weierstrass<\/a> 的二分法同源)。\n\n## 殊途同归：它就是 ℝ\n\n三步加序、域、完备,得到:**𝓡/c₀ 是一个完备的有序域,且包含 ℚ。** 但<a class=\"wl\" data-id=\"num_dedekind\">Dedekind 分割<\/a>造的也是「包含 ℚ 的完备有序域」。两个会不会不一样?\n\n不会——因为这样的东西**本质上唯一**:\n\n> **完备有序域的唯一性.** 任何两个完备有序域都<a class=\"wl\" data-id=\"fond_iniettive_suriettive\">同构<\/a>(存在保运算、保序的双射)。\n\n(这条唯一性定理我们承认——它的证明要点是:有序域里 ℚ 总能嵌入,完备性把 ℚ 的嵌入「连续地延拓」到整个域,而稠密性保证延拓唯一。属于略深的内容,这里引用结论。)\n\n于是 **Cantor 的 𝓡/c₀ 与 Dedekind 的分割域,作为完备有序域必定同构——它们是同一个 ℝ。** 两条看起来毫不相干的路——「数轴的一刀切」与「逼近的有理数列」——造出了同一个对象。这不是巧合,而是「完备有序域」这个概念**只有一个模型**的体现:无论你怎么填 ℚ 的洞,填出来的都是 ℝ。\n\n回头看这件事的圆满:<a class=\"wl\" data-id=\"num_radice2\">√2 不是有理数<\/a>揭示 ℚ 有洞;<a class=\"wl\" data-id=\"num_estremo_superiore\">上确界<\/a>把洞表述成「无上确界」;<a class=\"wl\" data-id=\"num_dedekind\">Dedekind<\/a>用分割填洞;<a class=\"wl\" data-id=\"an_cauchy\">Cauchy<\/a>用「内部收拢」重新刻画完备;而本节用 Cauchy 列再造一次 ℝ,并证明它与分割版是同一个。**ℝ 的存在与唯一,从两个方向被彻底坐实了。**\n\n## 一道激活练习\n\n(a) 验证「零列 × Cauchy 列 = 零列」,从而 c₀ 在乘法下吸收 𝓡（这是 c₀ 为理想的核心）。(提示:Cauchy 列有界,设 |sₙ| ≤ B;零列 rₙ → 0;估计 |rₙsₙ|。)\n\n(b) 说明为什么常数列 (a, a, …) 与 (b, b, …)（a, b ∈ ℚ）同类 ⟺ a = b。（这保证 ℚ 真的单射地嵌入,不同有理数不会被粘成一类。)\n\n(c) 逼近 √2 的牛顿迭代列 (xₙ) 与常数列 (1, 1, 1, …) 是否同类?为什么?（提示:看它们的差是否为零列。）\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 设 (sₙ) 是 Cauchy 列,由<a class=\"wl\" data-id=\"an_cauchy\">Cauchy⟹有界<\/a>存在 B > 0 使 |sₙ| ≤ B 对一切 n。设 (rₙ) 是零列,rₙ → 0。则 |rₙsₙ| = |rₙ|·|sₙ| ≤ B·|rₙ|。给定 ε > 0,因 rₙ → 0 取 N 使 n ≥ N 时 |rₙ| < ε/B,则 |rₙsₙ| < B·(ε/B) = ε。故 (rₙsₙ) 是零列。∎（这正是<a class=\"wl\" data-id=\"an_algebra_limiti\">零×有界=零<\/a>在 ℚ 上的应用。）\n\n**(b)** 两常数列同类 ⟺ 其差 (a−b, a−b, …) 是零列。但这是个**常数**列:它收敛到 0 当且仅当这个常数本身就是 0,即 a − b = 0,即 a = b。（常数列的极限就是那个常数——零列只有常数 0 这一种常数列。）故 a = b 时同类、a ≠ b 时不同类,嵌入是单射。∎\n\n**(c)** **不同类。** 它们的差是 (xₙ − 1)。牛顿迭代 xₙ → √2(在 ℝ 中),故 xₙ − 1 → √2 − 1 ≈ 0.414 ≠ 0。差不是零列(它收敛到一个非零的数),所以两列不同类。直观上:牛顿列指向 √2,常数列 1 指向 1,√2 ≠ 1,自然不是同一类。∎\n\n回顾:判断两个 Cauchy 列是否同类,永远归结为**看它们的差是不是零列**(差 → 0)。这和<a class=\"wl\" data-id=\"num_z\">ℤ<\/a>、<a class=\"wl\" data-id=\"num_q\">ℚ<\/a> 构造里「判断两个有序对是否同类」一脉相承——只是那里的判据是一个代数等式,这里的判据是一个极限(差 → 0)。等价类机器的形式始终如一,变的只是「材料」和「相同的判据」。\n\n## 往前看一步\n\n数系的两种构造都已完整,ℝ 的存在性与唯一性从分割、Cauchy 两个方向彻底坐实。数系-分析这条主线的「地基」部分至此再无悬念。\n\n回到分析主线的推进:我们有了<a class=\"wl\" data-id=\"an_serie\">级数<\/a>框架和<a class=\"wl\" data-id=\"an_limsup\">上下极限<\/a>工具,接下来建立**系统的收敛判别法**——绝对收敛、比较判别、根值判别(用 lim sup)、比值判别,它们将打开判定一般级数敛散的大门,并引向**指数函数**的严格定义。这就是分析的下一站:绝对收敛与判别法。","refs":"Amann–Escher, Analysis I §II.6"},{"id":"num_costruzioni","label":"数系构造","parent":"fond_fondamenta","summary":"从五条 Peano 公理出发,只用地基的语言把 ℕ、ℤ、ℚ、ℝ 逐级造出来:每一种「数」都是亲手搭成的集合,每一条运算律都有出生证明。","depth":1,"isContainer":true,"isTop":false,"role":null,"color":"#C0894A","ring":5,"bearing":0,"popupLinks":[{"id":"fond_equivalenza","text":"等价类"},{"id":"num_n","text":"什么是自然数"}],"body":"\n我们平日喊「数」喊得理直气壮,可它们究竟**是**什么?这一支就回答这个问题:以逻辑与集合为唯一原料,先用公理立起自然数,再反复使用<a class=\"wl\" data-id=\"fond_equivalenza\">等价类<\/a>构造——商出 ℤ、商出 ℚ,最后补上那道「没有缝隙」的工序得到 ℝ。每往上一级,旧数系都会原封不动地嵌进新数系;而每一级新获得的本领(能减、能除、能取极限),都将由明文的定理确立,而非默认。一切从最朴素的一问开始:<a class=\"wl\" data-id=\"num_n\">什么是自然数<\/a>。"},{"id":"num_dedekind","label":"Dedekind 分割与 ℝ 的构造","parent":"num_costruzioni","summary":"实数定义为 ℚ 的「分割」——数轴上一刀切出的左半;序即包含,完备性公理由「分割之并仍是分割」直接证得,ℚ 嵌入其中,√2 终于在数轴上落位。","depth":2,"isContainer":false,"isTop":false,"role":null,"color":"#C0894A","ring":9,"bearing":26,"popupLinks":[{"id":"alg_anelli","text":"环"},{"id":"an_analisi","text":"分析"}],"body":"\n## 用「一刀切」定义实数\n\n上一节把 ℝ 的使命锁定成一句话:造一个**完备**的有序域——每个非空有上界的子集都有上确界。现在动手。\n\nDedekind 的想法朴素得惊人。看 ℚ 的数轴:在任意一点把它切成左右两半。如果切口落在某个有理点上(比如在 3/2 处下刀),左半是「所有小于 3/2 的有理数」;但如果切口落在 √2「本该在」的位置——那里没有 ℚ 的点——左半就是「所有平方小于 2 的正有理数,连同全体非正有理数」,而**这一刀并不切到任何有理数身上**。关键的观察是:**无论切口处有没有有理数,左半这个集合本身总是完全确定的**。于是把因果倒过来:不再说「先有实数、再切出左半」,而是**直接用左半这个 ℚ 的子集去定义那个实数**。每一个可能的「左半」就是一个实数;有理点处的切口给出有理数,无理点处的切口给出新的数。所有这些子集收集起来,就是 ℝ。\n\n剩下的全部工作,是把「左半」这个直觉用纯粹的集合语言刻画清楚,然后验证如此定义的对象确实构成一个完备有序域。\n\n## 分割的定义\n\n什么样的 ℚ 子集配当「数轴左半」?它该满足三条:不空也不满、向左封闭、右端不含最大者。\n\n**定义.** ℚ 的一个子集 α 称为一个**分割**(Dedekind cut),若:\n\n- **(C1)** α ≠ ∅ 且 α ≠ ℚ(非平凡:左半既非空、也没吞掉整条轴);\n- **(C2) 向下封闭**:若 p ∈ α 且 q < p,则 q ∈ α(左半里一个点的左边全在左半里);\n- **(C3) 无最大元**:α 中不存在最大的有理数(切口处是「开」的——左半一路逼近切口但不含它)。\n\n记 **ℝ** 为全体分割之集。ℝ 的元素就是分割;一个「实数」从此就是一个满足 (C1)–(C3) 的有理数集合。\n\n(C3) 是个约定性的选择:切口处既可以把它归左、也可以归右,我们统一归右,于是左半\"无最大元\"。这避免了\"3/2 处的切口\"产生两个不同表示的麻烦,让每个实数对应唯一的分割。\n\n**有理数的分割.** 对每个 r ∈ ℚ,令\n\nr* := { p ∈ ℚ : p < r }。\n\n验它是分割:非空(r−1 ∈ r*)、非满(r ∉ r*,因 r < r 假)——(C1) 成立;若 p < r 且 q < p,则 q < r,(C2) 成立;无最大元——任取 p ∈ r*,即 p < r,由稠密性存在 p′ 满足 p < p′ < r,故 p′ ∈ r* 且 p′ > p,(C3) 成立。这样的分割称**有理分割**。映射 r ↦ r* 就是 ℚ 到 ℝ 的嵌入(下节验证它保序、保运算)。\n\n**一个不是有理分割的分割.** 这正是关键:令\n\nγ := { p ∈ ℚ : p ≤ 0 } ∪ { p ∈ ℚ : p > 0 且 p² < 2 }。\n\n它就是上一节那个集合 A 添上全体非正有理数。验证它是分割:非空(0 ∈ γ)非满(2 ∉ γ,因 2² = 4 > 2);向下封闭(若 q < p ∈ γ:p ≤ 0 时 q < 0 ∈ γ;p > 0 且 p² < 2 时,若 q ≤ 0 则 q ∈ γ,若 q > 0 则 q < p 给 q² < p² < 2);无最大元——这恰是上一节关键引理 (i)「平方小于 2 的正有理数总能再变大一点而不出界」,它保证 γ 的正数部分没有最大者,而非正部分显然更小。所以 γ 是分割。**但它不是任何有理分割**:若 γ = r*,则 r 恰好把\"平方小于 2\"和\"平方大于 2\"分开,这样的 r 满足 r² = 2(下面会精确说明),而上一节证过这样的有理数不存在。γ 就是即将名为 √2 的那个新实数——它在 ℚ 中找不到对应的点,却是一个完全合法的分割。\n\n## 序:就是集合的包含\n\n现在给 ℝ 装上序。Dedekind 构造最漂亮的地方在于:序不需要新定义,**包含关系 ⊆ 直接就是它**。直觉显然——左半越大,切口越靠右,数就越大。\n\n**定义.** 对分割 α, β,规定 α ≤ β :⟺ α ⊆ β。\n\n**定理.** ≤ 是 ℝ 上的全序。\n\n**证明.** 自反、传递就是 ⊆ 的自反、传递(集合论里的现成事实)。反对称:α ⊆ β 且 β ⊆ α 给 α = β(外延原则),正是反对称。**全序性**是唯一需要动脑的一条:任两个分割必有一个包含另一个。设 α ⊄ β,则存在 p ∈ α 而 p ∉ β。往证 β ⊆ α:任取 q ∈ β,因 p ∉ β 而 β 向下封闭,**不可能** q ≥ p(否则 p ≤ q ∈ β 迫使 p ∈ β),故 q < p;而 p ∈ α、α 向下封闭,得 q ∈ α。所以 β ⊆ α,即 β ≤ α。∎\n\n包含即序,这个选择的回报马上揭晓:它让完备性公理几乎不证自明。\n\n## 高潮:完备性公理成立\n\n上一节我们要求 ℝ 满足「每个非空有上界的子集都有上确界」。在 Dedekind 的框架里,这条公理的证明短得惊人——因为上确界就是**并集**。\n\n**定理(完备性 / 上确界公理).** 设 𝒜 ⊆ ℝ 非空,且有上界。则 𝒜 有上确界,且\n\nsup 𝒜 = ⋃_{α ∈ 𝒜} α\n\n(所有这些分割作为集合的并)。\n\n**证明.** 记 s := ⋃_{α∈𝒜} α。分三步:s 是分割、s 是上界、s 是最小上界。\n\n**s 是分割.** 设 β 是 𝒜 的上界(分割),即每个 α ∈ 𝒜 满足 α ⊆ β。\n*(C1)* 非空:𝒜 非空,取一个 α₀ ∈ 𝒜,它非空,故 s ⊇ α₀ 非空。非满:每个 α ⊆ β,故 s ⊆ β ≠ ℚ,于是 s ≠ ℚ。\n*(C2)* 向下封闭:设 q < p ∈ s。p ∈ s 意味着 p 属于某个 α ∈ 𝒜;α 向下封闭,故 q ∈ α ⊆ s。\n*(C3)* 无最大元:设 p ∈ s,则 p ∈ 某个 α;α 无最大元,存在 p′ ∈ α, p′ > p,而 p′ ∈ α ⊆ s。故 s 无最大元。\n三条齐备,s ∈ ℝ。\n\n**s 是上界.** 对每个 α ∈ 𝒜,显然 α ⊆ ⋃ = s,即 α ≤ s。\n\n**s 是最小上界.** 设 β 是任一上界,即 ∀α ∈ 𝒜, α ⊆ β。则它们的并也含于 β:s = ⋃ α ⊆ β,即 s ≤ β。\n\n故 s = sup 𝒜。∎\n\n停下来体会这件事的分量。在上一节,「ℚ 没有上确界」是一条需要费力反证的定理;而在 ℝ 里,「上确界存在」竟然只是「一族向下封闭集合的并仍然向下封闭」——几乎是集合论的自动事实。**这就是 Dedekind 构造的全部意图**:把「序」设计成包含、把实数设计成左半集合,正是为了让完备性变成并集的平凡性质。ℝ 之所以无洞,是因为我们用「能并起来的东西」来定义它的每一个点。\n\n## 加法\n\nℝ 已是完备的全序集;要成为完备有序**域**,还得装上加法与乘法,并验证有序域公理。先看加法——它同样落在集合层面。\n\n**定义.** α + β := { p + q : p ∈ α, q ∈ β }。\n\n**它是分割.** *(C1)* 非空(各取一元相加);非满:取 p₀ ∉ α、q₀ ∉ β,则对任何 p∈α,q∈β 有 p < p₀、q < q₀(因 α,β 向下封闭,集合外的数大于集合内一切),故 p+q < p₀+q₀,即 p₀+q₀ ∉ α+β。*(C2)* 设 r < p + q(p∈α,q∈β)。则 r − q < p,故 r − q ∈ α(向下封闭),而 r = (r−q) + q ∈ α + β。*(C3)* 任取 p+q ∈ α+β,α 无最大元给 p′ > p, p′∈α,则 p′+q > p+q 仍在 α+β。∎\n\n**(ℝ, +) 是交换群.** 加法的交换、结合直接继承自 ℚ 的对应定律(逐元素验证)。**零元是 0\\***（有理分割 0* = {p∈ℚ : p<0}，即全体负有理数）：验 α + 0* = α 需两个包含方向，是本节加法最需要小心的一处验证，留给读者按定义展开（提示用 (C3)：α 中任一元素都不是最大的，故可写成\"α 中更大元 + 负数\"）。**逆元** −α 的构造也有一个需要当心的小手术（不能简单取 {−p : p∉α}，要避开切口那一点）：\n\n−α := { p ∈ ℚ : 存在 r > 0 使 −p − r ∉ α }。\n\n（直觉：−α 的左半，是「把 α 的右半取相反数、再往左缩一点」，那个\"缩一点\"正是为了满足无最大元。）验证它是分割、且 α + (−α) = 0*，是一道扎实的练习,路数与上面相同,此处不再逐字展开。\n\n**序与加法相容 (O1)**:α ≤ β ⟹ α + γ ≤ β + γ。证明:α ⊆ β 时,{p+r : p∈α, r∈γ} ⊆ {q+r : q∈β, r∈γ},即 α+γ ⊆ β+γ。一行可了——包含即序,相容性几乎是自动的。\n\n## 乘法:同样的思路,多一道符号关卡\n\n乘法本应同法:α · β := { p·q : p∈α, q∈β }。但这里有个 ℚ 上没遇到的障碍:若 α、β 含有大量负数(它们向下封闭,一定含全体足够小的负数),两个很小的负数相乘得到很大的正数,{p·q} 会向右炸开,根本不是分割。\n\n解决办法是**先对正数定义,再用符号规则补全**——这正是有序域结构派上用场之处。先定义「正分割」:α > 0* 即 0* ⊊ α(α 严格大于零)。对两个正分割,定义\n\nα · β := 0* 的元素,连同 { p·q : p∈α, q∈β, p>0, q>0 }\n\n(只取正的部分相乘,再把负有理数全部补进左半)。验证它是正分割,与加法同法。然后对一般的 α、β,借符号定理把乘法**定义**出来:利用每个非零实数恰是某个正分割或其相反数(三歧性,由全序得到),令\n\nα·β := 视 α、β 的符号,等于 ±(|α|·|β|),\n\n其中 |α| 取
