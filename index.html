,存在 N₂ 使 n≥N₂ 时 ‖yₙ−y‖ < ε/2。则 n ≥ max(N₁,N₂) 时:\n\n‖(xₙ+yₙ)−(x+y)‖ = ‖(xₙ−x)+(yₙ−y)‖ ≤ ‖xₙ−x‖ + ‖yₙ−y‖ < ε/2+ε/2 = ε（用 (N3)）。\n\n故 xₙ+yₙ → x+y。∎（与<a class=\"wl\" data-id=\"an_algebra_limiti\">实数列和法则<\/a>证明结构完全相同,只把 |·| 换成 ‖·‖——因为只用到三角不等式,在任何赋范空间通用。）\n\n**(c)** 由反向三角不等式,| ‖xₙ‖ − ‖x‖ | ≤ ‖xₙ − x‖。给定 ε>0,因 xₙ→x 取 N 使 n≥N 时 ‖xₙ−x‖<ε,则同样 n≥N 时 | ‖xₙ‖−‖x‖ | ≤ ‖xₙ−x‖ < ε。故 ‖xₙ‖ → ‖x‖。∎\n\n回顾:这三题都印证同一件事——**赋范空间里的分析,本质是「把绝对值换成范数」后照搬实数列的论证**,只要原证明不依赖 𝕂 的乘法或序(即只用到三角不等式和齐次性)。(a) 验范数走「三公理逐条核对」标准流程;(b)(c) 则展示「实数列的极限定理,凡不碰乘法/序的,在赋范空间一字通用」。这是范数诱导度量带来的红利:一套分析,处处适用。\n\n## 往前看一步\n\n范数把「长度」和「距离」装进了向量空间,赋范空间自动成为度量空间,极限理论随之生效。但范数只给了**长度**,还没给**角度**——我们仍不能说「两个向量是否垂直」「它们的夹角是多少」。而几何里「垂直」「投影」「勾股定理」都离不开角度。\n\n补上角度的,是一个更强的结构:**内积**(inner product)。在 ℝⁿ 上,内积就是熟悉的点积 ⟨x, y⟩ = Σxᵢyᵢ;由它能定义夹角(通过 cos θ),也能**诱导出范数** ‖x‖ = √⟨x, x⟩。而内积满足的一条关键不等式——**Cauchy–Schwarz** |⟨x,y⟩| ≤ ‖x‖‖y‖——恰恰保证这个诱导范数满足三角不等式 (N3)。于是链条闭合:**内积 → 范数 → 度量**,而欧氏空间 ℝⁿ 终于成为一个有长度、有角度、有距离的完整<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>。这就是 <a class=\"wl\" data-id=\"an_prodotto_interno\">内积与欧氏空间<\/a> 的内容,也是我们在分析主干里一直推迟的欧氏 ℝⁿ 的终点站。","refs":"Amann–Escher, Analysis I §II.3"},{"id":"an_norme_equivalenti","label":"等价范数与积空间收敛","parent":"an_analisi","summary":"两个范数等价指它们互相被常数倍控制;等价范数给出相同的邻域,从而相同的收敛。ℝᵐ 上的欧氏、sup、1-范数两两等价,由此 ℝᵐ 中收敛 ⟺ 每个坐标分量收敛(按分量收敛)。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#E27FCD","ring":5,"bearing":0,"popupLinks":[{"id":"an_norma","text":"范数"},{"id":"an_prodotto_interno","text":"欧氏范数"},{"id":"fond_equivalenza","text":"等价关系"},{"id":"an_spazio_metrico","text":"邻域"},{"id":"an_convergenza","text":"收敛"},{"id":"alg_complessi","text":"ℂᵐ"},{"id":"an_succ_complesse","text":"复数列"},{"id":"an_algebra_limiti","text":"和的极限"},{"id":"num_archimede","text":"阿基米德"},{"id":"an_numero_e","text":"欧拉数"},{"id":"an_convergenza_assoluta","text":"绝对收敛"},{"id":"an_riordinamenti","text":"重排、二重级数与 Cauchy 乘积"}],"body":"\n## 同一个空间，不同的「长度尺」\n\n<a class=\"wl\" data-id=\"an_norma\">范数<\/a>那节见过:同一个向量空间可以配不同的范数——ℝ² 上有<a class=\"wl\" data-id=\"an_prodotto_interno\">欧氏范数<\/a> ‖x‖ = √(x₁²+x₂²)，也有<a class=\"wl\" data-id=\"an_norma\">曼哈顿范数<\/a> ‖x‖₁ = |x₁|+|x₂|，还有 sup 范数 ‖x‖∞ = max(|x₁|,|x₂|)。它们给出的「长度」数值不同,单位球形状也不同(圆、菱形、方形)。\n\n一个自然的问题:**换一把范数尺,分析会不会变?** 比如「收敛」「聚点」这些概念,用欧氏范数和用 sup 范数定义,得到的结果一样吗?这一节回答它——对一大类范数(「等价」的),答案是**完全一样**。这件事有个重要的实际收获:它让 ℝᵐ 中的收敛**化归为各坐标分量的收敛**,把多维问题拆成一维问题。\n\n## 等价范数\n\n**定义(等价).** 向量空间 E 上的两个<a class=\"wl\" data-id=\"an_norma\">范数<\/a> ‖·‖₁ 和 ‖·‖₂ 称**等价**(equivalent)，若存在常数 K ≥ 1,使\n\n(1/K)·‖x‖₁ ≤ ‖x‖₂ ≤ K·‖x‖₁，  对一切 x ∈ E。\n\n记 ‖·‖₁ ∼ ‖·‖₂。\n\n直观:两个范数等价,意味着它们「相差不超过一个固定的倍数」——一个范数大,另一个也大,谁也不会比对方大得离谱或小得离谱。它们度量长度的「尺度」是可比的。(可验证 ∼ 是范数集合上的一个<a class=\"wl\" data-id=\"fond_equivalenza\">等价关系<\/a>:自反、对称、传递都直接从定义得到。)\n\n## ℝᵐ 上的三个范数两两等价\n\n最重要的例子:𝕂ᵐ 上常用的三个范数互相等价。先回忆它们(对 x = (x₁,…,xₘ)):\n\n- 欧氏范数 ‖x‖ = √(Σ|xⱼ|²)（<a class=\"wl\" data-id=\"an_prodotto_interno\">内积诱导<\/a>）;\n- 1-范数 ‖x‖₁ = Σ|xⱼ|（各分量绝对值之和）;\n- sup 范数 ‖x‖∞ = max_{1≤j≤m} |xⱼ|（最大分量绝对值）。\n\n**命题.** 在 𝕂ᵐ 上,以下不等式成立(对一切 x):\n\n‖x‖∞ ≤ ‖x‖ ≤ √m·‖x‖∞，   (1/√m)·‖x‖₁ ≤ ‖x‖ ≤ ‖x‖₁。\n\n因此三个范数**两两等价**。\n\n**证明.** 设 M := max|xⱼ| = ‖x‖∞。\n- **‖x‖∞ ≤ ‖x‖**:某个 |xₖ| = M,而 ‖x‖² = Σ|xⱼ|² ≥ |xₖ|² = M²,开方得 ‖x‖ ≥ M。\n- **‖x‖ ≤ √m·‖x‖∞**:Σ|xⱼ|² ≤ Σ M² = m·M²,开方 ‖x‖ ≤ √m·M。\n- **‖x‖ ≤ ‖x‖₁**:Σ|xⱼ|² ≤ (Σ|xⱼ|)²（平方和 ≤ 和的平方,因交叉项非负）,开方即得。\n- **(1/√m)‖x‖₁ ≤ ‖x‖**:这正是<a class=\"wl\" data-id=\"an_prodotto_interno\">Cauchy–Schwarz<\/a>——取 (|x₁|,…,|xₘ|) 与 (1,…,1) 作内积:‖x‖₁ = Σ|xⱼ|·1 ≤ √(Σ|xⱼ|²)·√(Σ1²) = ‖x‖·√m。移项即得。\n\n所以欧氏范数被 sup 范数和 1-范数从两侧夹住(乘上 √m 这类常数),三者两两等价。∎\n\n<svg viewBox=\"0 0 300 320\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"40\" y1=\"150\" x2=\"260\" y2=\"150\" stroke=\"#ddd\" stroke-width=\"0.8\"/>\n  <line x1=\"150\" y1=\"40\" x2=\"150\" y2=\"260\" stroke=\"#ddd\" stroke-width=\"0.8\"/>\n  <!-- sup 单位球: 方形 (最大) -->\n  <rect x=\"80\" y=\"80\" width=\"140\" height=\"140\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"1.6\"/>\n  <text x=\"224\" y=\"78\" font-size=\"11\" fill=\"#5A5FE0\">‖·‖∞ (方)<\/text>\n  <!-- 欧氏 单位球: 圆 (中) -->\n  <circle cx=\"150\" cy=\"150\" r=\"70\" fill=\"none\" stroke=\"#E0612F\" stroke-width=\"1.6\"/>\n  <text x=\"150\" y=\"68\" font-size=\"11\" text-anchor=\"middle\" fill=\"#E0612F\">‖·‖ (圆)<\/text>\n  <!-- 1-范数 单位球: 菱形 (最小) -->\n  <polygon points=\"220,150 150,80 80,150 150,220\" fill=\"none\" stroke=\"#00A070\" stroke-width=\"1.6\"/>\n  <text x=\"155\" y=\"205\" font-size=\"11\" fill=\"#00A070\">‖·‖₁ (菱)<\/text>\n  <circle cx=\"150\" cy=\"150\" r=\"2.5\" fill=\"#333\"/>\n  <text x=\"150\" y=\"295\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">三个单位球互相包含在常数倍内 ⟹ 三范数等价<\/text>\n<\/svg>\n\n图中三个「单位球」——1-范数的菱形、欧氏的圆、sup 范数的方形——一个套一个,而且彼此都在对方的常数倍以内。**等价范数的几何含义,就是单位球互相「夹得住」**:把一个放大有限倍能包住另一个。\n\n## 等价范数给出相同的收敛\n\n等价为什么要紧?因为**它保证了拓扑概念(邻域、收敛、聚点)不变**。\n\n**命题.** 设 ‖·‖₁ ∼ ‖·‖₂ 是 E 上两个等价范数。则它们给出**相同的邻域**:对每个点 a,「a 的邻域」这个集合在两个范数下完全一样。从而**收敛、聚点等概念在等价范数下不变**。\n\n**证明思路.** 由等价,(1/K)‖·‖₁ ≤ ‖·‖₂ ≤ K‖·‖₁。这意味着一个范数的小球总能塞进另一个范数的球里(半径按 K 缩放):‖·‖₂ 下的球 B₂(a, r) 包含 ‖·‖₁ 下的球 B₁(a, r/K),反之亦然。所以「含某个 ‖·‖₁-球」与「含某个 ‖·‖₂-球」是一回事——<a class=\"wl\" data-id=\"an_spazio_metrico\">邻域<\/a>的集合相同。而<a class=\"wl\" data-id=\"an_convergenza\">收敛<\/a>「xₙ→a ⟺ a 的每个邻域含几乎所有项」只依赖邻域,故收敛性在两范数下一致;聚点同理。∎\n\n一句话:**等价范数是「同一种收敛的不同度量方式」**。换一把等价的范数尺,长度的数值会变,但「谁趋于谁」「哪些点是聚点」这些定性结论丝毫不变。所以在 ℝᵐ 上,谈论收敛时用欧氏、sup 还是 1-范数,**结果完全相同**——可以挑最方便的那个用。(顺带:<a class=\"wl\" data-id=\"alg_complessi\">ℂᵐ<\/a> 与 ℝ²ᵐ 在这个意义下也可认同,谈邻域、收敛时二者无区别。)\n\n## 积空间的收敛：按分量收敛\n\n把上面用到 ℝᵐ 上,得到一个极其实用的结论——它把多维收敛拆成一维收敛。\n\n**定理(按分量收敛).** 设 xₙ = (xₙ¹, …, xₙᵐ) ∈ 𝕂ᵐ。则以下等价:\n\n(i) 序列 (xₙ) 在 𝕂ᵐ 中收敛到 x = (x¹, …, xᵐ);\n\n(ii) **对每个** k ∈ {1,…,m},分量序列 (xₙᵏ) 在 𝕂 中收敛到 xᵏ。\n\n**证明.** 因所有范数等价,用最方便的 **sup 范数** 判收敛。注意\n\n‖xₙ − x‖∞ = max_{1≤k≤m} |xₙᵏ − xᵏ|。\n\n「‖xₙ − x‖∞ → 0」(即 xₙ → x)⟺「max_k |xₙᵏ − xᵏ| → 0」⟺ **每个** |xₙᵏ − xᵏ| → 0(最大值趋零当且仅当每一项都趋零)⟺ 每个分量 xₙᵏ → xᵏ。∎\n\n这条定理把「ℝᵐ(或 ℂᵐ)中向量序列的收敛」**完全化归为各坐标分量的收敛**——多维收敛 = 各分量分别收敛,称**按分量收敛**(componentwise convergence)。它的实用价值极大:研究 ℝᵐ 中的极限,原则上只需研究 ℝ 中的极限,逐坐标处理即可。(<a class=\"wl\" data-id=\"an_succ_complesse\">复数列<\/a>那节对 ℂ = ℝ² 做的「实部虚部分别收敛」,正是这条定理 m=1（ℂ 视作 ℝ²）的特例;现在推广到任意维。)\n\n> 一句提醒:这是把多维**收敛**问题降到一维,但并非说多维分析「不过是一维的堆叠」。许多多维现象(方向、连通、紧性的几何)无法靠逐坐标看清。按分量收敛是个有用的工具,不是说多维分析可被一维取代。\n\n## 一道激活练习\n\n(a) 在 ℝ² 上验证:‖(3, 4)‖ = 5（欧氏）、‖(3,4)‖₁ = 7、‖(3,4)‖∞ = 4。检查命题中的不等式 ‖x‖∞ ≤ ‖x‖ ≤ √2·‖x‖∞ 与 (1/√2)‖x‖₁ ≤ ‖x‖ ≤ ‖x‖₁ 对此 x 成立。\n\n(b) 用按分量收敛判断:𝕂² 中序列 xₙ = (1/n, (1 + 1/n)ⁿ) 是否收敛?若是,极限是什么?\n\n(c) 证明:若 xₙ → x 且 yₙ → y 在 ℝᵐ 中,则 xₙ + yₙ → x + y。(提示:可以用按分量收敛,把它降到 ℝ 中各分量的<a class=\"wl\" data-id=\"an_algebra_limiti\">和的极限<\/a>;或直接用范数三角不等式——两种都行,体会「降维」与「直接」两条路。)\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** ‖(3,4)‖ = √(9+16) = √25 = 5;‖(3,4)‖₁ = 3+4 = 7;‖(3,4)‖∞ = max(3,4) = 4。检查:\n- ‖x‖∞ = 4 ≤ 5 = ‖x‖ ✓;‖x‖ = 5 ≤ √2·4 ≈ 5.66 ✓。\n- (1/√2)·7 ≈ 4.95 ≤ 5 = ‖x‖ ✓;‖x‖ = 5 ≤ 7 = ‖x‖₁ ✓。\n全部成立。\n\n**(b)** 用按分量收敛,逐坐标看:第一分量 1/n → 0（<a class=\"wl\" data-id=\"num_archimede\">阿基米德<\/a>）;第二分量 (1+1/n)ⁿ → e（<a class=\"wl\" data-id=\"an_numero_e\">欧拉数<\/a>）。两个分量都收敛,故 (xₙ) **收敛**,极限 = **(0, e)**。\n\n**(c)** **方法一(降维)**:由按分量收敛,xₙ→x 即每个分量 xₙᵏ→xᵏ,yₙ→y 即 yₙᵏ→yᵏ。则各分量 xₙᵏ+yₙᵏ → xᵏ+yᵏ（ℝ 中<a class=\"wl\" data-id=\"an_algebra_limiti\">和的极限<\/a>）,即 (xₙ+yₙ) 的每个分量收敛到 (x+y) 的对应分量,故 xₙ+yₙ → x+y。\n**方法二(直接)**:‖(xₙ+yₙ)−(x+y)‖ = ‖(xₙ−x)+(yₙ−y)‖ ≤ ‖xₙ−x‖+‖yₙ−y‖（三角不等式）→ 0+0 = 0,故收敛。∎\n\n回顾:(b)(c) 都体现按分量收敛的威力——**多维收敛逐坐标验证即可**,每个坐标用熟悉的一维结论。(c) 的两种方法对照有意思:方法一把问题「降维」到 ℝ、复用一维定理;方法二「直接」用范数的三角不等式(在任何<a class=\"wl\" data-id=\"an_norma\">赋范空间<\/a>通用,不限于 ℝᵐ)。降维法直观、依赖坐标结构;直接法普适、不依赖维数。两条路都通,体现了等价范数带来的灵活性。\n\n## 往前看一步\n\n等价范数与按分量收敛补齐了 ℝᵐ 上的收敛理论:无论用哪把(等价的)范数尺,收敛性一致,而且多维收敛可逐坐标验证。这把欧氏空间的极限理论收拾得干净利落,为多元分析备好了又一块基础。\n\n接下来回到级数,补完<a class=\"wl\" data-id=\"an_convergenza_assoluta\">绝对收敛<\/a>留下的深层主题:**绝对收敛的级数,可以任意重排而和不变**(重排定理),还可以处理**二重级数**(双下标求和)与两个级数的**Cauchy 乘积**。这些都是「绝对收敛」这个性质的深层回报——它让无穷求和获得了有限求和那样的自由(交换、结合、相乘),而条件收敛则没有这种自由。这就是 <a class=\"wl\" data-id=\"an_riordinamenti\">重排、二重级数与 Cauchy 乘积<\/a> 的内容。","refs":"Amann–Escher, Analysis I §II.3"},{"id":"an_numero_e","label":"欧拉数 e","parent":"an_analisi","summary":"数列 (1+1/n)ⁿ 递增（由 Bernoulli 不等式）且有上界 3（由二项式定理），故由单调收敛定理收敛;其极限定义为欧拉数 e，满足 2 < e ≤ 3——一个本质上由极限定义的常数。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#F8799A","ring":6,"bearing":0,"popupLinks":[{"id":"an_monotone","text":"单调收敛定理"},{"id":"alg_binomio","text":"Bernoulli 不等式"},{"id":"num_radici_n","text":"n 次根"},{"id":"an_confronto","text":"夹逼例 2"},{"id":"an_algebra_limiti","text":"积法则"},{"id":"an_cauchy","text":"Cauchy 列与完备性"}],"body":"\n## 一个本质上是极限的常数\n\n<a class=\"wl\" data-id=\"an_monotone\">单调收敛定理<\/a>最著名的用武之地,是给一个数学中无处不在的常数一个严格的出生证明。这个常数就是**欧拉数 e**(自然对数的底,微积分里几乎处处出现),而它的特别之处在于:**e 不是任何简单运算的结果**——它不像 √2 是某个方程的解,也不像 π 最初是几何比值。e 从一开始就**是一个极限**:\n\ne := lim_{n→∞} (1 + 1/n)ⁿ。\n\n但这个定义有个前提——必须先证明这个极限**存在**。而 (1 + 1/n)ⁿ 正是<a class=\"wl\" data-id=\"an_monotone\">上一节<\/a>开头那个「拆不开也夹不住」的数列:运算法则对付不了(项数随 n 变),也找不到现成的夹板。唯一的出路是单调收敛定理。这一节就用它,完成两步——证 (1+1/n)ⁿ **递增**、证它**有上界**——从而保证极限存在,e 由此诞生。\n\n记 eₙ := (1 + 1/n)ⁿ。\n\n## 第一步：(eₙ) 递增\n\n要证 eₙ ≤ eₙ₊₁,看比值 eₙ₊₁/eₙ 是否 ≥ 1。\n\neₙ₊₁/eₙ = (1 + 1/(n+1))^{n+1} / (1 + 1/n)ⁿ。\n\n把两个底数通分整理:1 + 1/(n+1) = (n+2)/(n+1),1 + 1/n = (n+1)/n。代入并把指数拆开(把 (n+1) 次方写成 n 次方乘一次):\n\neₙ₊₁/eₙ = ((n+2)/(n+1))^{n+1} · (n/(n+1))ⁿ = [ (n+2)·n / (n+1)² ]^{n+1} · (n+1)/n。\n\n中括号里 (n+2)n = n²+2n = (n+1)² − 1,所以 (n+2)n/(n+1)² = 1 − 1/(n+1)²。于是\n\neₙ₊₁/eₙ = ( 1 − 1/(n+1)² )^{n+1} · (n+1)/n。\n\n现在对第一个因子用 <a class=\"wl\" data-id=\"alg_binomio\">Bernoulli 不等式<\/a> (1+x)^m ≥ 1 + mx（这里 x = −1/(n+1)² ≥ −1,m = n+1）:\n\n( 1 − 1/(n+1)² )^{n+1} ≥ 1 − (n+1)·1/(n+1)² = 1 − 1/(n+1) = n/(n+1)。\n\n代回:\n\neₙ₊₁/eₙ ≥ [ n/(n+1) ] · [ (n+1)/n ] = 1。\n\n故 eₙ₊₁ ≥ eₙ,数列递增。∎ 注意这一步的关键是把那个看着无从下手的比值,**整理成「1 减一个小量」的幂,再用 Bernoulli 不等式一压**——又一次「展开/放缩成可控的形状」,与<a class=\"wl\" data-id=\"num_radici_n\">n 次根<\/a>、<a class=\"wl\" data-id=\"an_confronto\">夹逼例 2<\/a>里的手法同源。\n\n## 第二步：(eₙ) 有上界 3\n\n用<a class=\"wl\" data-id=\"alg_binomio\">二项式定理<\/a>展开 eₙ：\n\neₙ = (1 + 1/n)ⁿ = Σ_{k=0}^{n} C(n,k)·(1/n)ᵏ = 1 + Σ_{k=1}^{n} C(n,k)/nᵏ。\n\n关键是估计每一项 C(n,k)/nᵏ。把二项式系数写开：\n\nC(n,k)/nᵏ = [n(n−1)(n−2)⋯(n−k+1)] / (k! · nᵏ) = (1/k!)·[ n/n · (n−1)/n · ⋯ · (n−k+1)/n ]。\n\n方括号里是 k 个**不超过 1** 的因子相乘(每个 (n−j)/n ≤ 1),所以整体 ≤ 1/k!。再把阶乘往下压:k! = 1·2·3⋯k ≥ 1·2·2⋯2 = 2^{k−1}(从第二个因子起每个 ≥ 2),故 1/k! ≤ 1/2^{k−1}。合起来：\n\nC(n,k)/nᵏ ≤ 1/k! ≤ 1/2^{k−1}，  1 ≤ k ≤ n。\n\n代回 eₙ 的展开式,并把求和放大成完整的几何级数：\n\neₙ ≤ 1 + Σ_{k=1}^{n} 1/2^{k−1} = 1 + (1 + 1/2 + 1/4 + ⋯ + 1/2^{n−1})。\n\n括号里是公比 1/2 的有限几何和,等于 (1 − (1/2)ⁿ)/(1 − 1/2) = 2(1 − (1/2)ⁿ) < 2。所以\n\neₙ < 1 + 2 = 3，  对一切 n。\n\n数列有上界 3。∎ 这一步把每项用「1/k! ≤ 1/2^{k−1}」换成几何级数的项,是处理「阶乘在分母」的标准放缩——以后讨论 e 的级数、指数函数时还会反复用到。\n\n## e 诞生\n\n两步齐备:(eₙ) 递增、有上界 3。由<a class=\"wl\" data-id=\"an_monotone\">单调收敛定理<\/a>,极限存在。**定义**\n\ne := lim_{n→∞} (1 + 1/n)ⁿ = sup{ eₙ : n ∈ ℕˣ }。\n\n界也立刻有了:e₁ = (1+1)¹ = 2,而数列递增,所以 e ≥ e₂ = (3/2)² = 9/4 = 2.25 > 2;另一方面每项 eₙ < 3,取极限保号(<a class=\"wl\" data-id=\"an_confronto\">序的保持<\/a>)得 e ≤ 3。故\n\n2 < e ≤ 3。\n\n<svg viewBox=\"0 0 440 230\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 3 线(上界) -->\n  <line x1=\"55\" y1=\"40\" x2=\"410\" y2=\"40\" stroke=\"#888\" stroke-width=\"1.1\" stroke-dasharray=\"6,3\"/>\n  <text x=\"414\" y=\"44\" font-size=\"12\" fill=\"#555\">3<\/text>\n  <!-- e 线 -->\n  <line x1=\"55\" y1=\"82\" x2=\"395\" y2=\"82\" stroke=\"#E0612F\" stroke-width=\"1.4\" stroke-dasharray=\"7,3\"/>\n  <text x=\"398\" y=\"86\" font-size=\"12\" fill=\"#E0612F\">e ≈ 2.718<\/text>\n  <!-- 2 线(下界) -->\n  <line x1=\"55\" y1=\"190\" x2=\"410\" y2=\"190\" stroke=\"#888\" stroke-width=\"1.1\" stroke-dasharray=\"6,3\"/>\n  <text x=\"414\" y=\"194\" font-size=\"12\" fill=\"#555\">2<\/text>\n  <!-- e 与 3 之间高亮极限不可达区? 不, 高亮 2..e 爬升 -->\n  <!-- 坐标轴 -->\n  <line x1=\"55\" y1=\"205\" x2=\"425\" y2=\"205\" stroke=\"#bbb\" stroke-width=\"1\"/>\n  <text x=\"420\" y=\"222\" font-size=\"11\" fill=\"#888\">n<\/text>\n  <!-- 数列点 eₙ -->\n  <polyline points=\"67,190 89,152 111,134 133,124 155,117 177,112 199,108 220,105 242,103 264,101 286,99 308,98 330,97\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"1\" opacity=\"0.5\"/>\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"67\" cy=\"190\" r=\"3.2\"/><circle cx=\"89\" cy=\"152\" r=\"3.2\"/><circle cx=\"111\" cy=\"134\" r=\"3.2\"/><circle cx=\"133\" cy=\"124\" r=\"3.2\"/><circle cx=\"155\" cy=\"117\" r=\"3.2\"/><circle cx=\"177\" cy=\"112\" r=\"3.2\"/><circle cx=\"199\" cy=\"108\" r=\"3.2\"/><circle cx=\"220\" cy=\"105\" r=\"3.2\"/><circle cx=\"242\" cy=\"103\" r=\"3.2\"/><circle cx=\"264\" cy=\"101\" r=\"3.2\"/><circle cx=\"286\" cy=\"99\" r=\"3.2\"/><circle cx=\"308\" cy=\"98\" r=\"3.2\"/><circle cx=\"330\" cy=\"97\" r=\"3.2\"/>\n  <\/g>\n  <text x=\"74\" y=\"183\" font-size=\"10\" fill=\"#5A5FE0\">e₁=2<\/text>\n  <text x=\"200\" y=\"222\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">eₙ=(1+1/n)ⁿ 从 2 起单调上升，被 3 封顶，极限是 e<\/text>\n<\/svg>\n\n注意 e 落在 2 与 3 之间,但数列**收敛得很慢**:e₁₀ ≈ 2.594,e₁₀₀ ≈ 2.705,e₁₀₀₀ ≈ 2.717,到 n = 1000 误差还有约 0.0014。e 的精确值是无理数(甚至超越数,但这些性质的证明属于更后面的内容):\n\ne ≈ 2.71828 18284 59045 …\n\n## 一个收敛快得多的表示\n\n(1+1/n)ⁿ 虽然定义了 e,却不适合实际计算 e 的值——太慢。第二步证明里的估计其实暗示了一个收敛快得多的公式。可以证明(留待级数那部分严格展开):\n\ne = lim_{n→∞} Σ_{k=0}^{n} 1/k! = 1 + 1/1! + 1/2! + 1/3! + 1/4! + ⋯\n\n这个级数收敛极快:取到 1/10! 误差就小于百万分之一。它和第二步里「C(n,k)/nᵏ ≤ 1/k!」的估计是同一个 1/k! ——那个上界,正是这个快速级数的项。两个看似不同的 e 的表示,根子上是连着的;它们相等的严格证明,要等无穷级数的工具,这里先记住结论与联系。\n\n## 一道激活练习\n\n(a) 证明 lim_{n→∞} (1 + 1/n)^{n+1} = e。（提示:把它写成 (1+1/n)ⁿ · (1+1/n),两个因子各求极限,用<a class=\"wl\" data-id=\"an_algebra_limiti\">积法则<\/a>;第二个因子 1 + 1/n → 1。）\n\n(b) 证明 lim_{n→∞} (1 − 1/n)ⁿ = 1/e。（提示:(1 − 1/n) = (n−1)/n = 1/(n/(n−1)) = 1/(1 + 1/(n−1))。把整个表达式凑成 1 / (1 + 1/(n−1))ⁿ,再调整指数逼近 e。）\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 直接拆:\n\n(1 + 1/n)^{n+1} = (1 + 1/n)ⁿ · (1 + 1/n)。\n\n第一个因子 → e（e 的定义）;第二个因子 1 + 1/n → 1（1/n → 0 与和法则）。两者都收敛,由<a class=\"wl\" data-id=\"an_algebra_limiti\">积法则<\/a>,极限 = e · 1 = **e**。∎（这也说明 (1+1/n)ⁿ 与 (1+1/n)^{n+1} 同极限——前者递增、后者其实递减,从两侧夹住 e。）\n\n**(b)** 改写底数:1 − 1/n = (n−1)/n,取倒数 = n/(n−1) = 1 + 1/(n−1)。所以\n\n(1 − 1/n)ⁿ = 1 / (1 + 1/(n−1))ⁿ = 1 / [ (1 + 1/(n−1))^{n−1} · (1 + 1/(n−1)) ]。\n\n令 m = n−1（n → ∞ 时 m → ∞）:分母 = (1 + 1/m)^m · (1 + 1/m) → e · 1 = e（前者是 e 的定义,后者 → 1,积法则）。故整个表达式 → 1/e。∎\n\n回顾:这两道题都是「把变体凑回标准的 (1+1/m)^m 形状,再用积法则微调指数」。e 的这类变形(指数加减常数、底数取倒数)在以后处理指数函数、复利、连续增长模型时极常见,核心永远是**还原成定义的标准形式**。\n\n## 往前看一步\n\n我们已经能判定单调有界数列收敛,并由此造出了 e。但单调收敛定理有个局限:它只管**单调**数列。很多重要数列并不单调(比如振荡着衰减的),却明显在「收拢」——项与项之间越来越靠近。能不能不依赖「单调」、也不需要事先知道极限,就判定这种数列收敛?答案是 Cauchy 的一个深刻洞察:**一个数列收敛,当且仅当它的项最终彼此任意接近**(Cauchy 列)。这个判据把「收敛」从「需要一个外部的极限点」改写成「数列内部的自我聚拢」,是完备性的又一个等价面孔,也是分析中判定收敛最通用的工具。这就是 <a class=\"wl\" data-id=\"an_cauchy\">Cauchy 列与完备性<\/a> 的内容。","refs":"Amann–Escher, Analysis I §II.4"},{"id":"an_operazioni_serie_potenze","label":"幂级数的运算与唯一性","parent":"an_analisi","summary":"幂级数可逐项相加、按 Cauchy 乘积相乘,结果仍是幂级数(收敛半径不小于两者较小者)。恒等定理:幂级数若在一列趋于 0 的非零点处全为零,则系数全为零;故幂级数表示唯一,可以「比较系数」。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#FF7B70","ring":11,"bearing":0,"popupLinks":[{"id":"an_serie_potenze","text":"幂级数"},{"id":"an_convergenza_assoluta","text":"绝对收敛"},{"id":"an_riordinamenti","text":"绝对收敛"},{"id":"an_serie","text":"逐项相加"},{"id":"alg_binomio","text":"二项式定理"},{"id":"num_n","text":"良序原理"},{"id":"an_convergenza","text":"数列收敛"},{"id":"an_cauchy","text":"完备性"},{"id":"an_continuita","text":"连续函数"}],"body":"\n## 幂级数能像多项式一样运算吗\n\n<a class=\"wl\" data-id=\"an_serie_potenze\">幂级数<\/a>在收敛圆盘内<a class=\"wl\" data-id=\"an_convergenza_assoluta\">绝对收敛<\/a>——而<a class=\"wl\" data-id=\"an_riordinamenti\">绝对收敛<\/a>那节刚证明,绝对收敛的级数可以自由地相加、相乘。这一节把这份自由用到幂级数上:**两个幂级数可以像多项式那样相加、相乘,结果仍是幂级数**。更进一步,我们将证明一个奠基性的事实——**幂级数的表示是唯一的**:一个函数若能展成幂级数,这个展开式只有一种。这让「比较系数」成为合法的推理手段,是幂级数方法的基石。这两件事合起来,为第二章「收敛」画上句号。\n\n## 加法与乘法\n\n**命题.** 设 a(x) = Σaₖxᵏ、b(x) = Σbₖxᵏ 是两个幂级数,收敛半径分别 ρₐ、ρᵦ。记 ρ := min(ρₐ, ρᵦ)。则对一切 |x| < ρ:\n\n- **加法(逐项相加)**:Σaₖxᵏ + Σbₖxᵏ = Σ(aₖ + bₖ)xᵏ;\n- **乘法(Cauchy 乘积/卷积)**:(Σaₖxᵏ)·(Σbₖxᵏ) = Σ_{k}(Σ_{j=0}^{k} aⱼb_{k−j})xᵏ。\n\n且 a+b 与 a·b 的收敛半径都 **≥ ρ**(即在两者公共的收敛圆盘内,运算结果仍是收敛的幂级数)。\n\n**证明.** 在 |x| < ρ 处,两个幂级数都绝对收敛。加法是收敛级数的<a class=\"wl\" data-id=\"an_serie\">逐项相加<\/a>(运算法则);乘法正是两个绝对收敛级数的 <a class=\"wl\" data-id=\"an_riordinamenti\">Cauchy 乘积<\/a>——其第 k 项对角线和是 Σ_{j=0}^{k} aⱼ·b_{k−j},而 (aⱼxʲ)(b_{k−j}x^{k−j}) = aⱼb_{k−j}xᵏ,提出 xᵏ 得系数 Σ_{j=0}^{k}aⱼb_{k−j}。Cauchy 乘积定理保证它绝对收敛到积。∎\n\n注意乘法的系数 cₖ = Σ_{j=0}^{k} aⱼb_{k−j} ——这正是多项式相乘时「同次项系数」的算法(**卷积**):x⁰ 系数是 a₀b₀,x¹ 系数是 a₀b₁+a₁b₀,x² 系数是 a₀b₂+a₁b₁+a₂b₀,…… **幂级数相乘,系数按卷积合成,和有限多项式完全一样**——只是现在有无穷多项,靠绝对收敛保证合法。\n\n> 收敛半径**可能变大**(故写 ≥ 而非 =):例如两个幂级数相加,主导项可能抵消,使和的收敛半径超过 min(ρₐ,ρᵦ)。但「至少在公共圆盘 |x|<ρ 内收敛」总成立,这已足够用。\n\n**例(指数律的伏笔).** <a class=\"wl\" data-id=\"an_serie_potenze\">exp(x) = Σxᵏ/k!<\/a>。算 exp(x)·exp(y)（把 y 看成参数,或在形式幂级数层面）的 Cauchy 乘积,第 n 项系数整理后恰是 (x+y)ⁿ/n!（用<a class=\"wl\" data-id=\"alg_binomio\">二项式定理<\/a>:Σ_{k=0}^n (xᵏ/k!)(y^{n−k}/(n−k)!) = (1/n!)Σ C(n,k)xᵏy^{n−k} = (x+y)ⁿ/n!）。于是\n\nexp(x)·exp(y) = Σ (x+y)ⁿ/n! = exp(x+y)。\n\n**指数律 exp(x)exp(y) = exp(x+y) 就此由 Cauchy 乘积严格证出**——这是幂级数相乘最漂亮的一个应用,也兑现了<a class=\"wl\" data-id=\"an_riordinamenti\">Cauchy 乘积<\/a>那节埋的伏笔。\n\n## 表示的唯一性：恒等定理\n\n现在是第二章的压轴结果。它回答一个根本问题:**一个函数的幂级数展开,会不会有两种不同的写法?** 答案是否定的——展开唯一。这要从一个看似很强、实则深刻的引理开始。\n\n**定理(幂级数的零点引理).** 设 Σaₖxᵏ 的收敛半径 ρ > 0。若存在一列**非零**的点 yⱼ,满足 yⱼ → 0(且 0 < |yⱼ| < ρ),使得\n\na(yⱼ) = Σ_{k=0}^{∞} aₖ yⱼᵏ = 0  对**所有** j，\n\n则**所有系数 aₖ = 0**（即 a 是零幂级数）。\n\n<svg viewBox=\"0 0 440 120\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"55\" y1=\"70\" x2=\"410\" y2=\"70\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <path d=\"M 410 70 L 402 66 L 402 74 z\" fill=\"#888\"/>\n  <!-- 原点 -->\n  <line x1=\"90\" y1=\"60\" x2=\"90\" y2=\"80\" stroke=\"#E0612F\" stroke-width=\"1.5\"/>\n  <text x=\"90\" y=\"96\" font-size=\"11\" text-anchor=\"middle\" fill=\"#E0612F\">0<\/text>\n  <!-- yⱼ 点列, 趋于 0 -->\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"278\" cy=\"70\" r=\"3.5\"/><circle cx=\"196\" cy=\"70\" r=\"3.5\"/><circle cx=\"164\" cy=\"70\" r=\"3.5\"/><circle cx=\"147\" cy=\"70\" r=\"3.5\"/><circle cx=\"136\" cy=\"70\" r=\"3.5\"/><circle cx=\"129\" cy=\"70\" r=\"3\"/><circle cx=\"124\" cy=\"70\" r=\"2.5\"/><circle cx=\"120\" cy=\"70\" r=\"2\"/><circle cx=\"117\" cy=\"70\" r=\"1.6\"/>\n  <\/g>\n  <text x=\"278\" y=\"58\" font-size=\"10\" fill=\"#5A5FE0\">y₀<\/text>\n  <text x=\"196\" y=\"58\" font-size=\"10\" fill=\"#5A5FE0\">y₁<\/text>\n  <text x=\"160\" y=\"58\" font-size=\"10\" fill=\"#5A5FE0\">y₂<\/text>\n  <text x=\"135\" y=\"92\" font-size=\"9\" fill=\"#5A5FE0\">yⱼ → 0<\/text>\n  <text x=\"320\" y=\"58\" font-size=\"10\" fill=\"#777\">在每个 yⱼ 处 a(yⱼ)=0<\/text>\n  <text x=\"200\" y=\"112\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">零点在原点处堆积 ⟹ 所有系数为零<\/text>\n<\/svg>\n\n**证明.** 反设系数不全为零。由<a class=\"wl\" data-id=\"num_n\">良序原理<\/a>,存在**最小**的下标 n₀ 使 a_{n₀} ≠ 0。把级数从第 n₀ 项拆开:a(x) = a_{n₀}x^{n₀} + Σ_{k>n₀} aₖxᵏ。关键是估计后面那个尾巴。\n\n**尾部估计**:固定 r ∈ (0, ρ)。由绝对收敛,对 |x| ≤ r,\n\n|Σ_{k≥n} aₖxᵏ| ≤ Σ_{k≥n}|aₖ||x|ᵏ = |x|ⁿ·Σ_{k≥n}|aₖ||x|^{k−n} ≤ |x|ⁿ·(Σ_{j≥0}|a_{j+n}|rʲ)。\n\n记 C := Σ_{j≥0}|a_{j+n₀+1}|rʲ < ∞(绝对收敛保证有限),则尾巴 |Σ_{k>n₀}aₖxᵏ| ≤ C·|x|^{n₀+1}。所以\n\n|a(x) − a_{n₀}x^{n₀}| ≤ C|x|^{n₀+1}，  |x| ≤ r。\n\n把 x = yⱼ 代入。因 a(yⱼ) = 0,左边 = |a_{n₀}yⱼ^{n₀}| = |a_{n₀}||yⱼ|^{n₀};右边 = C|yⱼ|^{n₀+1}。两边除以 |yⱼ|^{n₀}（yⱼ ≠ 0）:\n\n|a_{n₀}| ≤ C·|yⱼ|，  对所有 j。\n\n但 yⱼ → 0,令 j → ∞ 得 |a_{n₀}| ≤ 0,即 **a_{n₀} = 0**——与「a_{n₀} ≠ 0」矛盾。故系数全为零。∎\n\n证明的精髓:**最低次的非零系数 a_{n₀} 主导了原点附近的行为**(其它项是更高次的、更小的)。若函数在一列逼近 0 的点上全为零,这个主导项被迫为零——一个漂亮的「用最低次项卡住」的论证。\n\n由这个引理,立刻得到唯一性:\n\n**定理(恒等定理 identity theorem).** 设 a(x) = Σaₖxᵏ、b(x) = Σbₖxᵏ 收敛半径都 > 0。若存在一列非零点 yⱼ → 0,使 a(yⱼ) = b(yⱼ) 对所有 j,则 **aₖ = bₖ 对所有 k**(两幂级数逐项相同)。\n\n**证明.** 考虑差 a − b = Σ(aₖ−bₖ)xᵏ。它在所有 yⱼ 处为零(因 a(yⱼ)=b(yⱼ)),由零点引理,所有系数 aₖ−bₖ = 0,即 aₖ = bₖ。∎\n\n## 唯一性意味着什么：可以比较系数\n\n恒等定理的推论极其重要:\n\n**幂级数表示唯一.** 若一个函数 f 在原点附近能写成幂级数 f(x) = Σaₖxᵏ,则这个幂级数是**唯一**的——系数 aₖ 被 f 完全确定。(因为「在原点附近相等」尤其意味着「在某列 yⱼ→0 上相等」,恒等定理即给出系数唯一。)\n\n这条「唯一性」让一个常用手段变得合法——**比较系数**(comparison of coefficients):若两个幂级数表示同一个函数(在原点邻域),就可以逐项令它们的系数相等。这是幂级数方法的核心技巧:\n\n- 解微分方程时,设解为幂级数 Σaₖxᵏ,代入方程,**比较两边同次幂的系数**,得到 aₖ 的递推关系——合法性正来自唯一性。\n- 证恒等式(如三角恒等式、组合恒等式)时,把两边展成幂级数,**系数对应相等**即证。\n- 求一个函数的幂级数展开时,不必担心「会不会有别的展开」——唯一性保证算出的就是那一个。\n\n没有恒等定理,「比较系数」只是一厢情愿;有了它,这成了严格的推理。**唯一性是幂级数从「形式工具」升格为「严格方法」的关键。**\n\n> 一个**重要的前提不能省**:零点 yⱼ 必须**趋于 0**(在原点堆积)。仅仅「有无穷多个零点」不够——存在非零的幂级数(如以后会遇到的 sin),它有无穷多个零点(0, ±π, ±2π, …),但这些零点**不**在原点堆积(彼此隔开),所以不与恒等定理矛盾。零点在某点的「堆积」才是迫使系数全零的关键。\n\n## 一道激活练习\n\n(a) 用 Cauchy 乘积求 (Σ_{k=0}^∞ xᵏ)·(Σ_{k=0}^∞ xᵏ) 的幂级数(|x|<1),即算乘积的系数 cₖ。(提示:aⱼ=bⱼ=1,cₖ=Σ_{j=0}^k aⱼb_{k−j}。)\n\n(b) 已知 1/(1−x) = Σxᵏ(|x|<1)。利用幂级数唯一性(比较系数)求满足 (1−x)·f(x) = 1 的幂级数 f(x) = Σaₖxᵏ。(提示:把 (1−x)Σaₖxᵏ 展开,令其等于常数 1=1+0·x+0·x²+…,逐项比较系数解出 aₖ。)\n\n(c) 设幂级数 f(x) = Σaₖxᵏ 满足 f(x) = f(−x) 对原点附近所有 x（偶函数）。用恒等定理证明:所有奇数次系数为零(a₁=a₃=a₅=⋯=0)。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** cₖ = Σ_{j=0}^{k} 1·1 = k+1（k+1 个 1 相加）。故 (Σxᵏ)² = Σ_{k=0}^∞ (k+1)xᵏ = 1 + 2x + 3x² + 4x³ + ⋯。∎（与<a class=\"wl\" data-id=\"an_riordinamenti\">上节练习<\/a>一致;也即 1/(1−x)² = Σ(k+1)xᵏ。）\n\n**(b)** 展开 (1−x)Σaₖxᵏ = Σaₖxᵏ − Σaₖx^{k+1}。第二个和换指标(令 k+1=m）= Σ_{m≥1}a_{m−1}xᵐ。合并同次幂:常数项 a₀;xᵏ 项（k≥1）系数 aₖ − a_{k−1}。令整体 = 1 = 1 + 0·x + 0·x² + ⋯,**比较系数**:\n\nx⁰: a₀ = 1;  xᵏ (k≥1): aₖ − a_{k−1} = 0,即 aₖ = a_{k−1}。\n\n由 a₀=1 递推得 aₖ = 1 对所有 k。故 f(x) = Σxᵏ = 1/(1−x)——印证了 f = 1/(1−x) 确实是 (1−x)f=1 的解,且唯一性保证这是唯一的幂级数解。∎\n\n**(c)** f(x) = Σaₖxᵏ,而 f(−x) = Σaₖ(−x)ᵏ = Σ(−1)ᵏaₖxᵏ。条件 f(x) = f(−x) 对原点附近所有 x 成立,尤其在某列 yⱼ→0 上成立。由**恒等定理**,两个幂级数 Σaₖxᵏ 与 Σ(−1)ᵏaₖxᵏ 系数对应相等:\n\naₖ = (−1)ᵏaₖ,  对所有 k。\n\n当 k 为奇数,(−1)ᵏ = −1,得 aₖ = −aₖ,即 2aₖ = 0,故 aₖ = 0。所以所有奇数次系数为零。∎（偶函数的幂级数只含偶次幂——这与直觉一致,而恒等定理把它变成了严格结论。对称地,奇函数只含奇次幂。）\n\n回顾:这三题展示幂级数运算与唯一性的典型用法。(a) 是 Cauchy 乘积的直接计算(卷积系数)。(b)(c) 都用「**比较系数**」——其合法性正是恒等定理:(b) 通过令两边同次系数相等解出未知幂级数(幂级数解微分方程/函数方程的雏形);(c) 用对称性 + 恒等定理推出系数的奇偶结构。比较系数是幂级数方法的招牌动作,而它每一次使用,背后都站着唯一性定理。\n\n## 第二章收官\n\n到这里,A–E 第二章「收敛」全部学完。回望整章的拱顶:从<a class=\"wl\" data-id=\"an_convergenza\">数列收敛<\/a>的 ε–N 定义出发,经<a class=\"wl\" data-id=\"an_cauchy\">完备性<\/a>(ℝ 的根本性质)、<a class=\"wl\" data-id=\"an_serie\">级数<\/a>与<a class=\"wl\" data-id=\"an_convergenza_assoluta\">判别法<\/a>,抵达<a class=\"wl\" data-id=\"an_serie_potenze\">幂级数<\/a>——而幂级数现在不仅有<a class=\"wl\" data-id=\"an_serie_potenze\">收敛半径<\/a>、能<a class=\"wl\" data-id=\"an_riordinamenti\">相乘<\/a>,还有了唯一的表示。「逼近」与「无限求和」的理论完整而严密。\n\n但幂级数目前仍是「静态」的:我们能谈它在一点收敛到什么,却还不能对它做**微积分**——求导、积分。要让幂级数真正成为分析的利器(逐项求导得 exp'=exp、sin'=cos),必须先建立**函数的连续性与可微性**。这正是第三章的主题。\n\n第三章从**连续函数**开始:函数的极限(ε–δ 语言)、连续的定义、连续函数的运算与基本定理(介值定理、最值定理)。连续性是「函数」这一对象的第一个分析性质,也是通向**导数**的必经之路——而导数,正是你那条暂停的物理线等待已久的汇合点。数列收敛的理论已经备齐了一切工具(尤其<a class=\"wl\" data-id=\"an_convergenza\">序列收敛<\/a>与<a class=\"wl\" data-id=\"an_cauchy\">完备性<\/a>),连续性的大门就此打开。这是 <a class=\"wl\" data-id=\"an_continuita\">连续函数<\/a> 的起点,也是第三章的开篇。","refs":"Amann–Escher, Analysis I §II.9"},{"id":"an_prodotto_interno","label":"内积与欧氏空间","parent":"an_analisi","summary":"内积 ⟨x,y⟩ 给向量空间装上「角度」,由它定义长度 ‖x‖=√⟨x,x⟩;Cauchy–Schwarz 不等式 |⟨x,y⟩|≤‖x‖‖y‖ 保证这个范数满足三角不等式。于是欧氏空间 ℝⁿ 配点积成为完整的度量空间——多元分析的舞台终于就位。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#C58AED","ring":3,"bearing":1,"popupLinks":[{"id":"an_norma","text":"范数"},{"id":"an_spazio_metrico","text":"度量空间"},{"id":"alg_spazio_vettoriale","text":"向量空间"},{"id":"alg_span_indipendenza","text":"线性相关"},{"id":"an_convergenza","text":"收敛"},{"id":"an_cauchy","text":"完备性"},{"id":"an_bolzano_weierstrass","text":"Bolzano–Weierstrass"},{"id":"alg_base_dimensione","text":"基与维数"},{"id":"an_prodotto_interno","text":"内积"}],"body":"\n## 补上「角度」\n\n<a class=\"wl\" data-id=\"an_norma\">范数<\/a>给了向量「长度」,赋范空间因此成为<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>。但范数只管长度,**还没有角度**——我们仍不能说「两个向量垂直」「它们夹角多少」。而几何里的垂直、投影、勾股定理,全离不开角度。补上角度的,是一个比范数更强的结构:**内积**。\n\n这一节是分析主干一条长线的终点:从<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>那节起,我们就一直把欧氏 ℝⁿ「留待内积那节」。原因现在清楚了——ℝⁿ 的欧氏距离 ‖x−y‖ = √(Σ(xᵢ−yᵢ)²) 要成为度量,核心难点是它的范数满足**三角不等式**,而这要靠内积的一条关键不等式(Cauchy–Schwarz)才能证。本节就闭合这条链:**内积 → 范数 → 度量**,欧氏 ℝⁿ 终于落地。\n\n为清晰,主要讲**实数情形** 𝕂 = ℝ(此时内积对称、无复共轭);复数情形 𝕂 = ℂ 只需在对称性里加一个共轭,要点完全一样,末尾点明。\n\n## 定义\n\n设 E 是 𝕂 上的<a class=\"wl\" data-id=\"alg_spazio_vettoriale\">向量空间<\/a>。函数 ⟨·,·⟩ : E × E → 𝕂 称 E 上的一个**内积**(inner product / scalar product)，若满足(实情形,x, y, z ∈ E,λ, μ ∈ ℝ):\n\n- **(SP1)** 对称:⟨x, y⟩ = ⟨y, x⟩；\n- **(SP2)** 对第一个变元线性:⟨λx + μy, z⟩ = λ⟨x, z⟩ + μ⟨y, z⟩；\n- **(SP3)** 正定:⟨x, x⟩ ≥ 0,且 ⟨x, x⟩ = 0 ⟺ x = 0。\n\n配了内积的向量空间 (E, ⟨·,·⟩) 称**内积空间**(inner product space)。\n\n(由 (SP1) 对称 + (SP2),内积对**第二个**变元也线性——所以实内积是「双线性 + 对称 + 正定」。复情形里 (SP1) 改为 ⟨x,y⟩ = 共轭⟨y,x⟩,于是第二变元是「共轭线性」,称「半双线性 Hermite 型」;ℝ 上共轭是恒等,退化回双线性。)\n\n**最重要的例子:𝕂ⁿ 上的欧氏内积(点积).** 对 x = (x₁,…,xₙ), y = (y₁,…,yₙ),定义\n\n⟨x, y⟩ := Σ_{j=1}^{n} xⱼyⱼ = x₁y₁ + ⋯ + xₙyₙ。\n\n（实情形;复情形第二项取共轭 xⱼ·共轭yⱼ。）逐条验证它满足 (SP1)–(SP3)（对称显然;线性来自分配律;正定因 ⟨x,x⟩ = Σxⱼ² 是平方和,非负且为零当且仅当各 xⱼ=0）——这就是中学点积的严格版,称 𝕂ⁿ 上的**欧氏内积**。\n\n## Cauchy–Schwarz 不等式\n\n内积空间最有用的定理,也是闭合「内积→范数」那一环的钥匙。\n\n**定理(Cauchy–Schwarz).** 设 (E, ⟨·,·⟩) 是内积空间。则对一切 x, y ∈ E:\n\n|⟨x, y⟩|² ≤ ⟨x, x⟩·⟨y, y⟩，\n\n且等号成立 ⟺ x 与 y <a class=\"wl\" data-id=\"alg_span_indipendenza\">线性相关<\/a>。\n\n**证明（实情形）.** y = 0 时两边都是 0,成立。设 y ≠ 0。**核心技巧:利用正定性 ⟨v, v⟩ ≥ 0,然后挑一个最优的 α 把不等式榨到最紧。** 对任意 α ∈ ℝ,由 (SP3):\n\n0 ≤ ⟨x − αy, x − αy⟩ = ⟨x,x⟩ − 2α⟨x,y⟩ + α²⟨y,y⟩。\n\n(展开用了双线性与对称。)右边是关于 α 的二次式,对**一切** α 非负。要它最紧,取使右边最小的 α——配方或求导知最小点在 α = ⟨x,y⟩/⟨y,y⟩。代入:\n\n0 ≤ ⟨x,x⟩ − 2·(⟨x,y⟩/⟨y,y⟩)·⟨x,y⟩ + (⟨x,y⟩/⟨y,y⟩)²·⟨y,y⟩ = ⟨x,x⟩ − ⟨x,y⟩²/⟨y,y⟩。\n\n两边乘 ⟨y,y⟩ > 0,移项:⟨x,y⟩² ≤ ⟨x,x⟩⟨y,y⟩,即所证。**等号**当且仅当上面第一行的 ⟨x−αy, x−αy⟩ = 0,由 (SP3) 即 x − αy = 0,即 x = αy——x, y 线性相关。∎\n\n这个「考虑 ⟨x−αy, x−αy⟩ ≥ 0、再选最优 α」的手法极其典型——把一个不等式问题,转化成「一个二次式恒非负」,再用判别式/配方榨出结论。\n\n**写成长度的形式**(用下面就要定义的 ‖x‖ = √⟨x,x⟩),Cauchy–Schwarz 是:\n\n|⟨x, y⟩| ≤ ‖x‖·‖y‖。\n\n在 ℝⁿ 上展开,这就是经典的 **|Σxⱼyⱼ| ≤ √(Σxⱼ²)·√(Σyⱼ²)**——一个纯粹关于实数的、非平凡的不等式,却由内积的三条公理一举证得。\n\n## 内积诱导范数：链条闭合\n\n现在用内积定义长度,并证明它真是范数——三角不等式那一步,正是 Cauchy–Schwarz 的用武之地。\n\n**定理.** 设 (E, ⟨·,·⟩) 是内积空间。则\n\n‖x‖ := √⟨x, x⟩\n\n是 E 上的一个<a class=\"wl\" data-id=\"an_norma\">范数<\/a>（称内积**诱导的范数**）。\n\n**证明.** 根号有意义,因 (SP3) 保证 ⟨x,x⟩ ≥ 0。验<a class=\"wl\" data-id=\"an_norma\">范数三公理<\/a>:\n- **(N1)** ‖x‖ = 0 ⟺ ⟨x,x⟩ = 0 ⟺ x = 0（由 (SP3)）。✓\n- **(N2)** ‖λx‖ = √⟨λx,λx⟩ = √(λ²⟨x,x⟩) = |λ|√⟨x,x⟩ = |λ|·‖x‖（双线性提出 λ²，开方得 |λ|）。✓\n- **(N3) 三角不等式**——这里用 Cauchy–Schwarz:\n\n  ‖x + y‖² = ⟨x+y, x+y⟩ = ⟨x,x⟩ + 2⟨x,y⟩ + ⟨y,y⟩ = ‖x‖² + 2⟨x,y⟩ + ‖y‖²\n\n  ≤ ‖x‖² + 2|⟨x,y⟩| + ‖y‖² ≤ ‖x‖² + 2‖x‖‖y‖ + ‖y‖²（末步用 Cauchy–Schwarz |⟨x,y⟩| ≤ ‖x‖‖y‖）\n\n  = (‖x‖ + ‖y‖)²。\n\n  两边开方:‖x + y‖ ≤ ‖x‖ + ‖y‖。✓\n\n三条齐备,‖·‖ 是范数。∎\n\n**链条至此闭合:内积 →（√⟨x,x⟩）→ 范数 →（‖x−y‖）→ 度量。** 每个内积空间自动是赋范空间,从而自动是<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>——收敛、Cauchy、完备的全套理论一并继承。而三角不等式这块「拦路石」,由 Cauchy–Schwarz 搬开。\n\n## 欧氏空间 ℝⁿ 落地\n\n把上面用在最重要的例子上。\n\n**定义(欧氏空间).** 𝕂ⁿ 配上欧氏内积 ⟨x,y⟩ = Σxⱼyⱼ,及其诱导范数\n\n‖x‖ := √⟨x,x⟩ = √(Σ_{j=1}^{n} xⱼ²)，\n\n称 **n 维欧氏空间**(Euclidean space)。‖x‖ 称**欧氏范数**,它正是「勾股定理给出的长度」——各坐标平方和再开方。诱导的度量\n\nd(x, y) = ‖x − y‖ = √(Σ_{j=1}^{n} (xⱼ − yⱼ)²)\n\n就是 ℝⁿ 上的**欧氏距离**——两点间的直线距离。\n\n<svg viewBox=\"0 0 440 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 左: 长度=勾股 -->\n  <text x=\"100\" y=\"24\" font-size=\"11\" text-anchor=\"middle\" fill=\"#555\">‖x‖ = √(3²+2²) = √13<\/text>\n  <line x1=\"40\" y1=\"160\" x2=\"170\" y2=\"160\" stroke=\"#ccc\" stroke-width=\"0.8\"/>\n  <line x1=\"60\" y1=\"60\" x2=\"60\" y2=\"180\" stroke=\"#ccc\" stroke-width=\"0.8\"/>\n  <!-- 直角三角形 -->\n  <line x1=\"60\" y1=\"160\" x2=\"144\" y2=\"160\" stroke=\"#999\" stroke-width=\"1.3\"/>\n  <line x1=\"144\" y1=\"160\" x2=\"144\" y2=\"104\" stroke=\"#999\" stroke-width=\"1.3\"/>\n  <path d=\"M 144 160 L 136 160 L 136 152 L 144 152\" fill=\"none\" stroke=\"#999\" stroke-width=\"0.8\"/>\n  <line x1=\"60\" y1=\"160\" x2=\"144\" y2=\"104\" stroke=\"#E0612F\" stroke-width=\"2\" marker-end=\"url(#ap)\"/>\n  <text x=\"148\" y=\"100\" font-size=\"11\" fill=\"#E0612F\">x=(3,2)<\/text>\n  <text x=\"100\" y=\"174\" font-size=\"9\" fill=\"#777\">3<\/text>\n  <text x=\"150\" y=\"135\" font-size=\"9\" fill=\"#777\">2<\/text>\n  <text x=\"90\" y=\"125\" font-size=\"10\" fill=\"#E0612F\">√13<\/text>\n  <circle cx=\"60\" cy=\"160\" r=\"2.5\" fill=\"#333\"/>\n  <!-- 右: 夹角 + 正交 -->\n  <text x=\"320\" y=\"24\" font-size=\"11\" text-anchor=\"middle\" fill=\"#555\">夹角与正交<\/text>\n  <!-- 夹角 u,v -->\n  <line x1=\"300\" y1=\"140\" x2=\"358\" y2=\"122\" stroke=\"#5A5FE0\" stroke-width=\"2\" marker-end=\"url(#ap)\"/>\n  <line x1=\"300\" y1=\"140\" x2=\"322\" y2=\"90\" stroke=\"#00A070\" stroke-width=\"2\" marker-end=\"url(#ap)\"/>\n  <path d=\"M 330 131 A 32 32 0 0 0 315 116\" fill=\"none\" stroke=\"#777\" stroke-width=\"1\"/>\n  <text x=\"334\" y=\"120\" font-size=\"10\" fill=\"#777\">θ<\/text>\n  <text x=\"360\" y=\"121\" font-size=\"10\" fill=\"#5A5FE0\">u<\/text>\n  <text x=\"324\" y=\"88\" font-size=\"10\" fill=\"#00A070\">v<\/text>\n  <text x=\"296\" y=\"170\" font-size=\"9\" fill=\"#777\">cos θ = ⟨u,v⟩ / (‖u‖‖v‖)<\/text>\n  <circle cx=\"300\" cy=\"140\" r=\"2.5\" fill=\"#333\"/>\n  <defs>\n    <marker id=\"ap\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"context-stroke\"/><\/marker>\n  <\/defs>\n<\/svg>\n\n这就是分析主干一直缺的那块拼图:**ℝⁿ 现在是一个货真价实的<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>**,其上<a class=\"wl\" data-id=\"an_convergenza\">收敛<\/a>、<a class=\"wl\" data-id=\"an_cauchy\">完备性<\/a>、<a class=\"wl\" data-id=\"an_bolzano_weierstrass\">Bolzano–Weierstrass<\/a> 全部适用(且可证 ℝⁿ 完备,是有限维<a class=\"wl\" data-id=\"an_cauchy\">Banach 空间<\/a>)。多元微积分——多元函数的极限、连续、偏导、重积分——就在这个空间上展开。\n\n## 角度与正交\n\n内积比范数多给的,正是**角度**。由 Cauchy–Schwarz,对非零 x, y 有 −1 ≤ ⟨x,y⟩/(‖x‖‖y‖) ≤ 1,所以可以**定义**两向量的夹角 θ ∈ [0, π] 为\n\ncos θ := ⟨x, y⟩ / (‖x‖·‖y‖)。\n\n(Cauchy–Schwarz 保证了右边落在 [−1,1] 内,cos⁻¹ 才有意义——这是「角度能被定义」的前提。)特别地:\n\n**定义(正交).** x 与 y **正交**(orthogonal)，记 x ⊥ y，若 ⟨x, y⟩ = 0（夹角 θ = π/2，即垂直）。\n\n正交是欧氏几何的核心关系。一个立竿见影的收获是**勾股定理**:若 x ⊥ y,则\n\n‖x + y‖² = ‖x‖² + 2⟨x,y⟩ + ‖y‖² = ‖x‖² + ‖y‖²\n\n（中间项 ⟨x,y⟩ = 0 消失）——直角三角形斜边平方等于两直角边平方和。中学的勾股定理,在这里成了内积语言下的一行计算。正交、投影、正交基这些概念,是线性代数后续(谱定理)与分析(傅里叶级数)的基石,这里先立住「正交 = 内积为零」这个定义。\n\n## 一道激活练习\n\n(a) 在 ℝ³ 中设 x = (1, 2, 2),y = (2, −1, 2)。计算 ⟨x,y⟩、‖x‖、‖y‖,判断 x 与 y 是否正交,并验证 Cauchy–Schwarz |⟨x,y⟩| ≤ ‖x‖‖y‖。\n\n(b) 证明**平行四边形恒等式**:在任意内积空间中,\n\n‖x + y‖² + ‖x − y‖² = 2‖x‖² + 2‖y‖²。\n\n(提示:把两个范数平方都用内积展开 ⟨x±y, x±y⟩,相加。)\n\n(c) 用 Cauchy–Schwarz 证明:对任意实数 a₁,…,aₙ,有 (a₁ + ⋯ + aₙ)² ≤ n(a₁² + ⋯ + aₙ²)。(提示:在 ℝⁿ 中取 x = (a₁,…,aₙ)、y = (1,1,…,1),套用 |⟨x,y⟩| ≤ ‖x‖‖y‖ 并平方。)\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** ⟨x,y⟩ = 1·2 + 2·(−1) + 2·2 = 2 − 2 + 4 = **4**。‖x‖ = √(1+4+4) = √9 = **3**。‖y‖ = √(4+1+4) = √9 = **3**。因 ⟨x,y⟩ = 4 ≠ 0,**x 与 y 不正交**。Cauchy–Schwarz:|⟨x,y⟩| = 4,‖x‖‖y‖ = 9,确有 4 ≤ 9。✓\n\n**(b)** 展开两项:\n\n‖x+y‖² = ⟨x+y,x+y⟩ = ‖x‖² + 2⟨x,y⟩ + ‖y‖²，\n‖x−y‖² = ⟨x−y,x−y⟩ = ‖x‖² − 2⟨x,y⟩ + ‖y‖²。\n\n相加,交叉项 ±2⟨x,y⟩ 抵消:‖x+y‖² + ‖x−y‖² = 2‖x‖² + 2‖y‖²。∎（几何意义:平行四边形两条对角线的平方和 = 四条边的平方和。这个恒等式还能反过来刻画「哪些范数来自内积」——满足它的范数才是 Hilbert 范数,是泛函分析的一个判据。）\n\n**(c)** 在 ℝⁿ 取 x = (a₁,…,aₙ)、y = (1,…,1)。则 ⟨x,y⟩ = Σaⱼ·1 = a₁+⋯+aₙ;‖x‖ = √(Σaⱼ²);‖y‖ = √(Σ1²) = √n。由 Cauchy–Schwarz |⟨x,y⟩| ≤ ‖x‖‖y‖,两边平方:\n\n(a₁+⋯+aₙ)² ≤ (Σaⱼ²)·n = n(a₁²+⋯+aₙ²)。∎\n\n回顾:(c) 是 Cauchy–Schwarz 「造不等式」的典型用法——**把目标不等式的两边,凑成两个向量的内积与范数,再套 |⟨x,y⟩|≤‖x‖‖y‖**。取 y = (1,…,1) 是常用技巧,能把「和的平方」与「平方的和」联系起来(这也证明了算术-平方关系)。Cauchy–Schwarz 是分析中产生不等式的一台「母机」,以后(积分不等式、概率里的相关系数)会反复见到它的身影。\n\n## 多元分析前置就位\n\n到这里,分析主干一直推迟的欧氏 ℝⁿ 彻底落地:它是配了欧氏内积的内积空间,诱导出欧氏范数与欧氏距离,成为一个完整的<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>(且完备)。**多元分析的舞台就此搭好。**\n\n回望这条线的完整逻辑:<a class=\"wl\" data-id=\"alg_spazio_vettoriale\">向量空间<\/a>给了「能加能伸缩」的代数骨架,<a class=\"wl\" data-id=\"alg_base_dimensione\">基与维数<\/a>给了「坐标」与「大小」,<a class=\"wl\" data-id=\"an_norma\">范数<\/a>装上「长度」、把空间变成度量空间,本节的<a class=\"wl\" data-id=\"an_prodotto_interno\">内积<\/a>再装上「角度」、并用 Cauchy–Schwarz 落实欧氏 ℝⁿ。代数与分析两条主干,在欧氏空间这里交汇——这正是从一元分析迈向多元分析的门槛。门槛跨过,接下来就是 ℝⁿ 上的函数:多元函数的极限与连续、偏导数与全微分、多重积分——以及它们与你那条物理线真正汇合的地方。","refs":"Amann–Escher, Analysis I §II.3"},{"id":"an_riordinamenti","label":"重排、二重级数与 Cauchy 乘积","parent":"an_analisi","summary":"绝对收敛的级数可任意重排而和不变(条件收敛则不能——重排能改变其和,甚至 Riemann 定理任意指定);二重级数在可和时与求和次序无关;两个绝对收敛级数的 Cauchy 乘积(对角线求和)收敛到积。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#FE7A75","ring":10,"bearing":1,"popupLinks":[{"id":"an_convergenza_assoluta","text":"绝对收敛"},{"id":"an_numero_e","text":"单调数列"},{"id":"fond_funzioni","text":"双射/置换"},{"id":"an_serie","text":"Cauchy 判据"},{"id":"fond_cardinalita","text":"ℕ×ℕ 可数"},{"id":"an_serie_potenze","text":"exp(x) = Σxᵏ/k!"},{"id":"an_operazioni_serie_potenze","text":"幂级数的运算与唯一性"}],"body":"\n## 绝对收敛的深层回报\n\n<a class=\"wl\" data-id=\"an_convergenza_assoluta\">绝对收敛<\/a>比普通收敛「强」,强在哪里?这一节给出三个深刻的回报——**重排自由、求和次序无关、级数可相乘**。它们共同的主题是:**绝对收敛让无穷求和获得了有限求和那样的自由**(可以随意交换次序、可以像多项式那样相乘),而条件收敛则没有这种自由。这是「绝对」二字真正的分量所在。\n\n先用一个小热身,把<a class=\"wl\" data-id=\"an_convergenza_assoluta\">上节的判别法<\/a>用在几个常见极限上。\n\n## 热身：几个增长速度的极限\n\n比值判别法不仅判级数敛散,还能顺手算出几个「谁增长得快」的标准极限——因为「级数收敛 ⟹ 项趋于 0」,只要证某个级数收敛,它的通项就自动趋于 0。\n\n**命题(增长速度).** 设 a > 1,k ∈ ℕ 固定。则\n\n(i) nᵏ/aⁿ → 0（指数 aⁿ 压倒任何多项式 nᵏ）;  (ii) aⁿ/n! → 0（阶乘 n! 压倒任何指数 aⁿ）。\n\n**证明.** 都用「证级数收敛 ⟹ 通项趋零」。\n\n(i) 看级数 Σ nᵏ/aⁿ。比值 ((n+1)ᵏ/a^{n+1})/(nᵏ/aⁿ) = (1+1/n)ᵏ·(1/a) → 1ᵏ·(1/a) = 1/a < 1（因 a>1）。由<a class=\"wl\" data-id=\"an_convergenza_assoluta\">比值判别法<\/a>级数收敛,故通项 nᵏ/aⁿ → 0。\n\n(ii) 看级数 Σ aⁿ/n!。比值 (a^{n+1}/(n+1)!)/(aⁿ/n!) = a/(n+1) → 0 < 1。由比值判别法级数收敛,故 aⁿ/n! → 0。∎\n\n这两条极限(指数压多项式、阶乘压指数)是分析里反复用到的「增长速度排序」:**多项式 ≪ 指数 ≪ 阶乘**(≪ 表示「增长慢得多」)。用级数判别法证它们,比直接估计利落得多——这也补上了<a class=\"wl\" data-id=\"an_numero_e\">单调数列<\/a>那节「几个重要极限」里当时没细证的部分。\n\n## 重排：绝对收敛的级数可以随意调换次序\n\n有限个数相加,次序无所谓(加法交换律)。无穷多个呢?先看一个**警示性的例子**——条件收敛的级数,调换次序竟能改变和!\n\n**例(交错调和级数重排).** 交错调和级数 s = Σ(−1)^{k+1}/k = 1 − 1/2 + 1/3 − 1/4 + ⋯ <a class=\"wl\" data-id=\"an_convergenza_assoluta\">条件收敛<\/a>(值是 log 2)。现在把它**重排**——按「一个正项、两个负项」的次序重新排列同样这些项:\n\n1 − 1/2 − 1/4 + 1/3 − 1/6 − 1/8 + 1/5 − 1/10 − 1/12 + ⋯\n\n可以算出(把负项两两与前面的正项配对),这个重排级数收敛到 **s/2 = (log 2)/2**——**同样的项、不同的次序,和变成了一半!**\n\n这说明:**对条件收敛的级数,「无穷和」不满足交换律**——调换次序能改变结果。(更惊人的是 **Riemann 重排定理**:条件收敛级数可以重排成收敛到**任意**指定实数,甚至发散。条件收敛的「和」严重依赖次序。)\n\n但**绝对收敛的级数没有这个毛病**——它的和像有限和一样,与次序无关。\n\n**定理(重排定理).** 设 Σxₖ 绝对收敛。则它的**任何重排** Σx_{σ(k)}（σ 是 ℕ 的任意<a class=\"wl\" data-id=\"fond_funzioni\">双射/置换<\/a>）也绝对收敛,且与原级数有**相同的值**。\n\n**证明.** 由 Σ|xₖ| 收敛,其 <a class=\"wl\" data-id=\"an_serie\">Cauchy 判据<\/a>给出:对每个 ε > 0,存在 N 使\n\nΣ_{k=N+1}^{∞} |xₖ| ≤ ε（尾部绝对值之和任意小）。\n\n设 σ 是任意置换。取 M := max{σ⁻¹(0), …, σ⁻¹(N)}（即原级数前 N+1 项 x₀,…,x_N 在重排后出现的最晚位置）。则对 m ≥ M,重排的前 m 项 {x_{σ(0)},…,x_{σ(m)}} **必定包含** {x₀,…,x_N} 全部。于是这两个部分和之差,只剩下标 > N 的那些项,被尾部绝对值控制:\n\n|Σ_{k=0}^{m} x_{σ(k)} − Σ_{k=0}^{N} xₖ| ≤ Σ_{k=N+1}^{∞} |xₖ| ≤ ε，  m ≥ M。\n\n令 m → ∞:|（重排级数的和）− Σ_{k=0}^{N} xₖ| ≤ ε。而原级数的和也与 Σ_{k=0}^{N}xₖ 相差 ≤ ε。故重排的和与原级数的和相差 ≤ 2ε,对一切 ε 成立,两者相等。绝对收敛性同理(对 |x_{σ(k)}| 重复论证)。∎\n\n**核心机制:绝对收敛时,「尾部绝对值之和任意小」**——所以无论怎么重排,只要取得足够靠后,前面那 N 个重要的项总会被包含进来,而剩下的尾巴贡献可忽略。条件收敛缺的正是这一条:它的尾部绝对值之和**不**趋于零(否则就绝对收敛了),所以重排能把正负项重新搭配出不同的和。**绝对收敛 = 无穷和的交换律。**\n\n## 二重级数：双下标求和，次序无关\n\n有时要对一个**双下标**的数组 (x_{jk})_{j,k∈ℕ} 求和——把整个无穷矩阵的元素加起来:\n\n<svg viewBox=\"0 0 320 300\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 5x5 数组, 对角线 j+k=n 同色 -->\n  <g font-size=\"11\" font-family=\"monospace\">\n    <!-- 行列标 -->\n    <text x=\"40\" y=\"66\" font-size=\"10\" fill=\"#999\">j=0<\/text>\n    <text x=\"40\" y=\"110\" font-size=\"10\" fill=\"#999\">j=1<\/text>\n    <text x=\"40\" y=\"154\" font-size=\"10\" fill=\"#999\">j=2<\/text>\n    <text x=\"40\" y=\"198\" font-size=\"10\" fill=\"#999\">j=3<\/text>\n    <text x=\"78\" y=\"40\" font-size=\"10\" fill=\"#999\">k=0<\/text>\n    <text x=\"122\" y=\"40\" font-size=\"10\" fill=\"#999\">k=1<\/text>\n    <text x=\"166\" y=\"40\" font-size=\"10\" fill=\"#999\">k=2<\/text>\n    <text x=\"210\" y=\"40\" font-size=\"10\" fill=\"#999\">k=3<\/text>\n  <\/g>\n  <!-- 对角线高亮: j+k=0(橙) 1(绿) 2(蓝) 3(紫) -->\n  <circle cx=\"78\" cy=\"62\" r=\"15\" fill=\"#E0612F\" opacity=\"0.18\"/>\n  <circle cx=\"122\" cy=\"62\" r=\"15\" fill=\"#00A070\" opacity=\"0.18\"/><circle cx=\"78\" cy=\"106\" r=\"15\" fill=\"#00A070\" opacity=\"0.18\"/>\n  <circle cx=\"166\" cy=\"62\" r=\"15\" fill=\"#5A5FE0\" opacity=\"0.18\"/><circle cx=\"122\" cy=\"106\" r=\"15\" fill=\"#5A5FE0\" opacity=\"0.18\"/><circle cx=\"78\" cy=\"150\" r=\"15\" fill=\"#5A5FE0\" opacity=\"0.18\"/>\n  <circle cx=\"210\" cy=\"62\" r=\"15\" fill=\"#9059D0\" opacity=\"0.18\"/><circle cx=\"166\" cy=\"106\" r=\"15\" fill=\"#9059D0\" opacity=\"0.18\"/><circle cx=\"122\" cy=\"150\" r=\"15\" fill=\"#9059D0\" opacity=\"0.18\"/><circle cx=\"78\" cy=\"194\" r=\"15\" fill=\"#9059D0\" opacity=\"0.18\"/>\n  <!-- 元素 -->\n  <g font-size=\"10\" font-family=\"monospace\" fill=\"#555\">\n    <text x=\"68\" y=\"66\">x₀₀<\/text><text x=\"112\" y=\"66\">x₀₁<\/text><text x=\"156\" y=\"66\">x₀₂<\/text><text x=\"200\" y=\"66\">x₀₃<\/text><text x=\"240\" y=\"66\">…<\/text>\n    <text x=\"68\" y=\"110\">x₁₀<\/text><text x=\"112\" y=\"110\">x₁₁<\/text><text x=\"156\" y=\"110\">x₁₂<\/text><text x=\"200\" y=\"110\">x₁₃<\/text><text x=\"240\" y=\"110\">…<\/text>\n    <text x=\"68\" y=\"154\">x₂₀<\/text><text x=\"112\" y=\"154\">x₂₁<\/text><text x=\"156\" y=\"154\">x₂₂<\/text><text x=\"200\" y=\"154\">x₂₃<\/text><text x=\"240\" y=\"154\">…<\/text>\n    <text x=\"68\" y=\"198\">x₃₀<\/text><text x=\"112\" y=\"198\">x₃₁<\/text><text x=\"156\" y=\"198\">x₃₂<\/text><text x=\"200\" y=\"198\">x₃₃<\/text><text x=\"240\" y=\"198\">…<\/text>\n    <text x=\"68\" y=\"220\">⋮<\/text><text x=\"112\" y=\"220\">⋮<\/text><text x=\"156\" y=\"220\">⋮<\/text><text x=\"200\" y=\"220\">⋮<\/text>\n  <\/g>\n  <text x=\"160\" y=\"250\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">按行加？按列加？按对角线加？——可和时三者相等<\/text>\n  <text x=\"160\" y=\"266\" font-size=\"9\" text-anchor=\"middle\" fill=\"#999\">同色 = 一条对角线 j+k=n（Cauchy 乘积按此求和）<\/text>\n<\/svg>\n\n这个无穷矩阵可以**按行求和**(先把每行加起来,再加各行和)、**按列求和**,或**按其它任何次序**(如沿对角线)。结果会一样吗?和重排一样,关键在一个绝对型条件。\n\n**定义.** 二重级数 Σx_{jk} 称**可和**(summable)，若部分和的绝对值有统一上界:存在 M 使 Σ_{j,k=0}^{n} |x_{jk}| ≤ M 对一切 n。（这是「二维的绝对收敛」。）\n\n**定理(二重级数定理).** 设 Σx_{jk} 可和。则:把矩阵元素按**任意**次序排成一列(<a class=\"wl\" data-id=\"fond_cardinalita\">ℕ×ℕ 可数<\/a>,故能排)求和,都绝对收敛到**同一个值** s,与次序无关;特别地,**行和之和 = 列和之和 = s**:\n\nΣ_{j} (Σ_{k} x_{jk}) = Σ_{k} (Σ_{j} x_{jk}) = s。\n\n**思路.** 可和性使任意排列后的级数都被 M 控制,从而绝对收敛;再用<a class=\"wl\" data-id=\"an_serie\">重排<\/a>的思想证明所有排列同值。行和、列和只是两种特殊的「求和次序」,故都等于 s。∎ 直觉:**可和(二维绝对收敛)时,无穷矩阵的元素可以任意次序相加而和不变——行、列、对角线随便加**。又是「绝对型条件买来次序自由」。\n\n## Cauchy 乘积：两个级数相乘\n\n二重级数最重要的应用,是给**两个级数相乘**一个意义。有限和相乘是 (Σxⱼ)(Σyₖ) = Σ_{j,k} xⱼyₖ(每项乘每项)。无穷级数呢?把所有乘积 xⱼyₖ 排成无穷矩阵(第 (j,k) 格是 xⱼyₖ),沿**对角线** j + k = n 收集,就得到 Cauchy 乘积。\n\n**定义(Cauchy 乘积).** 级数 Σxⱼ 与 Σyₖ 的 **Cauchy 乘积**是级数 Σzₙ,其中第 n 项是第 n 条对角线之和:\n\nzₙ := Σ_{k=0}^{n} xₖ y_{n−k} = x₀yₙ + x₁y_{n−1} + ⋯ + xₙy₀。\n\n**定理(Cauchy 乘积).** 若 Σxⱼ 与 Σyₖ 都**绝对收敛**,则它们的 Cauchy 乘积 Σzₙ 也绝对收敛,且\n\n(Σ_{j=0}^{∞} xⱼ)·(Σ_{k=0}^{∞} yₖ) = Σ_{n=0}^{∞} zₙ = Σ_{n=0}^{∞} (Σ_{k=0}^{n} xₖy_{n−k})。\n\n**思路.** 两级数绝对收敛 ⟹ 乘积矩阵 (xⱼyₖ) 可和(其绝对值之和 ≤ (Σ|xⱼ|)(Σ|yₖ|) < ∞);由二重级数定理,矩阵元素可任意次序求和而同值。按「行/列」求和给出 (Σxⱼ)(Σyₖ),按「对角线」求和给出 Σzₙ,故两者相等。∎\n\n**这把「级数相乘」化归到了「绝对收敛 + 二重级数」**。最重要的应用是指数函数的加法定理:用 <a class=\"wl\" data-id=\"an_serie_potenze\">exp(x) = Σxᵏ/k!<\/a> 的级数,算 exp(x)·exp(y) 的 Cauchy 乘积,对角线之和恰好整理成 Σ(x+y)ⁿ/n! = exp(x+y)——**指数律 exp(x)exp(y) = exp(x+y) 由此严格证出**(细节留待指数函数那节)。Cauchy 乘积是连接「级数」与「函数运算」的关键桥梁。\n\n> 注意 Cauchy 乘积定理要求**绝对收敛**。两个只条件收敛的级数,其 Cauchy 乘积可能发散——又一次,绝对收敛是「能相乘」的保证,条件收敛不够。\n\n## 一道激活练习\n\n(a) 写出两个几何级数 Σxⱼ（x₀=x₁=⋯，公比形式这里简化为 Σaʲ）与 Σbᵏ 的 Cauchy 乘积的通项 zₙ。具体地,设 a, b ∈ ℝ,|a|,|b| < 1,求 Σaʲ 与 Σbᵏ 的 Cauchy 乘积 zₙ = Σ_{k=0}^n aᵏb^{n−k}（当 a ≠ b 时化简）。\n\n(b) 用 Cauchy 乘积验证 (Σ_{k=0}^∞ xᵏ)² = Σ_{n=0}^∞ (n+1)xⁿ（|x|<1）。(提示:两个相同的几何级数 Σxᵏ 作 Cauchy 乘积,算 zₙ = Σ_{k=0}^n xᵏ·x^{n−k}。)\n\n(c) 解释为什么交错调和级数能重排成不同的和,而 Σ(−1)ᵏ⁺¹/k² 不能。(提示:看哪个绝对收敛——比较 Σ1/k 与 Σ1/k²。)\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** zₙ = Σ_{k=0}^n aᵏb^{n−k} = b^n Σ_{k=0}^n (a/b)ᵏ（提出 bⁿ）。当 a ≠ b,内部是有限几何和 = (1−(a/b)^{n+1})/(1−a/b),整理:\n\nzₙ = bⁿ·(1 − (a/b)^{n+1})/(1 − a/b) = (b^{n+1} − a^{n+1})/(b − a)。\n\n（这也正是 1/((1−a)(1−b)) 展开成幂级数的系数——Cauchy 乘积给出 (Σaʲ)(Σbᵏ) = 1/(1−a)·1/(1−b)。）\n\n**(b)** 两个 Σxᵏ 的 Cauchy 乘积通项:zₙ = Σ_{k=0}^n xᵏ·x^{n−k} = Σ_{k=0}^n xⁿ = (n+1)xⁿ（n+1 个相同的 xⁿ 相加）。故 (Σxᵏ)² = Σ(n+1)xⁿ。∎（左边 = (1/(1−x))² = 1/(1−x)²,所以顺带得到 1/(1−x)² = Σ(n+1)xⁿ,一个有用的展开。）\n\n**(c)** **交错调和级数 Σ(−1)^{k+1}/k 只条件收敛**——绝对值级数 Σ1/k 是发散的<a class=\"wl\" data-id=\"an_serie\">调和级数<\/a>。条件收敛的级数,重排能改变其和(正文的 s/2 例,以及 Riemann 定理)。而 **Σ(−1)^{k+1}/k² 绝对收敛**——绝对值级数 Σ1/k² <a class=\"wl\" data-id=\"an_serie\">收敛<\/a>。由重排定理,绝对收敛级数任意重排和不变。所以前者「能重排出不同的和」、后者「重排和恒不变」,分野正在于**是否绝对收敛**。∎\n\n回顾:这三题围绕同一主线——**绝对收敛是无穷求和获得「有限求和的自由」(交换、相乘)的前提**。(a)(b) 是 Cauchy 乘积的计算(几何级数相乘,对角线求和),(c) 点明重排自由的边界:绝对收敛者有此自由,条件收敛者没有。判断一个无穷求和操作(重排、相乘、换序)是否「安全」,第一步永远是看**绝对收敛**。\n\n## 往前看一步\n\n绝对收敛的三大回报——重排自由、二重级数次序无关、Cauchy 乘积——都已就位。它们共同确立了一个原则:**绝对收敛的无穷和,行为像有限和一样温顺**;而条件收敛则保留了无穷的「危险」(次序敏感)。这套理论,尤其是 Cauchy 乘积,是下一步处理幂级数运算的直接工具。\n\n回到<a class=\"wl\" data-id=\"an_serie_potenze\">幂级数<\/a>:既然幂级数在收敛圆盘内<a class=\"wl\" data-id=\"an_convergenza_assoluta\">绝对收敛<\/a>,就能对它们做代数运算——**两个幂级数相加、相乘**(乘法正是 Cauchy 乘积),结果仍是幂级数。还有一个深刻的事实:**幂级数的表示是唯一的**——若两个幂级数在原点附近处处相等,则它们逐项系数相同(恒等定理)。这让「比较系数」成为合法手段,是幂级数方法的基石。这就是第二章最后一块:<a class=\"wl\" data-id=\"an_operazioni_serie_potenze\">幂级数的运算与唯一性<\/a>。","refs":"Amann–Escher, Analysis I §II.8"},{"id":"an_serie","label":"无穷级数与部分和","parent":"an_analisi","summary":"无穷级数 Σaₖ 定义为其部分和数列 sₙ = a₀+⋯+aₙ;级数收敛即部分和收敛,极限是级数的值。项趋于 0 是收敛的必要非充分条件(调和级数为反例),几何级数 Σaᵏ = 1/(1−a) （|a|<1）。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#FD7982","ring":8,"bearing":4,"popupLinks":[{"id":"an_cauchy","text":"数列极限"},{"id":"num_ricorsione","text":"递归定义"},{"id":"alg_binomio","text":"有限几何和"},{"id":"an_monotone","text":"几何数列"},{"id":"an_algebra_limiti","text":"运算法则"},{"id":"an_numero_e","text":"欧拉数 e"}],"body":"\n## 把「无限相加」定义清楚\n\n「1 + 1/2 + 1/4 + 1/8 + ⋯ 等于 2」——这种无穷多个数相加的说法,直觉上人人会用,但严格说来,「无限相加」是什么意思?加法是二元运算,一次只能加两个数;「加无穷多次」并非加法的定义内容,需要重新界定。\n\n界定的办法,正是<a class=\"wl\" data-id=\"an_cauchy\">数列极限<\/a>:不去「一次加完」,而是**逐项累加,看累加的结果趋于什么**。先加前一项、前两项、前三项……得到一串「部分和」,这串部分和若收敛,它的极限就定义为那个「无穷和」。于是「无限相加」被化归成了「一个特殊数列的极限」——而数列极限我们已经彻底掌握。\n\n**定义(级数).** 设 (aₖ) 是 K(= ℝ 或 ℂ,或更一般的 Banach 空间)中的数列。定义新数列 (sₙ):\n\nsₙ := Σ_{k=0}^{n} aₖ = a₀ + a₁ + ⋯ + aₙ。\n\n这个**部分和数列** (sₙ) 称一个**级数**(series)，记作 Σaₖ;sₙ 称第 n 个**部分和**(partial sum),aₖ 称第 k 个**项**(summand)。\n\n换句话说,**级数就是它的部分和数列**——一个由递归 s₀ = a₀、sₙ₊₁ = sₙ + aₙ₊₁ 定义的数列(<a class=\"wl\" data-id=\"num_ricorsione\">递归定义<\/a>的又一个实例)。\n\n**定义(收敛与值).** 级数 Σaₖ **收敛**,若部分和数列 (sₙ) 收敛;此时 (sₙ) 的极限称级数的**值**,记\n\nΣ_{k=0}^{∞} aₖ := lim_{n→∞} sₙ。\n\n若 (sₙ) 发散,则称级数**发散**。\n\n要紧的是分清两个对象:**项的数列 (aₖ)** 和**部分和数列 (sₙ)**。级数的收敛说的是**后者**——是累加的结果在收拢,不是项本身。记号 Σ_{k=0}^∞ aₖ 既指这个级数,又(在收敛时)指它的值,靠上下文区分。\n\n<svg viewBox=\"0 0 440 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 值线 -->\n  <line x1=\"55\" y1=\"50\" x2=\"395\" y2=\"50\" stroke=\"#E0612F\" stroke-width=\"1.4\" stroke-dasharray=\"7,3\"/>\n  <text x=\"398\" y=\"54\" font-size=\"12\" fill=\"#E0612F\">值 = 2<\/text>\n  <!-- 坐标轴 -->\n  <line x1=\"55\" y1=\"185\" x2=\"425\" y2=\"185\" stroke=\"#bbb\" stroke-width=\"1\"/>\n  <text x=\"420\" y=\"202\" font-size=\"11\" fill=\"#888\">n<\/text>\n  <!-- 部分和竖条 -->\n  <g stroke=\"#5A5FE0\" stroke-width=\"6\" opacity=\"0.32\">\n    <line x1=\"67\" y1=\"185\" x2=\"67\" y2=\"140\"/><line x1=\"93\" y1=\"185\" x2=\"93\" y2=\"95\"/><line x1=\"119\" y1=\"185\" x2=\"119\" y2=\"72\"/><line x1=\"145\" y1=\"185\" x2=\"145\" y2=\"61\"/><line x1=\"171\" y1=\"185\" x2=\"171\" y2=\"55\"/><line x1=\"197\" y1=\"185\" x2=\"197\" y2=\"52\"/><line x1=\"222\" y1=\"185\" x2=\"222\" y2=\"51\"/><line x1=\"248\" y1=\"185\" x2=\"248\" y2=\"50\"/><line x1=\"274\" y1=\"185\" x2=\"274\" y2=\"50\"/><line x1=\"300\" y1=\"185\" x2=\"300\" y2=\"50\"/><line x1=\"326\" y1=\"185\" x2=\"326\" y2=\"50\"/>\n  <\/g>\n  <!-- 部分和顶点 -->\n  <polyline points=\"67,140 93,95 119,72 145,61 171,55 197,52 222,51 248,50 274,50 300,50 326,50\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"1\" opacity=\"0.6\"/>\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"67\" cy=\"140\" r=\"3.3\"/><circle cx=\"93\" cy=\"95\" r=\"3.3\"/><circle cx=\"119\" cy=\"72\" r=\"3.3\"/><circle cx=\"145\" cy=\"61\" r=\"3.3\"/><circle cx=\"171\" cy=\"55\" r=\"3.3\"/><circle cx=\"197\" cy=\"52\" r=\"3.3\"/><circle cx=\"222\" cy=\"51\" r=\"3.3\"/><circle cx=\"248\" cy=\"50\" r=\"3.3\"/><circle cx=\"274\" cy=\"50\" r=\"3.3\"/><circle cx=\"300\" cy=\"50\" r=\"3.3\"/><circle cx=\"326\" cy=\"50\" r=\"3.3\"/>\n  <\/g>\n  <text x=\"64\" y=\"133\" font-size=\"9\" fill=\"#5A5FE0\">s₀=1<\/text>\n  <text x=\"200\" y=\"202\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">部分和 sₙ=1+½+¼+⋯+1/2ⁿ 步步逼近级数值 2<\/text>\n<\/svg>\n\n## 收敛的必要条件：项趋于 0\n\n第一条判据,简单却常用——它给出一个**排除发散**的快速检验。\n\n**命题.** 若级数 Σaₖ 收敛,则 (aₖ) 是零数列(aₖ → 0)。\n\n**证明.** Σaₖ 收敛即部分和 (sₙ) 收敛,由<a class=\"wl\" data-id=\"an_cauchy\">收敛 ⟹ Cauchy<\/a>,(sₙ) 是 Cauchy 列:对每个 ε > 0,存在 N 使 m, n ≥ N 时 |sₙ − sₘ| < ε。特别取相邻两项,n ≥ N 时\n\n|aₙ₊₁| = |sₙ₊₁ − sₙ| < ε。\n\n故 aₙ → 0。∎\n\n这条的用法是**逆否**:**若项不趋于 0,级数必发散**。例如 Σ(−1)ᵏ 的项在 ±1 间跳、不趋于 0,立即判定发散,不必算部分和。这是判断级数发散最快的一招——先看项是否趋于 0,不趋于就完了。\n\n但**反过来不成立**:项趋于 0 **不**保证级数收敛。这正是下面调和级数要揭示的——也是<a class=\"wl\" data-id=\"an_cauchy\">上一节练习<\/a>埋下的伏笔。\n\n## 调和级数：项趋于 0 却发散\n\n**例.** 调和级数 Σ 1/k(即 1 + 1/2 + 1/3 + 1/4 + ⋯)发散。\n\n它的项 1/k → 0,满足必要条件;若必要条件也充分,它就该收敛。但它不收敛——证明用 <a class=\"wl\" data-id=\"an_cauchy\">Cauchy 判据<\/a> 的反面:找到「任意远处仍不靠近」的两段部分和。\n\n**证明.** 看从第 n+1 项到第 2n 项这一段的和(即 s_{2n} − sₙ):\n\ns_{2n} − sₙ = Σ_{k=n+1}^{2n} 1/k = 1/(n+1) + 1/(n+2) + ⋯ + 1/(2n)。\n\n这是 n 个加项,每一项都 ≥ 最小的那个 1/(2n)。所以\n\ns_{2n} − sₙ ≥ n · 1/(2n) = 1/2，  对一切 n ≥ 1。\n\n于是无论 N 多大,总能取 m = N、n = 2N,使 |s_{2n} − sₙ| ≥ 1/2 —— 部分和数列**不是 Cauchy 列**(它不满足「任意远的两项任意接近」,差永远顶着 1/2)。由<a class=\"wl\" data-id=\"an_cauchy\">Cauchy 判据<\/a>,(sₙ) 发散,即调和级数发散。∎\n\n这正还上了<a class=\"wl\" data-id=\"an_cauchy\">上一节练习 (b)<\/a>的账:相邻差 1/(n+1) → 0 不足以收敛,因为 Cauchy 要求的是**任意远两项之距**小,而调和级数里「跨度为 n 的一段」其和顶着 1/2 不降——相邻虽近,成段累积起来仍不收拢。**「项趋于 0」是收敛的必要条件,绝非充分**,调和级数是这件事最经典的反例。\n\n## 几何级数：第一个能求和的级数\n\n与调和级数相反,几何级数不仅收敛,还能算出确切的值——它是最基本、用得最多的级数。\n\n**例(几何级数).** 设 a ∈ K。当 |a| < 1 时,Σaᵏ 收敛且\n\nΣ_{k=0}^{∞} aᵏ = 1/(1 − a)。\n\n当 |a| ≥ 1 时,Σaᵏ 发散。\n\n**证明.** 关键是部分和有**封闭公式**。对 a ≠ 1,由<a class=\"wl\" data-id=\"alg_binomio\">有限几何和<\/a>(可由 (1−a)(1+a+⋯+aⁿ) = 1−aⁿ⁺¹ 直接验证):\n\nsₙ = Σ_{k=0}^{n} aᵏ = (1 − aⁿ⁺¹)/(1 − a)。\n\n**|a| < 1 时**:<a class=\"wl\" data-id=\"an_monotone\">几何数列<\/a> aⁿ⁺¹ → 0,故由<a class=\"wl\" data-id=\"an_algebra_limiti\">运算法则<\/a>\n\nsₙ = (1 − aⁿ⁺¹)/(1 − a) → (1 − 0)/(1 − a) = 1/(1 − a)。\n\n**|a| ≥ 1 时**:|aᵏ| = |a|ᵏ ≥ 1,项不趋于 0,由必要条件级数发散。∎\n\n把它和开头的例子对上:a = 1/2 时,Σ(1/2)ᵏ = 1/(1 − 1/2) = 2——这正是「1 + 1/2 + 1/4 + ⋯ = 2」的严格证明。那个直觉的等式,如今是几何级数公式的一个特例。\n\n## 级数的线性\n\n级数既是特殊的数列,数列的<a class=\"wl\" data-id=\"an_algebra_limiti\">运算法则<\/a>就直接适用——尤其是线性。\n\n**命题.** 设 Σaₖ、Σbₖ 收敛,α ∈ K。则 Σ(aₖ + bₖ) 与 Σ(αaₖ) 收敛,且\n\nΣ(aₖ + bₖ) = Σaₖ + Σbₖ，  Σ(αaₖ) = α·Σaₖ。\n\n**证明.** 设 Σaₖ 的部分和 sₙ → s,Σbₖ 的部分和 tₙ → t。则 Σ(aₖ+bₖ) 的部分和恰是 sₙ + tₙ(有限和可重排),由<a class=\"wl\" data-id=\"an_algebra_limiti\">和法则<\/a> → s + t;Σ(αaₖ) 的部分和是 αsₙ → αs。∎ （注意:这只对**收敛**级数成立。两个发散级数逐项相加可能收敛,不能乱用。）\n\n## 两个收敛的例子\n\n**例 1:e = Σ 1/k!。** <a class=\"wl\" data-id=\"an_numero_e\">欧拉数 e<\/a>那节提过,e 还有一个收敛快得多的表示。现在能说清它是一个级数:Σ 1/k! 的部分和\n\nsₙ = 1 + 1/1! + 1/2! + ⋯ + 1/n!\n\n递增(每项为正),且有上界——由<a class=\"wl\" data-id=\"an_numero_e\">e 的有界性证明<\/a>里同样的估计,1/k! ≤ 1/2^{k−1},故 sₙ ≤ 1 + Σ(1/2)^{k−1} < 3。递增有上界,由<a class=\"wl\" data-id=\"an_monotone\">单调收敛<\/a>级数收敛。它的值正是 e(与 (1+1/n)ⁿ 同极限,严格证明需要更多工具,这里记住结论)。**e = Σ_{k=0}^∞ 1/k!** ——这个级数收敛极快,是实际计算 e 的标准方法。\n\n**例 2:Σ 1/k² 收敛。** 部分和 sₙ = Σ_{k=1}^n 1/k² 递增。用一个**伸缩**(telescoping)技巧估上界:对 k ≥ 2,1/k² ≤ 1/(k(k−1)) = 1/(k−1) − 1/k。于是\n\nsₙ ≤ 1 + Σ_{k=2}^{n} (1/(k−1) − 1/k) = 1 + (1 − 1/n) < 2，\n\n中间那个和**逐项相消**(伸缩),只剩首尾。所以 (sₙ) 递增有上界 2,由<a class=\"wl\" data-id=\"an_monotone\">单调收敛<\/a>级数收敛。（它的值是 π²/6,著名的 Basel 问题,但求出这个值要等更深的工具;收敛性这里已经够了。）这个例子和调和级数恰成对照:1/k 发散、1/k² 收敛——**项趋于 0 的速度决定成败**,1/k 降得太慢,1/k² 够快。\n\n## 一道激活练习\n\n(a) 求 Σ_{k=0}^∞ (2/3)ᵏ 和 Σ_{k=1}^∞ (1/5)ᵏ 的值（注意第二个从 k=1 起）。\n\n(b) 用「项趋于 0」判据说明 Σ k/(k+1) 发散。\n\n(c) 用伸缩法求 Σ_{k=1}^∞ 1/(k(k+1)) 的值（提示:1/(k(k+1)) = 1/k − 1/(k+1),写出部分和 sₙ 看它消成什么,再取极限）。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 第一个:几何级数 a = 2/3,|a| < 1,从 k=0 起,值 = 1/(1 − 2/3) = 1/(1/3) = **3**。\n第二个:a = 1/5,但从 k=1 起,缺了 k=0 的项(=1)。整条(从 0 起)= 1/(1 − 1/5) = 5/4;减去 k=0 项 1,得 Σ_{k≥1} = 5/4 − 1 = **1/4**。（或直接:首项 1/5、公比 1/5 的几何级数,值 = 首项/(1−公比) = (1/5)/(4/5) = 1/4。）\n\n**(b)** 项 aₖ = k/(k+1) = 1/(1 + 1/k) → 1/(1+0) = 1 ≠ 0。项不趋于 0,由必要条件的逆否,级数 **发散**。\n\n**(c)** 用 1/(k(k+1)) = 1/k − 1/(k+1) 写部分和:\n\nsₙ = Σ_{k=1}^{n} (1/k − 1/(k+1)) = (1 − 1/2) + (1/2 − 1/3) + ⋯ + (1/n − 1/(n+1))。\n\n中间项全部相消(伸缩),只剩 sₙ = 1 − 1/(n+1)。取极限:sₙ → 1 − 0 = **1**。故 Σ_{k=1}^∞ 1/(k(k+1)) = 1。∎\n\n回顾:(a) 是几何级数的直接套用,要点是看清「从哪一项起」(起点不同,要补/减开头的项)。(c) 是伸缩法的典型——**把每项拆成「相邻两个量之差」,部分和便首尾相消、只剩两端**,取极限即得。伸缩与几何级数,是少数几种能算出**确切值**的级数;大多数级数我们只能判断「收不收敛」而求不出值,那正是下面收敛判别法要解决的。\n\n## 往前看一步\n\n级数的框架立起来了:它是部分和数列,收敛性归结为数列极限,而我们已有的全部工具(Cauchy 判据、单调收敛、运算法则)都能用上。但目前能**求出值**的只有几何级数和伸缩级数寥寥几类;绝大多数级数,我们关心的不是「等于多少」,而是更基本的「**收不收敛**」。为此需要一批**收敛判别法**(convergence tests):不必算出部分和,仅凭项 aₖ 的大小或比值,就能判定级数敛散。其中最常用的是**比较判别法**(和已知级数比大小)、**比值判别法**与**根值判别法**(看相邻项之比或项的方根)。它们的根基,是一个把级数收敛性大大简化的概念——**绝对收敛**。这就是分析的下一站:级数的收敛判别法。","refs":"Amann–Escher, Analysis I §II.7"},{"id":"an_serie_potenze","label":"幂级数与收敛半径","parent":"an_analisi","summary":"幂级数 Σaₖxᵏ 把级数变成 x 的函数;它的收敛域是以原点为心的圆盘,半径由 Cauchy–Hadamard 公式 ρ = 1/limsup ᵏ√|aₖ| 给出。圆盘内绝对收敛、圆外发散。指数、三角、对数函数都将由幂级数定义。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#FE7A75","ring":10,"bearing":1,"popupLinks":[{"id":"an_convergenza_assoluta","text":"绝对收敛"},{"id":"an_serie","text":"级数"},{"id":"an_limsup","text":"上极限"},{"id":"an_convergenza","text":"数列收敛"},{"id":"an_cauchy","text":"完备性"}],"body":"\n## 把级数变成函数\n\n<a class=\"wl\" data-id=\"an_convergenza_assoluta\">绝对收敛<\/a>那节的指数级数 Σzᵏ/k! 已经透露了下一步:把级数的项里放进一个**变量**。一般地,取一列系数 (aₖ),考虑\n\nΣ_{k=0}^{∞} aₖxᵏ = a₀ + a₁x + a₂x² + a₃x³ + ⋯，\n\n其中 x 是变量。这就是**幂级数**(power series)——形式上是「无穷次多项式」。对每个具体的 x,它是一个普通<a class=\"wl\" data-id=\"an_serie\">级数<\/a>;这个级数收敛与否、收敛到什么,取决于 x。于是幂级数定义了一个**函数**:在它收敛的那些 x 处,函数值就是级数的和。\n\n**定义(幂级数与收敛域).** 设 (aₖ) 是 𝕂 中一列系数。幂级数 Σaₖxᵏ 的**收敛域**(domain of convergence)是\n\ndom := { x ∈ 𝕂 : Σaₖxᵏ 收敛 }，\n\n在其上定义函数\n\na(x) := Σ_{k=0}^{∞} aₖxᵏ,  x ∈ dom。\n\n注意 0 总在 dom 里(x = 0 时级数 = a₀,平凡收敛)。问题是:除了 0,还有哪些 x 使它收敛?\n\n幂级数为什么重要,一句话:**初等函数大多是幂级数**。指数、正弦、余弦、对数,都能写成幂级数,从而获得严格的定义——这是把「函数」建立在「无穷级数」这块已经夯实的地基上的关键一步。本节先解决最基础的问题:**一个幂级数到底在哪些 x 处收敛?**\n\n## 收敛域的三种形态\n\n先看三个例子,它们恰好展示收敛域的三种可能。\n\n**(a) 指数级数 Σxᵏ/k!:处处收敛。** <a class=\"wl\" data-id=\"an_convergenza_assoluta\">上节用比值判别法<\/a>证过它对一切 x ∈ ℂ 绝对收敛。故 dom = ℂ(整个 𝕂)。它定义的函数就是**指数函数** exp。\n\n**(b) 几何级数 Σxᵏ:在单位圆盘内收敛。** <a class=\"wl\" data-id=\"an_serie\">几何级数<\/a>当 |x| < 1 时收敛到 1/(1−x),当 |x| ≥ 1 时发散(项不趋于 0)。故 dom = { x : |x| < 1 },一个圆盘。它定义的函数是 1/(1−x)。\n\n**(c) Σk!xᵏ:只在 0 收敛。** 对任意 x ≠ 0,用比值判别法:|（k+1)!x^{k+1}| / |k!xᵏ| = (k+1)|x| → ∞,故发散。所以 dom = {0},除原点外处处发散。\n\n三个例子,三种收敛域:**整个 𝕂、一个圆盘、仅一个点**。它们的共同结构是——收敛域总是「以原点为心的某种圆盘」(退化情形是半径 ∞ 的「全平面」或半径 0 的「一个点」)。下面的定理把这件事说精确。\n\n## 收敛半径与 Cauchy–Hadamard 公式\n\n**定理(收敛半径).** 对任意幂级数 Σaₖxᵏ,存在唯一的 ρ ∈ [0, ∞](称**收敛半径** radius of convergence),使得:\n\n- 当 **|x| < ρ** 时,级数**绝对收敛**;\n- 当 **|x| > ρ** 时,级数**发散**。\n\n且 ρ 由 **Cauchy–Hadamard 公式** 给出:\n\nρ = 1 / ( lim sup_{k→∞} ᵏ√|aₖ| )。\n\n（约定:若 lim sup = ∞ 则 ρ = 0;若 lim sup = 0 则 ρ = ∞。）集合 { x : |x| < ρ } 称**收敛圆盘**(disk of convergence)。\n\n<svg viewBox=\"0 0 360 300\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 外部发散区(浅红) -->\n  <rect x=\"20\" y=\"20\" width=\"320\" height=\"260\" fill=\"#B33\" opacity=\"0.04\"/>\n  <!-- 收敛圆盘 -->\n  <circle cx=\"180\" cy=\"150\" r=\"95\" fill=\"#00A070\" opacity=\"0.10\" stroke=\"#00A070\" stroke-width=\"1.5\" stroke-dasharray=\"6,3\"/>\n  <!-- 轴 -->\n  <line x1=\"60\" y1=\"150\" x2=\"300\" y2=\"150\" stroke=\"#bbb\" stroke-width=\"0.8\"/>\n  <line x1=\"180\" y1=\"40\" x2=\"180\" y2=\"260\" stroke=\"#bbb\" stroke-width=\"0.8\"/>\n  <text x=\"304\" y=\"154\" font-size=\"10\" fill=\"#999\">Re<\/text>\n  <text x=\"186\" y=\"48\" font-size=\"10\" fill=\"#999\">Im<\/text>\n  <!-- 半径 -->\n  <line x1=\"180\" y1=\"150\" x2=\"275\" y2=\"150\" stroke=\"#E0612F\" stroke-width=\"1.5\"/>\n  <text x=\"220\" y=\"143\" font-size=\"11\" fill=\"#E0612F\">ρ<\/text>\n  <circle cx=\"180\" cy=\"150\" r=\"2.5\" fill=\"#333\"/>\n  <!-- 内部点(收敛) -->\n  <circle cx=\"225\" cy=\"120\" r=\"3.5\" fill=\"#00A070\"/>\n  <text x=\"231\" y=\"116\" font-size=\"10\" fill=\"#00A070\">收敛<\/text>\n  <!-- 外部点(发散) -->\n  <circle cx=\"300\" cy=\"200\" r=\"3.5\" fill=\"#B33\"/>\n  <text x=\"262\" y=\"205\" font-size=\"10\" fill=\"#B33\">发散<\/text>\n  <text x=\"180\" y=\"285\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">|x|&lt;ρ 绝对收敛（圆盘内）　|x|&gt;ρ 发散（圆盘外）　|x|=ρ 边界另议<\/text>\n<\/svg>\n\n**证明.** 把 ρ 定义为公式右边。对固定的 x,看级数 Σaₖxᵏ 的**根值判别法**——算它的项 aₖxᵏ 的 k 次根:\n\nlim sup_{k→∞} ᵏ√|aₖxᵏ| = lim sup_{k→∞} (|x|·ᵏ√|aₖ|) = |x|·lim sup_{k→∞} ᵏ√|aₖ| = |x|/ρ。\n\n(|x| 是常数,可提到 lim sup 外。)由<a class=\"wl\" data-id=\"an_convergenza_assoluta\">根值判别法<\/a>:这个 lim sup < 1 时绝对收敛、> 1 时发散。即\n\n|x|/ρ < 1 （亦即 |x| < ρ）⟹ 绝对收敛;　|x|/ρ > 1 （亦即 |x| > ρ）⟹ 发散。\n\n正是所断言的。∎\n\n**这就是<a class=\"wl\" data-id=\"an_limsup\">上极限<\/a>的第二次关键登场。** 当初补 lim sup 时说它是「根值判别法和收敛半径的必备工具」——现在兑现:Cauchy–Hadamard 公式 ρ = 1/limsup ᵏ√|aₖ| 里的 lim sup **不能换成 lim**,因为 ᵏ√|aₖ| 这个数列一般不收敛(系数 aₖ 可以毫无规律),只有它的<a class=\"wl\" data-id=\"an_limsup\">上极限总存在<\/a>。正是上极限的「无条件存在性」,让每个幂级数都有一个确定的收敛半径。\n\n> **边界 |x| = ρ 上发生什么,公式不回答**——圆周上可能收敛、可能发散,需逐例分析。例如 Σxᵏ/k 的 ρ = 1:在 x = 1 处是发散的<a class=\"wl\" data-id=\"an_serie\">调和级数<\/a>,在 x = −1 处是收敛的<a class=\"wl\" data-id=\"an_convergenza_assoluta\">交错调和级数<\/a>。同一个圆周上,不同点不同命运。这是幂级数理论里精细的一面,这里先记住「边界另议」。\n\n## 用比值判别法求半径\n\nCauchy–Hadamard 公式理论上完美(对一切幂级数成立),但 lim sup ᵏ√|aₖ| 有时不好算。当系数比值的极限存在时,<a class=\"wl\" data-id=\"an_convergenza_assoluta\">比值判别法<\/a>给出一个更易用的公式。\n\n**命题.** 若 lim_{k→∞} |aₖ/aₖ₊₁| 存在(在 ℝ̄ 中),则收敛半径\n\nρ = lim_{k→∞} |aₖ / aₖ₊₁|。\n\n**思路.** 对固定 x ≠ 0,级数 Σaₖxᵏ 的相邻项之比 |aₖ₊₁x^{k+1}|/|aₖxᵏ| = |x|·|aₖ₊₁/aₖ| → |x|/ρ。由<a class=\"wl\" data-id=\"an_convergenza_assoluta\">比值判别法<\/a>,|x|/ρ < 1 收敛、> 1 发散,得半径 ρ。∎ 实践中,**系数含阶乘或幂时,比值公式通常比根值公式好算**——这与上节「比值比根值易算」一脉相承。\n\n## 例子：算几个收敛半径\n\n**指数级数 Σxᵏ/k!:** aₖ = 1/k!。用比值公式:|aₖ/aₖ₊₁| = (1/k!)/(1/(k+1)!) = (k+1)! / k! = k+1 → ∞。故 **ρ = ∞**,处处收敛——印证了它定义 exp 于整个 ℂ。\n\n**几何级数 Σxᵏ:** aₖ = 1。|aₖ/aₖ₊₁| = 1 → 1,故 **ρ = 1**——印证收敛圆盘是单位圆盘。\n\n**Σk!xᵏ:** aₖ = k!。|aₖ/aₖ₊₁| = k!/(k+1)! = 1/(k+1) → 0,故 **ρ = 0**——只在原点收敛。\n\n**Σxᵏ/k²(以及 Σxᵏ/k):** aₖ = 1/k²。|aₖ/aₖ₊₁| = (k+1)²/k² = (1+1/k)² → 1,故 **ρ = 1**。这两个级数收敛圆盘都是单位圆盘,但边界行为不同(Σxᵏ/k² 在整个边界收敛,Σxᵏ/k 在 x=1 发散)——再次说明边界需单独看。\n\n## 初等函数即将由幂级数定义\n\n收敛半径理论的意义,在于它为「用幂级数定义函数」扫清了最后障碍:**只要算出 ρ > 0,幂级数就在收敛圆盘上定义了一个货真价实的函数**。下一阶段(微分理论之后)将看到:\n\n- **指数函数** exp(x) := Σ xᵏ/k!（ρ = ∞,定义在整个 ℂ）;\n- **正弦、余弦** sin(x) := Σ (−1)ᵏ x^{2k+1}/(2k+1)!,cos(x) := Σ (−1)ᵏ x^{2k}/(2k)!（ρ = ∞）;\n- **对数** log(1+x) := Σ (−1)^{k+1} xᵏ/k（ρ = 1，在单位圆盘内）。\n\n这些定义把初等函数**完全建立在级数(从而极限、完备性)的地基上**,不再依赖几何直觉或「中学的定义」。指数与三角函数的全部性质(exp 的加法定理、sin²+cos²=1、欧拉公式 e^{ix}=cos x+i sin x),都将从幂级数严格推出。这是分析「把熟悉的函数重新严格化」的核心工程,而收敛半径保证了这些级数确实定义了函数。\n\n## 一道激活练习\n\n求下列幂级数的收敛半径 ρ:\n\n(a) Σ_{k=0}^∞ 2ᵏ xᵏ（提示:比值公式,aₖ = 2ᵏ）;\n\n(b) Σ_{k=1}^∞ xᵏ/k!（注:这是 exp 去掉常数项的尾巴,但请独立用比值公式算）;\n\n(c) Σ_{k=0}^∞ xᵏ/2^{k²}（提示:这里比值 aₖ/aₖ₊₁ = 2^{(k+1)²}/2^{k²} = 2^{2k+1} → ∞,故 ρ = ∞;或用根值 ᵏ√|aₖ| = ᵏ√(1/2^{k²}) = 1/2ᵏ → 0,Cauchy–Hadamard 给 ρ = 1/0 = ∞）;\n\n(d) Σ_{k=1}^∞ kᵏ xᵏ（提示:根值公式更顺,ᵏ√|aₖ| = ᵏ√(kᵏ) = k → ∞,故 ρ = 1/∞ = 0）。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** aₖ = 2ᵏ。比值:|aₖ/aₖ₊₁| = 2ᵏ/2^{k+1} = 1/2 → 1/2。故 **ρ = 1/2**。(收敛圆盘 |x| < 1/2;直观:Σ(2x)ᵏ 是公比 2x 的几何级数,|2x| < 1 即 |x| < 1/2 时收敛,一致。)\n\n**(b)** aₖ = 1/k!。比值:|aₖ/aₖ₊₁| = (k+1)!/k! = k+1 → ∞。故 **ρ = ∞**,处处收敛。(与指数级数同,去掉常数项不改收敛半径。)\n\n**(c)** 用根值最直接:ᵏ√|aₖ| = ᵏ√(1/2^{k²}) = (2^{k²})^{−1/k} = 2^{−k} = 1/2ᵏ → 0。由 Cauchy–Hadamard,ρ = 1/(lim sup ᵏ√|aₖ|) = 1/0 = **∞**。处处收敛。(系数衰减极快,2^{k²} 比任何几何级数都快,故收敛域无限大。)\n\n**(d)** 用根值:ᵏ√|aₖ| = ᵏ√(kᵏ) = k → ∞。由 Cauchy–Hadamard,ρ = 1/∞ = **0**。只在原点收敛。(系数 kᵏ 增长极快,压垮任何 xᵏ，x≠0 即发散——与 Σk!xᵏ 同类。)\n\n回顾:求收敛半径的两把工具——**系数含阶乘或简单幂(2ᵏ、1/k!)用比值公式 ρ = lim|aₖ/aₖ₊₁|;系数形如 (k 的函数)ᵏ 或 2^{k²} 这类「k 进入指数」的,用根值/Cauchy–Hadamard ρ = 1/limsup ᵏ√|aₖ|（方根能消掉外层 k 次幂)**。(c)(d) 都是根值更顺的情形。Cauchy–Hadamard 是万能的(对一切幂级数成立),比值公式是它在「比值极限存在」时的便捷特例。\n\n## 往前看一步\n\n收敛半径理论为初等函数的严格定义铺好了路,A–E 第二章「收敛」到此画上句号:从<a class=\"wl\" data-id=\"an_convergenza\">数列收敛<\/a>、<a class=\"wl\" data-id=\"an_cauchy\">完备性<\/a>,到<a class=\"wl\" data-id=\"an_serie\">级数<\/a>、判别法,再到本节的幂级数——「逼近」与「无限求和」的理论完整了。\n\n但幂级数现在还只是「能定义函数」,我们尚不能对它做分析运算——**求导、积分**。下一大块(第三章起)进入**函数的分析**:先是**连续性**(函数极限、连续函数的性质),再是**微分**(导数、微分中值定理)。届时会证明:幂级数在收敛圆盘内可以**逐项求导、逐项积分**,且导数仍是幂级数——这将让我们轻松地从 exp 的级数推出 exp' = exp、从 sin/cos 的级数推出它们的导数关系。而**导数**,正是你那条暂停的物理线一直等待的汇合点:速度是位移的导数、加速度是速度的导数,牛顿力学的语言就是微积分。连续与微分,是分析的下一座山,也是数学与物理重新合流的地方。","refs":"Amann–Escher, Analysis I §II.9"},{"id":"an_sottosuccessioni","label":"子列与聚点","parent":"an_analisi","summary":"子列是从数列里按递增下标挑出的一串;收敛数列的每个子列都收敛到同一极限——由此 (−1)ⁿ 的发散一击可证。聚点是「无穷多项靠近」的值，恰好等于「某个收敛子列的极限」。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#E180D0","ring":3,"bearing":9,"popupLinks":[{"id":"an_convergenza","text":"上一节"},{"id":"num_ricorsione","text":"递归"},{"id":"num_radici_n","text":"良序原理"},{"id":"num_archimede","text":"阿基米德性质"},{"id":"an_valore_assoluto","text":"绝对值"},{"id":"an_algebra_limiti","text":"极限的运算法则"}],"body":"\n## 从一列里挑一串\n\n<a class=\"wl\" data-id=\"an_convergenza\">上一节<\/a>说 (−1)ⁿ「显然发散」,却把严格证明欠了下来。这一节补上——而补它的工具,本身就是分析里极重要的一个概念:**子列**。\n\n直觉很简单:从一个数列里,按原顺序挑出无穷多项,组成一个新数列。比如从 (x₀, x₁, x₂, x₃, …) 里只挑偶数项,得到 (x₀, x₂, x₄, …)。挑的时候有一条铁规矩——**下标必须严格递增**,既不能回头也不能停留。\n\n<svg viewBox=\"0 0 420 130\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"30\" y1=\"70\" x2=\"408\" y2=\"70\" stroke=\"#bbb\" stroke-width=\"1.1\"/>\n  <path d=\"M 408 70 L 400 66 L 400 74 z\" fill=\"#bbb\"/>\n  <text x=\"404\" y=\"58\" font-size=\"11\" fill=\"#888\">原数列下标 n<\/text>\n  <!-- 全项: 灰色小点 -->\n  <g>\n    <circle cx=\"45\" cy=\"70\" r=\"3\" fill=\"#bbb\"/>\n    <circle cx=\"83\" cy=\"70\" r=\"4\" fill=\"#E0612F\"/>\n    <circle cx=\"121\" cy=\"70\" r=\"3\" fill=\"#bbb\"/>\n    <circle cx=\"159\" cy=\"70\" r=\"4\" fill=\"#E0612F\"/>\n    <circle cx=\"197\" cy=\"70\" r=\"4\" fill=\"#E0612F\"/>\n    <circle cx=\"235\" cy=\"70\" r=\"3\" fill=\"#bbb\"/>\n    <circle cx=\"273\" cy=\"70\" r=\"3\" fill=\"#bbb\"/>\n    <circle cx=\"311\" cy=\"70\" r=\"4\" fill=\"#E0612F\"/>\n    <circle cx=\"349\" cy=\"70\" r=\"3\" fill=\"#bbb\"/>\n    <circle cx=\"387\" cy=\"70\" r=\"4\" fill=\"#E0612F\"/>\n  <\/g>\n  <!-- 下标标注 -->\n  <text x=\"45\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#999\">0<\/text>\n  <text x=\"83\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0612F\">1<\/text>\n  <text x=\"121\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#999\">2<\/text>\n  <text x=\"159\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0612F\">3<\/text>\n  <text x=\"197\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0612F\">4<\/text>\n  <text x=\"235\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#999\">5<\/text>\n  <text x=\"273\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#999\">6<\/text>\n  <text x=\"311\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0612F\">7<\/text>\n  <text x=\"349\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#999\">8<\/text>\n  <text x=\"387\" y=\"90\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0612F\">9<\/text>\n  <!-- 子列下标序 -->\n  <text x=\"45\" y=\"34\" font-size=\"11\" fill=\"#555\">挑出的子列(橙):  n₀=1, n₁=3, n₂=4, n₃=7, n₄=9  ——  下标严格递增<\/text>\n  <text x=\"45\" y=\"112\" font-size=\"10\" fill=\"#999\">灰点 = 被跳过的项<\/text>\n<\/svg>\n\n**定义(子列).** 设 (xₙ) 是数列,ψ : ℕ → ℕ 是一个**严格递增**函数（k < l ⟹ ψ(k) < ψ(l)）。则复合 (x_{ψ(k)})_{k∈ℕ} 称 (xₙ) 的一个**子列**(subsequence)。记 n_k := ψ(k),子列写作 (x_{n_k})_{k∈ℕ}，其中 n₀ < n₁ < n₂ < ⋯。\n\n「严格递增」这条有一个一用再用的小推论:**n_k ≥ k 对一切 k 成立**（从 n₀ ≥ 0 出发,每步至少加 1,归纳即得）。意思是「子列的第 k 项,在原数列里的位置不早于 k」——挑选只会让下标走得更快,不会更慢。\n\n## 收敛数列的子列：都去同一个地方\n\n子列的第一条、也是最有用的一条定理:\n\n**定理.** 若 (xₙ) 收敛到 a，则它的**每一个**子列都收敛到 a。\n\n**证明.** 设 (x_{n_k}) 是子列,U 是 a 的任意邻域。因 xₙ → a,存在 N 使 n ≥ N 时 xₙ ∈ U。而 n_k ≥ k,所以只要 k ≥ N,就有 n_k ≥ k ≥ N,于是 x_{n_k} ∈ U。即除前 N 个外,子列的项全在 U 里。故 x_{n_k} → a。∎\n\n一句话:**整列去哪,每串挑出来的子列就去哪。** 这听着平淡,却是一件锋利的武器——因为它的**逆否**给了判断发散的利器:**如果能从一个数列里挑出两个子列、收敛到不同的值,那么原数列必定发散**(否则两个子列都该收敛到同一个极限)。\n\n## (−1)ⁿ 发散：一击即中\n\n现在还上一节的债。\n\n**命题.** 实数列 ((−1)ⁿ) 发散。\n\n**证明.** 看它的两个子列。偶数项子列 ((−1)^{2k})_k = (1, 1, 1, …) 是常数列,收敛到 **1**;奇数项子列 ((−1)^{2k+1})_k = (−1, −1, −1, …) 也是常数列,收敛到 **−1**。\n\n<svg viewBox=\"0 0 420 170\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"55\" y1=\"85\" x2=\"408\" y2=\"85\" stroke=\"#ccc\" stroke-width=\"1\"/>\n  <path d=\"M 408 85 L 400 81 L 400 89 z\" fill=\"#ccc\"/>\n  <text x=\"404\" y=\"102\" font-size=\"11\" fill=\"#888\">n<\/text>\n  <line x1=\"55\" y1=\"45\" x2=\"395\" y2=\"45\" stroke=\"#E0612F\" stroke-width=\"0.8\" stroke-dasharray=\"5,3\"/>\n  <line x1=\"55\" y1=\"125\" x2=\"395\" y2=\"125\" stroke=\"#00A070\" stroke-width=\"0.8\" stroke-dasharray=\"5,3\"/>\n  <text x=\"36\" y=\"49\" font-size=\"12\" fill=\"#E0612F\">+1<\/text>\n  <text x=\"36\" y=\"129\" font-size=\"12\" fill=\"#00A070\">−1<\/text>\n  <!-- 偶子列(橙, 上) -->\n  <g fill=\"#E0612F\">\n    <circle cx=\"67\" cy=\"45\" r=\"3.6\"/><circle cx=\"133\" cy=\"45\" r=\"3.6\"/><circle cx=\"199\" cy=\"45\" r=\"3.6\"/><circle cx=\"265\" cy=\"45\" r=\"3.6\"/><circle cx=\"331\" cy=\"45\" r=\"3.6\"/><circle cx=\"397\" cy=\"45\" r=\"3.6\"/>\n  <\/g>\n  <!-- 奇子列(绿, 下) -->\n  <g fill=\"#00A070\">\n    <circle cx=\"100\" cy=\"125\" r=\"3.6\"/><circle cx=\"166\" cy=\"125\" r=\"3.6\"/><circle cx=\"232\" cy=\"125\" r=\"3.6\"/><circle cx=\"298\" cy=\"125\" r=\"3.6\"/><circle cx=\"364\" cy=\"125\" r=\"3.6\"/>\n  <\/g>\n  <text x=\"200\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#555\">偶子列 → +1，奇子列 → −1，两值不同 ⟹ 原数列发散<\/text>\n<\/svg>\n\n两个子列收敛到不同的极限 1 ≠ −1。若原数列收敛,由上面的定理两个子列都该收敛到同一极限——矛盾。故 ((−1)ⁿ) 发散。∎\n\n对比上一节那个含糊的「显然不收敛」,这里是一行干净的逻辑。**「找两个去向不同的子列」是证明发散的标准手法**,以后遇到振荡型数列都用它。\n\n## 聚点：无穷多项靠近的地方\n\n收敛要求「几乎所有项」靠近一个值;放松一档,只要求「无穷多项」靠近,就得到一个更宽松的概念。\n\n**定义(聚点).** 点 a 称数列 (xₙ) 的一个**聚点**(cluster point)，若 a 的**每一个**邻域都包含 (xₙ) 的**无穷多**项。\n\n把它和收敛并排看,差别只在一个词:\n\n- **收敛到 a**:每个邻域含**几乎所有**项(至多有限个例外);\n- **a 是聚点**:每个邻域含**无穷多**项(但允许无穷多项在外面)。\n\n收敛强,聚点弱:极限必是聚点(几乎所有 ⟹ 无穷多),反之不然。最能说明差别的就是 ((−1)ⁿ):它不收敛(没有极限),却有**两个**聚点 +1 和 −1——任何一个的小邻域里都有无穷多项。一个发散的数列可以有多个聚点,而收敛数列(<a class=\"wl\" data-id=\"an_convergenza\">上一节<\/a>证过)只有唯一聚点,就是它的极限。\n\n看一个两个聚点的数列 (它在 +1 与 −1 附近各聚集无穷多项,但谁也不是极限):\n\n<svg viewBox=\"0 0 420 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"55\" y1=\"105\" x2=\"408\" y2=\"105\" stroke=\"#ddd\" stroke-width=\"1\"/>\n  <path d=\"M 408 105 L 400 101 L 400 109 z\" fill=\"#ddd\"/>\n  <text x=\"404\" y=\"122\" font-size=\"11\" fill=\"#888\">n<\/text>\n  <!-- 两条聚集线 + ε带 -->\n  <rect x=\"55\" y=\"58\" width=\"330\" height=\"24\" fill=\"#E0612F\" opacity=\"0.09\"/>\n  <rect x=\"55\" y=\"128\" width=\"330\" height=\"24\" fill=\"#00A070\" opacity=\"0.09\"/>\n  <line x1=\"55\" y1=\"70\" x2=\"390\" y2=\"70\" stroke=\"#E0612F\" stroke-width=\"0.8\" stroke-dasharray=\"5,3\"/>\n  <line x1=\"55\" y1=\"140\" x2=\"390\" y2=\"140\" stroke=\"#00A070\" stroke-width=\"0.8\" stroke-dasharray=\"5,3\"/>\n  <text x=\"40\" y=\"74\" font-size=\"12\" fill=\"#E0612F\">+1<\/text>\n  <text x=\"40\" y=\"144\" font-size=\"12\" fill=\"#00A070\">−1<\/text>\n  <!-- 偶项聚于+1(上方衰减) -->\n  <g fill=\"#E0612F\">\n    <circle cx=\"65\" cy=\"28\" r=\"3.3\"/><circle cx=\"121\" cy=\"46\" r=\"3.3\"/><circle cx=\"177\" cy=\"55\" r=\"3.3\"/><circle cx=\"232\" cy=\"59\" r=\"3.3\"/><circle cx=\"288\" cy=\"61\" r=\"3.3\"/><circle cx=\"344\" cy=\"63\" r=\"3.3\"/>\n  <\/g>\n  <!-- 奇项聚于-1(下方衰减) -->\n  <g fill=\"#00A070\">\n    <circle cx=\"93\" cy=\"173\" r=\"3.3\"/><circle cx=\"149\" cy=\"158\" r=\"3.3\"/><circle cx=\"205\" cy=\"152\" r=\"3.3\"/><circle cx=\"260\" cy=\"150\" r=\"3.3\"/><circle cx=\"316\" cy=\"148\" r=\"3.3\"/><circle cx=\"372\" cy=\"146\" r=\"3.3\"/>\n  <\/g>\n  <text x=\"210\" y=\"192\" font-size=\"11\" text-anchor=\"middle\" fill=\"#555\">两个聚点 ±1：每条带里都有无穷多项，但都不是极限<\/text>\n<\/svg>\n\n## 聚点 = 某个收敛子列的极限\n\n聚点和子列之间有一座漂亮的桥——它把「无穷多项靠近」翻译成「挑得出一串真正收敛过去的子列」。\n\n**定理.** a 是 (xₙ) 的聚点 当且仅当 (xₙ) 有一个子列收敛到 a。\n\n**证明.** （⟸）设子列 x_{n_k} → a。任取 a 的邻域 U,则除有限个 k 外 x_{n_k} ∈ U——这已经是无穷多项落在 U 里。故 a 是聚点。\n\n（⟹）设 a 是聚点。要**造**一个收敛到 a 的子列,用<a class=\"wl\" data-id=\"num_ricorsione\">递归<\/a>逐个挑选,每次把精度收紧一档:\n\n令 n₀ := 0。已选定 n_{k−1} 后,令\n\nn_k := min{ m ∈ ℕ : m > n_{k−1} 且 x_m ∈ B(a, 1/k) }。\n\n这个 min 存在吗?要点正是「聚点」:B(a, 1/k) 是 a 的邻域,含**无穷多**项,所以「下标 > n_{k−1} 且落进 B(a,1/k)」的项必然还有(无穷多项里只排除了有限个前置下标),这样的 m 组成 ℕ 的非空子集,由<a class=\"wl\" data-id=\"num_radici_n\">良序原理<\/a>有最小元。于是 n_k 有定义,且 n_k > n_{k−1}（下标严格递增,确是子列）。\n\n收敛性:对一切 k ≥ 1,x_{n_k} ∈ B(a, 1/k),即 d(x_{n_k}, a) < 1/k。给定 ε > 0,由<a class=\"wl\" data-id=\"num_archimede\">阿基米德性质<\/a>取 K 使 1/K < ε,则 k ≥ K 时 d(x_{n_k}, a) < 1/k ≤ 1/K < ε。故 x_{n_k} → a。∎\n\n这条定理的份量在于它的**构造**:聚点不只是「附近有无穷多项」的静态描述,它保证你能**主动挑出**一条收敛的路径走过去。「每次把邻域半径收到 1/k、在剩下的无穷多项里挑下一个」——这个递归挑选的手法,以后证 Bolzano–Weierstrass 定理(有界数列必有收敛子列)时还会用到,是分析里\"从聚集提取收敛\"的标准动作。\n\n> 顺带澄清一个易错点:「有唯一聚点」**不**等于「收敛」。数列 (½, 2, ⅓, 3, ¼, 4, …) ——奇数位置趋于 0、偶数位置趋于无穷——只有一个聚点 0(任何 0 的邻域含无穷多个 1/n),却发散(偶数位的项跑向无穷,不可能几乎所有项都靠近 0)。收敛 = 有唯一聚点 **且** 数列有界,缺一不可。\n\n## 一道激活练习\n\n(a) 写出数列 (xₙ)，xₙ := (−1)ⁿ + 1/n 的所有聚点,并各指出一个收敛到它的子列。\n\n(b) 证明数列 xₙ := sin(nπ/2)（即 0, 1, 0, −1, 0, 1, 0, −1, …）发散,并列出它的全部聚点。\n\n(c) 证明:若 (xₙ) 收敛到 a，而 (y_k) 是 (xₙ) 的任意子列,则 (xₙ) 与 (y_k) 有**完全相同**的聚点集（都是 {a}）。（这说明对收敛数列,取子列不改变聚点——但对发散数列,子列可能丢掉聚点。）\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** xₙ = (−1)ⁿ + 1/n。偶子列 x_{2k} = 1 + 1/(2k) → 1;奇子列 x_{2k+1} = −1 + 1/(2k+1) → −1。所以聚点是 **1 和 −1**:偶下标子列收敛到 1,奇下标子列收敛到 −1。（没有别的聚点:任何远离 ±1 的点,其小邻域只含有限项。）\n\n**(b)** 数列循环为 0, 1, 0, −1, 0, 1, 0, −1, …(周期 4)。下标 n = 4k+1 的子列恒为 1 → 1;下标 n = 4k+3 的子列恒为 −1 → −1。两个子列收敛到不同值,故原数列**发散**。全部聚点:**0, 1, −1**——下标 ≡ 0,2 (mod 4) 的项恒为 0(子列 → 0),≡1 的恒为 1,≡3 的恒为 −1;这三个值的邻域各含无穷多项,而其余任何点的小邻域只含有限项(实际为零项)。\n\n**(c)** 因 (xₙ) 收敛到 a,由<a class=\"wl\" data-id=\"an_convergenza\">唯一聚点定理<\/a>它的聚点集是 {a}。而 (y_k) 作为 (xₙ) 的子列,由本节定理也收敛到 a(收敛数列的子列同极限),所以 (y_k) 也收敛,其聚点集同样是 {a}。两者聚点集都是 {a},相同。∎（注:对发散数列这会失败——如从 ((−1)ⁿ) 取偶子列,聚点集从 {−1,+1} 缩成 {+1},子列丢掉了一个聚点。）\n\n回顾:求聚点的通用套路是**按下标的周期或奇偶把数列拆成几个子列,看每个子列各自趋于什么**——每个收敛子列的极限是一个聚点,反过来每个聚点也来自某个收敛子列(本节的桥)。振荡数列的聚点,基本都靠这种「拆子列」找出来。\n\n## 往前看一步\n\n子列与聚点补全了收敛理论的「定性」一面：极限唯一、发散可判、聚集可提取。但我们验证收敛仍然只能逐个回到 ε–N 定义,手动找 N——太笨重。下一节转入「定量」的便利:**极限的运算法则**。若 xₙ → a、yₙ → b,则它们的和、差、积、商的极限,就是 a、b 的和、差、积、商。有了这套法则,复杂数列的极限可以像代数式一样**逐步拆解计算**,不必每次回到定义。而证明这些法则,用的正是<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>那节反复练习的「拆项 + 三角不等式 + 控制因子」——那些静态的估计技巧,即将在动态的极限里全部派上用场。这就是 <a class=\"wl\" data-id=\"an_algebra_limiti\">极限的运算法则<\/a> 的内容。","refs":"Amann–Escher, Analysis I §II.1"},{"id":"an_spazio_metrico","label":"度量空间","parent":"an_analisi","summary":"把绝对值真正用到的三条性质（重合才为零、对称、三角不等式）提炼成「距离」的公理，得到度量空间;它是收敛、连续、极限的统一舞台，ℝ、ℝⁿ、函数空间都是其特例。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#BB8DF4","ring":1,"bearing":20,"popupLinks":[{"id":"an_valore_assoluto","text":"绝对值"},{"id":"num_n","text":"Peano 公理"},{"id":"an_convergenza","text":"数列的收敛"}],"body":"\n## 从「绝对值」到「距离」\n\n<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>那节,我们用 |x − y| 度量了实数轴上两点的远近,并摸清了它的全部性质。现在做一次关键的抽象。\n\n回头看「逼近」这件事——一列数 x₀, x₁, x₂, … 越来越靠近某个值 a——它的本质是「**距离** |xₙ − a| 越来越小」。但仔细想:证明这类逼近时,我们真正用到的,是 |x − y| 的哪些性质?不是它「等于 x−y 或 y−x」这个具体定义,而是三条结构性的事实:\n\n- 距离非负,且**仅当两点重合时为零**;\n- 距离**对称**:x 到 y 与 y 到 x 一样远;\n- **三角不等式**:从 x 直接到 y,不比绕道 z 更远。\n\n只要一个「距离」满足这三条,逼近的全部理论就能在它上面展开——**不管被度量的对象是实数、复数、平面上的点、还是一个函数**。把这三条提炼成公理,就得到分析、拓扑、泛函分析共同的舞台:**度量空间**。\n\n## 定义\n\n**定义.** 设 X 是一个集合。函数 d : X × X → ℝ₊（ℝ₊ 表示非负实数）称为 X 上的一个**度量**(metric)，若满足:\n\n- **(M1)** d(x, y) = 0 ⟺ x = y；\n- **(M2)** d(x, y) = d(y, x)，对一切 x, y ∈ X（**对称性**）；\n- **(M3)** d(x, y) ≤ d(x, z) + d(z, y)，对一切 x, y, z ∈ X（**三角不等式**）。\n\n此时称序偶 (X, d) 为一个**度量空间**(metric space)；当度量从上下文清楚时,简记为 X。d(x, y) 称为点 x 与 y 之间的**距离**(distance)。\n\n三条公理都是「距离」该有的自然性质。值得专门点出 (M3) 的读法:它正是「从 x 到 y 的直达路程,不超过先到 z 再到 y 的折线路程」——三角形两边之和不小于第三边。这条几何直觉,在<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>那节已经以 |x+y| ≤ |x|+|y| 的形式见过;现在它升级成任意度量空间的公理。\n\n（注意定义里**没有**要求 X 自带加法、乘法或序——度量空间的元素可以是任何东西,只要两两之间能赋一个满足三条的「距离」。这正是抽象的威力:它剥离了「数」的代数结构,只保留「远近」。）\n\n## 例子\n\n**(a) ℝ 的自然度量。** 取 X = ℝ，定义\n\nd(x, y) := |x − y|。\n\n三条公理逐一来自<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>的性质:(M1) 即 |x−y| = 0 ⟺ x = y（绝对值性质 iv）；(M2) 即 |x−y| = |y−x|（绝对值性质 ii，|−t| = |t|）；(M3) 即 |x−y| ≤ |x−z| + |z−y|，把绝对值的三角不等式用在 (x−z) + (z−y) = x−y 上即得。这是我们最熟悉的度量空间,也是后面一切的原型。**今后谈到 ℝ,默认配这个自然度量。**\n\n**(b) 离散度量。** 设 X 是任意非空集合,定义\n\nd(x, y) := 1（若 x ≠ y）, d(x, x) := 0。\n\n验证:(M1) 显然(按定义,距离为 0 当且仅当两点相同);(M2) 对称(x≠y 与 y≠x 同义);(M3) 三角不等式——左边 d(x,y) 至多是 1,右边 d(x,z) + d(z,y) 若 x≠y 则 z 不可能同时等于 x 和 y,故右边至少一项为 1,≥ 1 ≥ 左边;若 x=y 左边为 0,自然 ≤ 右边。这个度量把任何集合都变成度量空间——哪怕集合元素之间毫无「天然的远近」可言。它说明:**度量是附加在集合上的结构,不是集合自带的**;同一个集合可以配不同的度量。\n\n**(c) 子空间度量。** 设 (X, d) 是度量空间,Y ⊆ X 非空。把 d 限制在 Y × Y 上,记 d_Y,它显然仍满足三条公理(公理对 Y 中的点照样成立)。于是 (Y, d_Y) 也是度量空间,称 X 的**度量子空间**(metric subspace)。例如闭区间 [0, 1] 配 ℝ 的自然度量,就是 ℝ 的一个度量子空间。这条让我们能把大空间的距离「继承」到任何子集上。\n\n> **预告几个重要例子。** 将来会看到:平面 ℝ²、空间 ℝ³ 乃至 ℝⁿ,配欧氏距离 d(x,y) = √(Σ(xᵢ−yᵢ)²),是度量空间——这是几何直觉里「两点间直线距离」的严格版;复数 ℂ 配 d(z,w) = |z−w|（待 ℂ 构造后）也是;甚至「一段区间上的全体连续函数」配上某种「函数间的距离」,也构成度量空间——那是泛函分析的起点。**同一套极限理论,将一次性覆盖所有这些**,这正是抽象成度量空间的回报。\n\n## 球与邻域\n\n有了距离,就能谈「某点附近」。两个基本概念:\n\n**定义(球).** 在度量空间 (X, d) 中,对 a ∈ X 与 r > 0：\n\n- **开球**(open ball) B(a, r) := { x ∈ X : d(a, x) < r }（到 a 的距离**严格小于** r 的点）；\n- **闭球**(closed ball) B̄(a, r) := { x ∈ X : d(a, x) ≤ r }（距离 ≤ r）。\n\n在 ℝ 的自然度量下,开球 B(a, r) = { x : |x − a| < r } 正是开区间 (a − r, a + r)——回到<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>那条 ε-带刻画。所以「球」是「区间」在一般度量空间里的推广;在 ℝ² 里它是真正的圆盘,在 ℝ³ 里是球体,名字由此而来。下图并列 ℝ 上的开球(区间)与 ℝ² 上的开球(圆盘):\n\n<svg viewBox=\"0 0 380 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 左:ℝ 上的开球 = 区间 -->\n  <text x=\"95\" y=\"30\" font-size=\"12\" text-anchor=\"middle\" fill=\"#555\">ℝ 中的 B(a, r)<\/text>\n  <rect x=\"40\" y=\"144\" width=\"110\" height=\"12\" fill=\"#E0612F\" opacity=\"0.13\"/>\n  <line x1=\"20\" y1=\"150\" x2=\"175\" y2=\"150\" stroke=\"#888\" stroke-width=\"1.3\"/>\n  <path d=\"M 175 150 L 167 146 L 167 154 z\" fill=\"#888\"/>\n  <circle cx=\"95\" cy=\"150\" r=\"3.5\" fill=\"#555\"/>\n  <text x=\"95\" y=\"172\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">a<\/text>\n  <circle cx=\"40\" cy=\"150\" r=\"4\" fill=\"white\" stroke=\"#E0612F\" stroke-width=\"1.5\"/>\n  <circle cx=\"150\" cy=\"150\" r=\"4\" fill=\"white\" stroke=\"#E0612F\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"172\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0612F\">a−r<\/text>\n  <text x=\"150\" y=\"172\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0612F\">a+r<\/text>\n  <text x=\"122\" y=\"138\" font-size=\"10\" fill=\"#E0612F\">r<\/text>\n  <line x1=\"95\" y1=\"134\" x2=\"150\" y2=\"134\" stroke=\"#E0612F\" stroke-width=\"0.8\" stroke-dasharray=\"3,2\"/>\n  <!-- 分隔 -->\n  <line x1=\"200\" y1=\"30\" x2=\"200\" y2=\"185\" stroke=\"#e5e5e5\" stroke-width=\"1\"/>\n  <!-- 右:ℝ² 上的开球 = 圆盘 -->\n  <text x=\"290\" y=\"30\" font-size=\"12\" text-anchor=\"middle\" fill=\"#555\">ℝ² 中的 B(a, r)<\/text>\n  <circle cx=\"290\" cy=\"95\" r=\"55\" fill=\"#E0612F\" opacity=\"0.10\" stroke=\"#E0612F\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/>\n  <circle cx=\"290\" cy=\"95\" r=\"3.5\" fill=\"#555\"/>\n  <text x=\"290\" y=\"113\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">a<\/text>\n  <line x1=\"290\" y1=\"95\" x2=\"335\" y2=\"127\" stroke=\"#E0612F\" stroke-width=\"1.4\"/>\n  <text x=\"306\" y=\"106\" font-size=\"11\" fill=\"#E0612F\">r<\/text>\n  <circle cx=\"310\" cy=\"77\" r=\"3\" fill=\"#5A5FE0\"/>\n  <text x=\"316\" y=\"74\" font-size=\"11\" fill=\"#5A5FE0\">x<\/text>\n<\/svg>\n\n虚线圆周表示「开」球——边界上的点(距离恰为 r)**不属于**球,正如开区间不含端点。图中 x 是球内一点,d(a, x) < r。\n\n**定义(邻域).** 集合 U ⊆ X 称为点 a 的一个**邻域**(neighborhood)，若存在某个 r > 0 使 B(a, r) ⊆ U。a 的全体邻域记作 𝒰(a)。\n\n直觉:U 是 a 的邻域,意思是「U 包含了 a 周围一整片小区域」——a 不在 U 的边缘,而是被 U 整个裹住。最基本的邻域就是球本身:对任意 ε > 0,B(a, ε) 是 a 的邻域(称 a 的 **ε-邻域**)。\n\n邻域有两条以后常用的简单性质:**X 自己是任何点的邻域**(取任意 r 即可);**两个邻域的交仍是邻域**(若 B(a, r₁) ⊆ U₁、B(a, r₂) ⊆ U₂，取 r = min(r₁, r₂)，则 B(a, r) ⊆ U₁ ∩ U₂)。后一条以后定义极限、证明唯一性时会反复用到——它本质上是「同时满足两个『足够近』的要求,只需取更严的那个」。\n\n## 度量的反向三角不等式\n\n<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>有反向三角不等式;一般度量也有对应版本,证明方式相同。\n\n**命题.** 在度量空间 (X, d) 中,对一切 x, y, z：\n\nd(x, y) ≥ | d(x, z) − d(z, y) |。\n\n**证明.** 由三角不等式 (M3)，d(x, z) ≤ d(x, y) + d(y, z)，移项（并用对称性 d(y,z)=d(z,y)）得\n\nd(x, z) − d(z, y) ≤ d(x, y)。\n\n把 x 与 y 互换,同理得 d(y, z) − d(z, x) ≤ d(y, x) = d(x, y)，即 −( d(x,z) − d(z,y) ) ≤ d(x, y)。两个不等式合起来:d(x,y) 同时 ≥ ( d(x,z)−d(z,y) ) 与其相反数,即 ≥ 其绝对值。∎\n\n它的用处与绝对值版一致:估计「两个距离之差」。在收敛理论里,证「若 xₙ → a 则 d(xₙ, b) → d(a, b)」这类连续性,一行就靠它。\n\n## 一道激活练习\n\n设 X = ℝ。判断下列函数是否为 ℝ 上的度量;是则验证三条公理,不是则指出违反了哪一条。\n\n(a) d₁(x, y) := (x − y)²；\n(b) d₂(x, y) := |x − y| 当 x ≠ y，d₂(x, x) := 0（提示：这其实是哪个例子？）；\n(c) d₃(x, y) := | √|x| − √|y| |。（注意它在某些不同点上可能为零。）\n\n（提示:重点查 (M1) 的「⟸ 与 ⟹ 双向」和 (M3)。(a) 试 x=0, y=2, z=1，算算三角不等式两边。(c) 找两个不同的 x、y 使 d₃(x,y)=0。）\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a) 不是度量**，违反 (M3)。取 x = 0, z = 1, y = 2：左边 d₁(0,2) = (0−2)² = 4；右边 d₁(0,1) + d₁(1,2) = 1 + 1 = 2。4 ≤ 2 不成立，三角不等式破。（(M1)(M2) 其实满足，但一条不过即出局。这也说明「把距离平方」会破坏度量结构——根号在欧氏距离里不是可有可无的。）\n\n**(b) 是度量**——它就是 ℝ 的**自然度量** |x−y|，只是分了段写：x ≠ y 时取 |x−y|，x = y 时取 0，而 |x−y| 在 x = y 时本来就等于 0。两种情形拼起来，d₂(x,y) = |x−y| 对一切 x, y 成立。所以 d₂ 与自然度量是**同一个函数**，三条公理同例子 (a)。（这一问的用意：换一种分段写法并不改变函数本身——别被「看起来像新定义」骗到。）\n\n**(c) 不是度量**，违反 (M1) 的「⟹」方向。取 x = 1, y = −1：d₃(1,−1) = | √|1| − √|−1| | = |1 − 1| = 0，但 1 ≠ −1。距离为零却非同一点，(M1) 破。（根源：√|·| 把 x 与 −x 映到同一个值，抹掉了符号信息，于是「距离」分不开这两个点。(M2)(M3) 其实都满足，但 (M1) 不过即出局。）\n\n回顾：判定度量，最易出问题的是 (M1) 的「距离为零 ⟹ 两点相同」（要求度量能**分开**任何两个不同的点）和 (M3)（三角不等式，常因「平方」「开根」之类的非线性变形而破）。这三条公理看着温和，但每一条都在拦截一类「看似距离、实则不够格」的函数——这与当初 <a class=\"wl\" data-id=\"num_n\">Peano 公理<\/a> 每条拦截一个赝品数系，是同一种「公理由反例划界」的思路。\n\n## 往前看一步\n\n舞台搭好了:度量空间给了「距离」一个统一的抽象,球与邻域给了「附近」一个精确的说法。现在可以正式定义这一切的目标——**收敛**。一列点 x₀, x₁, x₂, … 收敛到 a，直观上是「越往后,点越靠近 a」；用邻域的语言,这将被精确表述为「a 的**每一个**邻域,都包含**几乎所有**的项（即除有限个外的全部）」。这个定义一旦立起，「极限」就从模糊的直觉变成可以证明的对象，而它在 ℝ、在 ℝⁿ、在任何度量空间里都一字不变。这就是 <a class=\"wl\" data-id=\"an_convergenza\">数列的收敛<\/a> 的内容——我们终于抵达极限理论的正门。","refs":"Amann–Escher, Analysis I §II.1"},{"id":"an_succ_complesse","label":"复数列的收敛","parent":"an_analisi","summary":"复数列 (zₙ) 收敛 当且仅当 实部 (Re zₙ) 与虚部 (Im zₙ) 分别收敛,且 lim zₙ = lim Re zₙ + i·lim Im zₙ——把复数列的收敛拆成两个实数列的收敛。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#E47FCB","ring":4,"bearing":1,"popupLinks":[{"id":"an_convergenza","text":"收敛"},{"id":"alg_complessi","text":"ℂ"},{"id":"an_valore_assoluto","text":"反向三角不等式"},{"id":"an_algebra_limiti","text":"和法则"},{"id":"an_confronto","text":"夹逼"},{"id":"an_sottosuccessioni","text":"子列"},{"id":"an_monotone","text":"单调收敛定理"}],"body":"\n## 把复数列拆成两个实数列\n\n<a class=\"wl\" data-id=\"an_convergenza\">收敛<\/a>的定义对 <a class=\"wl\" data-id=\"alg_complessi\">ℂ<\/a> 一字通用——复数列 (zₙ) 收敛到 a,就是 |zₙ − a| → 0。但 ℂ 没有序,夹逼用不上,运算法则虽然能用却常嫌笨重。这一节给出一个把复数列收敛**完全转译**成实数列收敛的判据:只需分别看实部和虚部。这样一来,ℂ 上的极限问题就化归到熟悉的 ℝ 上,前面所有实数列的工具(运算法则、夹逼)都能间接用上。\n\n先补一条对 ℝ、ℂ 都成立的小结论。\n\n**命题(模的连续性).** 若 zₙ → a(在 K 中),则 |zₙ| → |a|。\n\n**证明.** 给定 ε > 0,取 N 使 n ≥ N 时 |zₙ − a| < ε。由<a class=\"wl\" data-id=\"an_valore_assoluto\">反向三角不等式<\/a>,\n\n| |zₙ| − |a| | ≤ |zₙ − a| < ε，  n ≥ N。\n\n故 |zₙ| → |a|。∎\n\n（这条<a class=\"wl\" data-id=\"an_convergenza\">上一节练习<\/a>在实数情形证过;反向三角不等式对复数的模同样成立,所以证明一字不变。它说「取模」这个操作不破坏收敛——逼近 a 的点,其到原点的距离也逼近 a 到原点的距离。）\n\n## 主定理：实部虚部分别收敛\n\n**定理.** 设 (zₙ) 是复数列。则以下等价:\n\n(i) (zₙ) 收敛;\n(ii) 实部 (Re zₙ) 与虚部 (Im zₙ) 都收敛(作为实数列)。\n\n且此时\n\nlim zₙ = lim (Re zₙ) + i·lim (Im zₙ)。\n\n几何上,这再自然不过:把 zₙ 看成平面上的点,它趋近 a,等价于它的**横坐标趋近 a 的横坐标、纵坐标趋近 a 的纵坐标**——平面上的逼近,就是两个方向上的逼近同时发生。\n\n<svg viewBox=\"0 0 380 300\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 轴 -->\n  <line x1=\"50\" y1=\"230\" x2=\"288\" y2=\"230\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <line x1=\"70\" y1=\"249\" x2=\"70\" y2=\"68\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <path d=\"M 288 230 L 280 226 L 280 234 z\" fill=\"#888\"/>\n  <path d=\"M 70 68 L 66 76 L 74 76 z\" fill=\"#888\"/>\n  <text x=\"292\" y=\"234\" font-size=\"11\" fill=\"#555\">Re<\/text>\n  <text x=\"58\" y=\"76\" font-size=\"11\" fill=\"#555\">Im<\/text>\n  <!-- 刻度 -->\n  <line x1=\"165\" y1=\"227\" x2=\"165\" y2=\"233\" stroke=\"#888\" stroke-width=\"0.8\"/>\n  <text x=\"165\" y=\"245\" font-size=\"10\" text-anchor=\"middle\" fill=\"#999\">1<\/text>\n  <line x1=\"260\" y1=\"227\" x2=\"260\" y2=\"233\" stroke=\"#888\" stroke-width=\"0.8\"/>\n  <text x=\"260\" y=\"245\" font-size=\"10\" text-anchor=\"middle\" fill=\"#999\">2<\/text>\n  <line x1=\"67\" y1=\"135\" x2=\"73\" y2=\"135\" stroke=\"#888\" stroke-width=\"0.8\"/>\n  <text x=\"60\" y=\"139\" font-size=\"10\" text-anchor=\"end\" fill=\"#999\">i<\/text>\n  <!-- 极限 a -->\n  <circle cx=\"184\" cy=\"144\" r=\"4.5\" fill=\"#E0612F\"/>\n  <text x=\"192\" y=\"140\" font-size=\"12\" fill=\"#E0612F\">a<\/text>\n  <!-- a 的投影 -->\n  <line x1=\"184\" y1=\"144\" x2=\"184\" y2=\"230\" stroke=\"#E0612F\" stroke-width=\"0.8\" stroke-dasharray=\"3,3\"/>\n  <line x1=\"184\" y1=\"144\" x2=\"70\" y2=\"144\" stroke=\"#E0612F\" stroke-width=\"0.8\" stroke-dasharray=\"3,3\"/>\n  <circle cx=\"184\" cy=\"230\" r=\"3\" fill=\"#E0612F\" opacity=\"0.7\"/>\n  <circle cx=\"70\" cy=\"144\" r=\"3\" fill=\"#E0612F\" opacity=\"0.7\"/>\n  <text x=\"184\" y=\"262\" font-size=\"9\" text-anchor=\"middle\" fill=\"#E0612F\">Re a<\/text>\n  <text x=\"44\" y=\"148\" font-size=\"9\" fill=\"#E0612F\">Im a<\/text>\n  <!-- 螺旋数列点 -->\n  <polyline points=\"221,73 160,112 157,149 178,164 195,156 197,140 186,133 176,139 176,149\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"0.9\" opacity=\"0.45\"/>\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"221\" cy=\"73\" r=\"2.8\"/><circle cx=\"160\" cy=\"112\" r=\"2.8\"/><circle cx=\"157\" cy=\"149\" r=\"2.8\"/><circle cx=\"178\" cy=\"164\" r=\"2.8\"/><circle cx=\"195\" cy=\"156\" r=\"2.8\"/><circle cx=\"197\" cy=\"140\" r=\"2.8\"/><circle cx=\"186\" cy=\"133\" r=\"2.8\"/><circle cx=\"176\" cy=\"139\" r=\"2.8\"/><circle cx=\"176\" cy=\"149\" r=\"2.8\"/><\/g>\n  <text x=\"225\" y=\"70\" font-size=\"10\" fill=\"#5A5FE0\">zₙ<\/text>\n  <text x=\"200\" y=\"290\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">zₙ 在平面上趋近 a ⟺ 两个坐标投影各自趋近 Re a、Im a<\/text>\n<\/svg>\n\n**证明.** 关键是两组不等式,把「复数的模」与「实部虚部的绝对值」互相控制。对任意 z = x + iy(x = Re z,y = Im z):\n\n|Re z| ≤ |z|,  |Im z| ≤ |z|，  且   |z| ≤ |Re z| + |Im z|。\n\n前两条来自<a class=\"wl\" data-id=\"alg_complessi\">模的性质<\/a>(|x| = √(x²) ≤ √(x²+y²) = |z|);第三条由 |z| = √(x²+y²) ≤ √(x²) + √(y²) = |x| + |y|（或三角不等式）。\n\n**(i) ⟹ (ii).** 设 zₙ → a,记 a = Re a + i·Im a。由前两条不等式(用在 zₙ − a 上):\n\n|Re zₙ − Re a| = |Re(zₙ − a)| ≤ |zₙ − a|，\n\n而 |zₙ − a| → 0,由「被零数列压住」,|Re zₙ − Re a| → 0,即 Re zₙ → Re a。虚部同理 Im zₙ → Im a。\n\n**(ii) ⟹ (i).** 设 Re zₙ → α、Im zₙ → β,令 a := α + iβ。由第三条不等式(用在 zₙ − a 上):\n\n|zₙ − a| ≤ |Re zₙ − α| + |Im zₙ − β|，\n\n右边两项都是零数列,其和也是零数列(<a class=\"wl\" data-id=\"an_algebra_limiti\">和法则<\/a>),故 |zₙ − a| → 0,即 zₙ → a。\n\n两个方向都成立,且极限 a = α + iβ = lim Re zₙ + i·lim Im zₙ。∎\n\n这条定理的实际意义:**复数列的收敛,被一劳永逸地化简成两个实数列的收敛**。算复数列极限时,拆出实部虚部,各自用实数列的工具(运算法则、夹逼)算清,再用 lim zₙ = lim Re + i·lim Im 拼回去。下面是范例。\n\n## 一个例子\n\n求 lim zₙ,其中 zₙ = (n+1)/(n+2) + i·(2n²)/(n²+1)。\n\n拆开看两部分。实部 Re zₙ = (n+1)/(n+2),<a class=\"wl\" data-id=\"an_algebra_limiti\">上一节<\/a>算过 → 1。虚部 Im zₙ = (2n²)/(n²+1),分子分母同除 n²:2/(1 + 1/n²) → 2/(1+0) = 2(运算法则)。两部分都收敛,由定理\n\nlim zₙ = 1 + i·2 = 1 + 2i。∎\n\n整个过程没碰一次复数的 ε–N——拆成两个实数列,各自用熟悉的法则,拼回去。\n\n## 一道激活练习\n\n用实部虚部判据求下列复数列的极限(或判定发散):\n\n(a) zₙ = (3n)/(n+1) + i·(1 − 1/n)；\n(b) zₙ = (1/n)·(cos n + i·sin n)（提示:实部虚部各自夹逼;cos、sin 有界）；\n(c) zₙ = iⁿ（提示:看它的实部数列 Re(iⁿ) 是什么——回忆 <a class=\"wl\" data-id=\"alg_complessi\">i 的四周期<\/a>;这个实部数列收敛吗？）。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 实部 (3n)/(n+1) = 3/(1+1/n) → 3。虚部 1 − 1/n → 1。两部分都收敛,故 **lim zₙ = 3 + i**。\n\n**(b)** 实部 (cos n)/n:由 −1 ≤ cos n ≤ 1 得 −1/n ≤ (cos n)/n ≤ 1/n,<a class=\"wl\" data-id=\"an_confronto\">夹逼<\/a>给 → 0。虚部 (sin n)/n 同理 → 0。两部分都 → 0,故 **lim zₙ = 0 + 0i = 0**。\n\n**(c)** zₙ = iⁿ 循环取值 1, i, −1, −i, 1, i, …（<a class=\"wl\" data-id=\"alg_complessi\">i 的四周期<\/a>）。看实部数列 Re(iⁿ):依次是 Re(1)=1, Re(i)=0, Re(−1)=−1, Re(−i)=0,即 1, 0, −1, 0, 1, 0, −1, 0, …——这个实数列有三个聚点 1, 0, −1,**发散**(<a class=\"wl\" data-id=\"an_sottosuccessioni\">子列<\/a>判据:取下标 ≡0 (mod 4) 的子列恒为 1、≡2 的恒为 −1,两子列极限不同)。实部都不收敛,由本节定理,(iⁿ) **发散**。∎（这也印证了<a class=\"wl\" data-id=\"alg_complessi\">i 的四周期<\/a>:iⁿ 永远在四个值间跳,不向任何单点靠拢。）\n\n回顾:复数列收敛与否,全看实部虚部两个实数列——**有一个发散,整个复数列就发散**(如 (c));两个都收敛,极限就是两个实极限拼成的复数。这把 ℂ 上所有收敛问题,都拉回了 ℝ 的地盘。\n\n## 往前看一步\n\n§II.2 的运算法则到此完整:实数列的和差积商与序(夹逼),复数列的实虚拆分,都已就位。但所有这些工具有一个共同的前提——**它们只能处理已知收敛、或能被夹住的数列**。还有一大类数列,我们能看出它「在往一个方向走」,却既拆不开、也找不到夹板,比如单调递增有上界的 (1 + 1/n)ⁿ。要断定这类数列收敛,运算法则和夹逼都无能为力,必须回到 ℝ 最深的性质:**完备性**。下一节,完备性将第一次在极限理论里正面登场——证明「单调递增且有上界的实数列必收敛」。这就是 <a class=\"wl\" data-id=\"an_monotone\">单调收敛定理<\/a> 的内容,也是通向 e
