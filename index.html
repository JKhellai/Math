用,是因为**任何收敛问题都能平移成零数列问题**:\n\n**命题(平移).** xₙ → a 当且仅当 (xₙ − a) 是零数列。\n\n**证明.** 两者的 ε–N 条件逐字相同:|xₙ − a| < ε 既是「xₙ → a」的定义,也是「xₙ − a → 0」的定义。∎\n\n所以「证 xₙ → a」永远可以改成「证 xₙ − a → 0」。下面证积、商法则时,这个改写是核心技巧——把「逼近 ab」拆解成若干个「逼近 0」的零数列之和。零数列还有一条立刻要用的小性质:**若实数零数列 (rₙ) 满足 |xₙ| ≤ rₙ(几乎所有 n),则 (xₙ) 也是零数列**(被一个趋于 0 的东西压住,自己也趋于 0;由 |xₙ| ≤ rₙ < ε 即得)。\n\n## 和与数乘\n\n最简单的两条,直接由三角不等式得到。\n\n**命题.** 设 xₙ → a，yₙ → b，α ∈ K。则 (i) xₙ + yₙ → a + b；(ii) α·xₙ → α·a。\n\n**证明.** (i) 给定 ε > 0。因 xₙ → a,存在 M 使 n ≥ M 时 |xₙ − a| < ε/2；因 yₙ → b,存在 N 使 n ≥ N 时 |yₙ − b| < ε/2。则对 n ≥ max(M, N):\n\n|(xₙ + yₙ) − (a + b)| = |(xₙ − a) + (yₙ − b)| ≤ |xₙ − a| + |yₙ − b| < ε/2 + ε/2 = ε。\n\n故 xₙ + yₙ → a + b。\n\n(ii) α = 0 时显然。设 α ≠ 0,给定 ε > 0,取 N 使 n ≥ N 时 |xₙ − a| < ε/|α|；则 |α·xₙ − α·a| = |α|·|xₙ − a| < |α|·(ε/|α|) = ε。∎\n\n(i) 的证明里藏着一个标准技巧:**目标精度 ε,拆成两份 ε/2 分给两个数列**。每个数列各自逼近到 ε/2,合起来三角不等式正好凑成 ε。下图把它画出来:\n\n<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 轴1: xₙ 逼近 a, 半带 ε/2 -->\n  <rect x=\"115\" y=\"39\" width=\"70\" height=\"12\" fill=\"#E0612F\" opacity=\"0.13\"/>\n  <line x1=\"40\" y1=\"45\" x2=\"290\" y2=\"45\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"150\" y1=\"39\" x2=\"150\" y2=\"51\" stroke=\"#E0612F\" stroke-width=\"1.3\"/>\n  <circle cx=\"150\" cy=\"45\" r=\"3\" fill=\"#E0612F\"/>\n  <text x=\"150\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"#E0612F\">a<\/text>\n  <text x=\"300\" y=\"49\" font-size=\"11\" fill=\"#555\">xₙ 落入 ±ε/2<\/text>\n  <!-- 轴2: yₙ 逼近 b, 半带 ε/2 -->\n  <rect x=\"205\" y=\"104\" width=\"70\" height=\"12\" fill=\"#00A070\" opacity=\"0.13\"/>\n  <line x1=\"40\" y1=\"110\" x2=\"290\" y2=\"110\" stroke=\"#aaa\" stroke-width=\"1\"/>\n  <line x1=\"240\" y1=\"104\" x2=\"240\" y2=\"116\" stroke=\"#00A070\" stroke-width=\"1.3\"/>\n  <circle cx=\"240\" cy=\"110\" r=\"3\" fill=\"#00A070\"/>\n  <text x=\"240\" y=\"97\" font-size=\"11\" text-anchor=\"middle\" fill=\"#00A070\">b<\/text>\n  <text x=\"300\" y=\"114\" font-size=\"11\" fill=\"#555\">yₙ 落入 ±ε/2<\/text>\n  <!-- 加号 -->\n  <text x=\"25\" y=\"82\" font-size=\"16\" fill=\"#777\">+<\/text>\n  <line x1=\"40\" y1=\"140\" x2=\"360\" y2=\"140\" stroke=\"#ccc\" stroke-width=\"0.8\"/>\n  <!-- 轴3: 和 逼近 a+b, 全带 ε -->\n  <rect x=\"130\" y=\"174\" width=\"140\" height=\"12\" fill=\"#5A5FE0\" opacity=\"0.12\"/>\n  <line x1=\"40\" y1=\"180\" x2=\"360\" y2=\"180\" stroke=\"#888\" stroke-width=\"1.1\"/>\n  <line x1=\"200\" y1=\"172\" x2=\"200\" y2=\"188\" stroke=\"#5A5FE0\" stroke-width=\"1.4\"/>\n  <circle cx=\"200\" cy=\"180\" r=\"3.3\" fill=\"#5A5FE0\"/>\n  <text x=\"200\" y=\"166\" font-size=\"11\" text-anchor=\"middle\" fill=\"#5A5FE0\">a+b<\/text>\n  <text x=\"276\" y=\"184\" font-size=\"11\" fill=\"#5A5FE0\">xₙ+yₙ 落入 ±ε<\/text>\n  <text x=\"200\" y=\"206\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">ε/2 + ε/2 = ε：两个半带的误差，三角不等式合成一个全带<\/text>\n<\/svg>\n\n由此(取 α = −1 再用 (i))还顺带得到**差**的法则:xₙ − yₙ → a − b。和、差、数乘三条合起来说明:**收敛数列对线性运算封闭,且取极限是线性的**——lim(αxₙ + βyₙ) = α·lim xₙ + β·lim yₙ。\n\n## 积:一个关键引理 + 拆项\n\n积的法则比和难,因为 xₙyₙ − ab 不能直接拆成两个小量。先备一个引理,它本身极常用。\n\n**引理(零 × 有界 = 零).** 若 (xₙ) 是零数列,(yₙ) 有界,则 (xₙyₙ) 是零数列。\n\n**证明.** (yₙ) 有界,存在 M > 0 使 |yₙ| ≤ M 对一切 n。给定 ε > 0,因 xₙ → 0,存在 N 使 n ≥ N 时 |xₙ| < ε/M。则\n\n|xₙyₙ| = |xₙ|·|yₙ| < (ε/M)·M = ε，  n ≥ N。\n\n故 xₙyₙ → 0。∎\n\n注意「有界」这个条件**不能去掉**:取 xₙ = 1/n(零数列)、yₙ = n²(无界),则 xₙyₙ = n 发散。有界性是这条引理的命脉——它保证那个「不趋于 0 的因子」至少不会爆炸,从而被趋于 0 的因子压住。\n\n**命题(积).** 若 xₙ → a、yₙ → b,则 xₙyₙ → ab。\n\n**证明.** 用<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>那节练习里的**加减同一项**手法,把 xₙyₙ − ab 拆成两个零数列之和:\n\nxₙyₙ − ab = xₙyₙ − a·yₙ + a·yₙ − ab = (xₙ − a)·yₙ + a·(yₙ − b)。\n\n逐项分析:(xₙ − a) 是零数列(因 xₙ → a),而 (yₙ) 收敛故<a class=\"wl\" data-id=\"an_convergenza\">有界<\/a>,由引理 (xₙ − a)·yₙ 是零数列;(yₙ − b) 是零数列,a 是常数(有界),a·(yₙ − b) 也是零数列。两个零数列之和仍是零数列(和法则),所以 xₙyₙ − ab → 0,即 xₙyₙ → ab。∎\n\n这个证明是<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>那节那道练习的精确重演——当时我们估计 |xy − ab| 用的就是「加减 ay、拆成 (x−a)y + a(y−b)」。那时是静态的不等式,现在每一项都成了零数列,「拆项」直接兑现成「拆成零数列之和」。**静态估计技巧,在极限里全部复活。**\n\n## 商:先把分母从 0 拉开\n\n商的法则要先处理倒数,而倒数的麻烦在于分母可能趋于 0 附近——得先保证它**离 0 有一段安全距离**。\n\n**命题(倒数).** 设 xₙ → a,且 a ≠ 0。则几乎所有 xₙ ≠ 0,且 1/xₙ → 1/a。\n\n**证明.** 第一步,把 xₙ 从 0 拉开。因 |a| > 0,取 ε = |a|/2:存在 N 使 n ≥ N 时 |xₙ − a| < |a|/2。由<a class=\"wl\" data-id=\"an_valore_assoluto\">反向三角不等式<\/a>,\n\n|a| − |xₙ| ≤ |xₙ − a| < |a|/2，  故 |xₙ| > |a|/2 > 0，  n ≥ N。\n\n所以从第 N 项起,xₙ 都非零(可取倒数),而且模有统一下界 |a|/2——分母**离 0 至少 |a|/2 远**,这正是控制 1/xₙ 的关键。\n\n第二步,估计 1/xₙ − 1/a。通分:\n\n|1/xₙ − 1/a| = |a − xₙ| / (|xₙ|·|a|) ≤ |xₙ − a| / ((|a|/2)·|a|) = (2/|a|²)·|xₙ − a|，  n ≥ N。\n\n右边是常数 2/|a|² 乘以零数列 |xₙ − a|,故是零数列;由「被零数列压住」,|1/xₙ − 1/a| → 0,即 1/xₙ → 1/a。∎\n\n第一步「把分母从 0 拉开」是全证的要害:没有 |xₙ| ≥ |a|/2 这个下界,通分后的分母 |xₙ||a| 可能趋于 0,整个估计失控。反向三角不等式在这里正好派上用场——它把「xₙ 接近 a」翻译成「|xₙ| 接近 |a|」,从而保证分母不塌。\n\n**推论(商).** 若 xₙ → a、yₙ → b,且 b ≠ 0,则 xₙ/yₙ → a/b。\n\n**证明.** xₙ/yₙ = xₙ·(1/yₙ)。由倒数法则 1/yₙ → 1/b,再由积法则 xₙ·(1/yₙ) → a·(1/b) = a/b。∎\n\n商法则不必单独硬证——它是「倒数 + 积」的组合。这也体现了运算法则的威力:一旦基本几条立住,新法则就能由旧法则拼出来,不必每次回到 ε–N。\n\n## 法则如何省力：一个例子\n\n现在回头算开头那个 lim (n+1)/(n+2),看法则怎样把它拆开。把分子分母同除以 n:\n\n(n+1)/(n+2) = (1 + 1/n) / (1 + 2/n)。\n\n分子:1 + 1/n。常数列 1 → 1(例),1/n → 0(阿基米德),由和法则 1 + 1/n → 1。\n分母:1 + 2/n。同理,2/n = 2·(1/n) → 2·0 = 0(数乘),故 1 + 2/n → 1。\n分母极限 1 ≠ 0,由商法则:\n\nlim (n+1)/(n+2) = (lim 分子)/(lim 分母) = 1/1 = 1。\n\n整个计算没有出现一次 ε 或 N——全部回到一个基本极限 1/n → 0,其余由法则逐层拼装。**这就是运算法则的意义:把「找 N」的力气,一次性封装进基本极限,此后只做代数。**\n\n## 一道激活练习\n\n用运算法则(不直接用 ε–N)计算下列极限,每步注明用了哪条法则:\n\n(a) lim (3n² − n + 1) / (2n² + 5)；\n(b) lim ( (n+1)/(n+2) + (2n)/(n+3) )；\n(c) lim ( (1 + i/n)·(2 − 1/n) )（复数列;i 是虚数单位）。\n\n（提示:(a) 分子分母同除以 n²,把每项化成常数加 c/nᵏ 形状。(c) 用积法则,分别求两个因子的极限。）\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 分子分母同除以 n²:\n\n(3n²−n+1)/(2n²+5) = (3 − 1/n + 1/n²) / (2 + 5/n²)。\n\n分子:1/n → 0(阿基米德),1/n² = (1/n)(1/n) → 0·0 = 0(积法则),故 3 − 1/n + 1/n² → 3 − 0 + 0 = 3(和与数乘)。分母:5/n² → 5·0 = 0,故 2 + 5/n² → 2。分母极限 2 ≠ 0,商法则给 **lim = 3/2**。\n\n**(b)** 由 (a) 同型计算:(n+1)/(n+2) = (1+1/n)/(1+2/n) → 1（正文已算）;(2n)/(n+3) = 2/(1+3/n) → 2/1 = 2。两个收敛数列之和,由和法则:**lim = 1 + 2 = 3**。\n\n**(c)** 第一个因子 1 + i/n:i/n = i·(1/n) → i·0 = 0(数乘,α = i),故 1 + i/n → 1。第二个因子 2 − 1/n → 2 − 0 = 2。两者都收敛,由积法则:**lim = 1·2 = 2**。\n\n回顾:三道题的统一套路是**把每个数列化简成「常数 + 趋于 0 的项」,再用和/数乘/积/商法则逐层组合**,最底层只用 1/n → 0。注意法则的使用顺序:总是先算清每个「零件」的极限(常数、1/n、1/n² …),再往上拼;商法则用前务必确认分母极限非零。\n\n## 往前看一步\n\n运算法则让我们能算出大量极限,但它们对**实数列**还漏掉了一件重要的事:序与极限的关系。如果 xₙ ≤ yₙ 对所有 n 成立,它们的极限之间有 lim xₙ ≤ lim yₙ 吗?更有用的是反过来——若一个数列被两个**收敛到同一极限**的数列上下夹住,它是否也被迫收敛到那个极限?这就是**夹逼定理**(squeeze theorem),实分析里求极限最锋利的工具之一,尤其当数列复杂到无法用运算法则拆解时。它依赖 ℝ 的序结构,因而是实数列特有的。这就是 <a class=\"wl\" data-id=\"an_confronto\">夹逼定理与极限的序<\/a> 的内容。","refs":"Amann–Escher, Analysis I §II.2"},{"id":"an_analisi","label":"分析","parent":null,"summary":"研究「极限与连续变化」的分支：以极限为核心，严格处理逼近、连续、导数、积分与无穷过程。","depth":0,"isContainer":true,"isTop":true,"role":"discipline","color":"#FF7F50","ring":1,"bearing":0,"popupLinks":[{"id":"fond_fondamenta","text":"地基"}],"body":"\n分析(analysis)的核心只有一个字：**极限**。一旦我们想严格地谈「越来越接近」「无限细分再累加」「瞬时变化率」，就进入了分析的领地——连续、导数、积分、级数，全是极限这一观念结出的果实。它的语言取自 <a class=\"wl\" data-id=\"fond_fondamenta\">地基<\/a>，但它真正的内核——极限与完备性——既不来自纯粹的运算、也不来自空间直观，是不可被还原的。正因如此，它真正的力量要等到数系一路构造到实数、补齐「没有缝隙」的完备性之后，才完全释放。"},{"id":"an_bolzano_weierstrass","label":"Bolzano–Weierstrass 定理","parent":"an_analisi","summary":"每个有界实数列都有收敛子列(等价地,有聚点)。证明用二分法:反复取含无穷多项的那一半,区间长度减半套出一个聚点——完备性的又一个面孔,也是判定 Cauchy 列收敛的引擎。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#FB7990","ring":6,"bearing":7,"popupLinks":[{"id":"an_convergenza","text":"收敛蕴含有界"},{"id":"an_sottosuccessioni","text":"聚点 ⟺ 收敛子列"},{"id":"an_monotone","text":"单调收敛定理"},{"id":"an_algebra_limiti","text":"差的极限"},{"id":"an_succ_complesse","text":"按坐标收敛"},{"id":"an_cauchy","text":"Cauchy 列与完备性"}],"body":"\n## 有界数列里总能挑出收敛的一串\n\n<a class=\"wl\" data-id=\"an_convergenza\">收敛蕴含有界<\/a>告诉我们「收敛 ⟹ 有界」,反过来不成立——((−1)ⁿ) 有界却发散。但「有界」也不是一无所获:虽然整个数列可能不收敛,**从里面总挑得出一个收敛的子列**。这就是 Bolzano–Weierstrass 定理,实分析里一条核心的存在性定理。\n\n它的用处马上会显现:下一节判定 Cauchy 列收敛,靠的正是它。而它本身,又是 ℝ 完备性的一个面孔——在不完备的 ℚ 里,有界数列可能挑不出在 ℚ 中收敛的子列(那串逼近 √2 的有理数,任何子列都收敛到 √2 ∉ ℚ)。\n\n**定理(Bolzano–Weierstrass).** ℝ 中每个有界数列都有收敛子列。等价地(<a class=\"wl\" data-id=\"an_sottosuccessioni\">聚点 ⟺ 收敛子列<\/a>),每个有界实数列都有**聚点**。\n\n## 二分法：把聚点套出来\n\n证明的思路很几何:有界数列被关在一个闭区间里,无穷多项挤在有限长度内,必然在某处「堆积」。怎么找到堆积点?**反复把区间对半切,每次保留装着无穷多项的那一半**——区间越切越短,套向一个点,那个点就是聚点。\n\n**证明.** 设 (xₙ) 有界,即存在区间 [a, b] 使所有 xₙ ∈ [a, b]。\n\n**构造区间套。** 记 I₀ := [a, b]。它含有数列的**全部**项,当然是无穷多项。已得到含无穷多项的闭区间 I_k = [a_k, b_k] 后,取中点 m := (a_k + b_k)/2,把它切成左右两半 [a_k, m] 与 [m, b_k]。这两半至少有一半含无穷多项(否则两半各只有有限项,合起来 I_k 只有有限项,矛盾)。**选含无穷多项的那一半**作 I_{k+1}(若两半都含无穷多项,随便选左边)。\n\n<svg viewBox=\"0 0 440 230\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 层1: 全区间, 高亮右半 -->\n  <line x1=\"60\" y1=\"45\" x2=\"380\" y2=\"45\" stroke=\"#888\" stroke-width=\"1.4\"/>\n  <rect x=\"220\" y=\"40\" width=\"160\" height=\"10\" fill=\"#E0612F\" opacity=\"0.18\"/>\n  <line x1=\"60\" y1=\"40\" x2=\"60\" y2=\"50\" stroke=\"#888\" stroke-width=\"1\"/>\n  <line x1=\"380\" y1=\"40\" x2=\"380\" y2=\"50\" stroke=\"#888\" stroke-width=\"1\"/>\n  <line x1=\"220\" y1=\"40\" x2=\"220\" y2=\"50\" stroke=\"#999\" stroke-width=\"0.8\"/>\n  <text x=\"52\" y=\"44\" font-size=\"10\" text-anchor=\"end\" fill=\"#777\">a<\/text>\n  <text x=\"388\" y=\"44\" font-size=\"10\" fill=\"#777\">b<\/text>\n  <text x=\"395\" y=\"49\" font-size=\"9\" fill=\"#E0612F\">I₁<\/text>\n  <!-- 层2 -->\n  <line x1=\"220\" y1=\"83\" x2=\"300\" y2=\"83\" stroke=\"#E0612F\" stroke-width=\"1.4\"/>\n  <rect x=\"220\" y=\"78\" width=\"80\" height=\"10\" fill=\"#E0612F\" opacity=\"0.18\"/>\n  <line x1=\"220\" y1=\"78\" x2=\"220\" y2=\"88\" stroke=\"#999\" stroke-width=\"0.8\"/>\n  <line x1=\"300\" y1=\"78\" x2=\"300\" y2=\"88\" stroke=\"#999\" stroke-width=\"0.8\"/>\n  <text x=\"310\" y=\"87\" font-size=\"9\" fill=\"#E0612F\">I₂<\/text>\n  <!-- 层3 -->\n  <line x1=\"220\" y1=\"121\" x2=\"260\" y2=\"121\" stroke=\"#E0612F\" stroke-width=\"1.4\"/>\n  <rect x=\"220\" y=\"116\" width=\"40\" height=\"10\" fill=\"#E0612F\" opacity=\"0.18\"/>\n  <text x=\"270\" y=\"125\" font-size=\"9\" fill=\"#E0612F\">I₃<\/text>\n  <!-- 层4 -->\n  <line x1=\"240\" y1=\"159\" x2=\"260\" y2=\"159\" stroke=\"#E0612F\" stroke-width=\"1.4\"/>\n  <rect x=\"240\" y=\"154\" width=\"20\" height=\"10\" fill=\"#E0612F\" opacity=\"0.2\"/>\n  <text x=\"270\" y=\"163\" font-size=\"9\" fill=\"#E0612F\">I₄<\/text>\n  <!-- 层5 -->\n  <line x1=\"250\" y1=\"197\" x2=\"260\" y2=\"197\" stroke=\"#E0612F\" stroke-width=\"1.6\"/>\n  <text x=\"270\" y=\"201\" font-size=\"9\" fill=\"#E0612F\">I₅<\/text>\n  <!-- 聚点竖虚线 -->\n  <line x1=\"258\" y1=\"38\" x2=\"258\" y2=\"210\" stroke=\"#5A5FE0\" stroke-width=\"0.9\" stroke-dasharray=\"3,3\"/>\n  <circle cx=\"258\" cy=\"197\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <text x=\"263\" y=\"218\" font-size=\"10\" fill=\"#5A5FE0\">聚点 ξ<\/text>\n  <text x=\"120\" y=\"218\" font-size=\"10\" fill=\"#777\">每层取「含无穷多项」的一半，区间长度减半，套向 ξ<\/text>\n<\/svg>\n\n这样得到一串**嵌套**的闭区间 I₀ ⊇ I₁ ⊇ I₂ ⊇ ⋯,每个含无穷多项,且长度 b_k − a_k = (b−a)/2ᵏ → 0。\n\n**套出聚点。** 左端点列 (a_k) 递增有上界(被 b 界住),右端点列 (b_k) 递减有下界。由<a class=\"wl\" data-id=\"an_monotone\">单调收敛定理<\/a>,a_k → ξ(其上确界),b_k → ξ′;而 b_k − a_k → 0,由<a class=\"wl\" data-id=\"an_algebra_limiti\">差的极限<\/a> ξ′ − ξ = 0,即 a_k 与 b_k 收敛到**同一个点** ξ。这个 ξ 落在每个 I_k 里。\n\n**ξ 是聚点。** 任取 ξ 的邻域 B(ξ, ε)。因区间长度 (b−a)/2ᵏ → 0、且 ξ ∈ I_k,只要 k 足够大,整个 I_k ⊆ B(ξ, ε)。而 I_k 含无穷多项——所以 B(ξ, ε) 也含无穷多项。故 ξ 是 (xₙ) 的聚点。\n\n由<a class=\"wl\" data-id=\"an_sottosuccessioni\">聚点 ⟺ 收敛子列<\/a>,存在子列收敛到 ξ。∎\n\n证明的引擎是**单调收敛定理**(套出 ξ)和**聚点的递归挑选**(从聚点得到子列)——两者都已在前面备好,这里只是把它们组装起来。而最核心的「每次保留无穷多项的一半」用的是一个朴素却关键的事实:**有限 + 有限 = 有限**,所以无穷多项对半分,必有一半仍是无穷多。\n\n## 推广一句\n\n定理对 ℝᵐ 和 ℂ 同样成立:**Kᵐ 中每个有界数列都有收敛子列**。证明对维数归纳——先在第一个坐标上用一维的 B–W 挑出收敛子列,再在这个子列上对第二个坐标用 B–W 挑子列的子列,逐个坐标收紧,最后所有坐标同时收敛(<a class=\"wl\" data-id=\"an_succ_complesse\">按坐标收敛<\/a>)。ℂ 视作 ℝ² 即归入此列。细节是标准的归纳,这里点到为止——眼下我们只需要一维的版本。\n\n## 为什么它叫「完备性的面孔」\n\n把 Bolzano–Weierstrass 和<a class=\"wl\" data-id=\"an_monotone\">单调收敛<\/a>并排:两者都是「有界 + 某种附加条件 ⟹ 收敛」,且都靠完备性。单调收敛要求数列**单调**;B–W 不要求单调,代价是只保证**子列**收敛(而非整列)。它们其实是完备性的两种等价表述——在 ℚ 里两者都失败(逼近 √2 的递增有理数列,既不在 ℚ 收敛,也挑不出在 ℚ 收敛的子列)。可以证明:对有序域,「单调有界必收敛」「有界必有收敛子列」「上确界存在」「Cauchy 列必收敛」彼此等价,都是「完备」的不同说法。我们以上确界为出发公理,其余都作为定理导出;下一节的 Cauchy 判据是这组等价里最后、也最实用的一个。\n\n## 一道激活练习\n\n(a) 数列 xₙ := (−1)ⁿ·(1 + 1/n) 有界。找出它的全部聚点,并对每个聚点指出一个收敛到它的子列。(这印证 B–W:有界数列确实有收敛子列——而且这里有不止一个。)\n\n(b) 说明为什么「**无界**数列也可能有收敛子列」并不与 B–W 矛盾,举一个无界但有收敛子列的数列。(B–W 说有界 ⟹ 有收敛子列,它没说无界 ⟹ 没有。)\n\n(c) 构造一个数列,它的聚点集恰好是 {0, 1, 2}(提示:让三个值各被无穷多项取到)。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** xₙ = (−1)ⁿ(1 + 1/n)。偶子列 x_{2k} = 1 + 1/(2k) → 1;奇子列 x_{2k+1} = −(1 + 1/(2k+1)) → −1。聚点是 **1 和 −1**:偶下标子列 → 1,奇下标子列 → −1。(数列有界:|xₙ| ≤ 1 + 1/n ≤ 2;B–W 保证有收敛子列,这里恰有两个去向。)\n\n**(b)** B–W 是单向蕴含「有界 ⟹ 有收敛子列」,其逆否是「无收敛子列 ⟹ 无界」,但它**不**断言「无界 ⟹ 无收敛子列」。反例:xₙ := (0, 1, 0, 2, 0, 3, 0, 4, …)——偶数位置恒为 0、奇数位置为 1,2,3,…。它无界(奇数位跑向无穷),但偶数位子列恒为 0,收敛到 0。所以无界数列照样可以有收敛子列,与 B–W 不矛盾。\n\n**(c)** 把 0,1,2 轮流排开,每个出现无穷多次:xₙ := (0, 1, 2, 0, 1, 2, 0, 1, 2, …)(周期 3)。下标 ≡0 (mod 3) 的子列恒为 0 → 0,≡1 的 → 1,≡2 的 → 2,故 0,1,2 都是聚点;而其余任何点的小邻域只含有限项(实为零项),不是聚点。故聚点集恰为 {0,1,2}。∎\n\n回顾:这三问围绕同一个区分——**聚点是「无穷多项靠近」,与「有界」「收敛」都不同**。有界保证聚点存在(B–W),但聚点可以有多个(发散数列);无界不排除聚点(只要某个子列收敛);聚点集可以是任意指定的有限集(让每个值被无穷多项取到)。把「聚点 / 有界 / 收敛」三者的关系彻底厘清,是这一串练习的目的。\n\n## 往前看一步\n\nBolzano–Weierstrass 给了我们一台「从有界数列提取收敛子列」的机器。它最重要的应用,是回答一个比单调收敛更普遍的收敛判据问题。单调收敛只管单调数列;可很多数列并不单调,却明显在「自我收拢」——项与项之间越来越靠近。Cauchy 把这种「内部收拢」精确化为一个判据:**对每个 ε,存在 N,使 m, n ≥ N 时 d(xₙ, xₘ) < ε**(Cauchy 列)。下一节将证明:在 ℝ 和 ℂ 中,**一个数列收敛当且仅当它是 Cauchy 列**——而证明「Cauchy ⟹ 收敛」的关键一步,正是用 B–W 从 Cauchy 列里提取一个收敛子列。这就是 <a class=\"wl\" data-id=\"an_cauchy\">Cauchy 列与完备性<\/a> 的内容。","refs":"Amann–Escher, Analysis I §II.5"},{"id":"an_cauchy","label":"Cauchy 列与完备性","parent":"an_analisi","summary":"Cauchy 列是「项最终彼此任意接近」的数列;在 ℝ 与 ℂ 中,数列收敛当且仅当它是 Cauchy 列——这把收敛判据从「需要外部极限点」改写成「内部自我收拢」，是完备性最实用的面孔。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#FC7988","ring":7,"bearing":6,"popupLinks":[{"id":"an_algebra_limiti","text":"算出极限"},{"id":"an_confronto","text":"夹板"},{"id":"an_monotone","text":"单调有界"},{"id":"an_convergenza","text":"收敛"},{"id":"num_radice2","text":"不是有理数"},{"id":"an_bolzano_weierstrass","text":"Bolzano–Weierstrass"},{"id":"num_dedekind","text":"Dedekind 分割"}],"body":"\n## 不靠极限点判断收敛\n\n到目前为止,判断一个数列收敛,要么<a class=\"wl\" data-id=\"an_algebra_limiti\">算出极限<\/a>、要么找<a class=\"wl\" data-id=\"an_confronto\">夹板<\/a>、要么靠<a class=\"wl\" data-id=\"an_monotone\">单调有界<\/a>——前两者都得对「极限是什么」有所掌握,第三个只管单调数列。但有一大类数列,既不单调、又算不出极限,却明显在「收拢」:项与项之间越来越靠近。能不能**不引入任何外部的极限点**,只看数列**自己**的项,就判定它收敛?\n\nCauchy 给了一个深刻的答案。他的想法是:与其问「项是否靠近某个外部的 a」,不如问「**项之间**是否最终任意接近」。\n\n**定义(Cauchy 列).** 度量空间 (X, d) 中的数列 (xₙ) 称 **Cauchy 列**(Cauchy sequence)，若:对每个 ε > 0,存在 N ∈ ℕ,使得\n\nd(xₙ, xₘ) < ε，  对一切 m, n ≥ N。\n\n注意它和<a class=\"wl\" data-id=\"an_convergenza\">收敛<\/a>定义的根本区别:收敛说「项与**极限 a** 的距离 < ε」,需要一个外部的 a;Cauchy 说「**项与项**的距离 < ε」,**只牵涉数列自己**。这个差别看似微小,意义重大——Cauchy 条件可以在不知道、甚至不存在极限的情况下检验。\n\n<svg viewBox=\"0 0 440 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- ε带(尾部) -->\n  <rect x=\"189\" y=\"74\" width=\"206\" height=\"54\" fill=\"#E0612F\" opacity=\"0.10\"/>\n  <line x1=\"189\" y1=\"74\" x2=\"395\" y2=\"74\" stroke=\"#E0612F\" stroke-width=\"0.7\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"189\" y1=\"128\" x2=\"395\" y2=\"128\" stroke=\"#E0612F\" stroke-width=\"0.7\" stroke-dasharray=\"4,3\"/>\n  <text x=\"398\" y=\"105\" font-size=\"11\" fill=\"#E0612F\">宽 ε<\/text>\n  <!-- 坐标轴 -->\n  <line x1=\"55\" y1=\"175\" x2=\"425\" y2=\"175\" stroke=\"#bbb\" stroke-width=\"1\"/>\n  <text x=\"420\" y=\"192\" font-size=\"11\" fill=\"#888\">n<\/text>\n  <!-- N 标线 -->\n  <line x1=\"189\" y1=\"44\" x2=\"189\" y2=\"179\" stroke=\"#777\" stroke-width=\"0.9\" stroke-dasharray=\"3,3\"/>\n  <text x=\"189\" y=\"192\" font-size=\"11\" text-anchor=\"middle\" fill=\"#555\">N<\/text>\n  <!-- 数列点 -->\n  <polyline points=\"67,158 87,50 108,139 128,67 148,129 169,74 189,124 210,78 230,120 250,81 271,118 291,83 311,116 332,84\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"67\" cy=\"158\" r=\"3\"/><circle cx=\"87\" cy=\"50\" r=\"3\"/><circle cx=\"108\" cy=\"139\" r=\"3\"/><circle cx=\"128\" cy=\"67\" r=\"3\"/><circle cx=\"148\" cy=\"129\" r=\"3\"/><circle cx=\"169\" cy=\"74\" r=\"3\"/><circle cx=\"189\" cy=\"124\" r=\"3\"/><circle cx=\"210\" cy=\"78\" r=\"3\"/><circle cx=\"230\" cy=\"120\" r=\"3\"/><circle cx=\"250\" cy=\"81\" r=\"3\"/><circle cx=\"271\" cy=\"118\" r=\"3\"/><circle cx=\"291\" cy=\"83\" r=\"3\"/><circle cx=\"311\" cy=\"116\" r=\"3\"/><circle cx=\"332\" cy=\"84\" r=\"3\"/>\n  <\/g>\n  <text x=\"210\" y=\"166\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">N 之后，任意两项的距离都 &lt; ε——项之间自我收拢，不指向任何外部点<\/text>\n<\/svg>\n\n## 收敛 ⟹ Cauchy\n\n一个方向是容易的,且对**任何**度量空间成立。\n\n**命题.** 每个收敛数列都是 Cauchy 列。\n\n**证明.** 设 xₙ → x。给定 ε > 0,存在 N 使 n ≥ N 时 d(xₙ, x) < ε/2。则对 m, n ≥ N,由三角不等式\n\nd(xₙ, xₘ) ≤ d(xₙ, x) + d(x, xₘ) < ε/2 + ε/2 = ε。\n\n故 (xₙ) 是 Cauchy 列。∎\n\n直觉:如果所有项最终都挤在极限 x 附近半径 ε/2 的球里,那它们彼此之间自然不会超过 ε 远。极限点 x 在这里只是「中转」——经过它用一次三角不等式,就把「项靠近 x」转成了「项之间靠近」。\n\n## 逆命题为何需要完备性：ℚ 里的反例\n\n反过来——**Cauchy ⟹ 收敛——却不是对所有度量空间都成立**。这正是「完备」与否的分水岭。在 ℚ 里,它就失败。\n\n**例.** 在 ℚ 中递归定义 x₀ := 2,x_{n+1} := ½(xₙ + 2/xₙ)。则 (xₙ) 是 ℚ 中的 Cauchy 列,但在 ℚ 中**不收敛**。\n\n这就是求 √2 的牛顿迭代。算几项:\n\nx₀ = 2,  x₁ = 1.5,  x₂ ≈ 1.41667,  x₃ ≈ 1.414216,  x₄ ≈ 1.414214, …\n\n<svg viewBox=\"0 0 440 170\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"55\" y1=\"120\" x2=\"410\" y2=\"120\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <path d=\"M 410 120 L 402 116 L 402 124 z\" fill=\"#888\"/>\n  <!-- √2 标线 -->\n  <line x1=\"150\" y1=\"40\" x2=\"150\" y2=\"130\" stroke=\"#B33\" stroke-width=\"1.2\" stroke-dasharray=\"6,3\"/>\n  <text x=\"150\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill=\"#B33\">√2 ∉ ℚ<\/text>\n  <!-- 刻度 -->\n  <text x=\"150\" y=\"32\" font-size=\"10\" text-anchor=\"middle\" fill=\"#B33\">≈1.4142<\/text>\n  <!-- 迭代点 (映射 1.4..2.0 到 x轴) -->\n  <!-- x: val 1.4->130, 2.0->380 -->\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"380\" cy=\"120\" r=\"4\"/><circle cx=\"172\" cy=\"120\" r=\"4\"/><circle cx=\"152\" cy=\"120\" r=\"4\"/><circle cx=\"150\" cy=\"120\" r=\"4\"/>\n  <\/g>\n  <text x=\"380\" y=\"110\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5A5FE0\">x₀=2<\/text>\n  <text x=\"176\" y=\"110\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5A5FE0\">x₁<\/text>\n  <text x=\"150\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5A5FE0\"><\/text>\n  <text x=\"230\" y=\"100\" font-size=\"10\" fill=\"#5A5FE0\">xₙ 飞快地挤向 √2<\/text>\n  <text x=\"135\" y=\"165\" font-size=\"10\" fill=\"#777\">每一项都是有理数，彼此越来越近（Cauchy），但要靠近的目标 √2 不在 ℚ 里<\/text>\n<\/svg>\n\n每个 xₙ 都是有理数(有理数的四则运算仍是有理数)。这串数收敛到 √2(在 ℝ 中),所以它在 ℝ 中收敛、从而是 Cauchy 列(<a class=\"wl\" data-id=\"an_convergenza\">收敛⟹Cauchy<\/a>),而 Cauchy 条件只关乎项之间的距离,在 ℚ 里检验和在 ℝ 里检验是同一回事——故它在 ℚ 中也是 Cauchy 列。\n\n但它在 ℚ 中**不收敛**:若 xₙ → a 且 a ∈ ℚ,则它在 ℝ 中也收敛到 a(<a class=\"wl\" data-id=\"an_convergenza\">极限唯一<\/a>),于是 a = √2;可 √2 <a class=\"wl\" data-id=\"num_radice2\">不是有理数<\/a>,矛盾。所以这个 Cauchy 列在 ℚ 里找不到极限——**它要靠近的那个点,恰好是 ℚ 的一个洞**。\n\n这个反例点破了完备性的实质:**Cauchy 列总在「收拢」,但收拢的目标点可能不在空间里**。ℚ 有洞,洞处的 Cauchy 列就无家可归。ℝ 之所以「完备」,正是因为它把这些洞全填上了——每个 Cauchy 列收拢的目标,在 ℝ 里都真实存在。\n\n## Cauchy 列的两条性质\n\n要证「在 ℝ 中 Cauchy ⟹ 收敛」,先备两块。\n\n**命题(Cauchy ⟹ 有界).** 每个 Cauchy 列有界。\n\n**证明.** 取 ε = 1:存在 N 使 m, n ≥ N 时 d(xₙ, xₘ) < 1。特别地,对 n ≥ N,d(xₙ, x_N) < 1。开头的有限项 x₀, …, x_{N−1} 与 x_N 的距离有最大值 M₀。取 M := M₀ + 1,则所有项到 x_N 的距离 ≤ M,数列有界。∎(与<a class=\"wl\" data-id=\"an_convergenza\">收敛⟹有界<\/a>同一手法:尾部挤在一起、前段有限,合起来有界。)\n\n**命题(有收敛子列的 Cauchy 列必收敛).** 若 Cauchy 列 (xₙ) 有一个子列收敛到 x,则 (xₙ) 整列收敛到 x。\n\n**证明.** 设子列 x_{n_k} → x。给定 ε > 0。由 Cauchy 性,存在 N 使 m, n ≥ N 时 d(xₙ, xₘ) < ε/2;由子列收敛,存在 K 使 k ≥ K 时 d(x_{n_k}, x) < ε/2。取一个足够大的下标 n_k(同时满足 k ≥ K 且 n_k ≥ N),则对一切 n ≥ N,\n\nd(xₙ, x) ≤ d(xₙ, x_{n_k}) + d(x_{n_k}, x) < ε/2 + ε/2 = ε。\n\n故 xₙ → x。∎ 直觉:Cauchy 列「全体挤在一起」,只要有**一个**子列找到了归宿 x,整列就被它带着一起收敛到 x——因为整列和这个子列本就贴在一起。\n\n## 主定理：ℝ 与 ℂ 完备\n\n三块齐备,拼出主定理。\n\n**定理.** 在 ℝ(及 ℂ)中,数列收敛 **当且仅当** 它是 Cauchy 列。\n\n**证明.** 「收敛 ⟹ Cauchy」已证(对任何度量空间成立)。「Cauchy ⟹ 收敛」:设 (xₙ) 是 ℝ 中的 Cauchy 列。由「Cauchy ⟹ 有界」,它有界;由 <a class=\"wl\" data-id=\"an_bolzano_weierstrass\">Bolzano–Weierstrass<\/a>,有界数列有收敛子列;由「有收敛子列的 Cauchy 列必收敛」,(xₙ) 整列收敛。ℂ 同理(或视作 ℝ²)。∎\n\n看清这条证明链:**Cauchy → 有界 →(B–W)收敛子列 →(带动整列)收敛**。Bolzano–Weierstrass 是其中不可替代的引擎——正是它把「自我收拢」兑现成「真的有个极限点」,而这一步的底层依据,是 ℝ 的完备性。\n\n## 完备空间与 Banach 空间\n\n把这条性质抽象出来,命名:\n\n**定义.** 度量空间 (X, d) 称**完备**(complete)，若其中每个 Cauchy 列都收敛(到空间内的点)。完备的赋范向量空间称 **Banach 空间**(Banach space)。\n\n于是上面的定理一句话:**ℝ 和 ℂ 是完备度量空间**(更进一步是 Banach 空间)。而 ℚ **不完备**——那个逼近 √2 的 Cauchy 列就是反证。完备性从此有了一个不依赖序、对任何度量空间都说得通的表述:「Cauchy 列都有归宿」。这比「上确界存在」更通用——后者要序,前者只要距离,所以它能搬到 ℝⁿ、函数空间等没有自然序的地方,成为现代分析里「完备」的标准定义。\n\n> 一个回响:<a class=\"wl\" data-id=\"num_dedekind\">Dedekind 分割<\/a>那节我们提过,造 ℝ 有两条路——分割,以及「Cauchy 列的完备化」。后者正是用本节的语言:把 ℚ 的所有 Cauchy 列收集起来、按「差为零列」归类,商出的就是 ℝ,每个洞由一个收拢于它的 Cauchy 列填上。我们走了分割那条路;但 Cauchy 完备化是等价的另一条,且更容易推广到一般度量空间(任何度量空间都能这样「补全」成完备的)。两条路殊途同归。\n\n## 一道激活练习\n\n(a) 用 Cauchy 判据证明:若 (xₙ) 满足 |x_{n+1} − xₙ| ≤ (1/2)ⁿ 对一切 n,则 (xₙ) 收敛。(提示:估计 |x_{n+p} − xₙ|,用三角不等式拆成相邻差之和,再用几何级数 Σ(1/2)ᵏ 的尾部 → 0 说明它是 Cauchy 列;ℝ 完备故收敛。注意:你**不需要**算出极限。)\n\n(b) 举例说明 (a) 中的条件 |x_{n+1} − xₙ| → 0(只要求相邻差趋于 0)**不足以**保证收敛。(提示:部分和 xₙ = 1 + 1/2 + 1/3 + ⋯ + 1/n——相邻差 1/n → 0,但这个数列发散,你以后会在级数里证;先直观接受或用「xₙ 无界」论证。)\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 验证 Cauchy。对 n < n+p,由三角不等式把跨度拆成相邻差之和:\n\n|x_{n+p} − xₙ| ≤ |x_{n+p} − x_{n+p−1}| + ⋯ + |x_{n+1} − xₙ| ≤ Σ_{k=n}^{n+p−1} (1/2)ᵏ。\n\n这个和 ≤ Σ_{k=n}^{∞} (1/2)ᵏ = (1/2)ⁿ/(1 − 1/2) = 2·(1/2)ⁿ = (1/2)^{n−1}。给定 ε > 0,因 (1/2)^{n−1} → 0(<a class=\"wl\" data-id=\"an_monotone\">几何数列<\/a>),取 N 使 (1/2)^{N−1} < ε。则对一切 m = n+p > n ≥ N,|xₘ − xₙ| ≤ (1/2)^{n−1} ≤ (1/2)^{N−1} < ε。故 (xₙ) 是 Cauchy 列;ℝ 完备,故收敛。∎(全程没算极限——这正是 Cauchy 判据的威力。)\n\n**(b)** 取 xₙ := Σ_{k=1}^{n} 1/k = 1 + 1/2 + ⋯ + 1/n(调和级数部分和)。相邻差 |x_{n+1} − xₙ| = 1/(n+1) → 0,满足「相邻差趋于 0」。但 (xₙ) 发散:它无界(可证 x_{2ᵐ} ≥ 1 + m/2,随 m 增到无穷;严格证明留待级数)。所以「相邻差 → 0」是收敛的必要条件,**远不充分**——Cauchy 要求的是「**任意远**的两项 d(xₙ, xₘ) 都小」(m, n 都 ≥ N 即可,无论相距多远),而非只是「相邻两项」小。这个区别是 Cauchy 判据的精髓:(a) 里相邻差按 (1/2)ⁿ 几何式衰减,快到连「任意远」的跨度求和都受控;(b) 里相邻差按 1/n 衰减,太慢,跨度一拉长求和就发散。∎\n\n回顾:Cauchy 判据的关键,是控制「**任意两项**」之距,而非相邻两项。(a)(b) 的对比正卡在这里——同样是「相邻差趋于 0」,几何式衰减(快)给出 Cauchy 列、调和式衰减(慢)不给。用 Cauchy 判据时,务必估计 |x_{n+p} − xₙ| 对**所有** p 一致地小,这一步通常归结为某个级数尾部的控制。\n\n## 往前看一步\n\n数列收敛的理论到此完整:定义(ε–N)、唯一性、有界、子列、聚点、运算法则、夹逼、单调收敛、e、Bolzano–Weierstrass、Cauchy 完备——ℝ 与 ℂ 上「一列点如何趋于一个点」已被彻底厘清。\n\n但「无限相加」还没真正展开。Cauchy 判据其实已经叩到了门口:把一串数 a₀, a₁, a₂, … **依次累加**,得到部分和 sₙ = a₀ + ⋯ + aₙ,这个部分和数列收不收敛?它收敛,就说无穷级数 Σaₖ「收敛」,其极限就是这个「无穷和」的值。e = Σ 1/k!、以及各种把函数展成无穷次多项式的展开,都属于这个主题。而判断级数收敛最根本的工具,正是刚建立的 Cauchy 判据(用在部分和数列上)与完备性。这就是分析的下一大块:**无穷级数**。","refs":"Amann–Escher, Analysis I §II.6"},{"id":"an_confronto","label":"夹逼定理与极限的序","parent":"an_analisi","summary":"极限保持「≤」(但不保持严格「<」);若 (yₙ) 被两个收敛到同一极限 a 的数列上下夹住,则 (yₙ) 也收敛到 a——夹逼定理是求复杂极限最锋利的工具,依赖 ℝ 的序。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#F679A3","ring":4,"bearing":11,"popupLinks":[{"id":"an_algebra_limiti","text":"运算法则"},{"id":"num_q_ordine","text":"全序"},{"id":"alg_binomio","text":"二项式定理"},{"id":"num_radici_n","text":"n 次根"},{"id":"an_convergenza","text":"收敛"},{"id":"an_monotone","text":"单调收敛定理"}],"body":"\n## 极限与序的关系\n\n<a class=\"wl\" data-id=\"an_algebra_limiti\">运算法则<\/a>让我们能算和、差、积、商的极限,但它们对**实数列**漏掉了一件事:序。两个数列若处处有 xₙ ≤ yₙ,它们的极限之间也有这个关系吗?反过来更有用——若一个数列被两个收敛到同一处的数列夹住,它是不是也被迫收敛到那里?\n\n这两个问题只对**实数列**有意义(ℂ 没有序,问\"复数谁大谁小\"无意义),所以本节专属实数列,依赖 ℝ 的<a class=\"wl\" data-id=\"num_q_ordine\">全序<\/a>。而第二个问题的答案——**夹逼定理**——是实分析里求极限最锋利的工具,尤其当数列复杂到运算法则拆不开时。\n\n## 极限保持「≤」\n\n**命题(序的保持).** 设 (xₙ)、(yₙ) 是收敛实数列,且 xₙ ≤ yₙ 对**无穷多** n 成立。则\n\nlim xₙ ≤ lim yₙ。\n\n**证明.** 记 a := lim xₙ,b := lim yₙ,反设 a > b。则 ε := a − b > 0。因 xₙ → a,几乎所有项满足 xₙ > a − ε/4;因 yₙ → b,几乎所有项满足 yₙ < b + ε/4。这两个\"几乎所有\"合起来仍是几乎所有,而题设 xₙ ≤ yₙ 对无穷多 n 成立——无穷多与几乎所有必有公共下标 n,在该处\n\na − ε/4 < xₙ ≤ yₙ < b + ε/4，\n\n即 a − ε/4 < b + ε/4,移项 a − b < ε/2,即 ε < ε/2,矛盾。故 a ≤ b。∎\n\n直觉:数列的极限继承了数列的「不大于」关系——如果 (xₙ) 总在 (yₙ) 下方(哪怕只是无穷多次),它们逼近的目标也满足同样的高下。\n\n## 但严格「<」不被保持\n\n一个**重要的陷阱**:把上面的 ≤ 换成严格的 <,结论**不成立**。即使 xₙ < yₙ 对一切 n 成立,也只能得到 lim xₙ ≤ lim yₙ,**不能**保证严格小于。\n\n反例:取 xₙ := −1/n,yₙ := 1/n。则对一切 n ∈ ℕˣ 有 xₙ < yₙ(负数 < 正数),但两者都收敛到 0:\n\n<svg viewBox=\"0 0 420 150\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"55\" y1=\"75\" x2=\"408\" y2=\"75\" stroke=\"#E0612F\" stroke-width=\"1.3\" stroke-dasharray=\"6,3\"/>\n  <text x=\"414\" y=\"79\" font-size=\"12\" fill=\"#E0612F\">0<\/text>\n  <line x1=\"55\" y1=\"30\" x2=\"55\" y2=\"135\" stroke=\"#ccc\" stroke-width=\"0.8\"/>\n  <!-- yₙ=1/n 上方 -->\n  <polyline points=\"67,20 92,36 117,48 142,54 167,58 192,61 217,63 242,64 267,65 292,66 317,67\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"67\" cy=\"20\" r=\"3\"/><circle cx=\"92\" cy=\"36\" r=\"3\"/><circle cx=\"117\" cy=\"48\" r=\"3\"/><circle cx=\"142\" cy=\"54\" r=\"3\"/><circle cx=\"167\" cy=\"58\" r=\"3\"/><circle cx=\"192\" cy=\"61\" r=\"3\"/><circle cx=\"217\" cy=\"63\" r=\"3\"/><circle cx=\"242\" cy=\"64\" r=\"3\"/><circle cx=\"267\" cy=\"65\" r=\"3\"/><circle cx=\"292\" cy=\"66\" r=\"3\"/><circle cx=\"317\" cy=\"67\" r=\"3\"/>\n  <\/g>\n  <text x=\"330\" y=\"55\" font-size=\"11\" fill=\"#5A5FE0\">yₙ = 1/n<\/text>\n  <!-- xₙ=-1/n 下方 -->\n  <polyline points=\"67,130 92,114 117,102 142,96 167,92 192,89 217,87 242,86 267,85 292,84 317,83\" fill=\"none\" stroke=\"#00A070\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n  <g fill=\"#00A070\">\n    <circle cx=\"67\" cy=\"130\" r=\"3\"/><circle cx=\"92\" cy=\"114\" r=\"3\"/><circle cx=\"117\" cy=\"102\" r=\"3\"/><circle cx=\"142\" cy=\"96\" r=\"3\"/><circle cx=\"167\" cy=\"92\" r=\"3\"/><circle cx=\"192\" cy=\"89\" r=\"3\"/><circle cx=\"217\" cy=\"87\" r=\"3\"/><circle cx=\"242\" cy=\"86\" r=\"3\"/><circle cx=\"267\" cy=\"85\" r=\"3\"/><circle cx=\"292\" cy=\"84\" r=\"3\"/><circle cx=\"317\" cy=\"83\" r=\"3\"/>\n  <\/g>\n  <text x=\"328\" y=\"112\" font-size=\"11\" fill=\"#00A070\">xₙ = −1/n<\/text>\n  <text x=\"200\" y=\"148\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">处处 xₙ &lt; yₙ，但两者都 → 0：严格不等式在极限处「塌成」相等<\/text>\n<\/svg>\n\n两条数列始终严格分开(一条全正、一条全负),却在极限处**并拢到同一个点** 0。教训:**取极限会把严格不等式「软化」成 ≤**——逼近的过程中,原本的间隙可以缩到零。以后用到「xₙ < yₙ 推出极限严格小于」时,务必警惕:这一步是错的。\n\n## 夹逼定理\n\n现在是主角。它的形状像三明治:中间的数列被上下两片夹住,而两片若收敛到同一处,中间的也别无选择。\n\n**定理(夹逼 squeeze theorem).** 设 (xₙ)、(yₙ)、(zₙ) 是实数列,满足\n\nxₙ ≤ yₙ ≤ zₙ  对几乎所有 n，\n\n且 lim xₙ = lim zₙ = a。则 (yₙ) 也收敛,且 lim yₙ = a。\n\n<svg viewBox=\"0 0 440 230\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"55\" y1=\"120\" x2=\"420\" y2=\"120\" stroke=\"#E0612F\" stroke-width=\"1.2\" stroke-dasharray=\"6,3\"/>\n  <text x=\"424\" y=\"124\" font-size=\"12\" fill=\"#E0612F\">a<\/text>\n  <line x1=\"55\" y1=\"30\" x2=\"55\" y2=\"212\" stroke=\"#ccc\" stroke-width=\"0.8\"/>\n  <text x=\"404\" y=\"225\" font-size=\"11\" fill=\"#888\">n<\/text>\n  <!-- 上数列 zₙ (降向a) -->\n  <polyline points=\"67,40 89,68 111,83 133,91 155,96 177,100 199,103 220,105 242,106 264,108 286,109 308,110 330,110\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"1\" opacity=\"0.55\"/>\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"67\" cy=\"40\" r=\"3\"/><circle cx=\"111\" cy=\"83\" r=\"3\"/><circle cx=\"155\" cy=\"96\" r=\"3\"/><circle cx=\"199\" cy=\"103\" r=\"3\"/><circle cx=\"242\" cy=\"106\" r=\"3\"/><circle cx=\"286\" cy=\"109\" r=\"3\"/><circle cx=\"330\" cy=\"110\" r=\"3\"/>\n  <\/g>\n  <text x=\"338\" y=\"86\" font-size=\"11\" fill=\"#5A5FE0\">zₙ ↓<\/text>\n  <!-- 下数列 xₙ (升向a) -->\n  <polyline points=\"67,200 89,172 111,157 133,149 155,144 177,140 199,137 220,135 242,134 264,132 286,131 308,130 330,130\" fill=\"none\" stroke=\"#00A070\" stroke-width=\"1\" opacity=\"0.55\"/>\n  <g fill=\"#00A070\">\n    <circle cx=\"67\" cy=\"200\" r=\"3\"/><circle cx=\"111\" cy=\"157\" r=\"3\"/><circle cx=\"155\" cy=\"144\" r=\"3\"/><circle cx=\"199\" cy=\"137\" r=\"3\"/><circle cx=\"242\" cy=\"134\" r=\"3\"/><circle cx=\"286\" cy=\"131\" r=\"3\"/><circle cx=\"330\" cy=\"130\" r=\"3\"/>\n  <\/g>\n  <text x=\"338\" y=\"136\" font-size=\"11\" fill=\"#00A070\">xₙ ↑<\/text>\n  <!-- 中数列 yₙ (被夹) -->\n  <g fill=\"#E0612F\">\n    <circle cx=\"67\" cy=\"137\" r=\"3.4\"/><circle cx=\"89\" cy=\"102\" r=\"3.4\"/><circle cx=\"111\" cy=\"136\" r=\"3.4\"/><circle cx=\"133\" cy=\"114\" r=\"3.4\"/><circle cx=\"155\" cy=\"127\" r=\"3.4\"/><circle cx=\"177\" cy=\"112\" r=\"3.4\"/><circle cx=\"199\" cy=\"122\" r=\"3.4\"/><circle cx=\"220\" cy=\"116\" r=\"3.4\"/><circle cx=\"242\" cy=\"125\" r=\"3.4\"/><circle cx=\"264\" cy=\"118\" r=\"3.4\"/><circle cx=\"286\" cy=\"122\" r=\"3.4\"/><circle cx=\"308\" cy=\"118\" r=\"3.4\"/><circle cx=\"330\" cy=\"123\" r=\"3.4\"/>\n  <\/g>\n  <text x=\"338\" y=\"118\" font-size=\"11\" fill=\"#E0612F\">yₙ<\/text>\n  <text x=\"210\" y=\"223\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">上下两片都收敛到 a，中间的 yₙ 被夹得别无选择，也 → a<\/text>\n<\/svg>\n\n**证明.** 设 m₀ 使 n ≥ m₀ 时 xₙ ≤ yₙ ≤ zₙ。给定 ε > 0。因 xₙ → a,存在 m₁ 使 n ≥ m₁ 时 xₙ > a − ε；因 zₙ → a,存在 m₂ 使 n ≥ m₂ 时 zₙ < a + ε。取 N := max(m₀, m₁, m₂)。则对一切 n ≥ N:\n\na − ε < xₙ ≤ yₙ ≤ zₙ < a + ε，\n\n即 a − ε < yₙ < a + ε,也就是 yₙ ∈ B(a, ε)。故几乎所有 yₙ 落在 a 的 ε-邻域里,yₙ → a。∎\n\n证明的关键一步是那条**串起来的不等式** a − ε < xₙ ≤ yₙ ≤ zₙ < a + ε:左端被下片顶住、右端被上片压住,中间的 yₙ 被锁死在 (a−ε, a+ε) 里。两片合拢到 a,缝隙归零,yₙ 无处可逃。\n\n夹逼的威力在于:**它不要求你算出 yₙ 本身的任何信息**,只要找到两个会算的、且收敛到同一处的「夹板」。当 yₙ 复杂到无法用运算法则拆解时,这往往是唯一的出路。\n\n## 夹逼怎么用：两个例子\n\n**例 1.** 求 lim (sin n)/n。\n\n直接算无从下手——sin n 在 ℝ 上不规则地振荡,既不收敛也没有简单公式。但它有界:−1 ≤ sin n ≤ 1。于是\n\n−1/n ≤ (sin n)/n ≤ 1/n。\n\n下片 −1/n → 0,上片 1/n → 0(都由 1/n → 0 与数乘),两片同极限 0。由夹逼,lim (sin n)/n = 0。∎ 注意我们**从未**分析 sin n 的行为,只用了「它被 ±1 框住」——夹逼把那个棘手的振荡完全绕过去了。\n\n**例 2.** 求 lim ⁿ√n（即 n^(1/n)）。\n\n这个极限不显然(底数 n 在涨、指数 1/n 在缩,两股力气方向相反)。答案是 1,可以用夹逼证。对 n ≥ 1 显然 ⁿ√n ≥ 1。另一边需要一个上界:写 ⁿ√n = 1 + hₙ(其中 hₙ ≥ 0),则 n = (1 + hₙ)ⁿ。由<a class=\"wl\" data-id=\"alg_binomio\">二项式定理<\/a>,当 n ≥ 2,\n\nn = (1 + hₙ)ⁿ ≥ C(n,2)·hₙ² = [n(n−1)/2]·hₙ²，\n\n(只保留二项展开里第 k=2 项,其余非负项全丢掉)。于是 hₙ² ≤ 2/(n−1),即 0 ≤ hₙ ≤ √(2/(n−1))。从而\n\n1 ≤ ⁿ√n = 1 + hₙ ≤ 1 + √(2/(n−1))。\n\n上片 1 + √(2/(n−1)) → 1(因 2/(n−1) → 0,根号连续——这点以后严格化,现在直观接受),下片恒 1。由夹逼,lim ⁿ√n = 1。∎ 这个例子展示了夹逼的典型配合:**先用二项式定理造出一个能算的上界,再夹**——和当初<a class=\"wl\" data-id=\"num_radici_n\">n 次根<\/a>、<a class=\"wl\" data-id=\"alg_binomio\">Bernoulli 不等式<\/a>里\"展开后丢掉同号项作界\"是同一种手法。\n\n## 一道激活练习\n\n用夹逼定理求下列极限(先找夹板,再说明两片同极限):\n\n(a) lim (cos(n²))/(n+1)；\n(b) lim ( 1/(n²+1) + 1/(n²+2) + ⋯ + 1/(n²+n) )（提示:n 个正项求和;每项都介于最小项与最大项之间,放大成 n·(最大项)、缩小成 n·(最小项)）；\n(c) lim ⁿ√(2ⁿ + 3ⁿ)（提示:夹在 ⁿ√(3ⁿ) 与 ⁿ√(2·3ⁿ) 之间）。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** cos 有界:−1 ≤ cos(n²) ≤ 1。故 −1/(n+1) ≤ cos(n²)/(n+1) ≤ 1/(n+1)。两片 ±1/(n+1) 都 → 0（由 1/(n+1) → 0,见<a class=\"wl\" data-id=\"an_convergenza\">收敛<\/a>例与运算法则）。夹逼给 **lim = 0**。\n\n**(b)** 记和为 Sₙ,它有 n 个加项,每项形如 1/(n²+k),1 ≤ k ≤ n。最大项是 k=1 时的 1/(n²+1),最小项是 k=n 时的 1/(n²+n)。于是\n\nn · 1/(n²+n) ≤ Sₙ ≤ n · 1/(n²+1)，\n\n即 n/(n²+n) ≤ Sₙ ≤ n/(n²+1)。下片 n/(n²+n) = 1/(n+1) → 0;上片 n/(n²+1) → 0（分子分母同除 n²:(1/n)/(1+1/n²) → 0/1 = 0,运算法则）。两片同极限 0,夹逼给 **lim Sₙ = 0**。\n\n**(c)** 因 3ⁿ ≤ 2ⁿ + 3ⁿ ≤ 3ⁿ + 3ⁿ = 2·3ⁿ,开 n 次方(根保序,<a class=\"wl\" data-id=\"num_radici_n\">n 次根<\/a>递增):\n\nⁿ√(3ⁿ) ≤ ⁿ√(2ⁿ+3ⁿ) ≤ ⁿ√(2·3ⁿ)。\n\n左片 ⁿ√(3ⁿ) = 3。右片 ⁿ√(2·3ⁿ) = ⁿ√2 · 3 → 1·3 = 3（因 ⁿ√2 → 1,这是 ⁿ√n → 1 同型的基本极限,可同法证或直接引用）。两片同极限 3,夹逼给 **lim = 3**。\n\n回顾:夹逼的通用策略是**把不会算的量,放大和缩小成两个会算的、且收敛到同一处的式子**。常见的\"造夹板\"手法有三种,本题各见一种:用有界因子的界(a：cos∈[−1,1])、用求和项的最大最小(b：n 项夹在 n×max 与 n×min 之间)、用主导项的提取(c：3ⁿ 是 2ⁿ+3ⁿ 的主导)。认出\"谁主导、谁有界、怎么放缩\",是用好夹逼的关键。\n\n## 往前看一步\n\n到这里,求极限的两大工具都备齐了:<a class=\"wl\" data-id=\"an_algebra_limiti\">运算法则<\/a>(拆解能算的)与夹逼(围堵不能算的)。但有一类极其重要的数列,这两样工具都难直接对付——**单调数列**:一个一直增(或一直减)、但不知道增向何方的数列,比如 (1 + 1/n)ⁿ。它显然在\"往上爬\",可极限是多少、甚至到底收不收敛,运算法则拆不开、也找不到现成的夹板。回答它需要回到 ℝ 最根本的性质——**完备性**:一个单调递增且有上界的数列,必定收敛(收敛到它的上确界)。这是完备性在极限理论里的第一次正面登场,也是通向 e、通向无穷级数的门。这就是 <a class=\"wl\" data-id=\"an_monotone\">单调收敛定理<\/a> 的内容。","refs":"Amann–Escher, Analysis I §II.2"},{"id":"an_continuita","label":"连续函数","parent":"an_analisi","summary":"函数 f 在 x₀ 连续,指 x 靠近 x₀ 时 f(x) 靠近 f(x₀)——用 ε–δ 精确表述。序列判据:f 连续 ⟺ 它「尊重极限」(xₙ→x₀ 蕴含 f(xₙ)→f(x₀)),这把整套数列收敛理论搬到了函数上。连续函数的和、积、商仍连续。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#F679A3","ring":4,"bearing":0,"popupLinks":[{"id":"an_convergenza","text":"数列收敛"},{"id":"an_cauchy","text":"完备性"},{"id":"an_serie","text":"级数"},{"id":"an_serie_potenze","text":"幂级数"},{"id":"an_spazio_metrico","text":"度量空间"},{"id":"num_radici_n","text":"根式"},{"id":"an_algebra_limiti","text":"数列极限的运算法则"},{"id":"an_continuita","text":"序列判据"},{"id":"an_confronto","text":"极限保序"},{"id":"num_q_ordine","text":"有理数"}],"body":"\n## 从「数」到「函数」\n\n第二章把「一列点如何趋于一个点」彻底厘清了——<a class=\"wl\" data-id=\"an_convergenza\">数列收敛<\/a>、<a class=\"wl\" data-id=\"an_cauchy\">完备性<\/a>、<a class=\"wl\" data-id=\"an_serie\">级数<\/a>、<a class=\"wl\" data-id=\"an_serie_potenze\">幂级数<\/a>。现在分析的对象从「数列」升级到「函数」。第一个、也是最基本的函数性质,是**连续性**。\n\n直觉上,连续函数是「图像不断开、可以一笔画成」的函数;反过来,不连续是「图像有跳跃、有洞」。但「一笔画成」是图形语言,不能作严格定义。严格的想法是:**当自变量 x 靠近 x₀ 时,函数值 f(x) 也靠近 f(x₀)**——输入的微小变化只引起输出的微小变化,没有突变。这一节把这个直觉用 ε–δ 精确化,并接上第二章的数列理论。\n\n## 用邻域定义连续\n\n设 f : X → Y 是两个<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>之间的函数。「f(x) 靠近 f(x₀)」用<a class=\"wl\" data-id=\"an_spazio_metrico\">邻域<\/a>表述最干净:\n\n**定义(连续).** f 在点 x₀ ∈ X **连续**(continuous)，若对 f(x₀) 的**每个**邻域 V,都存在 x₀ 的某个邻域 U,使得\n\nf(U) ⊆ V，\n\n即「U 中的点全被 f 映进 V」。若 f 在 X 的每一点都连续,就称 f **连续**。\n\n读法:**无论你要求 f(x) 落在 f(x₀) 周围多小的范围 V 里,总能找到 x₀ 周围一个范围 U,使得 U 里的 x 都满足要求**。输出要多准,输入就收多紧——这正是「微小输入变化 ⟹ 微小输出变化」的精确版。\n\n## ε–δ 表述\n\n邻域定义简洁,但具体计算时,用<a class=\"wl\" data-id=\"an_spazio_metrico\">球<\/a>把邻域写成 ε、δ 更顺手。\n\n**命题(ε–δ 判据).** f : X → Y 在 x₀ 连续 **当且仅当**:对每个 **ε > 0**,存在 **δ = δ(x₀, ε) > 0**,使得\n\nd(f(x₀), f(x)) < ε，  对一切满足 d(x₀, x) < δ 的 x。\n\n（记号 δ = δ(x₀, ε) 强调 δ 一般同时依赖于点 x₀ 和精度 ε。）\n\n**证明.** 把上面邻域定义里的 V 取成球 B(f(x₀), ε)、U 取成球 B(x₀, δ) 即可:邻域定义说「每个 V 有 U 使 f(U)⊆V」,翻译成球就是「每个 ε 有 δ 使 d(x,x₀)<δ ⟹ d(f(x),f(x₀))<ε」。两者等价。∎\n\n<svg viewBox=\"0 0 440 240\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- ε 带 (水平, 套住 f(x0)) -->\n  <rect x=\"60\" y=\"92\" width=\"320\" height=\"47\" fill=\"#E0612F\" opacity=\"0.09\"/>\n  <line x1=\"60\" y1=\"92\" x2=\"380\" y2=\"92\" stroke=\"#E0612F\" stroke-width=\"0.7\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"60\" y1=\"139\" x2=\"380\" y2=\"139\" stroke=\"#E0612F\" stroke-width=\"0.7\" stroke-dasharray=\"4,3\"/>\n  <text x=\"384\" y=\"110\" font-size=\"11\" fill=\"#E0612F\">2ε<\/text>\n  <!-- δ 带 (竖直, 套住 x0) -->\n  <rect x=\"213\" y=\"20\" width=\"84\" height=\"195\" fill=\"#5A5FE0\" opacity=\"0.08\"/>\n  <line x1=\"213\" y1=\"20\" x2=\"213\" y2=\"215\" stroke=\"#5A5FE0\" stroke-width=\"0.7\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"297\" y1=\"20\" x2=\"297\" y2=\"215\" stroke=\"#5A5FE0\" stroke-width=\"0.7\" stroke-dasharray=\"4,3\"/>\n  <text x=\"255\" y=\"232\" font-size=\"11\" text-anchor=\"middle\" fill=\"#5A5FE0\">2δ<\/text>\n  <!-- 坐标轴 -->\n  <line x1=\"60\" y1=\"215\" x2=\"410\" y2=\"215\" stroke=\"#bbb\" stroke-width=\"1\"/>\n  <line x1=\"60\" y1=\"215\" x2=\"60\" y2=\"20\" stroke=\"#bbb\" stroke-width=\"1\"/>\n  <!-- 曲线 -->\n  <polyline points=\"90.0,163.2 108.0,161.4 126.0,158.8 144.0,155.3 162.0,151.0 180.0,145.8 198.0,139.9 216.0,133.0 234.0,125.4 252.0,116.9 270.0,107.6 288.0,97.4 306.0,86.4 324.0,74.6 342.0,61.9 360.0,48.4\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/>\n  <!-- (x0, f(x0)) 点 + 投影线 -->\n  <line x1=\"255\" y1=\"215\" x2=\"255\" y2=\"115\" stroke=\"#999\" stroke-width=\"0.7\" stroke-dasharray=\"2,2\"/>\n  <line x1=\"60\" y1=\"115\" x2=\"255\" y2=\"115\" stroke=\"#999\" stroke-width=\"0.7\" stroke-dasharray=\"2,2\"/>\n  <circle cx=\"255\" cy=\"115\" r=\"4\" fill=\"#E0612F\"/>\n  <text x=\"252\" y=\"230\" font-size=\"11\" fill=\"#5A5FE0\">x₀<\/text>\n  <text x=\"38\" y=\"118\" font-size=\"11\" fill=\"#E0612F\">f(x₀)<\/text>\n  <text x=\"120\" y=\"40\" font-size=\"10\" fill=\"#777\">x 落在 δ 内 ⟹ f(x) 落在 ε 内<\/text>\n<\/svg>\n\n图示:给定 f(x₀) 周围宽 2ε 的水平带,要找 x₀ 周围宽 2δ 的竖直带,使曲线在竖直带内的部分**整个落进水平带**。函数越「陡」,达到同样 ε 所需的 δ 越小——但只要不突变,总能找到。\n\n**例(平方根连续).** f : ℝ₊ → ℝ₊,x ↦ √x 连续。**验证(在 x₀ > 0)**:给定 ε > 0,取 δ := min(ε√x₀, x₀)。当 |x − x₀| < δ 时,用<a class=\"wl\" data-id=\"num_radici_n\">根式<\/a>的有理化:\n\n|√x − √x₀| = |x − x₀| / (√x + √x₀) ≤ |x − x₀| / √x₀ < δ/√x₀ ≤ ε。\n\n(分母 √x + √x₀ ≥ √x₀ 给了第一个不等号。)故 √x 在每点连续。∎ 这是 ε–δ 定义的典型用法:**从目标 |f(x)−f(x₀)| < ε 倒推出需要多小的 δ**。\n\n## 序列判据：连续 = 尊重极限\n\n连续性与第二章的桥梁,是下面这条定理——它把「连续」翻译成「保持数列极限」,从而让**整套<a class=\"wl\" data-id=\"an_convergenza\">数列收敛<\/a>理论瞬间可用于函数**。\n\n**定理(序列判据).** f : X → Y 在 x₀ 连续 **当且仅当** f 在 x₀ **序列连续**:对**每个**收敛到 x₀ 的数列 (xₙ)(xₙ → x₀),都有 f(xₙ) → f(x₀)。\n\n**证明.** （⟹）设 f 在 x₀ 连续,xₙ → x₀。任取 f(x₀) 的邻域 V,由连续性有 x₀ 的邻域 U 使 f(U) ⊆ V。因 xₙ → x₀,存在 N 使 n ≥ N 时 xₙ ∈ U,于是 f(xₙ) ∈ V。这说明 f(xₙ) → f(x₀)。\n\n（⟸）反证。设 f 序列连续但在 x₀ **不**连续。则有 f(x₀) 的某个邻域 V,使**任何** x₀ 的邻域都装不进 V——特别地,对每个 k,球 B(x₀, 1/k) 里都有点 xₖ 使 f(xₖ) ∉ V。这样构造的 (xₖ) 满足 d(x₀,xₖ) < 1/k → 0,即 xₖ → x₀,但 f(xₖ) 始终在 V 外,不收敛到 f(x₀)——与序列连续矛盾。故 f 在 x₀ 连续。∎\n\n由此立刻得到连续函数最常用的一条性质——**连续函数与取极限可交换**:对任何收敛数列 (xₙ),\n\nlim_{n→∞} f(xₙ) = f( lim_{n→∞} xₙ )。\n\n一句话:**连续函数「尊重极限」**(respects limits)——先取极限再作用 f,与先作用 f 再取极限,结果相同。这是连续性最实用的刻画,也是「连续」一词在分析中真正的操作含义。\n\n## 连续函数的运算\n\n序列判据的最大红利,是把<a class=\"wl\" data-id=\"an_algebra_limiti\">数列极限的运算法则<\/a>直接搬成连续函数的运算法则——证明几乎是「翻译」。\n\n**命题.** 设 f, g 在 x₀ 连续(值在赋范空间 F,或 F = 𝕂)。则:\n\n(i) f + g 与 λf（λ ∈ 𝕂）在 x₀ 连续;\n(ii) 若 F = 𝕂,f · g 在 x₀ 连续;\n(iii) 若 F = 𝕂 且 g(x₀) ≠ 0,f / g 在 x₀ 连续。\n\n**证明.** 全部经由<a class=\"wl\" data-id=\"an_continuita\">序列判据<\/a>化归到<a class=\"wl\" data-id=\"an_algebra_limiti\">数列运算法则<\/a>。以 (ii) 为例:任取 xₙ → x₀。由 f, g 序列连续,f(xₙ) → f(x₀)、g(xₙ) → g(x₀);由数列<a class=\"wl\" data-id=\"an_algebra_limiti\">积的极限<\/a>,f(xₙ)g(xₙ) → f(x₀)g(x₀),即 (f·g)(xₙ) → (f·g)(x₀)。故 f·g 序列连续,从而连续。(i)(iii) 同理,分别用和、商的极限法则(商需 g(x₀)≠0 保证分母不为零)。∎\n\n**这正是序列判据的威力:连续函数的运算,无需重新做 ε–δ,只要调用第二章数列极限的对应法则。** 一次建立的数列理论,在这里第二次收获。\n\n由这条命题,一大批函数的连续性「免费」得到:\n\n- **多项式连续**:常函数和恒等函数 x↦x 显然连续,由加法、乘法封闭,任何多项式 aₙxⁿ+⋯+a₀ 连续。\n- **有理函数连续**:两个多项式之商 p(x)/q(x),在 q(x)≠0 处连续(由 (iii))。\n- 由 √x 连续 + 复合(连续函数的复合仍连续,易由序列判据证)、四则运算,√(x²+1)、(x+1)/(x²−2) 等都连续。\n\n## 一道激活练习\n\n(a) 用 ε–δ 定义证明 f(x) = 3x + 1 在任意点 x₀ ∈ ℝ 连续。(提示:|f(x)−f(x₀)| = 3|x−x₀|,要它 < ε,取 δ = ε/3。)\n\n(b) 用**序列判据**证明:若 f 在 x₀ 连续且 f(x₀) > 0,则存在 x₀ 的一个邻域,f 在其上恒正。(提示:反证——若每个邻域里都有 f ≤ 0 的点,构造 xₙ → x₀ 使 f(xₙ) ≤ 0,用序列连续 + <a class=\"wl\" data-id=\"an_confronto\">极限保序<\/a>推出 f(x₀) ≤ 0,矛盾。)\n\n(c) 考虑**Dirichlet 函数** D(x) = 1（x 有理）、D(x) = 0（x 无理）。用序列判据说明 D 在**每一点**都不连续。(提示:任何实数 x₀ 附近既有<a class=\"wl\" data-id=\"num_q_ordine\">有理数<\/a>也有无理数逼近它,构造两列都→x₀ 但 D 值不同的数列。)\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 给定 ε > 0,取 δ := ε/3。当 |x − x₀| < δ 时:\n\n|f(x) − f(x₀)| = |(3x+1) − (3x₀+1)| = 3|x − x₀| < 3δ = 3·(ε/3) = ε。\n\n故 f 在 x₀ 连续。∎(线性函数的 δ 与 x₀ 无关,只依赖 ε——这种「δ 不依赖点」的性质以后叫**一致连续**。)\n\n**(b)** 反证。设 f(x₀) > 0,但**每个** x₀ 的邻域里都有使 f ≤ 0 的点。特别地,对每个 n,球 B(x₀, 1/n) 里有点 xₙ 使 f(xₙ) ≤ 0。则 d(x₀, xₙ) < 1/n → 0,即 xₙ → x₀。由 f 在 x₀ <a class=\"wl\" data-id=\"an_continuita\">序列连续<\/a>,f(xₙ) → f(x₀)。而 f(xₙ) ≤ 0 对所有 n,由<a class=\"wl\" data-id=\"an_confronto\">极限保序<\/a>(≤ 在取极限下保持),f(x₀) = lim f(xₙ) ≤ 0——与 f(x₀) > 0 矛盾。故存在某邻域 f 恒正。∎(这条「连续函数在正值点附近保持正」是常用的局部性质。)\n\n**(c)** 取任意 x₀ ∈ ℝ。因<a class=\"wl\" data-id=\"num_q_ordine\">有理数稠密<\/a>,存在有理数列 (aₙ) 使 aₙ → x₀,此时 D(aₙ) = 1 → 1;因无理数也稠密(无理数充满数轴),存在无理数列 (bₙ) 使 bₙ → x₀,此时 D(bₙ) = 0 → 0。两列都收敛到 x₀,但 D 沿它们的极限不同(1 ≠ 0)——若 D 在 x₀ 连续,序列判据要求 D 沿**任何**→x₀ 的数列都趋于同一个 D(x₀),矛盾。故 D 在 x₀ 不连续。x₀ 任意,故 D 处处不连续。∎\n\n回顾:三题覆盖连续性的两套工具。(a) 是 **ε–δ 直接验证**(从 ε 倒推 δ)。(b)(c) 是 **序列判据**的应用:(b) 用「构造逼近数列 + 极限保序」证局部正性,(c) 用「两列不同极限」证不连续——**证不连续最有力的办法,就是找两个都收敛到 x₀ 但函数值趋于不同极限的数列**。Dirichlet 函数处处不连续,生动展示了有理/无理数在数轴上「犬牙交错」的稠密性,也展示了序列判据判定不连续的威力。\n\n## 往前看一步\n\n连续性建立起来了,且经由序列判据与第二章的数列理论完全打通——连续函数「尊重极限」,其四则运算自动连续,多项式、有理函数、根式等一大批函数的连续性随之到手。\n\n但连续函数最深刻的力量,体现在它的**整体定理**上——这些定理把「局部的连续」放大成「整体的结构性结论」:\n- **介值定理**(Bolzano):连续函数若在两点取异号值,中间必有零点——「连续曲线从负到正必穿过零」。这是求根、存在性证明的基石。\n- **最值定理**:闭区间上的连续函数必取到最大值和最小值——保证优化问题有解。\n\n这两条定理的根基,是 ℝ 的<a class=\"wl\" data-id=\"an_cauchy\">完备性<\/a>与两个深刻的拓扑概念——**紧性**(compactness,「闭且有界」的本质)与**连通性**(connectedness,「不可分割」的本质)。第三章接下来会建立这套拓扑语言(开集、闭集、紧集),然后用它证明介值定理与最值定理。而这些,又都是通向**微分**的准备——可微比连续更强,而导数,正是你那条暂停的物理线等待已久的汇合点。连续函数是分析这座大厦从「数」迈向「函数」的第一层,拾级而上,微积分在望。","refs":"Amann–Escher, Analysis I §III.1"},{"id":"an_convergenza","label":"数列的收敛","parent":"an_analisi","summary":"数列 (xₙ) 收敛到 a，指 a 的每个邻域都包含几乎所有项;等价的 ε–N 形式是逼近的精确语言。极限唯一，且收敛数列必有界——极限理论的三块基石。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#DB82D8","ring":2,"bearing":17,"popupLinks":[{"id":"an_spazio_metrico","text":"度量空间"},{"id":"alg_complessi","text":"ℂ"},{"id":"fond_funzioni","text":"函数"},{"id":"num_archimede","text":"阿基米德性质"},{"id":"an_sottosuccessioni","text":"子列"},{"id":"an_valore_assoluto","text":"反向三角不等式"},{"id":"an_algebra_limiti","text":"极限的运算法则"}],"body":"\n## 终于到极限\n\n地基铺了这么久,现在抵达分析的核心问题:一列数 x₀, x₁, x₂, … 「趋于」某个值 a,到底是什么意思?\n\n中学里的说法是「n 越大,xₙ 越接近 a」——但这句话经不起推敲:「接近」到什么程度?「越来越」是多快?数学需要一个不含糊的定义,而<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>那节已经备好了全部材料:距离、球、邻域。这一节把「趋于」一次说死,然后立起极限理论的三块基石——定义、唯一性、有界性。\n\n定义将在任意度量空间里给出,所以它对 ℝ、对 <a class=\"wl\" data-id=\"alg_complessi\">ℂ<\/a>、对将来的 ℝⁿ 一字通用。\n\n## 数列\n\n**定义.** 集合 X 中的一个**数列**(sequence)，就是一个函数 ϕ : ℕ → X。把 ϕ(n) 记作 xₙ（称第 n **项**），整个数列记作 (xₙ) 或 (x₀, x₁, x₂, …)。\n\n数列不过是「以自然数为定义域的函数」——又一次,新概念建在<a class=\"wl\" data-id=\"fond_funzioni\">函数<\/a>这块老地基上。X = ℝ 时称**实数列**,X = ℂ 时称**复数列**。\n\n> 一个容易混淆的区分:数列 (xₙ) 与它的**值域** {xₙ : n ∈ ℕ} 不是一回事。常数列 (a, a, a, …) 有无穷多项,但值域只是单元素集 {a}。数列记着「顺序与重复」,值域把这些信息抹掉了。\n\n## 收敛的定义\n\n直觉是「项最终都挤进 a 附近的任意小范围」。用邻域把「任意小范围」和「最终」都说精确:\n\n**定义(收敛).** 数列 (xₙ) **收敛**(converges)到 **a**，若 a 的**每一个**邻域都包含 (xₙ) 的**几乎所有**项——即除有限个外的全部项。此时 a 称 (xₙ) 的**极限**(limit)，记\n\nlim_{n→∞} xₙ = a   或   xₙ → a (n → ∞)。\n\n不收敛的数列称**发散**(divergent)。\n\n「几乎所有」(almost all)是这里的关键术语,意思是「至多有限个例外」。把定义里的邻域换成最基本的 ε-球,得到日常使用的形式:\n\n**命题(ε–N 刻画).** lim xₙ = a 当且仅当:**对每个 ε > 0，存在 N ∈ ℕ，使得对一切 n ≥ N 都有 d(xₙ, a) < ε。**\n\n**证明.** 这只是把定义换种说法。(⟸)给定 a 的邻域 U,存在 r > 0 使 B(a, r) ⊆ U;取 ε = r,由条件存在 N 使 n ≥ N 时 d(xₙ,a) < r,即 xₙ ∈ B(a,r) ⊆ U——除前 N 个外全部落入 U。(⟹)给定 ε > 0,B(a, ε) 是 a 的邻域,由收敛定义除有限个外的项都在其中,取 N 为这些例外下标的最大值加一即可。∎\n\n这就是分析的招牌句式——「**任给 ε，存在 N，使 n ≥ N 时距离 < ε**」。读法:ε 是对手开出的「精度挑战」（要多接近）,N 是你的回应（从第几项起能保证）。ε 越小,N 通常越大,但只要对**每个** ε 都答得出 N,数列就收敛。下图把这个过程画出来:\n\n<svg viewBox=\"0 0 420 240\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- ε 带 -->\n  <rect x=\"55\" y=\"82\" width=\"290\" height=\"76\" fill=\"#E0612F\" opacity=\"0.10\"/>\n  <!-- a 水平线 -->\n  <line x1=\"55\" y1=\"120\" x2=\"345\" y2=\"120\" stroke=\"#E0612F\" stroke-width=\"1.4\" stroke-dasharray=\"6,3\"/>\n  <text x=\"352\" y=\"124\" font-size=\"13\" fill=\"#E0612F\">a<\/text>\n  <!-- 带边界 a±ε -->\n  <line x1=\"55\" y1=\"82\" x2=\"345\" y2=\"82\" stroke=\"#E0612F\" stroke-width=\"0.8\"/>\n  <line x1=\"55\" y1=\"158\" x2=\"345\" y2=\"158\" stroke=\"#E0612F\" stroke-width=\"0.8\"/>\n  <text x=\"352\" y=\"86\" font-size=\"11\" fill=\"#E0612F\">a+ε<\/text>\n  <text x=\"352\" y=\"162\" font-size=\"11\" fill=\"#E0612F\">a−ε<\/text>\n  <!-- n 轴 -->\n  <line x1=\"55\" y1=\"215\" x2=\"408\" y2=\"215\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <path d=\"M 408 215 L 400 211 L 400 219 z\" fill=\"#888\"/>\n  <text x=\"404\" y=\"232\" font-size=\"11\" fill=\"#555\">n<\/text>\n  <!-- N 标线 -->\n  <line x1=\"130\" y1=\"78\" x2=\"130\" y2=\"219\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/>\n  <text x=\"130\" y=\"232\" font-size=\"11\" text-anchor=\"middle\" fill=\"#555\">N<\/text>\n  <text x=\"220\" y=\"200\" font-size=\"11\" fill=\"#777\">n ≥ N 后,项全部落入带内<\/text>\n  <!-- 数列点 -->\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"67\" cy=\"205\" r=\"3.2\"/>\n    <circle cx=\"88\" cy=\"62\" r=\"3.2\"/>\n    <circle cx=\"109\" cy=\"162\" r=\"3.2\"/>\n    <circle cx=\"130\" cy=\"87\" r=\"3.2\"/>\n    <circle cx=\"152\" cy=\"147\" r=\"3.2\"/>\n    <circle cx=\"173\" cy=\"97\" r=\"3.2\"/>\n    <circle cx=\"194\" cy=\"140\" r=\"3.2\"/>\n    <circle cx=\"215\" cy=\"103\" r=\"3.2\"/>\n    <circle cx=\"236\" cy=\"136\" r=\"3.2\"/>\n    <circle cx=\"257\" cy=\"106\" r=\"3.2\"/>\n    <circle cx=\"279\" cy=\"133\" r=\"3.2\"/>\n    <circle cx=\"300\" cy=\"108\" r=\"3.2\"/>\n    <circle cx=\"321\" cy=\"131\" r=\"3.2\"/>\n  <\/g>\n<\/svg>\n\n橙色虚线是极限 a,橙带是 ε-邻域。前几项可以在带外乱跳,但从某个 N 起,所有项都被「漏斗」收进带内——这正是「几乎所有项落入 B(a, ε)」的画面。换一个更小的 ε（更窄的带），N 通常要往右挪,但带总能罩住最终的项。\n\n## 几个例子\n\n**(a) lim (1/n) = 0。** 这是最基本的收敛,它就是<a class=\"wl\" data-id=\"num_archimede\">阿基米德性质<\/a>的推论穿上了极限的外衣。\n\n**证明.** 给定 ε > 0。由<a class=\"wl\" data-id=\"num_archimede\">阿基米德推论<\/a>,存在 N ∈ ℕˣ 使 1/N < ε。则对一切 n ≥ N,有 1/n ≤ 1/N < ε,即 |1/n − 0| < ε。∎\n\n看清这里发生了什么:当初在 `num_archimede` 里,「1/N 可以任意小」是一条静态定理;现在它直接兑现成「1/n → 0」。**ε–N 定义里那个 N,正是阿基米德性质替我们找到的。** 这是「先建静态工具、再穿上极限外衣」的第一个范例。\n\n**(b) 常数列 (a, a, a, …) 收敛到 a。** 对任意 ε > 0,每一项都满足 d(a, a) = 0 < ε,取 N = 0 即可。极限就是那个常数。\n\n**(c) 实数列 ((−1)ⁿ) 发散。** 它在 +1 与 −1 之间反复跳,不向任何单一的值靠拢:\n\n<svg viewBox=\"0 0 420 160\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"55\" y1=\"80\" x2=\"408\" y2=\"80\" stroke=\"#bbb\" stroke-width=\"1\"/>\n  <line x1=\"55\" y1=\"35\" x2=\"390\" y2=\"35\" stroke=\"#ccc\" stroke-width=\"0.8\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"55\" y1=\"125\" x2=\"390\" y2=\"125\" stroke=\"#ccc\" stroke-width=\"0.8\" stroke-dasharray=\"4,3\"/>\n  <text x=\"40\" y=\"39\" font-size=\"12\" fill=\"#555\">+1<\/text>\n  <text x=\"40\" y=\"129\" font-size=\"12\" fill=\"#555\">−1<\/text>\n  <text x=\"404\" y=\"96\" font-size=\"11\" fill=\"#555\">n<\/text>\n  <path d=\"M 408 80 L 400 76 L 400 84 z\" fill=\"#bbb\"/>\n  <!-- 跳动连线 -->\n  <polyline points=\"67,35 97,125 128,35 158,125 189,35 219,125 250,35 280,125 311,35 341,125 372,35\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"0.8\" opacity=\"0.45\"/>\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"67\" cy=\"35\" r=\"3.2\"/><circle cx=\"97\" cy=\"125\" r=\"3.2\"/><circle cx=\"128\" cy=\"35\" r=\"3.2\"/><circle cx=\"158\" cy=\"125\" r=\"3.2\"/><circle cx=\"189\" cy=\"35\" r=\"3.2\"/><circle cx=\"219\" cy=\"125\" r=\"3.2\"/><circle cx=\"250\" cy=\"35\" r=\"3.2\"/><circle cx=\"280\" cy=\"125\" r=\"3.2\"/><circle cx=\"311\" cy=\"35\" r=\"3.2\"/><circle cx=\"341\" cy=\"125\" r=\"3.2\"/><circle cx=\"372\" cy=\"35\" r=\"3.2\"/>\n  <\/g>\n<\/svg>\n\n直觉上它「显然不收敛」,但要**证明**发散,得有判据。最利落的方式是借用下面就要证的唯一性:假如它收敛到某个 a,那么它的项最终都该挤进 a 的小邻域;可它有无穷多项等于 +1、又有无穷多项等于 −1,这两拨不可能同时挤进一个半径 < 1 的邻域。矛盾。（严格论证留到<a class=\"wl\" data-id=\"an_sottosuccessioni\">子列<\/a>那节,用「不同子列收敛到不同值」一击即中——那正是为这种数列量身打造的工具。）\n\n## 极限唯一\n\n定义说「收敛到 a」,可会不会一个数列同时收敛到两个不同的值?直觉上不可能——但这需要证明,而证明本身很能说明问题。\n\n**定理(极限唯一).** 若 xₙ → a 且 xₙ → b,则 a = b。\n\n**证明.** 反设 a ≠ b。由 (M1),它们的距离 d(a, b) > 0。取\n\nε := d(a, b) / 2 > 0。\n\n关键是这个 ε 选得让 a、b 两个球**互不相交**:B(a, ε) 与 B(b, ε) 没有公共点（若 x 同属两球,则 d(a,b) ≤ d(a,x) + d(x,b) < ε + ε = d(a,b)，矛盾——三角不等式不容许）。\n\n<svg viewBox=\"0 0 360 130\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"30\" y1=\"70\" x2=\"335\" y2=\"70\" stroke=\"#888\" stroke-width=\"1.2\"/>\n  <!-- a 球 -->\n  <rect x=\"61\" y=\"64\" width=\"118\" height=\"12\" fill=\"#E0612F\" opacity=\"0.13\"/>\n  <line x1=\"61\" y1=\"64\" x2=\"61\" y2=\"76\" stroke=\"#E0612F\" stroke-width=\"1\"/>\n  <line x1=\"179\" y1=\"64\" x2=\"179\" y2=\"76\" stroke=\"#E0612F\" stroke-width=\"1\"/>\n  <circle cx=\"120\" cy=\"70\" r=\"3.5\" fill=\"#E0612F\"/>\n  <text x=\"120\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" fill=\"#E0612F\">a<\/text>\n  <text x=\"120\" y=\"92\" font-size=\"10\" text-anchor=\"middle\" fill=\"#E0612F\">B(a, ε)<\/text>\n  <!-- b 球 -->\n  <rect x=\"191\" y=\"64\" width=\"118\" height=\"12\" fill=\"#5A5FE0\" opacity=\"0.13\"/>\n  <line x1=\"191\" y1=\"64\" x2=\"191\" y2=\"76\" stroke=\"#5A5FE0\" stroke-width=\"1\"/>\n  <line x1=\"309\" y1=\"64\" x2=\"309\" y2=\"76\" stroke=\"#5A5FE0\" stroke-width=\"1\"/>\n  <circle cx=\"250\" cy=\"70\" r=\"3.5\" fill=\"#5A5FE0\"/>\n  <text x=\"250\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5A5FE0\">b<\/text>\n  <text x=\"250\" y=\"92\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5A5FE0\">B(b, ε)<\/text>\n  <!-- 中缝 -->\n  <line x1=\"185\" y1=\"62\" x2=\"185\" y2=\"110\" stroke=\"#999\" stroke-width=\"0.8\" stroke-dasharray=\"3,3\"/>\n  <text x=\"185\" y=\"122\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">ε = d(a,b)/2，两球不交<\/text>\n<\/svg>\n\n现在两边夹击。因 xₙ → a,从某个 N₁ 起所有项落进 B(a, ε)；因 xₙ → b,从某个 N₂ 起所有项落进 B(b, ε)。取 N = max(N₁, N₂),则第 N 项 x_N **同时**在两个球里——可两球不相交,不可能有公共点。矛盾。故 a = b。∎\n\n这个证明的核心思想叫「**分离**」:两个不同的点,总能用两个不相交的小球分开（这条性质叫 Hausdorff 性，度量空间天然具备）。一旦分开,数列的项不可能最终同时挤进两边,所以极限至多一个。「极限唯一」这件看似显然的事,本质是「不同点可被邻域分离」。\n\n## 收敛蕴含有界\n\n最后一块基石。先说「有界」在度量空间里的意思:\n\n**定义.** X 的子集 Y 称**有界**(bounded)，若存在 M > 0 使 d(x, y) ≤ M 对一切 x, y ∈ Y 成立（任意两点距离有统一上界）。数列 (xₙ) 称有界,若其值域 {xₙ : n ∈ ℕ} 有界。\n\n（在 ℝ 或 ℂ 中,这等价于存在 M 使 |xₙ| ≤ M 对一切 n——所有项被同一个 M 框住。）\n\n**定理.** 收敛数列必有界。\n\n**证明.** 设 xₙ → a。取 ε = 1:存在 N 使 n ≥ N 时 d(xₙ, a) < 1。于是对 m, n ≥ N,由三角不等式\n\nd(xₙ, xₘ) ≤ d(xₙ, a) + d(a, xₘ) < 1 + 1 = 2，\n\n即「尾部」的项两两距离 < 2。而开头的有限项 x₀, …, x_{N−1} 只有有限个,它们之间(以及与尾部)的距离有一个最大值 M₀。取 M := M₀ + 2,则全体项两两距离 ≤ M。故数列有界。∎\n\n直觉:收敛数列的尾巴挤在极限附近的一个小球里(自然有界),前面只有有限项（有限个点总是有界的）,两段合起来仍有界。**「有限 + 有界 = 有界」**,这个朴素的拼接以后会反复出现。\n\n注意这个蕴含**不可逆**:有界**不**保证收敛——((−1)ⁿ) 就有界(全在 [−1,1] 里)却发散。有界是收敛的必要条件,不是充分条件。「补上什么才够充分」是后面单调收敛、Cauchy 收敛要回答的问题。\n\n## 一道激活练习\n\n(a) 用 ε–N 定义证明 lim (n / (n+1)) = 1。（提示:算 |n/(n+1) − 1| = 1/(n+1)，再用阿基米德性质找 N。）\n\n(b) 用 ε–N 定义证明 lim ( (2n+1)/n ) = 2。\n\n(c) 证明:若 xₙ → a，则 |xₙ| → |a|（实数列;提示用<a class=\"wl\" data-id=\"an_valore_assoluto\">反向三角不等式<\/a>）。反过来对吗？即 |xₙ| → |a| 是否一定有 xₙ → a？举例说明。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 给定 ε > 0。计算距离:\n\n| n/(n+1) − 1 | = | (n − (n+1))/(n+1) | = 1/(n+1)。\n\n由<a class=\"wl\" data-id=\"num_archimede\">阿基米德性质<\/a>取 N 使 1/N < ε。则对一切 n ≥ N,1/(n+1) < 1/n ≤ 1/N < ε,即 |n/(n+1) − 1| < ε。故极限为 1。∎\n\n**(b)** 给定 ε > 0。距离:| (2n+1)/n − 2 | = | (2n+1 − 2n)/n | = 1/n。取 N 使 1/N < ε,则 n ≥ N 时 1/n ≤ 1/N < ε。故极限为 2。∎\n\n**(c)** 由<a class=\"wl\" data-id=\"an_valore_assoluto\">反向三角不等式<\/a>,| |xₙ| − |a| | ≤ |xₙ − a|。给定 ε > 0,因 xₙ → a,存在 N 使 n ≥ N 时 |xₙ − a| < ε;则同样 n ≥ N 时 | |xₙ| − |a| | ≤ |xₙ − a| < ε。故 |xₙ| → |a|。\n\n**反过来不对。** 取 xₙ = (−1)ⁿ:则 |xₙ| = 1 → 1,收敛;但 xₙ = (−1)ⁿ 本身发散(它在 ±1 间跳)。所以 |xₙ| 收敛不能推出 xₙ 收敛——绝对值抹掉了符号,把发散的振荡「拉平」成了收敛的常数。∎\n\n回顾:(a)(b) 的套路完全一样——**先把 |xₙ − 极限| 化简成一个明显趋于 0 的式子（通常是 c/n 形状）,再用阿基米德性质兑出 N**。这是从定义证收敛的标准三步:算距离、化简、找 N。几乎所有「直接按定义」的收敛证明都是这个模子。\n\n## 往前看一步\n\n三块基石就位:收敛有了精确定义(ε–N),极限唯一,收敛必有界。但目前我们只会**逐个**验证收敛——每次都要回到定义、手动找 N。这太笨重了。下一步要建**运算法则**:若 xₙ → a、yₙ → b,那么 xₙ + yₙ → a + b、xₙ·yₙ → a·b、xₙ/yₙ → a/b(b≠0)。有了这些,复杂数列的极限就能像搭积木一样,由简单数列的极限拼出来,不必每次回到 ε–N。而它们的证明,用的正是<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>那节练熟的「拆项 + 三角不等式」估计。这就是 <a class=\"wl\" data-id=\"an_algebra_limiti\">极限的运算法则<\/a> 的内容。","refs":"Amann–Escher, Analysis I §II.1"},{"id":"an_convergenza_assoluta","label":"绝对收敛与判别法","parent":"an_analisi","summary":"若 Σ|aₖ| 收敛则称 Σaₖ 绝对收敛,绝对收敛必收敛;由此得比较判别法、根值判别法（用 lim sup ⁿ√|aₖ|）、比值判别法。交错级数判别法处理条件收敛(如交错调和级数)。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#FE7A79","ring":9,"bearing":3,"popupLinks":[{"id":"an_serie","text":"级数"},{"id":"alg_complessi","text":"ℂ"},{"id":"an_cauchy","text":"Banach 空间"},{"id":"an_norma","text":"范数"},{"id":"an_monotone","text":"单调收敛"},{"id":"an_limsup","text":"上极限"},{"id":"an_confronto","text":"ⁿ√n → 1"},{"id":"an_numero_e","text":"e = Σ1/k!"}],"body":"\n## 一个更强、更好用的收敛概念\n\n<a class=\"wl\" data-id=\"an_serie\">级数<\/a>的框架立起来了,但判定敛散的工具还很少(项趋于 0、几何级数、伸缩)。这一节建立**系统的判别法**——不必求出级数的值,仅凭项的大小或比值就判断收不收敛。\n\n关键起点是一个比「收敛」更强的概念。回想<a class=\"wl\" data-id=\"an_serie\">级数<\/a>里令人头疼的现象:1 − 1 + 1 − 1 + ⋯ 这种级数,正负项的加法次序一变,「和」就变(甚至发散)——收敛很「脆弱」。如果**连每一项的绝对值加起来都收敛**,情况就稳健得多。\n\n**定义(绝对收敛).** 级数 Σaₖ 称**绝对收敛**(absolutely convergent)，若由各项绝对值构成的级数 Σ|aₖ| 收敛(即 Σ|aₖ| < ∞)。\n\n(本节 aₖ 可取在 ℝ、<a class=\"wl\" data-id=\"alg_complessi\">ℂ<\/a>,或更一般的<a class=\"wl\" data-id=\"an_cauchy\">Banach 空间<\/a>里;|·| 相应地是绝对值、模或<a class=\"wl\" data-id=\"an_norma\">范数<\/a>。)\n\n「绝对收敛」名副其实——它确实蕴含收敛:\n\n**命题.** 每个绝对收敛的级数都收敛。\n\n**证明.** 设 Σ|aₖ| 收敛。由<a class=\"wl\" data-id=\"an_serie\">级数的 Cauchy 判据<\/a>(部分和是 Cauchy 列),对每个 ε > 0 存在 N,使\n\nΣ_{k=n+1}^{m} |aₖ| < ε，  对一切 m > n ≥ N。\n\n而由三角不等式,Σaₖ 的部分和之差被它控制:\n\n|Σ_{k=n+1}^{m} aₖ| ≤ Σ_{k=n+1}^{m} |aₖ| < ε，  m > n ≥ N。\n\n所以 Σaₖ 的部分和也是 Cauchy 列;由 ℝ(或 ℂ、Banach 空间)的<a class=\"wl\" data-id=\"an_cauchy\">完备性<\/a>,Σaₖ 收敛。∎\n\n证明的核心:**三角不等式让「绝对值级数的 Cauchy 性」传递给原级数**。这里<a class=\"wl\" data-id=\"an_cauchy\">完备性<\/a>再次是关键——Cauchy 判据要靠它把「部分和收拢」兑现成「真的收敛」。\n\n> **逆命题不成立**:收敛**不**蕴含绝对收敛。下面的交错调和级数 Σ(−1)ᵏ⁺¹/k 收敛,但其绝对值级数是<a class=\"wl\" data-id=\"an_serie\">发散<\/a>的调和级数 Σ1/k。这种「收敛但不绝对收敛」的级数称**条件收敛**(conditionally convergent)——它的收敛依赖正负项的抵消,是「脆弱」的那一类。\n\n## 交错级数：条件收敛的典型\n\n先处理一类常见的、往往只条件收敛的级数——正负号交替出现的**交错级数**。\n\n**定理(Leibniz 判别法).** 设 (bₖ) 是**递减**的、趋于 0 的**非负**数列。则交错级数\n\nΣ_{k} (−1)ᵏ bₖ = b₀ − b₁ + b₂ − b₃ + ⋯\n\n收敛。\n\n**证明.** 看部分和 sₙ。偶数下标部分和递减:s_{2n+2} − s_{2n} = −b_{2n+1} + b_{2n+2} ≤ 0(因 bₖ 递减);奇数下标部分和递增:s_{2n+1} − s_{2n−1} = b_{2n} − b_{2n+1} ≥ 0。又 s_{2n+1} ≤ s_{2n}(差一个非负的 b_{2n+1})。于是 (s_{2n}) 递减有下界、(s_{2n+1}) 递增有上界,由<a class=\"wl\" data-id=\"an_monotone\">单调收敛<\/a>两者都收敛,设 s_{2n}→s、s_{2n+1}→t。而\n\nt − s = lim(s_{2n+1} − s_{2n}) = lim(−b_{2n+1}) = 0，\n\n故 s = t,奇偶部分和收敛到同一极限,从而 (sₙ) 整体收敛。∎\n\n<svg viewBox=\"0 0 440 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 极限线 -->\n  <line x1=\"55\" y1=\"126\" x2=\"395\" y2=\"126\" stroke=\"#E0612F\" stroke-width=\"1.3\" stroke-dasharray=\"7,3\"/>\n  <text x=\"398\" y=\"130\" font-size=\"11\" fill=\"#E0612F\">极限 (log 2)<\/text>\n  <line x1=\"55\" y1=\"180\" x2=\"420\" y2=\"180\" stroke=\"#bbb\" stroke-width=\"1\"/>\n  <text x=\"415\" y=\"196\" font-size=\"10\" fill=\"#888\">n<\/text>\n  <!-- 部分和点 -->\n  <polyline points=\"67,48 91,175 114,90 138,154 162,103 186,145 210,109 233,141 257,112 281,138 304,115 328,136\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n  <!-- 奇部分和(上, 降向极限) -->\n  <g fill=\"#00A070\">\n    <circle cx=\"67\" cy=\"48\" r=\"3\"/><circle cx=\"114\" cy=\"90\" r=\"3\"/><circle cx=\"162\" cy=\"103\" r=\"3\"/><circle cx=\"210\" cy=\"109\" r=\"3\"/><circle cx=\"257\" cy=\"112\" r=\"3\"/><circle cx=\"304\" cy=\"115\" r=\"3\"/>\n  <\/g>\n  <!-- 偶部分和(下, 升向极限) -->\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"91\" cy=\"175\" r=\"3\"/><circle cx=\"138\" cy=\"154\" r=\"3\"/><circle cx=\"186\" cy=\"145\" r=\"3\"/><circle cx=\"233\" cy=\"141\" r=\"3\"/><circle cx=\"281\" cy=\"138\" r=\"3\"/><circle cx=\"328\" cy=\"136\" r=\"3\"/>\n  <\/g>\n  <text x=\"78\" y=\"44\" font-size=\"9\" fill=\"#00A070\">s₁<\/text>\n  <text x=\"95\" y=\"186\" font-size=\"9\" fill=\"#5A5FE0\">s₂<\/text>\n  <text x=\"200\" y=\"172\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">奇部分和↓、偶部分和↑，从两侧夹住极限，间距→0<\/text>\n<\/svg>\n\n直观:部分和在极限两侧来回跳,跳幅 bₖ 越来越小,被夹向中间。**误差估计**也随之而来:用第 n 个部分和近似级数值,误差不超过「第一个被丢掉的项」|b_{n+1}|(因为极限被夹在相邻两个部分和之间)。\n\n**例(交错调和级数).** Σ_{k=1}^∞ (−1)^{k+1}/k = 1 − 1/2 + 1/3 − 1/4 + ⋯ 收敛(因 1/k 递减趋 0,Leibniz 适用)。它的值是 log 2(留待对数函数严格化后证)。但它**只条件收敛**:绝对值级数 Σ1/k 是发散的<a class=\"wl\" data-id=\"an_serie\">调和级数<\/a>。这是「收敛但不绝对收敛」最经典的例子。\n\n## 比较判别法（优级数判别法）\n\n回到绝对收敛。判定绝对收敛最灵活的工具,是和一个已知收敛的级数「比大小」。\n\n**定义.** 设 Σaₖ 是级数,Σcₖ 是**非负项**级数。若存在 K 使 |aₖ| ≤ cₖ 对一切 k ≥ K,则称 Σcₖ 是 Σaₖ 的一个**优级数**(majorant)。\n\n**定理(比较判别法).** 若级数有一个**收敛的优级数**,则它绝对收敛。\n\n**证明.** 设 |aₖ| ≤ cₖ（k ≥ K）,Σcₖ 收敛。由 Σcₖ 的 <a class=\"wl\" data-id=\"an_serie\">Cauchy 判据<\/a>,对 ε > 0 存在 N ≥ K 使 Σ_{k=n+1}^m cₖ < ε（m > n ≥ N）。则\n\nΣ_{k=n+1}^{m} |aₖ| ≤ Σ_{k=n+1}^{m} cₖ < ε，\n\n故 Σ|aₖ| 满足 Cauchy 判据,收敛,即 Σaₖ 绝对收敛。∎\n\n**例:** Σ 1/kᵐ 当 m ≥ 2 收敛——因 1/kᵐ ≤ 1/k²,而 <a class=\"wl\" data-id=\"an_serie\">Σ1/k² 收敛<\/a>,它是优级数。又如 |z| < 1 时 Σzᵏ 绝对收敛——|zᵏ| = |z|ᵏ,而几何级数 Σ|z|ᵏ 收敛,作优级数。比较判别法把「新级数的敛散」化归到「已知级数」,几何级数和 Σ1/kᵖ 是最常用的比较对象。\n\n## 根值判别法：lim sup 上场\n\n从比较判别法(以几何级数为优级数)能导出两个极其常用的判别法。第一个看「项的 k 次方根」——这里<a class=\"wl\" data-id=\"an_limsup\">上极限<\/a>正式派上用场。\n\n**定理(根值判别法 root test).** 设 Σaₖ 是级数,令\n\nα := lim sup_{k→∞} ᵏ√|aₖ|（即 <a class=\"wl\" data-id=\"an_limsup\">上极限<\/a>）。\n\n则:(i) α < 1 时 Σaₖ **绝对收敛**;(ii) α > 1 时 Σaₖ **发散**;(iii) α = 1 时**判别法失效**(可能收敛也可能发散)。\n\n**证明.** (i) 设 α < 1。取 q 满足 α < q < 1。因 α 是 ᵏ√|aₖ| 的<a class=\"wl\" data-id=\"an_limsup\">最大聚点<\/a>,只有有限多项能超过 q,故存在 K 使 ᵏ√|aₖ| < q 对一切 k ≥ K,即 **|aₖ| < qᵏ**。几何级数 Σqᵏ（q<1）收敛,作优级数,由比较判别法 Σaₖ 绝对收敛。\n\n(ii) 设 α > 1。因 α 是最大聚点,有**无穷多**个 k 使 ᵏ√|aₖ| ≥ 1,即 |aₖ| ≥ 1。这样项 aₖ 不趋于 0,由<a class=\"wl\" data-id=\"an_serie\">项趋于 0 必要条件<\/a>的反面,级数发散。\n\n(iii) α = 1 失效:交错调和级数 Σ(−1)ᵏ⁺¹/k 有 ᵏ√|aₖ| = ᵏ√(1/k) = 1/ᵏ√k → 1(因 <a class=\"wl\" data-id=\"an_confronto\">ⁿ√n → 1<\/a>),故 α = 1,而它收敛;调和级数 Σ1/k 同样 α = 1,却发散。同一个 α=1,两种结局,故失效。∎\n\n**为什么必须用 lim sup 而非 lim**:数列 ᵏ√|aₖ| 一般**不收敛**(没有普通极限),但它的 lim sup <a class=\"wl\" data-id=\"an_limsup\">总存在<\/a>。所以根值判别法的精确表述,绕不开上极限——这正是<a class=\"wl\" data-id=\"an_limsup\">当时补上极限<\/a>时说的「为幂级数和根值判别法预备」的兑现。\n\n根值判别法的精髓:**把任意级数的项,和一个几何级数比**——ᵏ√|aₖ| < q 等价于 |aₖ| < qᵏ,即项最终被一个公比 < 1 的几何级数压住,故收敛。\n\n## 比值判别法：看相邻项之比\n\n根值判别的思路(比几何级数)还导出一个更易计算的判别法——看相邻项的比值。\n\n**定理(比值判别法 ratio test).** 设 Σaₖ 的项最终非零。\n\n(i) 若存在 q ∈ (0,1) 和 K,使 |a_{k+1}|/|aₖ| ≤ q 对一切 k ≥ K,则 Σaₖ **绝对收敛**;\n\n(ii) 若 |a_{k+1}|/|aₖ| ≥ 1 对一切充分大的 k,则 Σaₖ **发散**。\n\n特别地,若极限 L := lim |a_{k+1}|/|aₖ| 存在,则 L < 1 时绝对收敛,L > 1 时发散,L = 1 时失效。\n\n**证明(i).** 设 |a_{k+1}|/|aₖ| ≤ q（k ≥ K）。则 |a_{K+1}| ≤ q|a_K|,|a_{K+2}| ≤ q|a_{K+1}| ≤ q²|a_K|,归纳得 |a_{K+j}| ≤ qʲ|a_K|。所以从第 K 项起,|aₖ| 被几何级数 |a_K|·Σqʲ（q<1，收敛）压住,作优级数,绝对收敛。(ii) 若比值 ≥ 1,则 |aₖ| 不减,不趋于 0,级数发散。∎\n\n比值判别法在实践中常比根值判别更好算(求比值比求方根容易),尤其当项含阶乘或幂时。\n\n**例(指数级数 Σ zᵏ/k! 绝对收敛).** 对任意 z ∈ ℂ,看比值:\n\n|a_{k+1}|/|aₖ| = (|z|^{k+1}/(k+1)!)/(|z|ᵏ/k!) = |z|/(k+1) → 0  （k → ∞）。\n\n极限 L = 0 < 1,由比值判别法,**Σ zᵏ/k! 对一切 z 绝对收敛**。这个级数极其重要——它的和定义了**指数函数** exp(z)，下一阶段(幂级数)会正式展开。注意 z = 1 时它就是 <a class=\"wl\" data-id=\"an_numero_e\">e = Σ1/k!<\/a>:e 是指数函数在 1 处的值。比值判别法在这里一举证明了「指数级数处处收敛」,为指数函数的定义扫清障碍。\n\n> **根值 vs 比值**:根值判别法更强(适用范围更广,凡比值判别能判的它都能判),但比值判别法通常更易算。两者 α=1 或 L=1 时都失效,此时要回到比较判别法或更精细的工具。\n\n## 一道激活练习\n\n用适当的判别法判定下列级数是否(绝对)收敛:\n\n(a) Σ_{k=1}^∞ k²/2ᵏ（提示:比值判别法,算 a_{k+1}/aₖ 的极限）;\n\n(b) Σ_{k=1}^∞ (−1)ᵏ/√k（提示:先看绝对值级数 Σ1/√k 是否收敛——和 Σ1/k 比;再用 Leibniz 判别法看原级数;结论是绝对还是条件收敛?）;\n\n(c) Σ_{k=1}^∞ (k/(k+1))^{k²}（提示:根值判别法,算 ᵏ√|aₖ| = (k/(k+1))ᵏ = 1/(1+1/k)ᵏ 的极限,回忆 <a class=\"wl\" data-id=\"an_numero_e\">(1+1/k)ᵏ → e<\/a>）。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 比值判别法:\n\na_{k+1}/aₖ = ((k+1)²/2^{k+1})/(k²/2ᵏ) = ((k+1)²/k²)·(2ᵏ/2^{k+1}) = (1+1/k)²·(1/2) → 1²·(1/2) = 1/2。\n\n极限 L = 1/2 < 1,故级数**绝对收敛**(项非负,即收敛)。∎（这也顺带说明 k²/2ᵏ → 0:收敛级数的项必趋于 0——指数 2ᵏ 压倒多项式 k²，正是审计里提到的「增长速度」结论的一个实例。）\n\n**(b)** 先看绝对值级数 Σ1/√k = Σk^{−1/2}。因 1/√k ≥ 1/k 对 k ≥ 1（√k ≤ k），而调和级数 Σ1/k 发散,由比较判别法(这次反向:更大的项发散则……更精确地,Σk^{−p} 当 p ≤ 1 发散,p=1/2 ≤ 1 故发散)Σ1/√k **发散**——所以原级数**不绝对收敛**。再用 Leibniz:1/√k 递减趋 0,故交错级数 Σ(−1)ᵏ/√k **收敛**。结论:**条件收敛**(收敛但不绝对收敛)。∎\n\n**(c)** 根值判别法:\n\nᵏ√|aₖ| = ᵏ√((k/(k+1))^{k²}) = (k/(k+1))ᵏ = 1/((k+1)/k)ᵏ = 1/(1 + 1/k)ᵏ → 1/e。\n\n(用了 <a class=\"wl\" data-id=\"an_numero_e\">(1+1/k)ᵏ → e<\/a>。)极限 α = 1/e ≈ 0.368 < 1,故级数**绝对收敛**。∎\n\n回顾:选判别法的经验——**项含阶乘或 k 次幂(如 2ᵏ、k!)用比值或根值;项形如 (⋯)^{k 的函数} 优先根值(方根能消掉外层幂);交错级数先查绝对收敛(绝对值级数),不绝对收敛再用 Leibniz 判条件收敛**。(b) 示范了完整的两步判定:先否掉绝对收敛、再用 Leibniz 确认条件收敛。(c) 则展示根值判别法与 e 的极限的漂亮配合。\n\n## 往前看一步\n\n收敛判别法成套就位:绝对收敛、比较、根值(用<a class=\"wl\" data-id=\"an_limsup\">lim sup<\/a>)、比值,加上交错级数的 Leibniz。我们现在能判定绝大多数级数的敛散——而且在 (b) 的指数级数 Σzᵏ/k! 那里,已经瞥见了下一站的主角。\n\n把级数的项换成**含一个变量 z 的幂** cₖzᵏ,得到的 Σcₖzᵏ 称**幂级数**(power series)。它对某些 z 收敛、对另一些 z 发散,而「收敛的 z 的范围」是一个以原点为心的圆盘,其半径(**收敛半径**)由根值判别法 + lim sup 给出——这就是 Cauchy–Hadamard 公式,<a class=\"wl\" data-id=\"an_limsup\">上极限<\/a>在此第二次大显身手。幂级数是把函数表示成「无穷次多项式」的工具,**指数函数、三角函数、对数**都将由幂级数严格定义。这就是 A–E 第二章的收官、也是通向初等函数严格化的门:幂级数与收敛半径。","refs":"Amann–Escher, Analysis I §II.8"},{"id":"an_limsup","label":"上极限与下极限","parent":"an_analisi","summary":"令 yₙ = sup_{k≥n} xₖ（递减）、zₙ = inf_{k≥n} xₖ（递增），它们在 ℝ̄ 中必收敛;lim sup = lim yₙ 是最大聚点，lim inf = lim zₙ 是最小聚点，二者总存在,且数列收敛 ⟺ lim inf = lim sup。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#FB7990","ring":6,"bearing":4,"popupLinks":[{"id":"an_sottosuccessioni","text":"聚点"},{"id":"an_monotone","text":"单调收敛定理"},{"id":"num_retta_estesa","text":"扩展数轴"},{"id":"num_estremo_superiore","text":"上确界刻画"},{"id":"an_convergenza","text":"收敛唯一"},{"id":"an_serie","text":"级数"},{"id":"an_convergenza_assoluta","text":"绝对收敛与判别法"}],"body":"\n## 给发散数列也配一个「极限」\n\n<a class=\"wl\" data-id=\"an_sottosuccessioni\">聚点<\/a>那节我们见过:发散数列可以有多个聚点,比如 ((−1)ⁿ) 有 +1 和 −1。普通极限对这种数列无能为力——它根本没有极限。但能不能退一步,给**任何**有界实数列都配上两个总是存在的「边界值」:它的项最终在哪个上限以下徘徊、哪个下限以上徘徊?\n\n这就是**上极限**(lim sup)与**下极限**(lim inf)。它们对发散数列也有定义,且**总是存在**(在扩展数轴 ℝ̄ 中)。它们不只是理论上的好奇——下面会看到,**根值判别法、幂级数的收敛半径**都要靠 lim sup 才能精确表述。而它们的存在性,直接来自<a class=\"wl\" data-id=\"an_monotone\">单调收敛定理<\/a>。\n\n## 定义：尾部的 sup 与 inf\n\n想法是:看数列「从第 n 项往后」的上确界和下确界,再让 n → ∞。\n\n**定义.** 设 (xₙ) 是实数列。对每个 n,定义\n\nyₙ := sup_{k≥n} xₖ = sup{ xₙ, xₙ₊₁, xₙ₊₂, … }，  zₙ := inf_{k≥n} xₖ = inf{ xₙ, xₙ₊₁, … }。\n\n（若数列无上界,某个 yₙ 可能是 +∞;这正是要在 ℝ̄ 中工作的原因——<a class=\"wl\" data-id=\"num_retta_estesa\">扩展数轴<\/a>让 sup/inf 对任何集合都有定义。）\n\n**关键观察:这两个新数列是单调的。** 当 n 增大,集合 {xₖ : k ≥ n} 变小(去掉了前面的项),所以它的 sup 只会变小或不变——**(yₙ) 递减**;同理它的 inf 只会变大或不变——**(zₙ) 递增**。\n\n于是由<a class=\"wl\" data-id=\"an_monotone\">单调收敛定理<\/a>(在 ℝ̄ 中,递减数列收敛到其下确界,递增收敛到其上确界——<a class=\"wl\" data-id=\"num_retta_estesa\">ℝ̄ 中 sup/inf 无条件存在<\/a>),这两个数列**必定收敛**(可能收敛到 ±∞)。它们的极限就是我们要的对象:\n\n**定义.** \n\nlim sup_{n→∞} xₙ := lim_{n→∞} yₙ = inf_{n} ( sup_{k≥n} xₖ )，   （上极限 limit superior）\n\nlim inf_{n→∞} xₙ := lim_{n→∞} zₙ = sup_{n} ( inf_{k≥n} xₖ )。   （下极限 limit inferior）\n\n（第二个等号:递减数列 (yₙ) 的极限 = 它的下确界,故 lim sup = inf yₙ;对偶地 lim inf = sup zₙ。）\n\n**核心优势:lim sup 与 lim inf 对任何实数列都存在**(在 ℝ̄ 中)——无论数列收不收敛。普通极限要求项「最终聚到一点」,可能不存在;lim sup/inf 只看尾部的 sup/inf 的走向,这个走向因单调性总有归宿。\n\n## 它们是最大、最小的聚点\n\nlim sup/inf 不是凭空的构造,它们有清晰的意义——正是数列的**极端聚点**。\n\n**定理.** 任何实数列 (xₙ) 在 ℝ̄ 中都有**最大聚点** x* 和**最小聚点** x⁎,且\n\nlim sup xₙ = x*（最大聚点）,   lim inf xₙ = x⁎（最小聚点）。\n\n<svg viewBox=\"0 0 440 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- +1 与 -1 两条聚点线 -->\n  <line x1=\"55\" y1=\"82\" x2=\"360\" y2=\"82\" stroke=\"#E0612F\" stroke-width=\"1.2\" stroke-dasharray=\"6,3\"/>\n  <line x1=\"55\" y1=\"158\" x2=\"360\" y2=\"158\" stroke=\"#00A070\" stroke-width=\"1.2\" stroke-dasharray=\"6,3\"/>\n  <text x=\"364\" y=\"86\" font-size=\"11\" fill=\"#E0612F\">limsup = +1<\/text>\n  <text x=\"364\" y=\"162\" font-size=\"11\" fill=\"#00A070\">liminf = −1<\/text>\n  <line x1=\"55\" y1=\"120\" x2=\"345\" y2=\"120\" stroke=\"#ddd\" stroke-width=\"0.8\"/>\n  <!-- 数列点 -->\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"67\" cy=\"202\" r=\"3\"/><circle cx=\"93\" cy=\"60\" r=\"3\"/><circle cx=\"119\" cy=\"172\" r=\"3\"/><circle cx=\"145\" cy=\"71\" r=\"3\"/><circle cx=\"171\" cy=\"166\" r=\"3\"/><circle cx=\"197\" cy=\"75\" r=\"3\"/><circle cx=\"222\" cy=\"164\" r=\"3\"/><circle cx=\"248\" cy=\"77\" r=\"3\"/><circle cx=\"274\" cy=\"162\" r=\"3\"/><circle cx=\"300\" cy=\"78\" r=\"3\"/><circle cx=\"326\" cy=\"162\" r=\"3\"/>\n  <\/g>\n  <!-- yₙ 包络(峰, 降向+1) -->\n  <polyline points=\"93,60 119,71 171,75 222,77 274,78\" fill=\"none\" stroke=\"#E0612F\" stroke-width=\"1\" opacity=\"0.55\" stroke-dasharray=\"2,2\"/>\n  <text x=\"120\" y=\"52\" font-size=\"9\" fill=\"#E0612F\">yₙ=sup tail ↓<\/text>\n  <!-- zₙ 包络(谷, 升向-1) -->\n  <polyline points=\"93,172 145,166 197,164 248,162\" fill=\"none\" stroke=\"#00A070\" stroke-width=\"1\" opacity=\"0.55\" stroke-dasharray=\"2,2\"/>\n  <text x=\"130\" y=\"192\" font-size=\"9\" fill=\"#00A070\">zₙ=inf tail ↑<\/text>\n  <text x=\"395\" y=\"120\" font-size=\"10\" fill=\"#888\">n →<\/text>\n<\/svg>\n\n**证明思路（以 lim sup 为例）.** 记 x* := lim sup xₙ = inf yₙ。要证两件事:**(A) x* 是聚点;(B) 没有比 x* 更大的聚点。**\n\n**(B) 上方无更大聚点:** 取任意 ξ > x*。因 x* = inf yₙ,存在某个 n 使 yₙ < ξ,即 sup_{k≥n} xₖ < ξ,于是 xₖ < ξ 对一切 k ≥ n——ξ 上方(及 ξ 处)只有有限项,故 ξ 不可能是聚点,任何 > x* 的点都不是。\n\n**(A) x* 自己是聚点:** 任取 ε > 0。一方面,刚证 x* + ε 上方只有有限项;另一方面,对每个 n,yₙ = sup_{k≥n} xₖ ≥ x*(因 x* 是这些 yₙ 的下确界),故由<a class=\"wl\" data-id=\"num_estremo_superiore\">上确界刻画<\/a>,存在 k ≥ n 使 xₖ > x* − ε。这说明「> x* − ε」的项有无穷多个(每个 n 之后都还有);配上「> x* + ε 的只有限个」,落在 (x* − ε, x* + ε) 里的必有无穷多——x* 是聚点。\n\n两条合起来,x* 是最大的聚点。lim inf 对偶可证。∎\n\n这个定理给了 lim sup/inf 一个一句话的记忆:**lim sup 是数列「最高的聚集高度」,lim inf 是「最低的聚集高度」**。对 ((−1)ⁿ),聚点是 ±1,故 lim sup = 1、lim inf = −1。\n\n## 收敛的判据：lim sup = lim inf\n\nlim sup 与 lim inf 把「收敛」刻画成一个等式——这是它们最重要的用途之一。\n\n**定理.** 实数列 (xₙ) 在 ℝ̄ 中收敛 **当且仅当** lim inf xₙ = lim sup xₙ。此时三者相等,公共值就是极限:\n\nlim xₙ = lim inf xₙ = lim sup xₙ。\n\n**证明.** （⟹）若 xₙ → x,则 x 是**唯一**的聚点(<a class=\"wl\" data-id=\"an_convergenza\">收敛唯一<\/a>+<a class=\"wl\" data-id=\"an_sottosuccessioni\">极限是唯一聚点<\/a>)。而 lim sup、lim inf 都是聚点,夹在最大与最小之间又只有这一个,故 lim inf = lim sup = x。\n\n（⟸）若 lim inf = lim sup = x,则最大聚点与最小聚点重合,数列只有 x 一个聚点。再由「x* + ε 上方有限项、x⁎ − ε 下方有限项」(两个极端聚点给出的双向控制),每个 x 的邻域 (x − ε, x + ε) 都含几乎所有项——这正是 xₙ → x。∎\n\n直觉:**lim sup 与 lim inf 是数列尾部上下振荡的「上下包络线」**;它们重合,意味着上下包络挤成一条线,数列被夹着收敛;它们分开(如 ±1),意味着尾部在两个高度间持续振荡,数列发散。「收敛 ⟺ 上下极限相等」把收敛性变成了一个**可计算的等式判据**,无需事先猜测极限。\n\n## 为什么要费这个劲\n\nlim sup/inf 看着比普通极限繁琐,但它有两个不可替代的价值:\n\n其一,**它对任何数列都存在**,所以可以无条件地谈论、放进不等式、用于估计——哪怕数列发散。许多定理的最干净表述用的是 lim sup 而非 lim。\n\n其二,**它是根值判别法与幂级数收敛半径的精确语言**。后面会看到,级数 Σaₖ 的「根值判别」要算 lim sup ⁿ√|aₖ|;幂级数 Σcₖxᵏ 的收敛半径由 Cauchy–Hadamard 公式 1/R = lim sup ⁿ√|cₖ| 给出。这里的 lim sup **不能换成 lim**——因为 ⁿ√|cₖ| 这个数列一般不收敛,只有 lim sup 总存在。这是我们现在补上 lim sup 的直接原因:它是通往幂级数的必经一站。\n\n## 一道激活练习\n\n求下列数列的 lim sup 与 lim inf（在 ℝ̄ 中）:\n\n(a) xₙ = (−1)ⁿ · n/(n+1)；\n(b) xₙ = n^{(−1)ⁿ}（即 n 的 (−1)ⁿ 次方:n 为奇数时是 1/n,偶数时是 n）；\n(c) xₙ = (−1)ⁿ + (−1)^{⌊n/2⌋}（提示:算出前 8 项,找出它在哪几个值间循环,最大最小者即 lim sup/inf）。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** xₙ = (−1)ⁿ·n/(n+1)。偶子列 x_{2k} = 2k/(2k+1) → 1;奇子列 x_{2k+1} = −(2k+1)/(2k+2) → −1。这两个是仅有的聚点,故 **lim sup = 1,lim inf = −1**。（注意每个 |xₙ| < 1,数列从未达到 ±1,但聚点不要求达到,只要无穷逼近。）\n\n**(b)** xₙ = n^{(−1)ⁿ}。奇数项 x_{2k+1} = 1/(2k+1) → 0;偶数项 x_{2k} = 2k → ∞。偶数项无界,故尾部 sup 恒为 ∞:**lim sup = +∞**。最小聚点:奇数项 → 0,而偶数项跑向 +∞ 不贡献小聚点,故 **lim inf = 0**。\n\n**(c)** 算前 8 项(⌊n/2⌋ 是下取整):\nn=1: (−1)+(−1)⁰=−1+1=0;n=2: 1+(−1)¹=1−1=0;n=3: −1+(−1)¹=−1−1=−2;n=4: 1+(−1)²=1+1=2;n=5: −1+(−1)²=−1+1=0;n=6: 1+(−1)³=1−1=0;n=7: −1+(−1)³=−2;n=8: 1+(−1)⁴=2。\n循环值为 0, 0, −2, 2, 0, 0, −2, 2, …——取值集合 {−2, 0, 2},每个出现无穷多次,都是聚点。故 **lim sup = 2,lim inf = −2**。\n\n回顾:求 lim sup/inf 的通用办法,正是<a class=\"wl\" data-id=\"an_sottosuccessioni\">求聚点<\/a>那套——**按奇偶或周期拆子列,各看趋向**,然后 lim sup = 最大聚点、lim inf = 最小聚点。无界要用 ℝ̄:某方向无界则该方向的极限是 ±∞。本质上,lim sup/inf 把「找出所有聚点、取最大/最小」这件事,变成了一个有定义、可计算的标准量。\n\n## 往前看一步\n\n上下极限补齐了实数列收敛理论里最后一块结构性工具:现在每个数列都有一对总是存在的极端聚点,收敛被刻画成「上下极限相等」,而 lim sup 还将成为根值判别法的语言。\n\n下一步回到<a class=\"wl\" data-id=\"an_serie\">级数<\/a>,建立一批**收敛判别法**——不求值、只判敛散。核心概念是**绝对收敛**:若 Σ|aₖ| 收敛,则 Σaₖ 收敛(且性质更好)。由它派生出**比较判别法**(和已知级数比大小)、**根值判别法**(算 lim sup ⁿ√|aₖ|,这里 lim sup 正式上岗)与**比值判别法**(看 |aₖ₊₁/aₖ|)。这些判别法将让我们判定绝大多数级数的敛散,并最终引向**指数函数**的级数定义。这就是 <a class=\"wl\" data-id=\"an_convergenza_assoluta\">绝对收敛与判别法<\/a> 的内容。","refs":"Amann–Escher, Analysis I §II.5"},{"id":"an_monotone","label":"单调收敛定理","parent":"an_analisi","summary":"单调递增且有上界的实数列必收敛,极限是它的上确界(递减有下界则收敛到下确界)。这是 ℝ 的完备性在极限理论里的第一次正面登场——判定收敛而无需事先知道极限。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#FA7993","ring":5,"bearing":10,"popupLinks":[{"id":"an_algebra_limiti","text":"运算法则"},{"id":"an_confronto","text":"夹逼"},{"id":"an_convergenza","text":"收敛蕴含有界"},{"id":"num_dedekind","text":"完备性公理"},{"id":"num_estremo_superiore","text":"上确界的 ε-刻画"},{"id":"an_sottosuccessioni","text":"子列"},{"id":"num_radici_n","text":"保序"},{"id":"an_numero_e","text":"欧拉数 e"}],"body":"\n## 一类拆不开也夹不住的数列\n\n到现在,判断收敛的工具有两套:<a class=\"wl\" data-id=\"an_algebra_limiti\">运算法则<\/a>(把数列拆成会算的零件)和<a class=\"wl\" data-id=\"an_confronto\">夹逼<\/a>(用两个夹板围堵)。但有一类数列,两套都使不上——我们**看得出它在往一个方向走,却既拆不开、也找不到夹板**。\n\n最有名的例子是 (1 + 1/n)ⁿ。展开它,项数随 n 变化,运算法则无从下手;它在缓慢上升,可上升到哪里没有现成的数能当夹板。直觉告诉我们它该收敛(它一直涨、又涨不快),但前面的工具都给不出判断。\n\n这一节的定理填上这个缺口,而填补它的,正是我们费尽周折造 ℝ 时得到的那个性质——**完备性**。这是完备性第一次在极限理论里正面出场:它让我们能断定一个数列收敛,**而无需事先知道极限是多少**。\n\n## 单调数列\n\n**定义.** 实数列 (xₙ) 称**递增**(increasing)，若 xₙ ≤ xₙ₊₁ 对一切 n;称**递减**(decreasing)，若 xₙ ≥ xₙ₊₁ 对一切 n。两者统称**单调**(monotone)。\n\n（\"递增\"这里指\"不减\",允许相等;严格不等的情形称\"严格递增\"。）单调是个很强的约束:数列只能一直往一个方向走,不能回头。正是这个约束,让\"有界\"这个原本不充分的条件变得充分。\n\n## 主定理\n\n回忆<a class=\"wl\" data-id=\"an_convergenza\">收敛蕴含有界<\/a>:有界是收敛的**必要**条件,但不充分——((−1)ⁿ) 有界却发散。问题出在它来回振荡。如果禁止振荡(即要求单调),有界就**变充分**了。\n\n**定理(单调收敛).** ℝ 中递增且有上界的数列 (xₙ) 必收敛,且\n\nlim xₙ = sup{ xₙ : n ∈ ℕ }。\n\n(对称地,递减且有下界的数列收敛到它的下确界。)\n\n<svg viewBox=\"0 0 440 215\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- sup 天花板 -->\n  <line x1=\"55\" y1=\"55\" x2=\"410\" y2=\"55\" stroke=\"#E0612F\" stroke-width=\"1.4\" stroke-dasharray=\"7,3\"/>\n  <text x=\"414\" y=\"59\" font-size=\"12\" fill=\"#E0612F\">sup<\/text>\n  <!-- sup-ε 线 -->\n  <line x1=\"55\" y1=\"83\" x2=\"395\" y2=\"83\" stroke=\"#E0612F\" stroke-width=\"0.7\" stroke-dasharray=\"3,3\" opacity=\"0.7\"/>\n  <text x=\"398\" y=\"87\" font-size=\"10\" fill=\"#E0612F\" opacity=\"0.8\">sup−ε<\/text>\n  <!-- ε 带高亮 -->\n  <rect x=\"55\" y=\"55\" width=\"340\" height=\"28\" fill=\"#E0612F\" opacity=\"0.08\"/>\n  <!-- 坐标轴 -->\n  <line x1=\"55\" y1=\"195\" x2=\"425\" y2=\"195\" stroke=\"#888\" stroke-width=\"1.1\"/>\n  <path d=\"M 425 195 L 417 191 L 417 199 z\" fill=\"#888\"/>\n  <text x=\"420\" y=\"212\" font-size=\"11\" fill=\"#888\">n<\/text>\n  <!-- N 标线 -->\n  <line x1=\"155\" y1=\"50\" x2=\"155\" y2=\"199\" stroke=\"#777\" stroke-width=\"0.9\" stroke-dasharray=\"3,3\"/>\n  <text x=\"155\" y=\"212\" font-size=\"11\" text-anchor=\"middle\" fill=\"#555\">N<\/text>\n  <!-- 单调升数列 -->\n  <polyline points=\"67,190 89,130 111,108 133,97 155,89 177,84 199,81 220,78 242,76 264,74 286,73 308,71 330,70\" fill=\"none\" stroke=\"#5A5FE0\" stroke-width=\"1\" opacity=\"0.5\"/>\n  <g fill=\"#5A5FE0\">\n    <circle cx=\"67\" cy=\"190\" r=\"3.2\"/><circle cx=\"89\" cy=\"130\" r=\"3.2\"/><circle cx=\"111\" cy=\"108\" r=\"3.2\"/><circle cx=\"133\" cy=\"97\" r=\"3.2\"/><circle cx=\"155\" cy=\"89\" r=\"3.2\"/><circle cx=\"177\" cy=\"84\" r=\"3.2\"/><circle cx=\"199\" cy=\"81\" r=\"3.2\"/><circle cx=\"220\" cy=\"78\" r=\"3.2\"/><circle cx=\"242\" cy=\"76\" r=\"3.2\"/><circle cx=\"264\" cy=\"74\" r=\"3.2\"/><circle cx=\"286\" cy=\"73\" r=\"3.2\"/><circle cx=\"308\" cy=\"71\" r=\"3.2\"/><circle cx=\"330\" cy=\"70\" r=\"3.2\"/>\n  <\/g>\n  <text x=\"210\" y=\"160\" font-size=\"10\" text-anchor=\"middle\" fill=\"#777\">数列单调上升、被 sup 封顶，越爬越贴近 sup，n≥N 后进入 ε 带<\/text>\n<\/svg>\n\n**证明.** 设 (xₙ) 递增有上界。其值域 X := { xₙ : n ∈ ℕ } 非空且有上界,由 ℝ 的<a class=\"wl\" data-id=\"num_dedekind\">完备性公理<\/a>,上确界\n\nx := sup X\n\n存在。往证 xₙ → x。\n\n给定 ε > 0。由<a class=\"wl\" data-id=\"num_estremo_superiore\">上确界的 ε-刻画<\/a>,x − ε 不是 X 的上界,故存在某项 x_N 满足 x_N > x − ε。而 (xₙ) 递增,所以对一切 n ≥ N,\n\nxₙ ≥ x_N > x − ε。\n\n另一方面,x 是上界,故 xₙ ≤ x < x + ε 对一切 n。两边合起来:\n\nx − ε < xₙ ≤ x < x + ε，  n ≥ N，\n\n即 xₙ ∈ B(x, ε)。故 xₙ → x = sup X。∎\n\n**递减情形**由「翻号」化归:若 (xₙ) 递减有下界,则 (−xₙ) 递增有上界,由已证部分 −xₙ → sup{−xₙ} = −inf{xₙ},再由<a class=\"wl\" data-id=\"an_algebra_limiti\">数乘法则<\/a>(乘 −1)得 xₙ → inf{xₙ}。∎\n\n## 这个定理为什么重要\n\n它的分量在证明的**第一步**:`x := sup X` 凭完备性**直接存在**,我们还没算出它是多少,就已经拿它当极限的候选。这是单调收敛定理独一无二的能力——\n\n**它判定收敛,而不要求你先知道极限。** 运算法则要你把极限拼出来,夹逼要你找到收敛到已知值的夹板,两者都得对\"极限是什么\"有所掌握。单调收敛不需要:只要确认\"一直涨\"和\"有顶\",收敛就成立,极限自动是那个上确界(哪怕你暂时算不出它)。\n\n把它和<a class=\"wl\" data-id=\"an_convergenza\">收敛⟹有界<\/a>并排,正好补成一对:那条说\"收敛必有界\"(有界是必要的),这条说\"单调时有界就够\"(对单调数列,有界是充分的)。中间隔着的\"振荡\"被单调性禁掉了,必要条件就升格成了充分条件。而支撑这次升格的,是完备性——在有理数 ℚ 里,单调有界数列**可能不收敛**(比如逼近 √2 的那串递增有理数,在 ℚ 里没有极限),正是 ℝ 补上的洞,才让这条定理成立。**单调收敛定理,本质上是完备性穿上极限外衣的样子。**\n\n## 第一个收获：几何数列\n\n用它立刻拿下一个基本极限。\n\n**命题.** 设 a ∈ ℝ,|a| < 1。则 aⁿ → 0。\n\n**证明.** 先设 0 ≤ a < 1。数列 (aⁿ) 递减(因 0 ≤ a < 1,每乘一次 a 变小:aⁿ⁺¹ = a·aⁿ ≤ aⁿ）且有下界 0(aⁿ ≥ 0)。由单调收敛定理,它收敛,设 aⁿ → L,且 L = inf{aⁿ} ≥ 0。\n\n求 L 用一个漂亮的技巧:子列 (aⁿ⁺¹) 是 (aⁿ) 的<a class=\"wl\" data-id=\"an_sottosuccessioni\">子列<\/a>,也收敛到同一极限 L。但 aⁿ⁺¹ = a·aⁿ,由<a class=\"wl\" data-id=\"an_algebra_limiti\">积法则<\/a>它收敛到 a·L。极限唯一,故\n\nL = a·L，  即 (1 − a)·L = 0。\n\n因 a < 1,1 − a ≠ 0,所以 L = 0。\n\n一般的 |a| < 1:由 |aⁿ| = |a|ⁿ → 0(刚证,用在 |a| ∈ [0,1) 上),再由「<a class=\"wl\" data-id=\"an_convergenza\">绝对值趋零则本身趋零<\/a>」得 aⁿ → 0。∎\n\n这个\"极限满足 L = aL、故 L = 0\"的手法值得记住:**对递推关系两边取极限,得到一个关于极限本身的方程,解出极限**。它在处理递归定义的数列时是标准动作——下面的练习就用它。\n\n## 一道激活练习\n\n设数列 (xₙ) 由递归定义:x₁ := 1,x_{n+1} := √(2 + xₙ)（每一项是\"2 加上一项\"再开方）。\n\n(a) 证明 (xₙ) 递增且以 2 为上界(提示:对\"xₙ < 2\"和\"xₙ < x_{n+1}\"分别用归纳;开方<a class=\"wl\" data-id=\"num_radici_n\">保序<\/a>)。\n(b) 由单调收敛定理,(xₙ) 收敛。设极限为 L,对递推式两边取极限,求出 L。\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a) 有上界(xₙ < 2,归纳).** 奠基 x₁ = 1 < 2。归纳步:设 xₙ < 2,则 x_{n+1} = √(2 + xₙ) < √(2 + 2) = √4 = 2(开方保序)。故对一切 n,xₙ < 2。\n\n**递增(xₙ < x_{n+1},归纳).** 即证 xₙ < √(2 + xₙ),两边平方(都正)等价于 xₙ² < 2 + xₙ,即 xₙ² − xₙ − 2 < 0,即 (xₙ − 2)(xₙ + 1) < 0。因 0 < xₙ < 2(由上一段),xₙ − 2 < 0 而 xₙ + 1 > 0,乘积为负,成立。故 xₙ < x_{n+1} 对一切 n,数列递增。\n\n（递增 + 有上界,由单调收敛定理,(xₙ) 收敛。）\n\n**(b) 求极限.** 设 xₙ → L。则子列 x_{n+1} 也 → L。对递推式 x_{n+1} = √(2 + xₙ) 两边取极限:左边 → L;右边,2 + xₙ → 2 + L(和法则),开方 → √(2 + L)（根号连续,直观接受,以后严格化）。故\n\nL = √(2 + L)。\n\n两边平方:L² = 2 + L,即 L² − L − 2 = 0,(L − 2)(L + 1) = 0,得 L = 2 或 L = −1。因所有 xₙ > 0,极限 L ≥ 0,排除 −1。故 **L = 2**。∎\n\n回顾:这道题是单调收敛定理的标准用法,分两步。**第一步用定理保证极限存在**(单调 + 有界)——这一步至关重要,因为第二步\"对递推式取极限求 L\"只有在**已知极限存在**时才合法(否则 L = √(2+L) 这个方程是对一个不存在的对象列的,可能解出假答案)。先证存在、再求值,顺序不能颠倒——这正是单调收敛定理不可替代的地方:它提供了\"存在性\"这块别的工具给不了的基石。\n\n## 往前看一步\n\n单调收敛定理给了我们一把判定收敛的新钥匙,而它最著名的用武之地,是定义一个数学中无处不在的常数。数列 (1 + 1/n)ⁿ ——本节开头那个拆不开也夹不住的例子——可以证明它**递增且有上界**(上界是 3),于是由单调收敛定理它收敛。它的极限就是**欧拉数 e**,自然对数的底,满足 2 < e ≤ 3。e 不是某个简单运算的结果,它**本质上是一个极限**——没有完备性、没有单调收敛定理,就无法保证这个极限存在,也就无法定义 e。这就是 <a class=\"wl\" data-id=\"an_numero_e\">欧拉数 e<\/a> 的内容:用本节的定理,给这个基本常数一个严格的出生证明。","refs":"Amann–Escher, Analysis I §II.4"},{"id":"an_norma","label":"赋范向量空间","parent":"an_analisi","summary":"范数 ‖·‖ 给向量空间的每个向量赋一个「长度」，满足非负、正齐次、三角不等式三条;它诱导出度量 d(x,y)=‖x−y‖，于是每个赋范空间自动是度量空间——极限、收敛的全套理论随之适用。","depth":1,"isContainer":false,"isTop":false,"role":null,"color":"#CC87E8","ring":2,"bearing":2,"popupLinks":[{"id":"alg_base_dimensione","text":"向量空间"},{"id":"an_valore_assoluto","text":"绝对值"},{"id":"alg_spazio_vettoriale","text":"向量空间"},{"id":"an_spazio_metrico","text":"度量"},{"id":"an_convergenza","text":"收敛"},{"id":"an_cauchy","text":"Cauchy 列"},{"id":"an_algebra_limiti","text":"运算法则"},{"id":"alg_complessi","text":"模"},{"id":"an_prodotto_interno","text":"内积与欧氏空间"}],"body":"\n## 把「长度」装回向量空间\n\n<a class=\"wl\" data-id=\"alg_base_dimensione\">向量空间<\/a>的内在结构(子空间、基、维数)已经理清,但它仍然很「素」:只有加法和数乘,**没有「长度」**。我们能说「两个向量相加」,却还不能说「这个向量有多长」——而长度,是把分析(极限、距离、收敛)接到向量空间上的桥。这一节补上它。\n\n动机来自最熟悉的 ℝ²。平面上一个向量 x,有一个**长度** ‖x‖(从原点到 x 的距离);两点 x, y 之间的距离就是 ‖x − y‖。这个「长度」函数有三条朴素性质:\n\n- **非负,且只有零向量长度为零**;\n- **伸缩 α 倍,长度变 |α| 倍**:‖αx‖ = |α|·‖x‖(α 可正可负,负的话方向反转但长度只看绝对值);\n- **三角不等式**:‖x + y‖ ≤ ‖x‖ + ‖y‖(两边之和不短于第三边)。\n\n把这三条抽出来当公理,就得到一般向量空间上的「长度」——**范数**。注意这三条**全都见过**:它们正是<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a> |·| 在 ℝ 上满足的性质!范数就是把绝对值「能度量长度」这件事,从数推广到了向量。\n\n## 定义\n\n设 E 是 𝕂 上的<a class=\"wl\" data-id=\"alg_spazio_vettoriale\">向量空间<\/a>。函数 ‖·‖ : E → ℝ₊（取非负实数值）称 E 上的一个**范数**(norm)，若满足:\n\n- **(N1)** ‖x‖ = 0 ⟺ x = 0（正定性）;\n- **(N2)** ‖λx‖ = |λ|·‖x‖,对一切 x ∈ E, λ ∈ 𝕂（正齐次性 positive homogeneity）;\n- **(N3)** ‖x + y‖ ≤ ‖x‖ + ‖y‖,对一切 x, y ∈ E（三角不等式）。\n\n配了范数的向量空间 (E, ‖·‖) 称**赋范向量空间**(normed vector space)。‖x‖ 读作 x 的**范数**或**长度**。\n\n<svg viewBox=\"0 0 440 190\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 左: 三角不等式 -->\n  <text x=\"120\" y=\"24\" font-size=\"11\" text-anchor=\"middle\" fill=\"#555\">(N3) ‖x+y‖ ≤ ‖x‖+‖y‖<\/text>\n  <line x1=\"60\" y1=\"150\" x2=\"145\" y2=\"120\" stroke=\"#5A5FE0\" stroke-width=\"2\" marker-end=\"url(#an)\"/>\n  <line x1=\"145\" y1=\"120\" x2=\"180\" y2=\"45\" stroke=\"#00A070\" stroke-width=\"2\" marker-end=\"url(#an)\"/>\n  <line x1=\"60\" y1=\"150\" x2=\"180\" y2=\"45\" stroke=\"#E0612F\" stroke-width=\"2\" marker-end=\"url(#an)\"/>\n  <text x=\"98\" y=\"143\" font-size=\"11\" fill=\"#5A5FE0\">x<\/text>\n  <text x=\"170\" y=\"88\" font-size=\"11\" fill=\"#00A070\">y<\/text>\n  <text x=\"105\" y=\"92\" font-size=\"11\" fill=\"#E0612F\">x+y<\/text>\n  <circle cx=\"60\" cy=\"150\" r=\"2.5\" fill=\"#333\"/>\n  <text x=\"115\" y=\"178\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">直达不长于绕道<\/text>\n  <!-- 右: 单位球 + 齐次 -->\n  <text x=\"320\" y=\"24\" font-size=\"11\" text-anchor=\"middle\" fill=\"#555\">(N2) ‖λx‖ = |λ|·‖x‖<\/text>\n  <circle cx=\"320\" cy=\"105\" r=\"45\" fill=\"#E0612F\" opacity=\"0.07\" stroke=\"#E0612F\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n  <text x=\"320\" y=\"58\" font-size=\"9\" text-anchor=\"middle\" fill=\"#E0612F\">单位球 ‖x‖=1<\/text>\n  <!-- x 到单位球, 2x 到外 -->\n  <line x1=\"320\" y1=\"105\" x2=\"352\" y2=\"73\" stroke=\"#5A5FE0\" stroke-width=\"2.5\" marker-end=\"url(#an)\"/>\n  <line x1=\"320\" y1=\"105\" x2=\"384\" y2=\"41\" stroke=\"#5A5FE0\" stroke-width=\"1.3\" opacity=\"0.6\" marker-end=\"url(#an)\"/>\n  <line x1=\"320\" y1=\"105\" x2=\"288\" y2=\"137\" stroke=\"#999\" stroke-width=\"1.3\" marker-end=\"url(#an)\"/>\n  <text x=\"352\" y=\"72\" font-size=\"10\" fill=\"#5A5FE0\">x<\/text>\n  <text x=\"386\" y=\"40\" font-size=\"10\" fill=\"#5A5FE0\">2x<\/text>\n  <text x=\"270\" y=\"142\" font-size=\"10\" fill=\"#999\">−x<\/text>\n  <circle cx=\"320\" cy=\"105\" r=\"2.5\" fill=\"#333\"/>\n  <defs>\n    <marker id=\"an\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"context-stroke\"/><\/marker>\n  <\/defs>\n<\/svg>\n\n(N2) 取 λ = −1 给 ‖−x‖ = ‖x‖（反向不改长度）;取 λ = 0 配 (N1) 给 ‖0‖ = 0。这些都符合「长度」的直觉。\n\n## 核心：范数诱导一个度量\n\n范数最重要的性质,是它**自动给出一个<a class=\"wl\" data-id=\"an_spazio_metrico\">度量<\/a>**——把「长度」变成「距离」,从而让整个极限理论在向量空间上生效。\n\n**定理.** 设 (E, ‖·‖) 是赋范向量空间。则\n\nd(x, y) := ‖x − y‖\n\n是 E 上的一个<a class=\"wl\" data-id=\"an_spazio_metrico\">度量<\/a>。于是**每个赋范向量空间自动是度量空间**。\n\n**证明.** 逐条验度量公理 (M1)–(M3):\n- **(M1)** d(x,y) = 0 ⟺ ‖x−y‖ = 0 ⟺ x−y = 0（由 (N1)）⟺ x = y。✓\n- **(M2)** d(x,y) = ‖x−y‖ = ‖(−1)(y−x)‖ = |−1|·‖y−x‖（由 (N2)）= ‖y−x‖ = d(y,x)。✓ 对称性来自正齐次。\n- **(M3)** 把范数的三角不等式 (N3) 用在 (x−z) + (z−y) = x−y 上:\n\n  d(x,y) = ‖x−y‖ = ‖(x−z)+(z−y)‖ ≤ ‖x−z‖ + ‖z−y‖ = d(x,z) + d(z,y)。✓\n\n三条齐备,d 是度量。∎\n\n这条定理是这一节的枢纽:**它把代数(向量空间 + 范数)和分析(度量空间)接通了**。一旦有了范数,<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>那节建立的一切——开球、邻域、<a class=\"wl\" data-id=\"an_convergenza\">收敛<\/a>、<a class=\"wl\" data-id=\"an_cauchy\">Cauchy 列<\/a>——立刻在 E 上有定义。特别地,向量序列的收敛就是\n\nxₙ → x 在 E 中 ⟺ ‖xₙ − x‖ → 0，\n\n即「向量与极限的距离(范数)趋于 0」。而<a class=\"wl\" data-id=\"an_algebra_limiti\">运算法则<\/a>中**凡不依赖 𝕂 的乘法或序的部分**(如和、数乘的极限)也自动成立——因为它们的证明只用到三角不等式。\n\n> 这正是<a class=\"wl\" data-id=\"an_spazio_metrico\">度量空间<\/a>那节预告而当时无法严格给出的方向:把「距离」装到向量空间上。绝对值给了 ℝ 一个度量(那是一维的范数);现在范数给了任意向量空间一个度量。ℝⁿ 的欧氏距离是其中最重要的一例——但它的范数从哪来、为什么满足三角不等式,要靠下一节的「内积」回答。\n\n**反向三角不等式**也随之成立(证明与<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>、<a class=\"wl\" data-id=\"an_spazio_metrico\">度量<\/a>那两节一字不差):\n\n‖x − y‖ ≥ | ‖x‖ − ‖y‖ |。\n\n它把诱导度量的<a class=\"wl\" data-id=\"an_spazio_metrico\">反向三角不等式<\/a>翻译回范数语言,用处一致:估计「两个向量长度之差」。\n\n## 球与有界\n\n有了诱导度量,<a class=\"wl\" data-id=\"an_spazio_metrico\">球<\/a>的概念照搬:开球 B(a, r) = { x ∈ E : ‖x − a‖ < r }。特别地**单位球** B = { x : ‖x‖ < 1 }(到原点距离 < 1 的向量)。范数的全部信息其实都编码在单位球的「形状」里——不同范数对应不同形状的单位球(圆、方、菱形……),这是泛函分析里的重要视角,这里先记住概念。\n\n子集 X ⊆ E 称**有界**,若它在诱导度量下<a class=\"wl\" data-id=\"an_convergenza\">有界<\/a>,等价地:存在 r 使 ‖x‖ < r 对一切 x ∈ X(所有向量长度被同一个 r 框住）。\n\n## 例子\n\n**(a) 绝对值是 𝕂 上的范数.** 在一维向量空间 𝕂 上,‖x‖ := |x|（<a class=\"wl\" data-id=\"an_valore_assoluto\">绝对值<\/a>/<a class=\"wl\" data-id=\"alg_complessi\">模<\/a>）满足三条——这正是它当初满足的性质。所以 ℝ、ℂ 作为一维赋范空间,诱导的度量就是 d(x,y)=|x−y|,回到<a class=\"wl\" data-id=\"an_spazio_metrico\">最初的例子<\/a>。范数是绝对值的高维推广,这一例确认了「一维情形退化回绝对值」。\n\n**(b) 上确界范数.** 设 X 是非空集合,B(X) 是 X 上**有界**函数构成的<a class=\"wl\" data-id=\"alg_spazio_vettoriale\">向量空间<\/a>。定义 ‖f‖_∞ := sup_{t∈X} |f(t)|（函数的「最大绝对值」）。可验证它是范数(三条都来自绝对值的对应性质 + sup 的性质)。这个「上确界范数」把两个函数的距离定义为「它们差的最大幅度」——是函数空间上最常用的范数之一,一致收敛理论(分析后续)的核心就是它诱导的度量。\n\n(ℝⁿ 上的欧氏范数 ‖x‖ = √(Σxᵢ²) 是最重要的例子,但它满足三角不等式需要 Cauchy–Schwarz,留待下一节。)\n\n## 一道激活练习\n\n(a) 在 ℝ² 上定义 ‖(x, y)‖₁ := |x| + |y|（两个坐标绝对值之和,称「曼哈顿范数」/出租车范数）。验证它满足范数三公理 (N1)–(N3)。\n\n(b) 设 (E, ‖·‖) 是赋范空间,xₙ → x 且 yₙ → y（在 E 中）。证明 xₙ + yₙ → x + y。(提示:估计 ‖(xₙ+yₙ)−(x+y)‖,用三角不等式拆成 ‖xₙ−x‖ + ‖yₙ−y‖;这正是<a class=\"wl\" data-id=\"an_algebra_limiti\">和的极限<\/a>在赋范空间里的版本——注意证明只用到 (N3),不碰 𝕂 的乘法。)\n\n(c) 证明:在赋范空间中,若 xₙ → x,则 ‖xₙ‖ → ‖x‖（范数是「连续」的）。(提示:用反向三角不等式。)\n\n## 参考解答\n\n(建议先自己写完再看。)\n\n**(a)** 设 (x,y), (x',y') ∈ ℝ²,λ ∈ ℝ。\n**(N1)** ‖(x,y)‖₁ = |x|+|y| = 0 ⟺ |x|=0 且 |y|=0（两非负数之和为零则各为零）⟺ x=y=0 ⟺ (x,y)=0。✓\n**(N2)** ‖λ(x,y)‖₁ = ‖(λx,λy)‖₁ = |λx|+|λy| = |λ||x|+|λ||y| = |λ|(|x|+|y|) = |λ|·‖(x,y)‖₁。✓（用绝对值的<a class=\"wl\" data-id=\"an_valore_assoluto\">可乘性<\/a>。）\n**(N3)** ‖(x,y)+(x',y')‖₁ = |x+x'|+|y+y'| ≤ (|x|+|x'|)+(|y|+|y'|)（对每个坐标用绝对值三角不等式）= (|x|+|y|)+(|x'|+|y'|) = ‖(x,y)‖₁+‖(x',y')‖₁。✓ 故 ‖·‖₁ 是范数。∎\n\n**(b)** 给定 ε > 0。因 xₙ→x,存在 N₁ 使 n≥N₁ 时 ‖xₙ−x‖ < ε/2;因 yₙ→y
